    const 字X = x0 + 48, 字宽 = 宽 - 48 - 26;\n    const 时候色 = 行.时候不认识 ? \"#E5484D\" : \"#1E2A4A\", 做色 = 行.做不认识 ? \"#E5484D\" : \"#1E2A4A\";\n    if (宽松) {\n      画左文字(行.名字, 字X, y0 + 16, 19, \"#1E2A4A\", 字宽 - (是现在 ? 34 : 0));\n      const a = 画左文字(\"什么时候 \", 字X, y0 + 38, 13, \"#8A93A8\");\n      画左文字(行.什么时候 || \"（空）\", 字X + a, y0 + 38, 14, 时候色, 字宽 + 16 - a);\n      const b = 画左文字(\"做什么 \", 字X, y0 + 57, 13, \"#8A93A8\");\n      画左文字(行.做什么 || \"（空）\", 字X + b, y0 + 57, 14, 做色, 字宽 - b);\n    } else {\n      画左文字(行.名字, 字X, y0 + 高 * 0.32, 16, \"#1E2A4A\", 字宽 - (是现在 ? 34 : 0));\n      画左文字((行.什么时候 || \"（空）\") + \" → \" + (行.做什么 || \"（空）\"), 字X, y0 + 高 * 0.72, 12, 行.时候不认识 || 行.做不认识 ? \"#E5484D\" : \"#5B6683\", 字宽);\n    }\n    if (是现在) { ctx.fillStyle = \"#FF8A3D\"; 圆角矩形(x0 + 宽 - 40, y0 + 5, 36, 20, 10); 画文字(\"现在\", x0 + 宽 - 22, y0 + 15, 12, \"#FFFFFF\"); }\n    if (行.时候不认识 || 行.做不认识) {\n      ctx.fillStyle = \"#E5484D\"; 圆(x0 + 宽 - 14, y0 + 高 - 14, 10);\n      画文字(\"?\", x0 + 宽 - 14, y0 + 高 - 13, 15, \"#FFFFFF\");\n    }\n  }\n  if (太多) 画文字(\"还有 \" + (状态表.length - 7) + \" 行…\", 中, 顶 + 6 + 7 * 行高 + 行高 / 2, 15, \"#8A93A8\");\n}\n\nfunction 画雪球按钮() {\n  if (!可以扔()) return;\n  const b = 雪球按钮;\n  ctx.fillStyle = \"#8FCDEB\"; 圆(b.x, b.y, b.半径 + 4);\n  ctx.fillStyle = \"#EAF7FF\"; 圆(b.x, b.y, b.半径);\n  画表情(\"❄️\", b.x, b.y - 10, 40);\n  画文字(\"扔雪球\", b.x, b.y + 28, 16, \"#2D7FF9\");\n  if (雪球冷却 > 0) {\n    ctx.fillStyle = \"rgba(255,255,255,0.65)\";\n    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.arc(b.x, b.y, b.半径, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * 雪球冷却 / 30); ctx.closePath(); ctx.fill();\n  }\n}\n\n// 每一帧都会运行一次\nfunction 游戏循环() {\n  帧数++;\n  更新();\n\n  ctx.fillStyle = \"#FFF7EC\"; ctx.fillRect(0, 0, W, H);\n  画顶上();\n  画场地();\n\n  // 星星：轻轻上下浮\n  星星们.forEach((星, i) => 画表情(\"⭐\", 星.x, 星.y + Math.sin(帧数 / 15 + i) * 3, 36));\n\n  // 比特要去的地方\n  if (目标 && 局面 === \"玩\") {\n    ctx.strokeStyle = \"rgba(255,138,61,0.8)\"; ctx.lineWidth = 3;\n    ctx.beginPath(); ctx.arc(目标.x, 目标.y, 14, 0, Math.PI * 2); ctx.stroke();\n  }\n\n  // 雪球和火球\n  for (const 球 of 雪球们) { ctx.fillStyle = \"#9BCDE8\"; 圆(球.x, 球.y, 11); ctx.fillStyle = \"#FFFFFF\"; 圆(球.x, 球.y, 9); }\n  for (const 火 of 火球们) 画表情(\"🔥\", 火.x, 火.y, 30);\n\n  画怪兽();\n  画比特();\n\n  // 飘字\n  for (const 字 of 飘字们) {\n    ctx.globalAlpha = 字.寿命 / 40; 画文字(字.文字, 字.x, 字.y, 28, 字.颜色); 字.y -= 1.2; 字.寿命--; ctx.globalAlpha = 1;\n  }\n  飘字们 = 飘字们.filter(字 => 字.寿命 > 0);\n\n  画状态表();\n  画雪球按钮();\n\n  // 赢了 / 输了\n  if (局面 !== \"玩\") {\n    const 中x = 场地.x + 场地.宽 / 2, 中y = 场地.y + 场地.高 / 2;\n    ctx.fillStyle = \"rgba(255,247,236,0.85)\"; 圆角矩形(场地.x, 场地.y, 场地.宽, 场地.高, 16);\n    画表情(局面 === \"赢了\" ? \"🏆\" : \"💫\", 中x, 中y - 100, 72);\n    画文字(局面 === \"赢了\" ? \"赢了！\" : \"输了…\", 中x, 中y - 30, 46, 局面 === \"赢了\" ? \"#18A87C\" : \"#E5484D\");\n    画文字(结果, 中x, 中y + 14, 24, \"#5B6683\");\n    ctx.fillStyle = \"#FF8A3D\"; 圆角矩形(再来按钮.x - 再来按钮.宽 / 2, 再来按钮.y - 再来按钮.高 / 2, 再来按钮.宽, 再来按钮.高, 20);\n    画文字(\"再来一局\", 再来按钮.x, 再来按钮.y, 28, \"#FFFFFF\");\n  }\n\n  // 一句提示\n  if (话的寿命 > 0) {\n    话的寿命--;\n    ctx.globalAlpha = Math.min(1, 话的寿命 / 30);\n    ctx.fillStyle = \"rgba(255,255,255,0.92)\"; 圆角矩形(场地.x + 70, 场地.y + 12, 场地.宽 - 140, 50, 18);\n    画文字(话, 场地.x + 场地.宽 / 2, 场地.y + 38, 24, \"#1E2A4A\");\n    ctx.globalAlpha = 1;\n  }\n\n  requestAnimationFrame(游戏循环);\n}\n开始();\n游戏循环();\n<\/script>\n<\/body>\n<\/html>\n", "守护狗窝.html": "<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, user-scalable=no\">\n<title>守护狗窝<\/title>\n<style>\n  html, body { margin: 0; height: 100%; background: #FFF7EC; font-family: \"PingFang SC\", \"Microsoft YaHei\", sans-serif; color: #1E2A4A; touch-action: none; }\n  #box { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }\n  h1 { margin: 0; font-size: 28px; }\n  canvas { width: min(96vw, 160vh); max-height: 82vh; aspect-ratio: 16 / 9; border-radius: 18px; box-shadow: 0 6px 0 #F0E2CC; background: #FFF7EC; }\n  p { margin: 0; color: #5B6683; font-size: 18px; }\n<\/style>\n<\/head>\n<body>\n<div id=\"box\">\n  <h1>守护狗窝<\/h1>\n  <canvas id=\"game\" width=\"960\" height=\"540\"><\/canvas>\n  <p>怪物要来抢比特的狗窝！点怪物一下就打它一下，血打光它就倒<\/p>\n<\/div>\n\n<script>\n// ===== 游戏设置：想改游戏，先改这里 =====\nconst 设置 = {\n  狗窝有几颗心: 3,         // 怪物走进狗窝就少一颗心，心没了就输\n  每波之间休息几秒: 3,     // 打完一波，歇几秒再来下一波\n  每只怪间隔几秒: 1.2,     // 同一波里，隔几秒出来一只怪\n  显示血条: true,          // 改成 false：怪物头上不画血条\n  怪物大小: 64,            // 怪物的图案画多大\n  背景颜色: \"#CFEFD8\",     // 草地的颜色\n};\n\n// ===== 怪物表：每一行是一种怪 =====\n// 名字：怪物叫什么（波次表里就写这个名字）\n// 图案：一个 emoji\n// 血量：要打几下才倒\n// 速度：\"慢\"（大约 12 秒走到狗窝）、\"中\"、\"快\"（大约 5 秒）；也可以写数字：每帧走几像素\n// 打倒得几分：打倒它加几分\nconst 怪物们 = [\n  { 名字: \"小怪兽\", 图案: \"👾\", 血量: 2, 速度: \"慢\", 打倒得几分: 1 },\n];\n\n// ===== 波次表：每一行是一波，从上往下一波一波来 =====\n// 第几波：这是第几波\n// 出场：写\"名字×几只\"，几种怪用\"、\"隔开，比如 \"小怪兽×3、大块头×1\"（几种怪会轮流出来）\n// 波次表空着：怪物表里的怪会一直来，没有尽头\nconst 波次们 = [\n  { 第几波: 1, 出场: \"小怪兽×5\" },\n  { 第几波: 2, 出场: \"小怪兽×8\" },\n  { 第几波: 3, 出场: \"小怪兽×12\" },\n];\n\n// ===== 下面是游戏程序 =====\nconst canvas = document.getElementById(\"game\");\nconst ctx = canvas.getContext(\"2d\");\nconst W = canvas.width, H = canvas.height;\nconst 草地 = { 左: 20, 上: 58, 右: 940, 下: 382 };    // 三条路所在的草地\nconst 路高 = (草地.下 - 草地.上) / 3;                   // 每条路有多高\nconst 草地中间 = (草地.上 + 草地.下) / 2;\nconst 狗窝线 = 170;                                       // 怪物走到这里，就进狗窝了\nconst 出生X = W + 24;                                     // 怪物从右边外面走进来\nconst 速度表 = { 慢: 1.2, 中: 1.8, 快: 2.8 };            // 每帧走几像素：慢的大约 12 秒走到狗窝，快的大约 5 秒\nconst 再来按钮 = { x: W / 2, y: 330, 宽: 240, 高: 68 };\n\nlet 怪物图鉴 = [];        // 照怪物表整理好的每种怪（漏填、填错的地方用了默认值）\nlet 出场的名字 = [];      // 波次表里写到的怪物名字\nlet 场上的怪 = [];        // 正在走的怪：{ 种类, x, y, 路, 血, 满血, 速度, 挨打 }\nlet 出怪队列 = [];        // 这一波还没出来的怪，排着队\nlet 第几波 = 0;\nlet 一共几波 = 0;          // 0：波次表是空的，怪会一直来\nlet 阶段 = \"休息\";        // \"休息\"：两波中间；\"出怪\"：这一波正在来；\"没有怪\"：怪物表是空的\nlet 计时 = 0;             // 休息还剩几帧，或者下一只怪还要等几帧\nlet 心 = 3;\nlet 分数 = 0;\nlet 打倒几只 = 0;\nlet 状态 = \"玩\";          // \"玩\"、\"输了\"、\"赢了\"\nlet 帧数 = 0;\nlet 话 = \"\", 话的寿命 = 0;       // 屏幕上的一句提示\nlet 大字 = \"\", 大字的寿命 = 0;   // \"第 2 波来了！\"\nlet 飘字们 = [];\nlet 爆炸们 = [];\nlet 狗窝晃 = 0, 比特叫 = 0;\nlet 上一条路 = -1;\nlet 毛病们 = [];          // 怪物表里看不懂的地方\n\n// \"12\" \"三\" \"十二\" 变成数字；看不懂就是 NaN\nfunction 读数(字) {\n  字 = String(字 == null ? \"\" : 字).trim();\n  if (/^\\d+(\\.\\d+)?$/.test(字)) return Number(字);\n  const 中文 = \"零一二三四五六七八九\";\n  字 = 字.replace(/两/g, \"二\");\n  if (/^[零一二三四五六七八九]$/.test(字)) return 中文.indexOf(字);\n  const m = 字.match(/^([一二三四五六七八九]?)十([一二三四五六七八九]?)$/);\n  if (m) return (m[1] ? 中文.indexOf(m[1]) : 1) * 10 + (m[2] ? 中文.indexOf(m[2]) : 0);\n  return NaN;\n}\n\n// 把怪物表里的一行整理好：漏填、填错的地方用默认值\nfunction 整理一种怪(行, 第几个) {\n  const 名字 = 行.名字 == null || String(行.名字).trim() === \"\" ? \"怪物\" + (第几个 + 1) : String(行.名字).trim();\n  const 图案 = typeof 行.图案 === \"string\" && 行.图案.trim() ? 行.图案.trim() : \"👾\";\n  const 血量 = Math.min(99, Math.max(1, Math.round(读数(行.血量)) || 1));\n  let 速度 = 速度表.中, 速度名 = \"中\";\n  if (行.速度 === \"慢\" || 行.速度 === \"中\" || 行.速度 === \"快\") { 速度 = 速度表[行.速度]; 速度名 = 行.速度; }\n  else if (读数(行.速度) > 0) { 速度 = Math.min(10, Math.max(0.2, 读数(行.速度))); 速度名 = String(速度); }\n  else if (行.速度 != null && 行.速度 !== \"\") 毛病们.push(名字 + \"的速度「\" + 行.速度 + \"」看不懂，当成「中」\");\n  const 分 = 行.打倒得几分 == null || 行.打倒得几分 === \"\" ? 1 : 读数(行.打倒得几分);\n  return { 名字, 图案, 血量, 速度, 速度名, 分: 分 >= 0 ? Math.min(999, Math.round(分)) : 1 };\n}\n\n// 把 \"小怪兽×3、大块头×1\" 拆成 [{ 名字: \"小怪兽\", 几只: 3 }, { 名字: \"大块头\", 几只: 1 }]\nfunction 拆出场(出场) {\n  const 结果 = [];\n  for (const 段 of String(出场 == null ? \"\" : 出场).split(/[、，,+＋;；\\n]/)) {\n    const 字 = 段.trim();\n    if (!字) continue;\n    const m = 字.match(/^(.*?)\\s*[×xX*＊]\\s*(\\d+|[零一两二三四五六七八九十]+)\\s*[只个]?$/) || 字.match(/^(.*?)\\s*(\\d+|[零一两二三四五六七八九十]+)\\s*[只个]$/);\n    const 几只 = m ? 读数(m[2]) : 1;\n    结果.push({ 名字: (m ? m[1] : 字).trim(), 几只: Math.min(50, Math.max(0, Math.round(几只) || 0)) });\n  }\n  return 结果;\n}\n\n// 一波里的怪排好队：几种怪轮流出来\nfunction 排队(出场) {\n  const 每种 = [];\n  for (const 一段 of 拆出场(出场)) {\n    const 种类 = 怪物图鉴.find(怪 => 怪.名字 === 一段.名字);\n    if (种类) 每种.push({ 种类, 剩: 一段.几只 });\n    else 说一句(\"没有叫「\" + 一段.名字 + \"」的怪物\");\n  }\n  const 队 = [];\n  while (每种.some(一种 => 一种.剩 > 0)) {\n    for (const 一种 of 每种) if (一种.剩 > 0) { 队.push(一种.种类); 一种.剩--; }\n  }\n  return 队;\n}\n\nfunction 满心() { return Math.min(99, Math.max(1, Math.round(Number(设置.狗窝有几颗心)) || 3)); }\nfunction 秒变帧(秒, 默认) { const n = Number(秒); return Number.isFinite(n) && n >= 0 ? Math.round(n * 60) : 默认; }\nfunction 每只怪的间隔() { return Math.max(6, 秒变帧(设置.每只怪间隔几秒, 72)); }\nfunction 休息几帧() { return Math.max(30, 秒变帧(设置.每波之间休息几秒, 180)); }\nfunction 怪物大小() { const n = Number(设置.怪物大小); return n >= 20 && n <= 160 ? n : 64; }\n\n// 开一局新游戏\nfunction 开始() {\n  毛病们 = [];\n  const 表 = Array.isArray(怪物们) ? 怪物们 : [];\n  怪物图鉴 = 表.filter(行 => 行 && typeof 行 === \"object\").map(整理一种怪);\n  const 波表 = Array.isArray(波次们) ? 波次们 : [];\n  一共几波 = 波表.length;\n  出场的名字 = [];\n  for (const 一波 of 波表) for (const 一段 of 拆出场(一波 && 一波.出场)) 出场的名字.push(一段.名字);\n  场上的怪 = []; 出怪队列 = []; 飘字们 = []; 爆炸们 = [];\n  第几波 = 0; 分数 = 0; 打倒几只 = 0; 状态 = \"玩\"; 心 = 满心();\n  大字的寿命 = 0; 话的寿命 = 0; 狗窝晃 = 0;\n  if (!怪物图鉴.length) { 阶段 = \"没有怪\"; 说一句(\"怪物表是空的\"); return; }\n  阶段 = \"休息\"; 计时 = 40;\n  if (毛病们.length) 说一句(毛病们[0]);\n}\n\n// 下一波开始\nfunction 下一波() {\n  第几波++;\n  if (一共几波) 出怪队列 = 排队((波次们[第几波 - 1] || {}).出场);\n  else {   // 波次表是空的：怪物表里的怪一直来，一波比一波多\n    出怪队列 = [];\n    const 每种几只 = 1 + Math.ceil(第几波 / 2);\n    for (let i = 0; i < 每种几只; i++) for (const 种类 of 怪物图鉴) 出怪队列.push(种类);\n    出怪队列 = 出怪队列.slice(0, 60);\n  }\n  阶段 = \"出怪\"; 计时 = 50;\n  大字 = \"第 \" + 第几波 + \" 波来了！\"; 大字的寿命 = 100;\n}\n\n// 这一波的怪都出完了、也都打倒了\nfunction 这一波打完了() {\n  if (一共几波 && 第几波 >= 一共几波) return 赢了();\n  阶段 = \"休息\"; 计时 = 休息几帧();\n  说一句(\"第 \" + 第几波 + \" 波守住了！歇一会儿\");\n}\n\n// 一只怪从右边出来，挑一条路\nfunction 出一只怪(种类) {\n  let 路 = Math.floor(Math.random() * 3);\n  if (路 === 上一条路) 路 = (路 + 1 + Math.floor(Math.random() * 2)) % 3;\n  上一条路 = 路;\n  场上的怪.push({ 种类, x: 出生X, y: 草地.上 + 路高 * (路 + 0.5), 路, 血: 种类.血量, 满血: 种类.血量, 速度: 种类.速度, 挨打: 0, 晃: Math.random() * 6 });\n}\n\n// 怪物走进狗窝：少一颗心\nfunction 进狗窝(怪) {\n  怪.走了 = true;\n  心 = Math.max(0, 心 - 1); 狗窝晃 = 24;\n  飘字(\"-1\", 狗窝线 - 30, 怪.y - 30, \"#E5484D\");\n  if (心 <= 0) 输了();\n}\n\n// 点到怪物：打它一下\nfunction 打一下(怪) {\n  怪.血--; 怪.挨打 = 8; 怪.x += 6; 比特叫 = 14;\n  if (怪.血 <= 0) 打倒(怪);\n}\nfunction 打倒(怪) {\n  怪.走了 = true;\n  场上的怪 = 场上的怪.filter(别的 => 别的 !== 怪);\n  分数 += 怪.种类.分; 打倒几只++;\n  爆炸们.push({ x: 怪.x, y: 怪.y, 寿命: 18 });\n  飘字(\"+\" + 怪.种类.分, 怪.x, 怪.y - 44, \"#18A87C\");\n}\nfunction 输了() { 状态 = \"输了\"; }\nfunction 赢了() { 状态 = \"赢了\"; 阶段 = \"休息\"; }\n\n// 每帧：出怪、走路、进狗窝\nfunction 更新() {\n  if (狗窝晃 > 0) 狗窝晃--;\n  if (比特叫 > 0) 比特叫--;\n  if (状态 !== \"玩\") return;\n  if (阶段 === \"休息\") { 计时--; if (计时 <= 0) 下一波(); }\n  else if (阶段 === \"出怪\") {\n    if (出怪队列.length) {\n      计时--;\n      if (计时 <= 0) { 出一只怪(出怪队列.shift()); 计时 = 每只怪的间隔(); }\n    } else if (!场上的怪.length) 这一波打完了();\n  }\n  for (const 怪 of 场上的怪) {\n    怪.x -= 怪.速度;\n    if (怪.挨打 > 0) 怪.挨打--;\n    if (怪.x <= 狗窝线) 进狗窝(怪);\n    if (状态 !== \"玩\") break;\n  }\n  场上的怪 = 场上的怪.filter(怪 => !怪.走了);\n}\n\n// ===== 操作：点怪物打它；输了、赢了点「再来一局」 =====\nfunction 点了(x, y) {\n  if (状态 !== \"玩\") {\n    if (Math.abs(x - 再来按钮.x) < 再来按钮.宽 / 2 && Math.abs(y - 再来按钮.y) < 再来按钮.高 / 2) 开始();\n    return;\n  }\n  let 打中 = null, 最近 = Math.max(40, 怪物大小() * 0.75);\n  for (const 怪 of 场上的怪) {\n    const 远 = Math.hypot(x - 怪.x, y - 怪.y);\n    if (远 < 最近) { 打中 = 怪; 最近 = 远; }\n  }\n  if (打中) 打一下(打中);\n}\ncanvas.addEventListener(\"pointerdown\", e => {\n  const r = canvas.getBoundingClientRect();\n  const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;\n  点了(x, y);\n});\ndocument.addEventListener(\"keydown\", e => {\n  if ((e.key === \"Enter\" || e.key === \" \") && 状态 !== \"玩\") { 开始(); e.preventDefault(); }\n});\n\n// ===== 画画的小工具 =====\nfunction 说一句(文字) { 话 = 文字; 话的寿命 = 150; }\nfunction 飘字(文字, x, y, 颜色) { 飘字们.push({ 文字, x, y, 颜色, 寿命: 40 }); }\nfunction 圆角矩形(x, y, w, h, r) {\n  r = Math.min(r, w / 2, h / 2);\n  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);\n  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); ctx.fill();\n}\nfunction 画表情(文字, x, y, 大小) {\n  ctx.font = 大小 + 'px \"Apple Color Emoji\",\"Segoe UI Emoji\",\"Noto Color Emoji\",sans-serif';\n  ctx.fillStyle = \"#000\"; ctx.textAlign = \"center\"; ctx.textBaseline = \"middle\"; ctx.fillText(文字, x, y);\n}\nfunction 画文字(文字, x, y, 大小, 颜色) {\n  ctx.fillStyle = 颜色; ctx.font = \"bold \" + 大小 + 'px \"PingFang SC\",\"Microsoft YaHei\",sans-serif';\n  ctx.textAlign = \"center\"; ctx.textBaseline = \"middle\"; ctx.fillText(文字, x, y);\n}\n// 小字：可以靠左、靠右，太长会挤一挤\nfunction 画小字(文字, x, y, 大小, 颜色, 对齐, 最宽, 粗) {\n  ctx.fillStyle = 颜色; ctx.font = (粗 ? \"bold \" : \"\") + 大小 + 'px \"PingFang SC\",\"Microsoft YaHei\",sans-serif';\n  ctx.textAlign = 对齐 || \"center\"; ctx.textBaseline = \"middle\";\n  if (最宽) ctx.fillText(文字, x, y, 最宽); else ctx.fillText(文字, x, y);\n}\n\n// 比特：一只机器小狗，头上有根小天线\nfunction 画比特形象(x, y, 大小) {\n  const s = 大小 / 100;\n  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);\n  // 影子\n  ctx.fillStyle = \"rgba(36,48,94,.16)\"; ctx.beginPath(); ctx.ellipse(0, 54, 40, 6, 0, 0, Math.PI * 2); ctx.fill();\n  // 后腿\n  ctx.fillStyle = \"#F4F6FA\"; ctx.strokeStyle = \"#C5CCD8\"; ctx.lineWidth = 1.5;\n  [[-28, 20], [28, 20]].forEach(([lx, ly]) => { 圆角矩形(lx - 8, ly, 16, 26, 8); });\n  ctx.fillStyle = \"#FF8A3D\";\n  [[-28, 42], [28, 42]].forEach(([lx, ly]) => { 圆角矩形(lx - 10, ly, 20, 12, 5); });\n  // 尾巴\n  ctx.strokeStyle = \"#FF8A3D\"; ctx.lineWidth = 9; ctx.lineCap = \"round\";\n  ctx.beginPath(); ctx.moveTo(26, 8); ctx.quadraticCurveTo(44, 14, 40, 30); ctx.stroke();\n  // 身体\n  ctx.fillStyle = \"#F4F6FA\"; 圆角矩形(-34, -18, 68, 56, 22);\n  ctx.strokeStyle = \"#C5CCD8\"; ctx.lineWidth = 2; ctx.beginPath();\n  (function(x,y,w,h,r){ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();})(-34,-18,68,56,22); ctx.stroke();\n  // 橙心 <\/>\n  ctx.fillStyle = \"#FF8A3D\";\n  ctx.beginPath();\n  ctx.moveTo(0, 22); ctx.bezierCurveTo(-18, 8, -26, -4, -16, -12); ctx.bezierCurveTo(-10, -16, -4, -12, 0, -6);\n  ctx.bezierCurveTo(4, -12, 10, -16, 16, -12); ctx.bezierCurveTo(26, -4, 18, 8, 0, 22);\n  ctx.fill();\n  ctx.strokeStyle = \"#fff\"; ctx.lineWidth = 2.4; ctx.lineCap = \"round\"; ctx.lineJoin = \"round\";\n  ctx.beginPath(); ctx.moveTo(-9, -14); ctx.lineTo(-15, -8); ctx.lineTo(-9, -2); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(-2.5, -14); ctx.lineTo(2.5, -2); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(9, -14); ctx.lineTo(15, -8); ctx.lineTo(9, -2); ctx.stroke();\n  // 前腿\n  ctx.fillStyle = \"#F4F6FA\";\n  [[-16, 24], [16, 24]].forEach(([lx, ly]) => { 圆角矩形(lx - 7, ly, 14, 24, 7); });\n  ctx.fillStyle = \"#FF8A3D\";\n  [[-16, 44], [16, 44]].forEach(([lx, ly]) => { 圆角矩形(lx - 9, ly, 18, 11, 5); });\n  // 垂耳：从头两侧下垂的胶囊耳（正旋转=下垂；负旋转会变成翅耳）\n  ctx.fillStyle = \"#FF8A3D\";\n  ctx.beginPath(); ctx.ellipse(-48, -48, 13, 30, 0.35, 0, Math.PI * 2); ctx.fill();\n  ctx.beginPath(); ctx.ellipse(48, -48, 13, 30, -0.35, 0, Math.PI * 2); ctx.fill();\n  ctx.fillStyle = \"#FFC08A\";\n  ctx.beginPath(); ctx.ellipse(-48, -46, 6, 18, 0.35, 0, Math.PI * 2); ctx.fill();\n  ctx.beginPath(); ctx.ellipse(48, -46, 6, 18, -0.35, 0, Math.PI * 2); ctx.fill();\n  // 头\n  ctx.fillStyle = \"#F4F6FA\"; 圆角矩形(-40, -88, 80, 72, 30);\n  ctx.strokeStyle = \"#C5CCD8\"; ctx.lineWidth = 2; ctx.beginPath();\n  (function(x,y,w,h,r){ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();})(-40,-88,80,72,30); ctx.stroke();\n  ctx.fillStyle = \"rgba(255,255,255,.55)\"; ctx.beginPath(); ctx.ellipse(-14, -70, 16, 8, -0.3, 0, Math.PI * 2); ctx.fill();\n  // 黑面罩\n  ctx.fillStyle = \"#141820\"; ctx.beginPath(); ctx.ellipse(0, -52, 28, 22, 0, 0, Math.PI * 2); ctx.fill();\n  // 四角星星眼 ✦\n  ctx.fillStyle = \"#5BE0FF\";\n  for (const [ex, ey] of [[-12, -54], [12, -54]]) {\n    ctx.beginPath();\n    const outer = 9, inner = 9 * 0.38;\n    for (let i = 0; i < 8; i++) {\n      const a = -Math.PI / 2 + i * Math.PI / 4;\n      const rad = i % 2 === 0 ? outer : inner;\n      const x = ex + Math.cos(a) * rad, y = ey + Math.sin(a) * rad;\n      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);\n    }\n    ctx.closePath(); ctx.fill();\n  }\n  // 像素小嘴\n  [[-5, -40], [-1, -38], [3, -40]].forEach(([mx, my]) => { 圆角矩形(mx, my, 2.6, 2.2, 0.4); });\n  // 天线：橙底座 + 白杆 + 白球\n  ctx.fillStyle = \"#FF8A3D\"; ctx.beginPath(); ctx.ellipse(0, -88, 7, 4, 0, 0, Math.PI * 2); ctx.fill();\n  ctx.strokeStyle = \"#F2F4F8\"; ctx.lineWidth = 4; ctx.lineCap = \"round\";\n  ctx.beginPath(); ctx.moveTo(0, -88); ctx.lineTo(0, -104); ctx.stroke();\n  ctx.fillStyle = \"#FFFFFF\"; ctx.strokeStyle = \"#D0D6E2\"; ctx.lineWidth = 1;\n  ctx.beginPath(); ctx.arc(0, -106, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();\n  ctx.restore();\n}\n\nfunction 画比特(x, y) {\n  const 跳 = 比特叫 > 0 ? -Math.sin(比特叫 / 14 * Math.PI) * 10 : Math.sin(帧数 / 12) * 2;\n  画比特形象(x, y + 跳, 54);\n  if (比特叫 > 0) 画文字(\"汪！\", x + 44, y + 跳 - 36, 22, \"#FF8A3D\");\n}\n\nfunction 画顶栏() {\n  const 波字 = 阶段 === \"没有怪\" ? \"还没有怪\" : 一共几波 ? \"第 \" + Math.max(1, 第几波) + \" 波 / 共 \" + 一共几波 + \" 波\" : \"第 \" + Math.max(1, 第几波) + \" 波（没有尽头）\";\n  画文字(波字, 160, 30, 26, \"#1E2A4A\");\n  const 满 = 满心();\n  if (满 <= 10) for (let i = 0; i < 满; i++) 画表情(i < 心 ? \"❤️\" : \"🤍\", W / 2 - (满 - 1) * 19 + i * 38, 30, 28);\n  else { 画表情(\"❤️\", W / 2 - 30, 30, 28); 画文字(\"× \" + 心, W / 2 + 22, 30, 26, \"#E5484D\"); }\n  画文字(\"分数 \" + 分数, 830, 30, 28, \"#1E2A4A\");\n}\n\nfunction 画草地() {\n  ctx.fillStyle = 设置.背景颜色; 圆角矩形(草地.左, 草地.上, 草地.右 - 草地.左, 草地.下 - 草地.上, 18);\n  ctx.fillStyle = \"rgba(255,255,255,0.2)\"; ctx.fillRect(狗窝线, 草地.上 + 路高, 草地.右 - 狗窝线 - 6, 路高);\n  ctx.strokeStyle = \"rgba(30,42,74,0.12)\"; ctx.lineWidth = 3; ctx.setLineDash([16, 14]);\n  for (let i = 1; i < 3; i++) { ctx.beginPath(); ctx.moveTo(狗窝线, 草地.上 + 路高 * i); ctx.lineTo(草地.右 - 10, 草地.上 + 路高 * i); ctx.stroke(); }\n  ctx.setLineDash([]);\n  // 狗窝这一块和篱笆\n  ctx.fillStyle = \"rgba(255,247,236,0.6)\"; 圆角矩形(草地.左 + 8, 草地.上 + 8, 狗窝线 - 草地.左 - 16, 草地.下 - 草地.上 - 16, 14);\n  ctx.strokeStyle = \"#C9A27A\"; ctx.lineWidth = 6; ctx.lineCap = \"round\";\n  for (let y = 草地.上 + 14; y < 草地.下 - 14; y += 26) { ctx.beginPath(); ctx.moveTo(狗窝线, y); ctx.lineTo(狗窝线, y + 12); ctx.stroke(); }\n  ctx.lineCap = \"butt\";\n  const 晃 = 狗窝晃 > 0 ? Math.sin(狗窝晃 * 1.3) * 6 : 0;\n  if (狗窝晃 > 0) { ctx.fillStyle = \"rgba(229,72,77,\" + (狗窝晃 / 60) + \")\"; 圆角矩形(草地.左 + 8, 草地.上 + 8, 狗窝线 - 草地.左 - 16, 草地.下 - 草地.上 - 16, 14); }\n  画表情(\"🏠\", 92 + 晃, 草地中间 - 34, 100);\n  画比特(96, 草地中间 + 86);\n}\n\nfunction 画一只怪(怪) {\n  const 大小 = 怪物大小();\n  const y = 怪.y + Math.sin(帧数 / 6 + 怪.晃) * 3;\n  ctx.fillStyle = \"rgba(30,42,74,0.13)\"; ctx.beginPath(); ctx.ellipse(怪.x, 怪.y + 大小 * 0.42, 大小 * 0.36, 大小 * 0.1, 0, 0, Math.PI * 2); ctx.fill();\n  if (怪.挨打 > 0) { ctx.fillStyle = \"rgba(255,255,255,0.8)\"; ctx.beginPath(); ctx.arc(怪.x, y, 大小 * 0.56, 0, Math.PI * 2); ctx.fill(); }\n  画表情(怪.种类.图案, 怪.x, y, 怪.挨打 > 0 ? 大小 * 1.12 : 大小);\n  if (设置.显示血条) {\n    const 宽 = 56, 比例 = Math.max(0, 怪.血 / 怪.满血), 左 = 怪.x - 宽 / 2, 上 = 怪.y - 大小 / 2 - 16;\n    ctx.fillStyle = \"#FFFFFF\"; 圆角矩形(左 - 3, 上 - 3, 宽 + 6, 14, 7);\n    ctx.fillStyle = 比例 > 0.5 ? \"#2ECC71\" : 比例 > 0.25 ? \"#FFC93D\" : \"#E5484D\";\n    圆角矩形(左, 上, Math.max(8, 宽 * 比例), 8, 4);\n  }\n}\n\n// 底下的怪物图鉴：照着怪物表一种一种画出来\nfunction 画图鉴() {\n  const 左 = 20, 上 = 392, 宽 = 920, 高 = 142;\n  ctx.fillStyle = \"#F0E2CC\"; 圆角矩形(左 - 3, 上 - 3, 宽 + 6, 高 + 6, 18);\n  ctx.fillStyle = \"#FFFFFF\"; 圆角矩形(左, 上, 宽, 高, 16);\n  画小字(\"怪物图鉴\", 左 + 16, 上 + 16, 17, \"#1E2A4A\", \"left\", 0, true);\n  画小字(\"照怪物表画的：改了表，这里就跟着变\", 左 + 宽 - 16, 上 + 16, 14, \"#9AA3B8\", \"right\");\n  const n = 怪物图鉴.length;\n  if (!n) { 画文字(\"怪物表是空的：在怪物表里填一行试试\", W / 2, 上 + 80, 22, \"#5B6683\"); return; }\n  const 画几种 = n > 16 ? 15 : n, 还有 = n - 画几种, 格数 = 画几种 + (还有 ? 1 : 0);\n  const 区左 = 32, 区宽 = 896, 区上 = 上 + 32;\n  if (格数 <= 6) {\n    const 卡宽 = Math.min(170, (区宽 - (格数 - 1) * 10) / 格数), 卡高 = 104;\n    const 起点 = W / 2 - (格数 * 卡宽 + (格数 - 1) * 10) / 2;\n    for (let i = 0; i < 格数; i++) 画一张卡(i < 画几种 ? 怪物图鉴[i] : null, 起点 + i * (卡宽 + 10), 区上, 卡宽, 卡高, 还有, false);\n  } else {\n    const 每行 = Math.ceil(格数 / 2), 卡宽 = (区宽 - (每行 - 1) * 8) / 每行, 卡高 = 49;\n    for (let i = 0; i < 格数; i++) 画一张卡(i < 画几种 ? 怪物图鉴[i] : null, 区左 + (i % 每行) * (卡宽 + 8), 区上 + Math.floor(i / 每行) * (卡高 + 6), 卡宽, 卡高, 还有, true);\n  }\n}\nfunction 画一张卡(怪, x, y, 宽, 高, 还有, 小卡) {\n  const 出场 = !怪 || !一共几波 || 出场的名字.includes(怪.名字);\n  ctx.fillStyle = 出场 ? \"#FFF7EC\" : \"#F2F2F2\"; 圆角矩形(x, y, 宽, 高, 12);\n  if (!怪) { 画小字(\"还有 \" + 还有 + \" 种\", x + 宽 / 2, y + 高 / 2, 15, \"#5B6683\", \"center\", 宽 - 8, true); return; }\n  ctx.globalAlpha = 出场 ? 1 : 0.5;\n  const 属性 = \"血 \" + 怪.血量 + \" · \" + 怪.速度名 + \" · \" + 怪.分 + \" 分\";\n  if (小卡) {\n    画表情(怪.图案, x + 24, y + 高 / 2, 28);\n    画小字(怪.名字, x + 46, y + 15, 15, \"#1E2A4A\", \"left\", 宽 - 50, true);\n    画小字(属性, x + 46, y + 35, 12, \"#5B6683\", \"left\", 宽 - 50);\n  } else {\n    画表情(怪.图案, x + 宽 / 2, y + 26, 38);\n    画小字(怪.名字, x + 宽 / 2, y + 56, 18, \"#1E2A4A\", \"center\", 宽 - 10, true);\n    画小字(属性, x + 宽 / 2, y + 79, 14, \"#5B6683\", \"center\", 宽 - 10);\n    if (!出场) 画小字(\"波次表里没有\", x + 宽 / 2, y + 95, 12, \"#E5484D\", \"center\", 宽 - 10);\n  }\n  ctx.globalAlpha = 1;\n}\n\nfunction 画结局() {\n  ctx.fillStyle = \"rgba(30,42,74,0.35)\"; ctx.fillRect(0, 0, W, H);\n  ctx.fillStyle = \"#FFF7EC\"; 圆角矩形(W / 2 - 240, 116, 480, 268, 26);\n  const 赢 = 状态 === \"赢了\";\n  画表情(赢 ? \"🏆\" : \"😢\", W / 2, 166, 58);\n  画文字(赢 ? \"守住了！\" : \"狗窝被占了\", W / 2, 224, 40, 赢 ? \"#18A87C\" : \"#E5484D\");\n  画文字(赢 ? \"打倒 \" + 打倒几只 + \" 只怪，得了 \" + 分数 + \" 分\" : \"守到了第 \" + 第几波 + \" 波，得了 \" + 分数 + \" 分\", W / 2, 268, 22, \"#5B6683\");\n  ctx.fillStyle = \"#FF8A3D\"; 圆角矩形(再来按钮.x - 再来按钮.宽 / 2, 再来按钮.y - 再来按钮.高 / 2, 再来按钮.宽, 再来按钮.高, 20);\n  画文字(\"再来一局\", 再来按钮.x, 再来按钮.y, 28, \"#FFFFFF\");\n}\n\n// 每一帧都会运行一次\nfunction 游戏循环() {\n  帧数++;\n  更新();\n\n  ctx.fillStyle = \"#FFF7EC\"; ctx.fillRect(0, 0, W, H);\n  画顶栏();\n  画草地();\n\n  // 怪物\n  for (const 怪 of 场上的怪) 画一只怪(怪);\n  for (const 炸 of 爆炸们) { ctx.globalAlpha = 炸.寿命 / 18; 画表情(\"💥\", 炸.x, 炸.y, 70 - 炸.寿命); 炸.寿命--; ctx.globalAlpha = 1; }\n  爆炸们 = 爆炸们.filter(炸 => 炸.寿命 > 0);\n\n  // 飘字\n  for (const 字 of 飘字们) {\n    ctx.globalAlpha = 字.寿命 / 40; 画文字(字.文字, 字.x, 字.y, 30, 字.颜色); 字.y -= 1.2; 字.寿命--; ctx.globalAlpha = 1;\n  }\n  飘字们 = 飘字们.filter(字 => 字.寿命 > 0);\n\n  // 草地中间的大字：第几波来了、休息倒数、怪物表是空的\n  const 中X = (狗窝线 + 草地.右) / 2;\n  if (状态 === \"玩\" && 阶段 === \"休息\" && 第几波 > 0) 画文字(\"第 \" + (第几波 + 1) + \" 波还有 \" + Math.ceil(计时 / 60) + \" 秒\", 中X, 草地中间, 30, \"rgba(30,42,74,0.55)\");\n  if (阶段 === \"没有怪\") {\n    画文字(\"怪物表是空的\", 中X, 草地中间 - 18, 36, \"#1E2A4A\");\n    画文字(\"在怪物表里填一行，怪就来了\", 中X, 草地中间 + 26, 22, \"#5B6683\");\n  }\n  if (大字的寿命 > 0) {\n    大字的寿命--;\n    const 放大 = 1 + Math.max(0, 大字的寿命 - 86) / 14 * 0.35;\n    ctx.globalAlpha = Math.min(1, 大字的寿命 / 20);\n    ctx.save(); ctx.translate(中X, 草地中间); ctx.scale(放大, 放大);\n    ctx.fillStyle = \"rgba(255,255,255,0.92)\"; 圆角矩形(-200, -44, 400, 88, 30);\n    画文字(大字, 0, 0, 46, \"#FF8A3D\");\n    ctx.restore(); ctx.globalAlpha = 1;\n  }\n\n  画图鉴();\n\n  // 一句提示\n  if (话的寿命 > 0) {\n    话的寿命--;\n    ctx.globalAlpha = Math.min(1, 话的寿命 / 30);\n    const 宽 = Math.min(720, 话.length * 26 + 60);\n    ctx.fillStyle = \"rgba(255,255,255,0.94)\"; 圆角矩形(中X - 宽 / 2, 草地.上 + 12, 宽, 50, 18);\n    画小字(话, 中X, 草地.上 + 37, 24, \"#1E2A4A\", \"center\", 宽 - 24, true);\n    ctx.globalAlpha = 1;\n  }\n\n  if (状态 !== \"玩\") 画结局();\n\n  requestAnimationFrame(游戏循环);\n}\n开始();\n游戏循环();\n<\/script>\n<\/body>\n<\/html>\n", "打砖块.html": "<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, user-scalable=no\">\n<title>打砖块<\/title>\n<style>\n  html, body { margin: 0; height: 100%; background: #FFF7EC; font-family: \"PingFang SC\", \"Microsoft YaHei\", sans-serif; color: #1E2A4A; touch-action: none; }\n  #box { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }\n  h1 { margin: 0; font-size: 28px; }\n  canvas { width: min(96vw, 160vh); max-height: 82vh; aspect-ratio: 16 / 9; border-radius: 18px; box-shadow: 0 6px 0 #F0E2CC; background: #FFF7EC; }\n  p { margin: 0; color: #5B6683; font-size: 18px; }\n<\/style>\n<\/head>\n<body>\n<div id=\"box\">\n  <h1>打砖块<\/h1>\n  <canvas id=\"game\" width=\"960\" height=\"540\"><\/canvas>\n  <p>手指按住画面左右拖，挡板跟着走；点一下发球，把砖块全打碎<\/p>\n<\/div>\n\n<script>\n// ===== 游戏设置：想改游戏，先改这里 =====\nconst 设置 = {\n  球的速度: 6,            // 球每一帧飞多远，数字越大球越快\n  挡板宽度: 160,          // 挡板有多宽\n  有几个球: 3,            // 一局有几个球，用完就输了\n  底下有保护墙: false,     // 改成 true：底下有一道墙，球掉下去能挡住一次\n  背景颜色: \"#1E2A4A\",    // 场地的颜色\n};\n\n// ===== 砖块种类：每一行是一种砖 =====\n// 记号：在下面「砖块排列」里用的一个字，比如 \"红\"\n// 颜色：砖的颜色，比如 \"#FF5A5F\"\n// 打几下才碎：1 就是一碰就碎；要打好几下的砖，没碎时会裂开，还写着剩几下\n// 得几分：打碎了得几分\n// 碎了掉出：\"\"（什么都不掉）、\"变长\"（挡板变长 10 秒）、\"多一个球\"、\"加一条命\"；挡板接到才生效\nconst 砖块种类 = [\n  { 记号: \"红\", 颜色: \"#FF5A5F\", 打几下才碎: 1, 得几分: 1, 碎了掉出: \"\" },\n  { 记号: \"黄\", 颜色: \"#FFC93D\", 打几下才碎: 1, 得几分: 1, 碎了掉出: \"\" },\n  { 记号: \"绿\", 颜色: \"#2ECC9A\", 打几下才碎: 1, 得几分: 1, 碎了掉出: \"\" },\n];\n\n// ===== 砖块排列：每一行是一排砖，一个字是一块砖（用上面的记号），\".\" 是空位 =====\nconst 砖块排列 = [\n  \"红红红红红红红红红红\",\n  \"黄黄黄黄黄黄黄黄黄黄\",\n  \"绿绿绿绿绿绿绿绿绿绿\",\n];\n\n// ===== 下面是游戏程序 =====\nconst canvas = document.getElementById(\"game\");\nconst ctx = canvas.getContext(\"2d\");\nconst W = canvas.width, H = canvas.height;\nconst 场地 = { 左: 16, 上: 64, 右: W - 16, 下: H - 12 };   // 球能飞的地方\nconst 球半径 = 10;\nconst 挡板Y = 场地.下 - 44, 挡板高 = 20;   // 挡板上沿在哪、有多厚\nconst 保护墙Y = 场地.下 - 10;\nconst 认识的掉落 = [\"\", \"变长\", \"多一个球\", \"加一条命\"];\nconst 道具图案 = { 变长: \"📏\", 多一个球: \"⚪\", 加一条命: \"❤️\" };\n\nlet 砖块们 = [];          // 场上的砖：{ x, y, 宽, 高, 种类, 还要打几下 }\nlet 球们 = [];            // 场上的球：{ x, y, vx, vy, 在挡板上 }\nlet 道具们 = [];          // 正在往下掉的道具：{ x, y, 东西 }\nlet 挡板 = { x: W / 2 };  // 挡板中间在哪\nlet 剩几个球 = 3;\nlet 分数 = 0;\nlet 状态 = \"玩\";          // \"玩\"、\"输了\" 或 \"赢了\"\nlet 保护墙还在 = false;\nlet 变长到 = 0;           // 挡板变长，一直到第几帧\nlet 一开始有砖 = false;\nlet 帧数 = 0;\nlet 话 = \"\", 话的寿命 = 0;  // 屏幕上的一句提示\nlet 飘字们 = [];\nlet 碎片们 = [];\n\n// 开一局新游戏\nfunction 开始() {\n  分数 = 0; 状态 = \"玩\"; 球们 = []; 道具们 = []; 飘字们 = []; 碎片们 = []; 变长到 = 0;\n  剩几个球 = 一局几个球();\n  保护墙还在 = 设置.底下有保护墙 === true || 设置.底下有保护墙 === \"true\";\n  挡板.x = W / 2;\n  摆砖块();\n  新球放在挡板上();\n}\n\n// 表格里填错了也不崩：没填、填错的用默认值\nfunction 整理种类() {\n  const 表 = {};\n  for (const 种 of 砖块种类) {\n    if (!种) continue;\n    const 记号 = Array.from(String(种.记号 == null ? \"\" : 种.记号))[0];\n    if (!记号 || 记号 === \".\") continue;\n    let 掉 = 种.碎了掉出 == null ? \"\" : String(种.碎了掉出);\n    if (!认识的掉落.includes(掉)) { 说一句(\"不认识「\" + 掉 + \"」，\" + 记号 + \"砖碎了什么都不掉\"); 掉 = \"\"; }\n    const 几下 = Math.max(1, Math.round(Number(种.打几下才碎)) || 1);\n    const 分 = Number.isFinite(Number(种.得几分)) && 种.得几分 !== null ? Number(种.得几分) : 1;\n    表[记号] = { 记号, 颜色: typeof 种.颜色 === \"string\" && 种.颜色 ? 种.颜色 : \"#FFC93D\", 打几下才碎: 几下, 得几分: 分, 碎了掉出: 掉 };\n  }\n  return 表;\n}\n\n// 照「砖块排列」把砖摆上去：按最长那排算宽度，短的排放在中间\nfunction 摆砖块() {\n  砖块们 = [];\n  const 种类表 = 整理种类();\n  const 排们 = (Array.isArray(砖块排列) ? 砖块排列 : []).map(排 => Array.from(String(排 == null ? \"\" : 排)));\n  const 最多几块 = Math.max(1, ...排们.map(排 => 排.length));\n  const 格宽 = Math.min(96, (场地.右 - 场地.左 - 40) / 最多几块);\n  const 格高 = Math.min(34, 250 / Math.max(1, 排们.length));\n  const 左边 = (W - 格宽 * 最多几块) / 2;\n  let 不认识 = \"\";\n  排们.forEach((排, 行) => {\n    const 这排左边 = 左边 + (最多几块 - 排.length) * 格宽 / 2;\n    排.forEach((字, 列) => {\n      const 种 = 种类表[字];\n      if (!种) { if (字 !== \".\" && 字.trim() && !不认识) 不认识 = 字; return; }\n      砖块们.push({ x: 这排左边 + 列 * 格宽 + 2, y: 场地.上 + 40 + 行 * 格高 + 2, 宽: 格宽 - 4, 高: 格高 - 4, 种类: 种, 还要打几下: 种.打几下才碎 });\n    });\n  });\n  一开始有砖 = 砖块们.length > 0;\n  if (!一开始有砖) 说一句(\"没有砖块！去「砖块排列」里加几排吧\");\n  else if (不认识) 说一句(\"不认识「\" + 不认识 + \"」，当成空位\");\n}\n\nfunction 一局几个球() { return Math.max(1, Math.round(Number(设置.有几个球)) || 3); }\nfunction 球速() { const 速 = Number(设置.球的速度); return 速 > 0 ? Math.min(速, 30) : 6; }\nfunction 挡板现在宽() {\n  const 宽 = Number(设置.挡板宽度), 最宽 = 场地.右 - 场地.左;\n  const 本来 = 宽 > 0 ? Math.min(宽, 最宽) : 160;\n  return 帧数 < 变长到 ? Math.min(本来 * 1.5, 最宽) : 本来;\n}\nfunction 移动挡板(x) {\n  const 半 = 挡板现在宽() / 2;\n  挡板.x = Math.max(场地.左 + 半, Math.min(场地.右 - 半, x));\n}\n\nfunction 新球放在挡板上() { 球们.push({ x: 挡板.x, y: 挡板Y - 球半径, vx: 0, vy: 0, 在挡板上: true }); }\n\n// 点一下：把停在挡板上的球发出去（稍微往右斜着飞）\nfunction 发球() {\n  if (状态 !== \"玩\") return;\n  for (const 球 of 球们) {\n    if (!球.在挡板上) continue;\n    球.在挡板上 = false;\n    球.vx = 球速() * Math.sin(0.35); 球.vy = -球速() * Math.cos(0.35);\n  }\n}\n\n// 球碰到挡板：打在左边往左飞，打在右边往右飞，越靠边飞得越斜\nfunction 碰到挡板(球, 宽) {\n  const 偏 = Math.max(-1, Math.min(1, (球.x - 挡板.x) / (宽 / 2)));   // -1 最左边，0 正中间，1 最右边\n  const 角度 = 偏 * 1.05;                                            // 最斜 60 度\n  球.vx = 球速() * Math.sin(角度); 球.vy = -球速() * Math.cos(角度);\n  球.y = 挡板Y - 球半径;\n}\n\n// 球打到一块砖\nfunction 打到砖(砖) {\n  砖.还要打几下--;\n  if (砖.还要打几下 > 0) { 飘字(\"还要 \" + 砖.还要打几下 + \" 下\", 砖.x + 砖.宽 / 2, 砖.y, \"#FFFFFF\"); return; }\n  砖块们 = 砖块们.filter(别的 => 别的 !== 砖);\n  分数 += 砖.种类.得几分;\n  飘字(\"+\" + 砖.种类.得几分, 砖.x + 砖.宽 / 2, 砖.y, \"#FFE066\");\n  for (let i = 0; i < 6; i++) 碎片们.push({ x: 砖.x + 砖.宽 / 2, y: 砖.y + 砖.高 / 2, vx: (Math.random() - 0.5) * 8, vy: -Math.random() * 5, 颜色: 砖.种类.颜色, 寿命: 30 });\n  if (砖.种类.碎了掉出) 道具们.push({ x: 砖.x + 砖.宽 / 2, y: 砖.y + 砖.高 / 2, 东西: 砖.种类.碎了掉出 });\n}\n\n// 挡板接到道具\nfunction 接到道具(东西) {\n  if (东西 === \"变长\") { 变长到 = 帧数 + 600; 说一句(\"挡板变长了！10 秒\"); }\n  if (东西 === \"多一个球\") { 球们.push({ x: 挡板.x, y: 挡板Y - 球半径 - 2, vx: -球速() * Math.sin(0.5), vy: -球速() * Math.cos(0.5), 在挡板上: false }); 说一句(\"多了一个球！\"); }\n  if (东西 === \"加一条命\") { 剩几个球++; 说一句(\"加一条命！还剩 \" + 剩几个球 + \" 个球\"); }\n}\n\n// 球往前走一小步，看碰到了什么\nfunction 球走一小步(球, 份) {\n  const 前x = 球.x, 前y = 球.y;\n  球.x += 球.vx * 份; 球.y += 球.vy * 份;\n  // 左边、右边、上边的墙\n  if (球.x - 球半径 < 场地.左) { 球.x = 场地.左 + 球半径; 球.vx = Math.abs(球.vx); }\n  if (球.x + 球半径 > 场地.右) { 球.x = 场地.右 - 球半径; 球.vx = -Math.abs(球.vx); }\n  if (球.y - 球半径 < 场地.上) { 球.y = 场地.上 + 球半径; 球.vy = Math.abs(球.vy); }\n  // 挡板\n  const 宽 = 挡板现在宽();\n  if (球.vy > 0 && 球.y + 球半径 >= 挡板Y && 前y + 球半径 <= 挡板Y + 8 && Math.abs(球.x - 挡板.x) <= 宽 / 2 + 球半径) 碰到挡板(球, 宽);\n  // 砖块：碰到上下面，上下反弹；碰到左右面，左右反弹\n  for (const 砖 of 砖块们) {\n    if (球.x + 球半径 <= 砖.x || 球.x - 球半径 >= 砖.x + 砖.宽 || 球.y + 球半径 <= 砖.y || 球.y - 球半径 >= 砖.y + 砖.高) continue;\n    const 从左右来 = 前x + 球半径 <= 砖.x || 前x - 球半径 >= 砖.x + 砖.宽;\n    const 从上下来 = 前y + 球半径 <= 砖.y || 前y - 球半径 >= 砖.y + 砖.高;\n    if (从左右来 && !从上下来) 球.vx = 前x < 砖.x ? -Math.abs(球.vx) : Math.abs(球.vx);\n    else 球.vy = 前y < 砖.y ? -Math.abs(球.vy) : Math.abs(球.vy);\n    球.x = 前x; 球.y = 前y;\n    打到砖(砖);\n    break;\n  }\n  // 底下：有保护墙就挡一次，没有就掉下去了\n  if (保护墙还在 && 球.vy > 0 && 球.y + 球半径 >= 保护墙Y) { 球.y = 保护墙Y - 球半径; 球.vy = -Math.abs(球.vy); 保护墙还在 = false; 说一句(\"保护墙挡住了一次！\"); }\n  if (球.y - 球半径 > 场地.下) 球.掉了 = true;\n}\n\nfunction 少一个球() {\n  剩几个球--;\n  if (剩几个球 <= 0) { 剩几个球 = 0; 输了(); return; }\n  说一句(\"球掉下去了，还剩 \" + 剩几个球 + \" 个球\");\n  新球放在挡板上();\n}\nfunction 输了() { 状态 = \"输了\"; 说一句(\"球用完了！点「再来一局」\"); }\nfunction 赢了() { 状态 = \"赢了\"; 说一句(\"砖块全打碎了，你赢了！\"); }\n\n// 每一帧：挡板、球、道具都动一动\nfunction 更新() {\n  if (状态 !== \"玩\") return;\n  if (按着左) 移动挡板(挡板.x - 12);\n  if (按着右) 移动挡板(挡板.x + 12);\n  移动挡板(挡板.x);   // 挡板变长变短以后也不出界\n  for (const 球 of 球们) {\n    if (球.在挡板上) { 球.x = 挡板.x; 球.y = 挡板Y - 球半径; continue; }\n    const 几步 = Math.max(1, Math.ceil(Math.hypot(球.vx, 球.vy) / 4));   // 分几小步走，快的球也不会穿过砖\n    for (let i = 0; i < 几步 && !球.掉了; i++) 球走一小步(球, 1 / 几步);\n  }\n  球们 = 球们.filter(球 => !球.掉了);\n  if (球们.length === 0) 少一个球();\n  const 宽 = 挡板现在宽();\n  for (const 道具 of 道具们) {\n    道具.y += 3;\n    if (道具.y + 16 >= 挡板Y && 道具.y - 16 <= 挡板Y + 挡板高 && Math.abs(道具.x - 挡板.x) <= 宽 / 2 + 16) { 道具.没了 = true; 接到道具(道具.东西); }\n    else if (道具.y - 20 > 场地.下) 道具.没了 = true;\n  }\n  道具们 = 道具们.filter(道具 => !道具.没了);\n  if (状态 === \"玩\" && 一开始有砖 && 砖块们.length === 0) 赢了();\n}\n\n// ===== 操作：手指按住左右拖动挡板，点一下发球；也可以用方向键和空格 =====\nlet 按住 = false, 按下的点 = null, 拖过 = false;\nlet 按着左 = false, 按着右 = false;\nconst 再来按钮 = { x: W / 2, y: H / 2 + 70, 宽: 220, 高: 64 };\nfunction 画布上的点(e) {\n  const r = canvas.getBoundingClientRect();\n  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };\n}\ncanvas.addEventListener(\"pointerdown\", e => {\n  const 点 = 画布上的点(e);\n  if (状态 !== \"玩\") {\n    if (Math.abs(点.x - 再来按钮.x) < 再来按钮.宽 / 2 && Math.abs(点.y - 再来按钮.y) < 再来按钮.高 / 2) 开始();\n    return;\n  }\n  按住 = true; 按下的点 = 点; 拖过 = false;\n  try { canvas.setPointerCapture(e.pointerId); } catch (错) { }\n});\ncanvas.addEventListener(\"pointermove\", e => {\n  if (!按住 || 状态 !== \"玩\") return;\n  const 点 = 画布上的点(e);\n  if (Math.abs(点.x - 按下的点.x) > 12) 拖过 = true;\n  if (拖过) 移动挡板(点.x);\n});\ncanvas.addEventListener(\"pointerup\", () => {\n  if (!按住) return;\n  按住 = false;\n  if (!拖过) 发球();   // 没拖动，就是点了一下\n});\ncanvas.addEventListener(\"pointercancel\", () => { 按住 = false; });\ndocument.addEventListener(\"keydown\", e => {\n  if (e.key === \"ArrowLeft\") { 按着左 = true; e.preventDefault(); }\n  else if (e.key === \"ArrowRight\") { 按着右 = true; e.preventDefault(); }\n  else if (e.key === \" \" || e.key === \"ArrowUp\") { if (状态 === \"玩\") 发球(); else 开始(); e.preventDefault(); }\n});\ndocument.addEventListener(\"keyup\", e => {\n  if (e.key === \"ArrowLeft\") 按着左 = false;\n  if (e.key === \"ArrowRight\") 按着右 = false;\n});\n\n// ===== 画画的小工具 =====\nfunction 说一句(文字) { 话 = 文字; 话的寿命 = 150; }\nfunction 飘字(文字, x, y, 颜色) { 飘字们.push({ 文字, x, y, 颜色, 寿命: 40 }); }\nfunction 圆角矩形(x, y, w, h, r) {\n  r = Math.max(0, Math.min(r, w / 2, h / 2));\n  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);\n  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); ctx.fill();\n}\nfunction 画表情(文字, x, y, 大小) {\n  ctx.font = 大小 + 'px \"Apple Color Emoji\",\"Segoe UI Emoji\",\"Noto Color Emoji\",sans-serif';\n  ctx.fillStyle = \"#000\"; ctx.textAlign = \"center\"; ctx.textBaseline = \"middle\"; ctx.fillText(文字, x, y);\n}\nfunction 画文字(文字, x, y, 大小, 颜色) {\n  ctx.fillStyle = 颜色; ctx.font = \"bold \" + 大小 + 'px \"PingFang SC\",\"Microsoft YaHei\",sans-serif';\n  ctx.textAlign = \"center\"; ctx.textBaseline = \"middle\"; ctx.fillText(文字, x, y);\n}\n// 要打好几下的砖，被打过就裂开：打过几下，就有几道裂纹\nfunction 画裂纹(砖, 几道) {\n  ctx.strokeStyle = \"rgba(30,42,74,0.6)\"; ctx.lineWidth = 2;\n  for (let i = 0; i < Math.min(几道, 3); i++) {\n    const x = 砖.x + 砖.宽 * (0.2 + 0.3 * i);\n    ctx.beginPath(); ctx.moveTo(x, 砖.y); ctx.lineTo(x + 6, 砖.y + 砖.高 * 0.35); ctx.lineTo(x - 4, 砖.y + 砖.高 * 0.65); ctx.lineTo(x + 3, 砖.y + 砖.高); ctx.stroke();\n  }\n}\n\nfunction 画() {\n  ctx.fillStyle = \"#FFF7EC\"; ctx.fillRect(0, 0, W, H);\n\n  // 顶上：比特、分数、还剩几个球\n  画表情(\"🐶\", 40, 32, 34);\n  画文字(\"分数 \" + 分数, 140, 32, 28, \"#1E2A4A\");\n  if (保护墙还在) 画文字(\"保护墙 ✓\", W / 2, 32, 22, \"#18A87C\");\n  画文字(\"还剩\", 790, 32, 24, \"#5B6683\");\n  画表情(\"⚪\", 852, 32, 26);\n  画文字(\"× \" + 剩几个球, 900, 32, 28, \"#1E2A4A\");\n\n  // 场地\n  ctx.fillStyle = 设置.背景颜色; 圆角矩形(场地.左, 场地.上, 场地.右 - 场地.左, 场地.下 - 场地.上, 18);\n\n  // 砖块\n  for (const 砖 of 砖块们) {\n    ctx.fillStyle = 砖.种类.颜色; 圆角矩形(砖.x, 砖.y, 砖.宽, 砖.高, 6);\n    ctx.fillStyle = \"rgba(255,255,255,0.28)\"; 圆角矩形(砖.x + 4, 砖.y + 3, 砖.宽 - 8, Math.max(2, 砖.高 * 0.25), 3);\n    if (砖.种类.打几下才碎 > 1) {\n      const 打过 = 砖.种类.打几下才碎 - 砖.还要打几下;\n      if (打过 > 0) 画裂纹(砖, 打过);\n      画文字(String(砖.还要打几下), 砖.x + 砖.宽 / 2, 砖.y + 砖.高 / 2 + 1, Math.max(10, Math.min(22, 砖.高 - 6)), \"#1E2A4A\");\n    }\n    if (砖.种类.碎了掉出 && 砖.宽 > 36) 画表情(道具图案[砖.种类.碎了掉出], 砖.x + 砖.宽 - 13, 砖.y + 砖.高 / 2 + 1, Math.max(10, Math.min(18, 砖.高 - 8)));\n  }\n\n  // 碎片\n  for (const 片 of 碎片们) {\n    ctx.globalAlpha = 片.寿命 / 30; ctx.fillStyle = 片.颜色; ctx.fillRect(片.x - 4, 片.y - 4, 8, 8); ctx.globalAlpha = 1;\n    片.x += 片.vx; 片.y += 片.vy; 片.vy += 0.3; 片.寿命--;\n  }\n  碎片们 = 碎片们.filter(片 => 片.寿命 > 0);\n\n  // 掉下来的道具\n  for (const 道具 of 道具们) {\n    ctx.fillStyle = \"rgba(255,255,255,0.18)\"; ctx.beginPath(); ctx.arc(道具.x, 道具.y, 20, 0, Math.PI * 2); ctx.fill();\n    画表情(道具图案[道具.东西] || \"🎁\", 道具.x, 道具.y, 28);\n  }\n\n  // 保护墙\n  if (保护墙还在) { ctx.fillStyle = \"#5BE0FF\"; 圆角矩形(场地.左 + 10, 保护墙Y - 3, 场地.右 - 场地.左 - 20, 6, 3); }\n\n  // 挡板：比特坐在上面\n  const 宽 = 挡板现在宽();\n  ctx.fillStyle = 帧数 < 变长到 ? \"#FFC93D\" : \"#FF8A3D\"; 圆角矩形(挡板.x - 宽 / 2, 挡板Y, 宽, 挡板高, 10);\n  画表情(\"🐶\", 挡板.x, 挡板Y + 挡板高 / 2 + 1, 20);\n\n  // 球\n  for (const 球 of 球们) {\n    ctx.fillStyle = \"rgba(255,255,255,0.25)\"; ctx.beginPath(); ctx.arc(球.x, 球.y, 球半径 + 5, 0, Math.PI * 2); ctx.fill();\n    ctx.fillStyle = \"#FFFFFF\"; ctx.beginPath(); ctx.arc(球.x, 球.y, 球半径, 0, Math.PI * 2); ctx.fill();\n  }\n  if (状态 === \"玩\" && 球们.some(球 => 球.在挡板上)) 画文字(\"点一下发球\", W / 2, 挡板Y - 70, 26, \"rgba(255,255,255,0.85)\");\n\n  // 飘字\n  for (const 字 of 飘字们) {\n    ctx.globalAlpha = 字.寿命 / 40; 画文字(字.文字, 字.x, 字.y, 26, 字.颜色); 字.y -= 1.2; 字.寿命--; ctx.globalAlpha = 1;\n  }\n  飘字们 = 飘字们.filter(字 => 字.寿命 > 0);\n\n  // 输了、赢了：再来一局\n  if (状态 !== \"玩\") {\n    ctx.fillStyle = \"rgba(255,247,236,0.95)\"; 圆角矩形(W / 2 - 230, H / 2 - 120, 460, 250, 26);\n    画文字(状态 === \"赢了\" ? \"你赢了！🎉\" : \"球用完了\", W / 2, H / 2 - 66, 44, \"#1E2A4A\");\n    画文字(\"得了 \" + 分数 + \" 分\", W / 2, H / 2 - 6, 28, \"#5B6683\");\n    ctx.fillStyle = \"#FF8A3D\"; 圆角矩形(再来按钮.x - 再来按钮.宽 / 2, 再来按钮.y - 再来按钮.高 / 2, 再来按钮.宽, 再来按钮.高, 20);\n    画文字(\"再来一局\", 再来按钮.x, 再来按钮.y, 28, \"#FFFFFF\");\n  }\n\n  // 一句提示\n  if (话的寿命 > 0) {\n    话的寿命--;\n    ctx.globalAlpha = Math.min(1, 话的寿命 / 30);\n    ctx.fillStyle = \"rgba(255,255,255,0.92)\"; 圆角矩形(W / 2 - 300, 场地.上 + 12, 600, 52, 18);\n    画文字(话, W / 2, 场地.上 + 38, 24, \"#1E2A4A\");\n    ctx.globalAlpha = 1;\n  }\n}\n\n// 每一帧都会运行一次\nfunction 游戏循环() {\n  帧数++;\n  更新();\n  画();\n  requestAnimationFrame(游戏循环);\n}\n开始();\n游戏循环();\n<\/script>\n<\/body>\n<\/html>\n", "抓虫子-救援版.html": "<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, user-scalable=no\">\n<title>抓虫子<\/title>\n<style>\n  html, body { margin: 0; height: 100%; background: #FFF7EC; font-family: \"PingFang SC\", \"Microsoft YaHei\", sans-serif; color: #1E2A4A; touch-action: manipulation; }\n  #box { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }\n  h1 { margin: 0; font-size: 28px; }\n  canvas { width: min(96vw, 160vh); max-height: 82vh; aspect-ratio: 16 / 9; border-radius: 18px; box-shadow: 0 6px 0 #F0E2CC; background: #9BD77E; }\n  p { margin: 0; color: #5B6683; font-size: 18px; }\n<\/style>\n<\/head>\n<body>\n<div id=\"box\">\n  <h1>抓虫子<\/h1>\n  <canvas id=\"game\" width=\"960\" height=\"540\"><\/canvas>\n  <p>虫子从洞里冒出来，快点它！<\/p>\n<\/div>\n\n<script>\n// ===== 游戏设置：想改游戏，先改这里 =====\nconst 设置 = {\n  主角: \"比特\",            // 在旁边加油的主角；也可以换成表情，比如 \"🐱\"\n  天空颜色: \"#BDE6FF\",     // 上面天空的颜色\n  草地颜色: \"#9BD77E\",     // 草地的颜色\n  洞的行数: 2,             // 一共几排洞\n  洞的列数: 4,             // 每排几个洞\n  冒出间隔: 1,             // 每隔几秒冒出一个；数字越小，冒得越勤\n  停留时间: 1.5,           // 冒出来以后停几秒就缩回去；数字越小，越难抓\n  显示分数: true,          // 是否显示分数\n  倒计时: 60,              // 游戏时间（秒）；填 0 表示不限时\n  越来越快: true,          // 每得 5 分，冒得更勤、停得更短\n  加时间道具间隔: 10,      // 能加时间的道具（比如闹钟），最少隔几秒才出现一次\n};\n\n// ===== 洞里会冒出来的道具：只要你想得到，都可以加进来 =====\n// 图案：可以用画好的（毛毛虫、蚊子、蝴蝶、闹钟），也可以填任意表情，比如 \"🐭\"\n// 点到加几分：可以是负数，比如不能点的蝴蝶填 -3\n// 点到加几秒：点到以后，倒计时多几秒（要先打开倒计时）\n// 出现机会：数字越大，越常冒出来\nconst 会冒出来的东西 = [\n  { 名字: \"毛毛虫\", 图案: \"毛毛虫\", 点到加几分: 1, 出现机会: 3 },\n  { 名字: \"蚊子\", 图案: \"蚊子\", 点到加几分: 5, 出现机会: 1 },\n  { 名字: \"蝴蝶\", 图案: \"蝴蝶\", 点到加几分: -3, 出现机会: 1 },\n  { 名字: \"闹钟\", 图案: \"闹钟\", 点到加几分: 0, 点到加几秒: 5, 出现机会: 1 },\n];\n\n// ===== 画好的图案（想加新图案，可以直接用表情） =====\nconst 画好的图案 = {\n  毛毛虫: '<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\"><g fill=\"#5BC236\" stroke=\"#2F8A1E\" stroke-width=\"3\"><circle cx=\"50\" cy=\"86\" r=\"14\"/><circle cx=\"53\" cy=\"68\" r=\"15\"/><circle cx=\"49\" cy=\"50\" r=\"15\"/><\/g><g fill=\"#2F8A1E\"><circle cx=\"44\" cy=\"88\" r=\"3\"/><circle cx=\"58\" cy=\"70\" r=\"3\"/><circle cx=\"44\" cy=\"52\" r=\"3\"/><\/g><circle cx=\"52\" cy=\"28\" r=\"19\" fill=\"#7BD84E\" stroke=\"#2F8A1E\" stroke-width=\"3\"/><path d=\"M45 11l-6-8M59 11l6-8\" stroke=\"#2F8A1E\" stroke-width=\"3\" stroke-linecap=\"round\"/><circle cx=\"38\" cy=\"3\" r=\"3.5\" fill=\"#FFC93D\"/><circle cx=\"66\" cy=\"3\" r=\"3.5\" fill=\"#FFC93D\"/><circle cx=\"45\" cy=\"25\" r=\"6\" fill=\"#fff\"/><circle cx=\"59\" cy=\"25\" r=\"6\" fill=\"#fff\"/><circle cx=\"46\" cy=\"26\" r=\"3\" fill=\"#1E2A4A\"/><circle cx=\"60\" cy=\"26\" r=\"3\" fill=\"#1E2A4A\"/><path d=\"M46 36q6 5 12 0\" stroke=\"#1E2A4A\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><\/svg>',\n  蚊子: '<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\"><g stroke=\"#3A3F55\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><path d=\"M50 56L38 78L31 92\"/><path d=\"M57 57L60 80L56 94\"/><path d=\"M63 54L79 75L88 87\"/><\/g><ellipse cx=\"40\" cy=\"25\" rx=\"19\" ry=\"10\" fill=\"#DCEEFF\" stroke=\"#7AA9D6\" stroke-width=\"2.5\" transform=\"rotate(-40 40 25)\"/><ellipse cx=\"55\" cy=\"24\" rx=\"21\" ry=\"11\" fill=\"#EAF5FF\" stroke=\"#7AA9D6\" stroke-width=\"2.5\" transform=\"rotate(-18 55 24)\"/><ellipse cx=\"29\" cy=\"53\" rx=\"25\" ry=\"12\" fill=\"#5B6178\" transform=\"rotate(-12 29 53)\"/><path d=\"M17 45l2 16M27 42l2 18M37 41l1 16\" stroke=\"#fff\" stroke-width=\"3.4\" stroke-linecap=\"round\"/><circle cx=\"56\" cy=\"47\" r=\"12\" fill=\"#4A4F66\"/><circle cx=\"71\" cy=\"42\" r=\"10\" fill=\"#4A4F66\"/><circle cx=\"74\" cy=\"39\" r=\"5\" fill=\"#E5484D\"/><path d=\"M78 47L98 61\" stroke=\"#4A4F66\" stroke-width=\"3.6\" stroke-linecap=\"round\"/><\/svg>',\n  蝴蝶: '<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\"><ellipse cx=\"29\" cy=\"38\" rx=\"23\" ry=\"18\" fill=\"#A066FF\" transform=\"rotate(-25 29 38)\"/><ellipse cx=\"71\" cy=\"38\" rx=\"23\" ry=\"18\" fill=\"#A066FF\" transform=\"rotate(25 71 38)\"/><ellipse cx=\"33\" cy=\"66\" rx=\"15\" ry=\"13\" fill=\"#FF6FA5\"/><ellipse cx=\"67\" cy=\"66\" rx=\"15\" ry=\"13\" fill=\"#FF6FA5\"/><circle cx=\"25\" cy=\"35\" r=\"6\" fill=\"#fff\" opacity=\".85\"/><circle cx=\"75\" cy=\"35\" r=\"6\" fill=\"#fff\" opacity=\".85\"/><circle cx=\"32\" cy=\"68\" r=\"4\" fill=\"#FFC93D\"/><circle cx=\"68\" cy=\"68\" r=\"4\" fill=\"#FFC93D\"/><rect x=\"46\" y=\"28\" width=\"8\" height=\"48\" rx=\"4\" fill=\"#1E2A4A\"/><circle cx=\"50\" cy=\"24\" r=\"6\" fill=\"#1E2A4A\"/><path d=\"M48 19Q42 8 35 7M52 19Q58 8 65 7\" stroke=\"#1E2A4A\" stroke-width=\"2.6\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"35\" cy=\"7\" r=\"3\" fill=\"#1E2A4A\"/><circle cx=\"65\" cy=\"7\" r=\"3\" fill=\"#1E2A4A\"/><\/svg>',\n  闹钟: '<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\"><path d=\"M32 86l-8 10M68 86l8 10\" stroke=\"#B8333A\" stroke-width=\"7\" stroke-linecap=\"round\"/><circle cx=\"26\" cy=\"22\" r=\"13\" fill=\"#FFC93D\" stroke=\"#D9A200\" stroke-width=\"3\"/><circle cx=\"74\" cy=\"22\" r=\"13\" fill=\"#FFC93D\" stroke=\"#D9A200\" stroke-width=\"3\"/><rect x=\"45\" y=\"14\" width=\"10\" height=\"10\" rx=\"3\" fill=\"#B8333A\"/><circle cx=\"50\" cy=\"57\" r=\"34\" fill=\"#E5484D\"/><circle cx=\"50\" cy=\"57\" r=\"26\" fill=\"#fff\"/><path d=\"M50 57V39M50 57l12 7\" stroke=\"#1E2A4A\" stroke-width=\"5\" stroke-linecap=\"round\"/><circle cx=\"50\" cy=\"57\" r=\"4\" fill=\"#1E2A4A\"/><\/svg>'\n};\n\n// ===== 下面是游戏程序 =====\nconst canvas = document.getElementById(\"game\");\nconst ctx = canvas.getContext(\"2d\");\nconst W = canvas.width, H = canvas.height;\n\nlet 状态 = \"准备\";            // \"准备\"、\"玩\"、\"结束\"\nlet 分数 = 0, 剩余时间 = 设置.倒计时, 玩了几秒 = 0, 上次加时间道具 = -99;\nlet 洞们 = [], 飘字们 = [], 计时 = 0, 跳一跳 = 0, 分数跳 = 0;\n\n// 把画好的图案变成图片\nconst 图片们 = {};\nfor (const 名字 in 画好的图案) {\n  const 图 = new Image();\n  图.src = \"data:image/svg+xml;charset=utf-8,\" + encodeURIComponent(画好的图案[名字]);\n  图片们[名字] = 图;\n}\n\n// 按行数、列数排好洞的位置\nfunction 摆洞() {\n  洞们 = [];\n  const 最上 = 205, 最下 = H - 70;\n  for (let 行 = 0; 行 < 设置.洞的行数; 行++) {\n    for (let 列 = 0; 列 < 设置.洞的列数; 列++) {\n      const x = 60 + 680 * (列 + 0.5) / 设置.洞的列数;\n      const y = 设置.洞的行数 === 1 ? (最上 + 最下) / 2 : 最上 + (最下 - 最上) * 行 / (设置.洞的行数 - 1);\n      洞们.push({ x: x, y: y, 东西: null });\n    }\n  }\n}\n\nfunction 重新开始() {\n  分数 = 0;\n  剩余时间 = 设置.倒计时;\n  玩了几秒 = 0;\n  上次加时间道具 = -99;\n  计时 = 0;\n  飘字们 = [];\n  摆洞();\n  状态 = \"玩\";\n}\n\n// 按“出现机会”随机挑一个道具\nfunction 挑一个东西() {\n  // 能加时间的道具，最少隔一段时间才出现一次；不然手快的人能一直玩下去\n  let 能选的 = 会冒出来的东西.filter(东西 => !(东西.点到加几秒 && 设置.倒计时 > 0 && 玩了几秒 - 上次加时间道具 < 设置.加时间道具间隔));\n  if (能选的.length === 0) 能选的 = 会冒出来的东西;\n  let 总数 = 0;\n  for (const 东西 of 能选的) 总数 += 东西.出现机会 || 1;\n  let 随机 = Math.random() * 总数;\n  for (const 东西 of 能选的) {\n    随机 -= 东西.出现机会 || 1;\n    if (随机 <= 0) return 东西;\n  }\n  return 能选的[0];\n}\n\n// 越来越快：每得 5 分升一级，冒得更勤、停得更短\nfunction 难度() { return 设置.越来越快 ? Math.floor(Math.max(0, 分数) / 5) : 0; }\nfunction 当前间隔() { return Math.max(0.35, 设置.冒出间隔 * Math.pow(0.88, 难度())); }\nfunction 当前停留() { return Math.max(0.6, 设置.停留时间 * Math.pow(0.93, 难度())); }\n\n// 找一个空洞，让一个道具冒出来\nfunction 冒一个() {\n  const 空洞 = 洞们.filter(洞 => !洞.东西);\n  if (空洞.length === 0) return;\n  const 洞 = 空洞[Math.floor(Math.random() * 空洞.length)];\n  const 东西 = 挑一个东西();\n  if (东西.点到加几秒) 上次加时间道具 = 玩了几秒;\n  洞.东西 = Object.assign({ 已过: 0, 停留: 当前停留() }, 东西);\n}\n\nfunction 飘字(文字, x, y, 颜色) { 飘字们.push({ 文字, x, y, 颜色, 寿命: 45 }); }\n\n// 点到洞里的道具时，会发生什么\nfunction 点到(洞) {\n  const 东西 = 洞.东西;\n  洞.东西 = null;\n  const 分 = tx.lineTo(9, -2); ctx.stroke();\n  // 前腿\n  ctx.fillStyle = \"#F4F6FA\";\n  [[-16, 24], [16, 24]].forEach(([lx, ly]) => { 圆角矩形(lx - 7, ly, 14, 24, 7); });\n  ctx.fillStyle = \"#FF8A3D\";\n  [[-16, 44], [16, 44]].forEach(([lx, ly]) => { 圆角矩形(lx - 9, ly, 18, 11, 5); });\n  // 垂耳：从头两侧下垂的胶囊耳（正旋转=下垂；负旋转会变成翅耳）\n  ctx.fillStyle = \"#FF8A3D\";\n  ctx.beginPath(); ctx.ellipse(-48, -48, 13, 30, 0.35, 0, Math.PI * 2); ctx.fill();\n  ctx.beginPath(); ctx.ellipse(48, -48, 13, 30, -0.35, 0, Math.PI * 2); ctx.fill();\n  ctx.fillStyle = \"#FFC08A\";\n  ctx.beginPath(); ctx.ellipse(-48, -46, 6, 18, 0.35, 0, Math.PI * 2); ctx.fill();\n  ctx.beginPath(); ctx.ellipse(48, -46, 6, 18, -0.35, 0, Math.PI * 2); ctx.fill();\n  // 头\n  ctx.fillStyle = \"#F4F6FA\"; 圆角矩形(-40, -88, 80, 72, 30);\n  ctx.strokeStyle = \"#C5CCD8\"; ctx.lineWidth = 2; ctx.beginPath();\n  (function(x,y,w,h,r){ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();})(-40,-88,80,72,30); ctx.stroke();\n  ctx.fillStyle = \"rgba(255,255,255,.55)\"; ctx.beginPath(); ctx.ellipse(-14, -70, 16, 8, -0.3, 0, Math.PI * 2); ctx.fill();\n  // 黑面罩\n  ctx.fillStyle = \"#141820\"; ctx.beginPath(); ctx.ellipse(0, -52, 28, 22, 0, 0, Math.PI * 2); ctx.fill();\n  // 四角星星眼 ✦\n  ctx.fillStyle = \"#5BE0FF\";\n  for (const [ex, ey] of [[-12, -54], [12, -54]]) {\n    ctx.beginPath();\n    const outer = 9, inner = 9 * 0.38;\n    for (let i = 0; i < 8; i++) {\n      const a = -Math.PI / 2 + i * Math.PI / 4;\n      const rad = i % 2 === 0 ? outer : inner;\n      const x = ex + Math.cos(a) * rad, y = ey + Math.sin(a) * rad;\n      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);\n    }\n    ctx.closePath(); ctx.fill();\n  }\n  // 像素小嘴\n  [[-5, -40], [-1, -38], [3, -40]].forEach(([mx, my]) => { 圆角矩形(mx, my, 2.6, 2.2, 0.4); });\n  // 天线：橙底座 + 白杆 + 白球\n  ctx.fillStyle = \"#FF8A3D\"; ctx.beginPath(); ctx.ellipse(0, -88, 7, 4, 0, 0, Math.PI * 2); ctx.fill();\n  ctx.strokeStyle = \"#F2F4F8\"; ctx.lineWidth = 4; ctx.lineCap = \"round\";\n  ctx.beginPath(); ctx.moveTo(0, -88); ctx.lineTo(0, -104); ctx.stroke();\n  ctx.fillStyle = \"#FFFFFF\"; ctx.strokeStyle = \"#D0D6E2\"; ctx.lineWidth = 1;\n  ctx.beginPath(); ctx.arc(0, -106, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();\n  ctx.restore();\n}\nfunction 圆角矩形(x, y, w, h, r) {\n  r = Math.min(r, w / 2, h / 2);\n  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);\n  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); ctx.fill();\n}\nfunction 画表情(文字, x, y, 大小) {\n  ctx.font = 大小 + 'px \"Apple Color Emoji\",\"Segoe UI Emoji\",\"Noto Color Emoji\",sans-serif';\n  ctx.fillStyle = \"#000\"; ctx.textAlign = \"center\"; ctx.textBaseline = \"middle\"; ctx.fillText(文字, x, y);\n}\nfunction 画文字(文字, x, y, 大小, 颜色, 对齐) {\n  ctx.fillStyle = 颜色; ctx.font = \"bold \" + 大小 + 'px \"PingFang SC\",\"Microsoft YaHei\",sans-serif';\n  ctx.textAlign = 对齐 || \"center\"; ctx.textBaseline = \"middle\"; ctx.fillText(文字, x, y);\n}\n// 画一块圆角的牌子，用来显示分数和时间\nfunction 画牌子(文字, x, y, 底色, 字色, 放大) {\n  ctx.save(); ctx.translate(x, y); ctx.scale(放大, 放大);\n  ctx.font = 'bold 40px \"PingFang SC\",\"Microsoft YaHei\",sans-serif';\n  const 宽 = ctx.measureText(文字).width + 52;\n  ctx.fillStyle = 底色; 圆角矩形(-宽 / 2, -32, 宽, 64, 32);\n  画文字(文字, 0, 2, 40, 字色);\n  ctx.restore();\n}\n\nfunction 画() {\n  画背景();\n  for (const 洞 of 洞们) 画洞(洞);\n  if (跳一跳 > 0) 跳一跳--;\n  if (分数跳 > 0) 分数跳--;\n  const 主角Y = H - 40 - Math.sin(跳一跳 / 18 * Math.PI) * 30;\n  if (设置.主角 === \"比特\") 画比特(W - 96, 主角Y, 100);\n  else 画表情(设置.主角, W - 96, 主角Y - 50, 96);\n  for (const 字 of 飘字们) {\n    ctx.globalAlpha = 字.寿命 / 45; 画文字(字.文字, 字.x, 字.y, 32, 字.颜色); 字.y -= 1.3; 字.寿命--; ctx.globalAlpha = 1;\n  }\n  飘字们 = 飘字们.filter(字 => 字.寿命 > 0);\n  if (状态 !== \"准备\") {\n    const 有时间 = 设置.倒计时 > 0;\n    if (设置.显示分数) 画牌子(\"分数 \" + 分数, W / 2 - (有时间 ? 130 : 0), 60, \"#FFFFFF\", 分数 < 0 ? \"#E5484D\" : \"#1E2A4A\", 1 + Math.sin(分数跳 / 14 * Math.PI) * 0.18);\n    if (有时间) 画牌子(\"剩 \" + Math.ceil(剩余时间) + \" 秒\", W / 2 + 140, 60, 剩余时间 <= 10 ? \"#E5484D\" : \"#1E2A4A\", \"#FFFFFF\", 1);\n  }\n  if (状态 === \"准备\") {\n    ctx.fillStyle = \"rgba(30,42,74,0.35)\"; ctx.fillRect(0, 0, W, H);\n    画文字(\"点一下，开始抓虫！\", W / 2, H / 2, 54, \"#FFFFFF\");\n  }\n  if (状态 === \"结束\") {\n    ctx.fillStyle = \"rgba(30,42,74,0.55)\"; ctx.fillRect(0, 0, W, H);\n    画文字(\"时间到！\", W / 2, H / 2 - 50, 64, \"#FFFFFF\");\n    if (设置.显示分数) 画文字(\"总分 \" + 分数, W / 2, H / 2 + 20, 48, \"#FFC93D\");\n    画文字(\"点一下，再来一次\", W / 2, H / 2 + 84, 30, \"#FFFFFF\");\n  }\n}\n\nfunction 游戏循环() { 更新(); 画(); requestAnimationFrame(游戏循环); }\n摆洞();\n游戏循环();\n<\/script>\n<\/body>\n<\/html>\n", "抓虫子.html": "<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, user-scalable=no\">\n<title>抓虫子<\/title>\n<style>\n  html, body { margin: 0; height: 100%; background: #FFF7EC; font-family: \"PingFang SC\", \"Microsoft YaHei\", sans-serif; color: #1E2A4A; touch-action: manipulation; }\n  #box { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }\n  h1 { margin: 0; font-size: 28px; }\n  canvas { width: min(96vw, 160vh); max-height: 82vh; aspect-ratio: 16 / 9; border-radius: 18px; box-shadow: 0 6px 0 #F0E2CC; background: #9BD77E; }\n  p { margin: 0; color: #5B6683; font-size: 18px; }\n<\/style>\n<\/head>\n<body>\n<div id=\"box\">\n  <h1>抓虫子<\/h1>\n  <canvas id=\"game\" width=\"960\" height=\"540\"><\/canvas>\n  <p>虫子从洞里冒出来，快点它！<\/p>\n<\/div>\n\n<script>\n// ===== 游戏设置：想改游戏，先改这里 =====\nconst 设置 = {\n  主角: \"比特\",            // 在旁边加油的主角；也可以换成表情，比如 \"🐱\"\n  天空颜色: \"#BDE6FF\",     // 上面天空的颜色\n  草地颜色: \"#9BD77E\",     // 草地的颜色\n  洞的行数: 2,             // 一共几排洞\n  洞的列数: 4,             // 每排几个洞\n  冒出间隔: 1,             // 每隔几秒冒出一个；数字越小，冒得越勤\n  停留时间: 1.5,           // 冒出来以后停几秒就缩回去；数字越小，越难抓\n  显示分数: false,         // 是否显示分数\n  倒计时: 0,               // 游戏时间（秒）；填 0 表示不限时\n  越来越快: false,         // 每得 5 分，冒得更勤、停得更短\n  加时间道具间隔: 10,      // 能加时间的道具（比如闹钟），最少隔几秒才出现一次\n};\n\n// ===== 洞里会冒出来的道具：只要你想得到，都可以加进来 =====\n// 图案：可以用画好的（毛毛虫、蚊子、蝴蝶、闹钟），也可以填任意表情，比如 \"🐭\"\n// 点到加几分：可以是负数，比如不能点的蝴蝶填 -3\n// 点到加几秒：点到以后，倒计时多几秒（要先打开倒计时）\n// 出现机会：数字越大，越常冒出来\nconst 会冒出来的东西 = [\n  { 名字: \"毛毛虫\", 图案: \"毛毛虫\", 点到加几分: 1, 出现机会: 1 },\n];\n\n// ===== 画好的图案（想加新图案，可以直接用表情） =====\nconst 画好的图案 = {\n  毛毛虫: '<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\"><g fill=\"#5BC236\" stroke=\"#2F8A1E\" stroke-width=\"3\"><circle cx=\"50\" cy=\"86\" r=\"14\"/><circle cx=\"53\" cy=\"68\" r=\"15\"/><circle cx=\"49\" cy=\"50\" r=\"15\"/><\/g><g fill=\"#2F8A1E\"><circle cx=\"44\" cy=\"88\" r=\"3\"/><circle cx=\"58\" cy=\"70\" r=\"3\"/><circle cx=\"44\" cy=\"52\" r=\"3\"/><\/g><circle cx=\"52\" cy=\"28\" r=\"19\" fill=\"#7BD84E\" stroke=\"#2F8A1E\" stroke-width=\"3\"/><path d=\"M45 11l-6-8M59 11l6-8\" stroke=\"#2F8A1E\" stroke-width=\"3\" stroke-linecap=\"round\"/><circle cx=\"38\" cy=\"3\" r=\"3.5\" fill=\"#FFC93D\"/><circle cx=\"66\" cy=\"3\" r=\"3.5\" fill=\"#FFC93D\"/><circle cx=\"45\" cy=\"25\" r=\"6\" fill=\"#fff\"/><circle cx=\"59\" cy=\"25\" r=\"6\" fill=\"#fff\"/><circle cx=\"46\" cy=\"26\" r=\"3\" fill=\"#1E2A4A\"/><circle cx=\"60\" cy=\"26\" r=\"3\" fill=\"#1E2A4A\"/><path d=\"M46 36q6 5 12 0\" stroke=\"#1E2A4A\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><\/svg>',\n  蚊子: '<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\"><g stroke=\"#3A3F55\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><path d=\"M50 56L38 78L31 92\"/><path d=\"M57 57L60 80L56 94\"/><path d=\"M63 54L79 75L88 87\"/><\/g><ellipse cx=\"40\" cy=\"25\" rx=\"19\" ry=\"10\" fill=\"#DCEEFF\" stroke=\"#7AA9D6\" stroke-width=\"2.5\" transform=\"rotate(-40 40 25)\"/><ellipse cx=\"55\" cy=\"24\" rx=\"21\" ry=\"11\" fill=\"#EAF5FF\" stroke=\"#7AA9D6\" stroke-width=\"2.5\" transform=\"rotate(-18 55 24)\"/><ellipse cx=\"29\" cy=\"53\" rx=\"25\" ry=\"12\" fill=\"#5B6178\" transform=\"rotate(-12 29 53)\"/><path d=\"M17 45l2 16M27 42l2 18M37 41l1 16\" stroke=\"#fff\" stroke-width=\"3.4\" stroke-linecap=\"round\"/><circle cx=\"56\" cy=\"47\" r=\"12\" fill=\"#4A4F66\"/><circle cx=\"71\" cy=\"42\" r=\"10\" fill=\"#4A4F66\"/><circle cx=\"74\" cy=\"39\" r=\"5\" fill=\"#E5484D\"/><path d=\"M78 47L98 61\" stroke=\"#4A4F66\" stroke-width=\"3.6\" stroke-linecap=\"round\"/><\/svg>',\n  蝴蝶: '<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\"><ellipse cx=\"29\" cy=\"38\" rx=\"23\" ry=\"18\" fill=\"#A066FF\" transform=\"rotate(-25 29 38)\"/><ellipse cx=\"71\" cy=\"38\" rx=\"23\" ry=\"18\" fill=\"#A066FF\" transform=\"rotate(25 71 38)\"/><ellipse cx=\"33\" cy=\"66\" rx=\"15\" ry=\"13\" fill=\"#FF6FA5\"/><ellipse cx=\"67\" cy=\"66\" rx=\"15\" ry=\"13\" fill=\"#FF6FA5\"/><circle cx=\"25\" cy=\"35\" r=\"6\" fill=\"#fff\" opacity=\".85\"/><circle cx=\"75\" cy=\"35\" r=\"6\" fill=\"#fff\" opacity=\".85\"/><circle cx=\"32\" cy=\"68\" r=\"4\" fill=\"#FFC93D\"/><circle cx=\"68\" cy=\"68\" r=\"4\" fill=\"#FFC93D\"/><rect x=\"46\" y=\"28\" width=\"8\" height=\"48\" rx=\"4\" fill=\"#1E2A4A\"/><circle cx=\"50\" cy=\"24\" r=\"6\" fill=\"#1E2A4A\"/><path d=\"M48 19Q42 8 35 7M52 19Q58 8 65 7\" stroke=\"#1E2A4A\" stroke-width=\"2.6\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"35\" cy=\"7\" r=\"3\" fill=\"#1E2A4A\"/><circle cx=\"65\" cy=\"7\" r=\"3\" fill=\"#1E2A4A\"/><\/svg>',\n  闹钟: '<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\"><path d=\"M32 86l-8 10M68 86l8 10\" stroke=\"#B8333A\" stroke-width=\"7\" stroke-linecap=\"round\"/><circle cx=\"26\" cy=\"22\" r=\"13\" fill=\"#FFC93D\" stroke=\"#D9A200\" stroke-width=\"3\"/><circle cx=\"74\" cy=\"22\" r=\"13\" fill=\"#FFC93D\" stroke=\"#D9A200\" stroke-width=\"3\"/><rect x=\"45\" y=\"14\" width=\"10\" height=\"10\" rx=\"3\" fill=\"#B8333A\"/><circle cx=\"50\" cy=\"57\" r=\"34\" fill=\"#E5484D\"/><circle cx=\"50\" cy=\"57\" r=\"26\" fill=\"#fff\"/><path d=\"M50 57V39M50 57l12 7\" stroke=\"#1E2A4A\" stroke-width=\"5\" stroke-linecap=\"round\"/><circle cx=\"50\" cy=\"57\" r=\"4\" fill=\"#1E2A4A\"/><\/svg>'\n};\n\n// ===== 下面是游戏程序 =====\nconst canvas = document.getElementById(\"game\");\nconst ctx = canvas.getContext(\"2d\");\nconst W = canvas.width, H = canvas.height;\n\nlet 状态 = \"准备\";            // \"准备\"、\"玩\"、\"结束\"\nlet 分数 = 0, 剩余时间 = 设置.倒计时, 玩了几秒 = 0, 上次加时间道具 = -99;\nlet 洞们 = [], 飘字们 = [], 计时 = 0, 跳一跳 = 0, 分数跳 = 0;\n\n// 把画好的图案变成图片\nconst 图片们 = {};\nfor (const 名字 in 画好的图案) {\n  const 图 = new Image();\n  图.src = \"data:image/svg+xml;charset=utf-8,\" + encodeURIComponent(画好的图案[名字]);\n  图片们[名字] = 图;\n}\n\n// 按行数、列数排好洞的位置\nfunction 摆洞() {\n  洞们 = [];\n  const 最上 = 205, 最下 = H - 70;\n  for (let 行 = 0; 行 < 设置.洞的行数; 行++) {\n    for (let 列 = 0; 列 < 设置.洞的列数; 列++) {\n      const x = 60 + 680 * (列 + 0.5) / 设置.洞的列数;\n      const y = 设置.洞的行数 === 1 ? (最上 + 最下) / 2 : 最上 + (最下 - 最上) * 行 / (设置.洞的行数 - 1);\n      洞们.push({ x: x, y: y, 东西: null });\n    }\n  }\n}\n\nfunction 重新开始() {\n  分数 = 0;\n  剩余时间 = 设置.倒计时;\n  玩了几秒 = 0;\n  上次加时间道具 = -99;\n  计时 = 0;\n  飘字们 = [];\n  摆洞();\n  状态 = \"玩\";\n}\n\n// 按“出现机会”随机挑一个道具\nfunction 挑一个东西() {\n  // 能加时间的道具，最少隔一段时间才出现一次；不然手快的人能一直玩下去\n  let 能选的 = 会冒出来的东西.filter(东西 => !(东西.点到加几秒 && 设置.倒计时 > 0 && 玩了几秒 - 上次加时间道具 < 设置.加时间道具间隔));\n  if (能选的.length === 0) 能选的 = 会冒出来的东西;\n  let 总数 = 0;\n  for (const 东西 of 能选的) 总数 += 东西.出现机会 || 1;\n  let 随机 = Math.random() * 总数;\n  for (const 东西 of 能选的) {\n    随机 -= 东西.出现机会 || 1;\n    if (随机 <= 0) return 东西;\n  }\n  return 能选的[0];\n}\n\n// 越来越快：每得 5 分升一级，冒得更勤、停得更短\nfunction 难度() { return 设置.越来越快 ? Math.floor(Math.max(0, 分数) / 5) : 0; }\nfunction 当前间隔() { return Math.max(0.35, 设置.冒出间隔 * Math.pow(0.88, 难度())); }\nfunction 当前停留() { return Math.max(0.6, 设置.停留时间 * Math.pow(0.93, 难度())); }\n\n// 找一个空洞，让一个道具冒出来\nfunction 冒一个() {\n  const 空洞 = 洞们.filter(洞 => !洞.东西);\n  if (空洞.length === 0) return;\n  const 洞 = 空洞[Math.floor(Math.random() * 空洞.length)];\n  const 东西 = 挑一个东西();\n  if (东西.点到加几秒) 上次加时间道具 = 玩了几秒;\n  洞.东西 = Object.assign({ 已过: 0, 停留: 当前停留() }, 东西);\n}\n\nfunction 飘字(文字, x, y, 颜色) { 飘字们.push({ 文字, x, y, 颜色, 寿命: 45 }); }\n\n// 点到洞里的道具时，会发生什么\nfunction 点到(洞) {\n  const 东西 = 洞.东西;\n  洞.东西 = null;\n  const 分 = 东西.点到加几分 || 0;\n  分数 += 分;\n  if (分 !== 0) 分数跳 = 14;\n  if (设置.显示分数 && 分 !== 0) 飘字((分 > 0 ? \"+\" : \"\") + 分, 洞.x, 洞.y - 110, 分 > 0 ? \"#18A87C\" : \"#E5484D\");\n  if (!设置.显示分数) 飘字(\"抓到了！\", 洞.x, 洞.y - 110, \"#18A87C\");\n  if (设置.倒计时 > 0 && 东西.点到加几秒) { 剩余时间 += 东西.点到加几秒; 飘字(\"+\" + 东西.点到加几秒 + \" 秒\", 洞.x, 洞.y - 150, \"#2366D1\"); }\n  if (分 >= 0) 跳一跳 = 18;\n}\n\n// 点屏幕：开始 / 抓虫 / 重来\ncanvas.addEventListener(\"pointerdown\", e => {\n  if (状态 !== \"玩\") { 重新开始(); return; }\n  const r = canvas.getBoundingClientRect();\n  const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;\n  for (const 洞 of 洞们) {\n    if (洞.东西 && Math.abs(x - 洞.x) < 64 && y > 洞.y - 130 && y < 洞.y + 28) { 点到(洞); return; }\n  }\n});\n\nfunction 更新() {\n  if (状态 !== \"玩\") return;\n  计时 += 1 / 60;\n  玩了几秒 += 1 / 60;\n  if (计时 >= 当前间隔()) { 计时 = 0; 冒一个(); }\n  for (const 洞 of 洞们) {\n    if (!洞.东西) continue;\n    洞.东西.已过 += 1 / 60;\n    if (洞.东西.已过 >= 洞.东西.停留) 洞.东西 = null;   // 没抓到，缩回去了\n  }\n  if (设置.倒计时 > 0) {\n    剩余时间 -= 1 / 60;\n    if (剩余时间 <= 0) { 剩余时间 = 0; 状态 = \"结束\"; }\n  }\n}\n\n// ===== 画画 =====\nfunction 画背景() {\n  ctx.fillStyle = 设置.天空颜色; ctx.fillRect(0, 0, W, 120);\n  ctx.fillStyle = \"#FFC93D\"; ctx.beginPath(); ctx.arc(890, 58, 32, 0, Math.PI * 2); ctx.fill();\n  ctx.fillStyle = 设置.草地颜色; ctx.fillRect(0, 120, W, H - 120);\n  ctx.fillStyle = \"rgba(0,0,0,0.07)\";\n  for (let i = 0; i < 16; i++) 圆角矩形((i * 173) % 900 + 20, 140 + (i * 97) % 370, 28, 8, 4);\n}\n\n// 画一个图案：画好的就画图片，不然就当表情画\nfunction 画图案(图案, x, y, 大小) {\n  const 图 = 图片们[图案];\n  if (图) { if (图.complete) ctx.drawImage(图, x - 大小 / 2, y - 大小 / 2, 大小, 大小); }\n  else 画表情(图案, x, y, 大小 * 0.85);\n}\n\nfunction 画洞(洞) {\n  ctx.fillStyle = \"#7A5230\"; ctx.beginPath(); ctx.ellipse(洞.x, 洞.y, 68, 22, 0, 0, Math.PI * 2); ctx.fill();\n  ctx.fillStyle = \"#3A2614\"; ctx.beginPath(); ctx.ellipse(洞.x, 洞.y + 2, 56, 15, 0, 0, Math.PI * 2); ctx.fill();\n  if (洞.东西) {\n    // 冒出来、缩回去的动画\n    const t = 洞.东西.已过, 高 = Math.max(0, Math.min(1, t / 0.15, (洞.东西.停留 - t) / 0.15));\n    ctx.save();\n    ctx.beginPath(); ctx.rect(洞.x - 80, 洞.y - 170, 160, 170); ctx.clip();   // 只画洞口上面的部分\n    画图案(洞.东西.图案, 洞.x, 洞.y + 50 - 高 * 104, 112);\n    ctx.restore();\n  }\n  ctx.fillStyle = \"#946A40\"; ctx.beginPath(); ctx.ellipse(洞.x, 洞.y + 4, 68, 16, 0, 0, Math.PI); ctx.fill();\n}\n\nfunction 画比特(x, y, 大小) {\n  const s = 大小 / 100;\n  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);\n  // 影子\n  ctx.fillStyle = \"rgba(36,48,94,.16)\"; ctx.beginPath(); ctx.ellipse(0, 54, 40, 6, 0, 0, Math.PI * 2); ctx.fill();\n  // 后腿\n  ctx.fillStyle = \"#F4F6FA\"; ctx.strokeStyle = \"#C5CCD8\"; ctx.lineWidth = 1.5;\n  [[-28, 20], [28, 20]].forEach(([lx, ly]) => { 圆角矩形(lx - 8, ly, 16, 26, 8); });\n  ctx.fillStyle = \"#FF8A3D\";\n  [[-28, 42], [28, 42]].forEach(([lx, ly]) => { 圆角矩形(lx - 10, ly, 20, 12, 5); });\n  // 尾巴\n  ctx.strokeStyle = \"#FF8A3D\"; ctx.lineWidth = 9; ctx.lineCap = \"round\";\n  ctx.beginPath(); ctx.moveTo(26, 8); ctx.quadraticCurveTo(44, 14, 40, 30); ctx.stroke();\n  // 身体\n  ctx.fillStyle = \"#F4F6FA\"; 圆角矩形(-34, -18, 68, 56, 22);\n  ctx.strokeStyle = \"#C5CCD8\"; ctx.lineWidth = 2; ctx.beginPath();\n  (function(x,y,w,h,r){ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();})(-34,-18,68,56,22); ctx.stroke();\n  // 橙心 <\/>\n  ctx.fillStyle = \"#FF8A3D\";\n  ctx.beginPath();\n  ctx.moveTo(0, 22); ctx.bezierCurveTo(-18, 8, -26, -4, -16, -12); ctx.bezierCurveTo(-10, -16, -4, -12, 0, -6);\n  ctx.bezierCurveTo(4, -12, 10, -16, 16, -12); ctx.bezierCurveTo(26, -4, 18, 8, 0, 22);\n  ctx.f if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);\n    }\n    ctx.closePath(); ctx.fill();\n  }\n  // 像素小嘴\n  [[-5, -40], [-1, -38], [3, -40]].forEach(([mx, my]) => { 圆角矩形(mx, my, 2.6, 2.2, 0.4); });\n  // 天线：橙底座 + 白杆 + 白球\n  ctx.fillStyle = \"#FF8A3D\"; ctx.beginPath(); ctx.ellipse(0, -88, 7, 4, 0, 0, Math.PI * 2); ctx.fill();\n  ctx.strokeStyle = \"#F2F4F8\"; ctx.lineWidth = 4; ctx.lineCap = \"round\";\n  ctx.beginPath(); ctx.moveTo(0, -88); ctx.lineTo(0, -104); ctx.stroke();\n  ctx.fillStyle = \"#FFFFFF\"; ctx.strokeStyle = \"#D0D6E2\"; ctx.lineWidth = 1;\n  ctx.beginPath(); ctx.arc(0, -106, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();\n  ctx.restore();\n}\nfunction 圆角矩形(x, y, w, h, r) {\n  r = Math.min(r, w / 2, h / 2);\n  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);\n  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); ctx.fill();\n}\nfunction 画表情(文字, x, y, 大小) {\n  ctx.font = 大小 + 'px \"Apple Color Emoji\",\"Segoe UI Emoji\",\"Noto Color Emoji\",sans-serif';\n  ctx.fillStyle = \"#000\"; ctx.textAlign = \"center\"; ctx.textBaseline = \"middle\"; ctx.fillText(文字, x, y);\n}\nfunction 画文字(文字, x, y, 大小, 颜色, 对齐) {\n  ctx.fillStyle = 颜色; ctx.font = \"bold \" + 大小 + 'px \"PingFang SC\",\"Microsoft YaHei\",sans-serif';\n  ctx.textAlign = 对齐 || \"center\"; ctx.textBaseline = \"middle\"; ctx.fillText(文字, x, y);\n}\n// 画一块圆角的牌子，用来显示分数和时间\nfunction 画牌子(文字, x, y, 底色, 字色, 放大) {\n  ctx.save(); ctx.translate(x, y); ctx.scale(放大, 放大);\n  ctx.font = 'bold 40px \"PingFang SC\",\"Microsoft YaHei\",sans-serif';\n  const 宽 = ctx.measureText(文字).width + 52;\n  ctx.fillStyle = 底色; 圆角矩形(-宽 / 2, -32, 宽, 64, 32);\n  画文字(文字, 0, 2, 40, 字色);\n  ctx.restore();\n}\n\nfunction 画() {\n  画背景();\n  for (const 洞 of 洞们) 画洞(洞);\n  if (跳一跳 > 0) 跳一跳--;\n  if (分数跳 > 0) 分数跳--;\n  const 主角Y = H - 40 - Math.sin(跳一跳 / 18 * Math.PI) * 30;\n  if (设置.主角 === \"比特\") 画比特(W - 96, 主角Y, 100);\n  else 画表情(设置.主角, W - 96, 主角Y - 50, 96);\n  for (const 字 of 飘字们) {\n    ctx.globalAlpha = 字.寿命 / 45; 画文字(字.文字, 字.x, 字.y, 32, 字.颜色); 字.y -= 1.3; 字.寿命--; ctx.globalAlpha = 1;\n  }\n  飘字们 = 飘字们.filter(字 => 字.寿命 > 0);\n  if (状态 !== \"准备\") {\n    const 有时间 = 设置.倒计时 > 0;\n    if (设置.显示分数) 画牌子(\"分数 \" + 分数, W / 2 - (有时间 ? 130 : 0), 60, \"#FFFFFF\", 分数 < 0 ? \"#E5484D\" : \"#1E2A4A\", 1 + Math.sin(分数跳 / 14 * Math.PI) * 0.18);\n    if (有时间) 画牌子(\"剩 \" + Math.ceil(剩余时间) + \" 秒\", W / 2 + 140, 60, 剩余时间 <= 10 ? \"#E5484D\" : \"#1E2A4A\", \"#FFFFFF\", 1);\n  }\n  if (状态 === \"准备\") {\n    ctx.fillStyle = \"rgba(30,42,74,0.35)\"; ctx.fillRect(0, 0, W, H);\n    画文字(\"点一下，开始抓虫！\", W / 2, H / 2, 54, \"#FFFFFF\");\n  }\n  if (状态 === \"结束\") {\n    ctx.fillStyle = \"rgba(30,42,74,0.55)\"; ctx.fillRect(0, 0, W, H);\n    画文字(\"时间到！\", W / 2, H / 2 - 50, 64, \"#FFFFFF\");\n    if (设置.显示分数) 画文字(\"总分 \" + 分数, W / 2, H / 2 + 20, 48, \"#FFC93D\");\n    画文字(\"点一下，再来一次\", W / 2, H / 2 + 84, 30, \"#FFFFFF\");\n  }\n}\n\nfunction 游戏循环() { 更新(); 画(); requestAnimationFrame(游戏循环); }\n摆洞();\n游戏循环();\n<\/script>\n<\/body>\n<\/html>\n", "接星星.html": "<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, user-scalable=no\">\n<title>接星星<\/title>\n<style>\n  html, body { margin: 0; height: 100%; background: #FFF7EC; font-family: \"PingFang SC\", \"Microsoft YaHei\", sans-serif; color: #1E2A4A; touch-action: none; }\n  #box { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }\n  h1 { margin: 0; font-size: 28px; }\n  canvas { width: min(96vw, 160vh); max-height: 82vh; aspect-ratio: 16 / 9; border-radius: 18px; box-shadow: 0 6px 0 #F0E2CC; background: #FFF7EC; }\n  p { margin: 0; color: #5B6683; font-size: 18px; }\n<\/style>\n<\/head>\n<body>\n<div id=\"box\">\n  <h1>接星星<\/h1>\n  <canvas id=\"game\" width=\"960\" height=\"540\"><\/canvas>\n  <p>手指按住画面左右拖，让比特用篮子接星星；左上角写着现在在哪个画面<\/p>\n<\/div>\n\n<script>\n// ===== 游戏设置：想改游戏，先改这里 =====\nconst 设置 = {\n  一局几秒: 30,            // 一局玩几秒，时间到了看「流程」去哪\n  有开始画面: false,       // true：一打开游戏，先看到开始画面\n  有结束画面: false,       // true：有结束画面（显示这局得分和金币）\n  有商店: false,           // true：有商店（用金币买东西）\n  背景颜色: \"#1E2A4A\",     // 玩的时候夜空的颜色\n};\n\n// ===== 流程：画面之间怎么走 =====\n// 每一行：从哪个画面，按什么（按钮上的字；\"时间到\" 表示一局时间到了自动走），到哪个画面\n// 画面只有这几个：\"开始画面\" \"游戏\" \"结束画面\" \"商店\"\n// 例子：{ 从: \"开始画面\", 按: \"开始\", 到: \"游戏\" },\nconst 流程 = [\n];\n\n// ===== 商店里卖的东西（有商店才用得上）：钱够才能买 =====\n// 价钱：要几个金币（接到一颗星星得 1 个金币）\n// 效果：只能填这几种 —— \"篮子变大\" \"星星掉得慢\" \"星星自己飞过来\" \"挡一次石头\"\nconst 商品们 = [\n  { 名字: \"大篮子\", 图案: \"🧺\", 价钱: 5, 效果: \"篮子变大\" },\n  { 名字: \"慢动作\", 图案: \"🐢\", 价钱: 3, 效果: \"星星掉得慢\" },\n  { 名字: \"磁铁\", 图案: \"🧲\", 价钱: 8, 效果: \"星星自己飞过来\" },\n];\n\n// ===== 下面是游戏程序 =====\nconst canvas = document.getElementById(\"game\");\nconst ctx = canvas.getContext(\"2d\");\nconst W = canvas.width, H = canvas.height;\nconst 画面们 = [\"开始画面\", \"游戏\", \"结束画面\", \"商店\"];\nconst 认识的效果 = [\"篮子变大\", \"星星掉得慢\", \"星星自己飞过来\", \"挡一次石头\"];\nconst 篮子Y = 370;          // 篮子口有多高：星星掉到这里就算接住\nconst 篮子本来宽 = 110;\n\nlet 现在的画面 = \"游戏\";    // 现在在哪个画面\nlet 分数 = 0;               // 这一局的分数\nlet 金币 = 0;               // 金币一直攒着，再玩一局也不清零\nlet 剩余帧数 = 0;           // 这一局还剩几帧（60 帧 = 1 秒）\nlet 时间到了 = false;\nlet 时间到后几帧 = 0;\nlet 篮子X = W / 2;\nlet 天上 = [];              // 正在往下掉的星星和石头\nlet 已买 = [];              // 买过的商品的名字\nlet 护盾 = 0;               // 还能挡几次石头\nlet 拖着 = false;           // 手指是不是正按着画面\nlet 按着左 = false, 按着右 = false;\nlet 帧数 = 0;\nlet 话 = \"\", 话的寿命 = 0;   // 屏幕上的一句提示\nlet 飘字们 = [];\n\n// 打开游戏：有开始画面就先去开始画面，没有就直接开始玩\nfunction 开始() {\n  金币 = 0; 已买 = []; 护盾 = 0;\n  if (设置.有开始画面 === true) 现在的画面 = \"开始画面\";\n  else { 现在的画面 = \"游戏\"; 开一局(); }\n  const 看不懂 = 流程表().length - 能走的路().length;\n  if (看不懂 > 0) 说一句(\"流程里有 \" + 看不懂 + \" 行看不懂，先跳过了\");\n}\n\n// 开新的一局：分数清零，金币留着\nfunction 开一局() {\n  分数 = 0; 天上 = []; 飘字们 = []; 时间到了 = false; 时间到后几帧 = 0; 篮子X = W / 2; 拖着 = false;\n  const 秒 = Number(设置.一局几秒);\n  剩余帧数 = Math.round((秒 > 0 ? Math.min(秒, 600) : 30) * 60);\n}\n\n// ===== 画面怎么走：全听「流程」表的 =====\nfunction 流程表() { return Array.isArray(流程) ? 流程 : []; }\n// 填对了的行：画面名写错、没写按什么的行，跳过\nfunction 能走的路() {\n  const 路们 = [];\n  for (const 行 of 流程表()) {\n    if (!行 || typeof 行 !== \"object\") continue;\n    const 从 = String(行.从 == null ? \"\" : 行.从).trim();\n    const 按 = String(行.按 == null ? \"\" : 行.按).trim();\n    const 到 = String(行.到 == null ? \"\" : 行.到).trim();\n    if (画面们.includes(从) && 画面们.includes(到) && 按) 路们.push({ 从, 按, 到 });\n  }\n  return 路们;\n}\n// 这个画面上有哪些按钮：流程表里「从」是这个画面的行（\"时间到\" 不是按钮）\nfunction 这个画面的按钮(画面) { return 能走的路().filter(路 => 路.从 === 画面 && 路.按 !== \"时间到\").slice(0, 6); }\n// 这个画面在设置里打开了没有（\"游戏\" 一直都有）\nfunction 画面开着(画面) {\n  if (画面 === \"游戏\") return true;\n  if (画面 === \"开始画面\") return 设置.有开始画面 === true;\n  if (画面 === \"结束画面\") return 设置.有结束画面 === true;\n  if (画面 === \"商店\") return 设置.有商店 === true;\n  return false;\n}\n// 去另一个画面\nfunction 去(画面) {\n  if (!画面开着(画面)) { 说一句(\"还没有\" + (画面.endsWith(\"画面\") ? 画面 : 画面 + \"画面\")); return false; }\n  现在的画面 = 画面; 拖着 = false;\n  if (画面 === \"游戏\") 开一局();\n  return true;\n}\n// 一局时间到了：看流程表里「从 游戏，按 时间到」那行去哪；没有这一行，就停在这里\nfunction 时间到以后() {\n  const 路 = 能走的路().find(路 => 路.从 === \"游戏\" && 路.按 === \"时间到\");\n  if (路) 去(路.到);\n}\n\n// ===== 玩：星星和石头往下掉，篮子接 =====\nfunction 掉一个() {\n  const 是石头 = Math.random() < 0.2;\n  天上.push({ 图案: 是石头 ? \"🪨\" : \"⭐\", 是石头, x: 50 + Math.random() * (W - 100), y: -30, 速度: 2.6 + Math.random() * 1.2 });\n}\nfunction 篮子宽() { return 有效果(\"篮子变大\") ? 篮子本来宽 * 2 : 篮子本来宽; }\n\nfunction 接到(东西) {\n  东西.不见了 = true;\n  if (!东西.是石头) { 分数 += 1; 金币 += 1; 飘字(\"+1\", 东西.x, 篮子Y - 40, \"#FFE58A\"); return; }\n  if (护盾 > 0) {   // 买了护盾：这一次石头不扣分\n    护盾--;\n    if (护盾 === 0) 已买 = 已买.filter(名字 => !商品表().some(货 => 货.名字 === 名字 && 货.效果 === \"挡一次石头\"));\n    飘字(\"挡住了！\", 东西.x, 篮子Y - 40, \"#5BE0FF\");\n    return;\n  }\n  分数 -= 1; 飘字(\"-1\", 东西.x, 篮子Y - 40, \"#FF6B6B\");\n}\n\nfunction 更新游戏() {\n  if (按着左) 篮子X -= 12;\n  if (按着右) 篮子X += 12;\n  const 半宽 = 篮子宽() / 2;\n  篮子X = Math.max(半宽, Math.min(W - 半宽, 篮子X));\n  if (时间到了) { 时间到后几帧++; if (时间到后几帧 === 60) 时间到以后(); return; }\n  剩余帧数--;\n  if (剩余帧数 <= 0) { 剩余帧数 = 0; 时间到了 = true; 时间到后几帧 = 0; 天上 = []; 拖着 = false; return; }\n  if (剩余帧数 % 36 === 0) 掉一个();\n  const 慢 = 有效果(\"星星掉得慢\") ? 0.5 : 1;\n  const 吸 = 有效果(\"星星自己飞过来\");\n  for (const 东西 of 天上) {\n    东西.y += 东西.速度 * 慢;\n    if (吸 && !东西.是石头 && 东西.y > 120 && Math.abs(东西.x - 篮子X) < 300) 东西.x += (篮子X - 东西.x) * 0.08;\n    if (!东西.不见了 && 东西.y > 篮子Y - 22 && 东西.y < 篮子Y + 26 && Math.abs(东西.x - 篮子X) < 半宽 + 12) 接到(东西);\n  }\n  天上 = 天上.filter(东西 => !东西.不见了 && 东西.y < H + 40);\n}\n\n// ===== 商店 =====\n// 整理一下商品表：缺名字、缺图案、价钱不是数字，都用默认的\nfunction 商品表() {\n  const 表 = [];\n  for (const 货 of (Array.isArray(商品们) ? 商品们 : [])) {\n    if (!货 || typeof 货 !== \"object\") continue;\n    const 钱 = Math.round(Number(货.价钱));\n    表.push({ 名字: String(货.名字 || \"神秘商品\"), 图案: String(货.图案 || \"🎁\"), 价钱: 钱 >= 0 ? 钱 : 5, 效果: String(货.效果 || \"\") });\n  }\n  return 表.slice(0, 8);\n}\nfunction 有效果(效果) { return 商品表().some(货 => 货.效果 === 效果 && 已买.includes(货.名字)); }\nfunction 买(货) {\n  if (已买.includes(货.名字)) { 说一句(货.名字 + \"已经买过了\"); return; }\n  if (金币 < 货.价钱) { 说一句(\"钱不够，还差 \" + (货.价钱 - 金币) + \" 个金币\"); return; }\n  金币 -= 货.价钱;\n  已买.push(货.名字);\n  if (货.效果 === \"挡一次石头\") 护盾++;\n  if (认识的效果.includes(货.效果)) 说一句(\"买到了\" + 货.名字 + \"：\" + 货.效果 + \"！\");\n  else 说一句(\"买了\" + 货.名字 + \"，可是「\" + (货.效果 || \"没写效果\") + \"」我不会，没用\");\n}\n// 第 i 张商品卡在哪（一排最多 4 张）\nfunction 商品位置(i, n) {\n  const 两排 = n > 4, 宽 = 190, 高 = 两排 ? 140 : 220, 间隔 = 20;\n  const 第几排 = Math.floor(i / 4), 这排几个 = Math.min(4, n - 第几排 * 4);\n  const 左 = W / 2 - (这排几个 * 宽 + (这排几个 - 1) * 间隔) / 2;\n  return { x: 左 + (i % 4) * (宽 + 间隔), y: (两排 ? 100 : 130) + 第几排 * (高 + 间隔), 宽, 高 };\n}\nfunction 点到的商品(x, y) {\n  const 表 = 商品表();\n  for (let i = 0; i < 表.length; i++) {\n    const 卡 = 商品位置(i, 表.length);\n    if (x > 卡.x && x < 卡.x + 卡.宽 && y > 卡.y && y < 卡.y + 卡.高) return 表[i];\n  }\n  return null;\n}\n\n// ===== 操作：手指按住画面左右拖（也可以用方向键），点按钮换画面 =====\n// 第 i 个按钮在哪：游戏画面的按钮竖着排在右边，别的画面横着排在下面\nfunction 按钮位置(画面, i, n) {\n  if (画面 === \"游戏\") return { x: W - 105, y: 112 + i * 62, 宽: 170, 高: 50 };\n  const 宽 = Math.min(220, (W - 80) / n - 20);\n  return { x: W / 2 + (i - (n - 1) / 2) * (宽 + 20), y: 470, 宽, 高: 64 };\n}\nfunction 点了(x, y) {\n  const 按钮们 = 这个画面的按钮(现在的画面);\n  for (let i = 0; i < 按钮们.length; i++) {\n    const b = 按钮位置(现在的画面, i, 按钮们.length);\n    if (Math.abs(x - b.x) < b.宽 / 2 && Math.abs(y - b.y) < b.高 / 2) { 去(按钮们[i].到); return; }\n  }\n  if (现在的画面 === \"商店\") { const 货 = 点到的商品(x, y); if (货) { 买(货); return; } }\n  if (现在的画面 === \"游戏\" && !时间到了) { 拖着 = true; 篮子X = x; return; }\n  if (按钮们.length === 0) 说一句(现在的画面 === \"游戏\" ? \"时间到了，可是没有按钮，去不了别的画面\" : \"这个画面没有按钮，出不去了\");\n}\nfunction 手指在哪(e) {\n  const r = canvas.getBoundingClientRect();\n  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };\n}\ncanvas.addEventListener(\"pointerdown\", e => {\n  const 点 = 手指在哪(e);\n  点了(点.x, 点.y);\n  if (拖着) { try { canvas.setPointerCapture(e.pointerId); } catch (错) { } }\n});\ncanvas.addEventListener(\"pointermove\", e => { if (拖着 && 现在的画面 === \"游戏\") 篮子X = 手指在哪(e).x; });\ncanvas.addEventListener(\"pointerup\", () => { 拖着 = false; });\ncanvas.addEventListener(\"pointercancel\", () => { 拖着 = false; });\ndocument.addEventListener(\"keydown\", e => {\n  if (e.key === \"ArrowLeft\") { 按着左 = true; e.preventDefault(); }\n  if (e.key === \"ArrowRight\") { 按着右 = true; e.preventDefault(); }\n  if (e.key === \"Enter\") { const 按钮们 = 这个画面的按钮(现在的画面); if (按钮们.length) 去(按钮们[0].到); }\n});\ndocument.addEventListener(\"keyup\", e => {\n  if (e.key === \"ArrowLeft\") 按着左 = false;\n  if (e.key === \"ArrowRight\") 按着右 = false;\n});\n\n// ===== 画画的小工具 =====\nfunction 说一句(文字) { 话 = 文字; 话的寿命 = 150; }\nfunction 飘字(文字, x, y, 颜色) { 飘字们.push({ 文字, x, y, 颜色, 寿命: 40 }); }\nfunction 圆角矩形(x, y, w, h, r) {\n  ctx.beginP nPath();\n    const outer = 9, inner = 9 * 0.38;\n    for (let i = 0; i < 8; i++) {\n      const a = -Math.PI / 2 + i * Math.PI / 4;\n      const rad = i % 2 === 0 ? outer : inner;\n      const x = ex + Math.cos(a) * rad, y = ey + Math.sin(a) * rad;\n      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);\n    }\n    ctx.closePath(); ctx.fill();\n  }\n  // 像素小嘴\n  [[-5, -40], [-1, -38], [3, -40]].forEach(([mx, my]) => { 圆角矩形(mx, my, 2.6, 2.2, 0.4); });\n  // 天线：橙底座 + 白杆 + 白球\n  ctx.fillStyle = \"#FF8A3D\"; ctx.beginPath(); ctx.ellipse(0, -88, 7, 4, 0, 0, Math.PI * 2); ctx.fill();\n  ctx.strokeStyle = \"#F2F4F8\"; ctx.lineWidth = 4; ctx.lineCap = \"round\";\n  ctx.beginPath(); ctx.moveTo(0, -88); ctx.lineTo(0, -104); ctx.stroke();\n  ctx.fillStyle = \"#FFFFFF\"; ctx.strokeStyle = \"#D0D6E2\"; ctx.lineWidth = 1;\n  ctx.beginPath(); ctx.arc(0, -106, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();\n  ctx.restore();\n}\n// 比特举着篮子：x 是篮子中间，y 是篮子口，宽倍 = 篮子变宽几倍\nfunction 画比特举篮子(x, y, 宽倍) {\n  画比特(x - 24, y + 115, 80);\n  ctx.strokeStyle = \"#E0681C\"; ctx.lineWidth = 8; ctx.lineCap = \"round\";\n  ctx.beginPath(); ctx.moveTo(x - 50, y + 100); ctx.lineTo(x - 34, y + 46); ctx.moveTo(x + 2, y + 100); ctx.lineTo(x + 30, y + 46); ctx.stroke();\n  ctx.save(); ctx.translate(x, y + 18); ctx.scale(宽倍, 1); 画表情(\"🧺\", 0, 0, 76); ctx.restore();\n}\n// 开始、结束、商店画面的浅色底，有几颗一闪一闪的小星星\nfunction 画浅色底() {\n  ctx.fillStyle = \"#FFF7EC\"; ctx.fillRect(0, 0, W, H);\n  const 点们 = [[80, 120], [880, 150], [140, 420], [840, 400], [340, 56], [620, 56], [650, 300]];\n  点们.forEach(([x, y], i) => 画小星星(x, y, 12 + (i % 3) * 4 + Math.sin((帧数 + i * 15) / 30) * 2, \"#FFE0A3\"));\n}\nfunction 画药丸(x, y, 宽, 颜色) {   // 一个圆圆的白色小标签\n  ctx.fillStyle = 颜色 || \"rgba(255,255,255,0.94)\"; 圆角矩形(x, y, 宽, 46, 23);\n}\n\n// ===== 每个画面怎么画 =====\nfunction 画开始画面() {\n  画浅色底();\n  画文字(\"接星星\", W / 2, 140, 96, \"#1E2A4A\");\n  画表情(\"⭐\", W / 2 - 220, 132, 60); 画表情(\"⭐\", W / 2 + 220, 132, 60);\n  画文字(\"帮比特用篮子接住天上掉下来的星星\", W / 2, 218, 26, \"#5B6683\");\n  画比特举篮子(W / 2, 278, 1);\n}\nfunction 画游戏() {\n  ctx.fillStyle = 设置.背景颜色; ctx.fillRect(0, 0, W, H);\n  for (let i = 0; i < 46; i++) {   // 一闪一闪的小星星\n    ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin((帧数 + i * 37) / 45));\n    ctx.fillStyle = \"#FFFFFF\"; ctx.fillRect((i * 197 + 31) % W, (i * 71 + 17) % 330 + 70, 3, 3);\n  }\n  ctx.globalAlpha = 1;\n  ctx.fillStyle = \"#FFF3C4\"; ctx.beginPath(); ctx.arc(110, 140, 34, 0, Math.PI * 2); ctx.fill();   // 弯弯的月亮\n  ctx.fillStyle = 设置.背景颜色; ctx.beginPath(); ctx.arc(126, 130, 30, 0, Math.PI * 2); ctx.fill();\n  ctx.fillStyle = \"#2E3D63\"; ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(0, 500); ctx.quadraticCurveTo(W / 2, 468, W, 500); ctx.lineTo(W, H); ctx.closePath(); ctx.fill();\n\n  for (const 东西 of 天上) 画表情(东西.图案, 东西.x, 东西.y, 46);\n  if (护盾 > 0) { ctx.fillStyle = \"rgba(91,224,255,0.25)\"; ctx.beginPath(); ctx.arc(篮子X, 篮子Y + 40, 篮子宽() / 2 + 34, Math.PI, 0); ctx.fill(); }\n  画比特举篮子(篮子X, 篮子Y, 篮子宽() / 篮子本来宽);\n\n  // 上面：分数和金币、买过的东西、还剩几秒\n  画药丸(238, 14, 230);\n  画文字(\"⭐ \" + 分数 + \" 分    🪙 \" + 金币, 353, 37, 22, \"#1E2A4A\");\n  const 买过的 = 商品表().filter(货 => 已买.includes(货.名字));\n  买过的.forEach((货, i) => 画表情(货.图案, 262 + i * 40, 86, 30));\n  const 秒 = Math.ceil(剩余帧数 / 60);\n  画药丸(W - 196, 14, 180, 秒 <= 5 && !时间到了 ? \"#FFE1D2\" : null);\n  画文字(\"⏰ 还剩 \" + 秒 + \" 秒\", W - 106, 37, 22, \"#1E2A4A\");\n\n  if (时间到了) {\n    ctx.fillStyle = \"rgba(20,28,52,0.6)\"; ctx.fillRect(0, 0, W, H);\n    画文字(\"时间到！\", W / 2, H / 2 - 30, 100, \"#FFFFFF\");\n    画文字(\"这局得了 \" + 分数 + \" 分\", W / 2, H / 2 + 60, 34, \"#FFE58A\");\n  }\n}\nfunction 画结束画面() {\n  画浅色底();\n  ctx.fillStyle = \"#F0E2CC\"; 圆角矩形(W / 2 - 240, 96, 480, 300, 28);\n  ctx.fillStyle = \"#FFFFFF\"; 圆角矩形(W / 2 - 240, 90, 480, 300, 28);\n  画文字(\"这一局结束啦\", W / 2, 140, 32, \"#5B6683\");\n  画文字(\"得分 \" + 分数, W / 2, 228, 80, \"#FF8A3D\");\n  画文字(\"🪙 金币一共 \" + 金币 + \" 个\", W / 2, 322, 32, \"#1E2A4A\");\n  画比特举篮子(122, 236, 1);\n  画表情(\"⭐\", 840, 220, 64); 画表情(\"⭐\", 880, 300, 40);\n}\nfunction 画商店() {\n  画浅色底();\n  画文字(\"🏪 商店\", W / 2, 40, 40, \"#1E2A4A\");\n  画药丸(W - 216, 14, 200);\n  画文字(\"🪙 金币 \" + 金币, W - 116, 37, 24, \"#1E2A4A\");\n  const 表 = 商品表();\n  if (!表.length) 画文字(\"商店里还没有东西卖\", W / 2, 250, 32, \"#8A93AB\");\n  表.forEach((货, i) => {\n    const 卡 = 商品位置(i, 表.length), 大 = 卡.高 > 180, 买了 = 已买.includes(货.名字), 够钱 = 金币 >= 货.价钱;\n    ctx.fillStyle = \"#F0E2CC\"; 圆角矩形(卡.x, 卡.y + 6, 卡.宽, 卡.高, 22);\n    ctx.fillStyle = 买了 ? \"#E3F7EE\" : \"#FFFFFF\"; 圆角矩形(卡.x, 卡.y, 卡.宽, 卡.高, 22);\n    画表情(货.图案, 卡.x + 卡.宽 / 2, 卡.y + (大 ? 60 : 38), 大 ? 64 : 42);\n    画文字(货.名字, 卡.x + 卡.宽 / 2, 卡.y + (大 ? 122 : 82), 大 ? 28 : 22, \"#1E2A4A\");\n    if (大) 画文字(货.效果 || \"（没写效果）\", 卡.x + 卡.宽 / 2, 卡.y + 156, 18, \"#8A93AB\");\n    画文字(买了 ? \"✔ 已买\" : \"🪙 \" + 货.价钱, 卡.x + 卡.宽 / 2, 卡.y + 卡.高 - (大 ? 30 : 24), 大 ? 26 : 22, 买了 ? \"#18A87C\" : 够钱 ? \"#FF8A3D\" : \"#B0B6C6\");\n  });\n  if (表.length && 表.length <= 4) 画文字(\"点商品就能买，金币够才买得到\", W / 2, 395, 20, \"#8A93AB\");\n}\nfunction 画按钮们() {\n  const 按钮们 = 这个画面的按钮(现在的画面);\n  按钮们.forEach((路, i) => {\n    const b = 按钮位置(现在的画面, i, 按钮们.length);\n    ctx.fillStyle = \"#E0681C\"; 圆角矩形(b.x - b.宽 / 2, b.y - b.高 / 2 + 5, b.宽, b.高, 20);\n    ctx.fillStyle = \"#FF8A3D\"; 圆角矩形(b.x - b.宽 / 2, b.y - b.高 / 2, b.宽, b.高, 20);\n    画文字(路.按, b.x, b.y, Math.max(16, Math.min(28, (b.宽 - 24) / Math.max(1, 路.按.length))), \"#FFFFFF\");\n  });\n}\nfunction 画现在在哪() {   // 左上角的小标签\n  画药丸(16, 14, 210);\n  ctx.fillStyle = \"#FF8A3D\"; ctx.beginPath(); ctx.arc(40, 37, 7, 0, Math.PI * 2); ctx.fill();\n  画文字(\"现在：\" + 现在的画面, 130, 37, 22, \"#1E2A4A\");\n}\n\n// 每一帧都会运行一次\nfunction 游戏循环() {\n  帧数++;\n  if (现在的画面 === \"游戏\") 更新游戏();\n\n  if (现在的画面 === \"开始画面\") 画开始画面();\n  else if (现在的画面 === \"结束画面\") 画结束画面();\n  else if (现在的画面 === \"商店\") 画商店();\n  else 画游戏();\n  画按钮们();\n  画现在在哪();\n\n  // 飘字\n  for (const 字 of 飘字们) {\n    ctx.globalAlpha = 字.寿命 / 40; 画文字(字.文字, 字.x, 字.y, 30, 字.颜色); 字.y -= 1.2; 字.寿命--; ctx.globalAlpha = 1;\n  }\n  飘字们 =
