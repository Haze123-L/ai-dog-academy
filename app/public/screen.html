// ================= 游戏三：抓虫子 =================
// items: [{ name, sprite(画好的图案) 或 icon(表情), score(点到加几分，可为负), sec(点到加几秒), w(出现机会) }]
function WhackGame(canvas, cfg) {
  const W = 960, H = 540; canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const st = { cfg: Object.assign({}, WHACK_DEFAULT, cfg), state: 'ready', score: 0, time: 0, clock: 0, lastSec: -99, holes: [], pops: [], t: 0, hop: 0, bump: 0, raf: 0 };
  function layout() {
    const c = st.cfg, top = 205, bot = H - 70; st.holes = [];
    for (let r = 0; r < c.rows; r++) for (let k = 0; k < c.cols; k++)
      st.holes.push({ x: 60 + 680 * (k + .5) / c.cols, y: c.rows === 1 ? (top + bot) / 2 : top + (bot - top) * r / (c.rows - 1), it: null });
  }
  function restart() { st.score = 0; st.time = st.cfg.timer; st.t = 0; st.clock = 0; st.lastSec = -99; st.pops = []; layout(); st.state = 'play'; }
  function choose() {
    // 能加时间的道具，至少隔 timeGap 秒才出现一次，不然手快就能一直玩下去
    const c = st.cfg, list = c.items.filter(i => !(i.sec && c.timer > 0 && st.clock - st.lastSec < c.timeGap));
    const pool = list.length ? list : c.items; let t = 0; pool.forEach(i => t += i.w || 1); let r = Math.random() * t;
    for (const i of pool) { r -= i.w || 1; if (r <= 0) return i; } return pool[0];
  }
  const level = () => st.cfg.speedUp ? Math.floor(Math.max(0, st.score) / 5) : 0;
  const interval = () => Math.max(.35, st.cfg.every * Math.pow(.88, level()));
  const stayNow = () => Math.max(.6, st.cfg.stay * Math.pow(.93, level()));
  function hit(h) {
    const it = h.it, c = st.cfg, sc = it.score || 0; h.it = null; st.score += sc;
    if (sc) st.bump = 14;
    if (c.showScore && sc) st.pops.push({ x: h.x, y: h.y - 100, t: (sc > 0 ? '+' : '') + sc, col: sc > 0 ? '#18A87C' : '#E5484D', life: 40 });
    else if (!c.showScore) st.pops.push({ x: h.x, y: h.y - 100, t: '抓到了！', col: '#18A87C', life: 40 });
    if (c.timer > 0 && it.sec) { st.time += it.sec; st.pops.push({ x: h.x, y: h.y - 140, t: '+' + it.sec + ' 秒', col: '#2366D1', life: 40 }); }
    if (sc >= 0) st.hop = 18;
  }
  canvas.addEventListener('pointerdown', e => {
    if (st.cfg.auto) return;
    if (st.state !== 'play') { restart(); return; }
    const r = canvas.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
    const h = st.holes.find(h => h.it && Math.abs(x - h.x) < 64 && y > h.y - 120 && y < h.y + 28);
    if (h) hit(h);
  });
  function drawItem(it, x, y, size) { if (it.sprite) drawSprite(ctx, it.sprite, x, y, size); else drawEmoji(ctx, it.icon, x, y, size * .9); }
  function drawHole(h) {
    ctx.fillStyle = '#7A5230'; ctx.beginPath(); ctx.ellipse(h.x, h.y, 68, 22, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#3A2614'; ctx.beginPath(); ctx.ellipse(h.x, h.y + 2, 56, 15, 0, 0, 7); ctx.fill();
    if (h.it) {
      const a = h.it.age, up = Math.max(0, Math.min(1, a / .15, (h.it.stay - a) / .15));
      ctx.save(); ctx.beginPath(); ctx.rect(h.x - 80, h.y - 170, 160, 170); ctx.clip();
      drawItem(h.it, h.x, h.y + 50 - up * 104, 112); ctx.restore();
    }
    ctx.fillStyle = '#946A40'; ctx.beginPath(); ctx.ellipse(h.x, h.y + 4, 68, 16, 0, 0, Math.PI); ctx.fill();
  }
  function pill(text, x, y, bg, fg, scale) {
    ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
    ctx.font = 'bold 40px "PingFang SC","Microsoft YaHei",sans-serif'; const w = ctx.measureText(text).width + 52;
    ctx.fillStyle = bg; rr(ctx, -w / 2, -32, w, 64, 32); drawText(ctx, text, 0, 2, 40, fg); ctx.restore();
  }
  function loop() {
    const c = st.cfg, dt = 1 / 60;
    if (c.auto && st.state !== 'play') restart();
    if (st.state === 'play') {
      st.t += dt; st.clock += dt;
      if (st.t >= interval()) { st.t = 0; const free = st.holes.filter(h => !h.it); if (free.length) { const h = pick(free), it = choose(); if (it.sec) st.lastSec = st.clock; h.it = Object.assign({ age: 0, stay: stayNow() }, it); h.it.tap = h.it.stay * (.35 + Math.random() * .35); } }
      for (const h of st.holes) if (h.it) {
        h.it.age += dt;
        if (c.auto && h.it.age > h.it.tap && ((h.it.score || 0) > 0 || h.it.sec)) { hit(h); continue; }
        if (h.it.age >= h.it.stay) h.it = null;
      }
      if (c.timer > 0 && !c.auto) { st.time -= dt; if (st.time <= 0) { st.time = 0; st.state = 'over'; } }
    }
    if (st.hop > 0) st.hop--; if (st.bump > 0) st.bump--;
    const dark = c.sky === '#1E2A4A';
    ctx.fillStyle = c.sky; ctx.fillRect(0, 0, W, 120);
    if (dark) { ctx.fillStyle = '#fff'; for (let i = 0; i < 26; i++) ctx.fillRect((i * 97) % W, 10 + (i * 37) % 96, 3, 3); ctx.fillStyle = '#FFF3C4'; ctx.beginPath(); ctx.arc(890, 60, 30, 0, 7); ctx.fill(); }
    else { ctx.fillStyle = '#FFC93D'; ctx.beginPath(); ctx.arc(890, 58, 32, 0, 7); ctx.fill(); }
    ctx.fillStyle = c.grass; ctx.fillRect(0, 120, W, H - 120);
    ctx.fillStyle = 'rgba(0,0,0,.07)'; for (let i = 0; i < 16; i++) rr(ctx, (i * 173) % 900 + 20, 140 + (i * 97) % 370, 28, 8, 4);
    for (const h of st.holes) drawHole(h);
    const hy = H - 84 - Math.sin(st.hop / 18 * Math.PI) * 30;
    if (c.hero === 'bit') drawBit(ctx, W - 96, hy, 100); else drawEmoji(ctx, c.hero, W - 96, hy - 10, 96);
    for (const p of st.pops) { ctx.globalAlpha = p.life / 40; drawText(ctx, p.t, p.x, p.y, 34, p.col); p.y -= 1.4; p.life--; ctx.globalAlpha = 1; }
    st.pops = st.pops.filter(p => p.life > 0);
    if (st.state !== 'ready') {
      if (c.showScore) pill('分数 ' + st.score, W / 2 - (c.timer > 0 && !c.auto ? 130 : 0), 60, '#fff', st.score < 0 ? '#E5484D' : '#1E2A4A', 1 + Math.sin(st.bump / 14 * Math.PI) * .18);
      if (c.timer > 0 && !c.auto) pill('剩 ' + Math.ceil(st.time) + ' 秒', W / 2 + 140, 60, st.time <= 10 ? '#E5484D' : '#1E2A4A', '#fff', 1);
    }
    if (st.state === 'ready') { ctx.fillStyle = 'rgba(30,42,74,.35)'; ctx.fillRect(0, 0, W, H); drawText(ctx, '点一下，开始抓虫！', W / 2, H / 2, 54, '#fff'); }
    if (st.state === 'over') { ctx.fillStyle = 'rgba(30,42,74,.55)'; ctx.fillRect(0, 0, W, H); drawText(ctx, '时间到！', W / 2, H / 2 - 50, 64, '#fff'); if (c.showScore) drawText(ctx, '总分 ' + st.score, W / 2, H / 2 + 20, 48, '#FFC93D'); drawText(ctx, '点一下，再来一次', W / 2, H / 2 + 84, 30, '#fff'); }
    st.raf = requestAnimationFrame(loop);
  }
  layout(); loop();
  return {
    set(c) { c = Object.assign({}, c); const add = c.addItems; delete c.addItems;
      const wt = st.cfg.timer, wl = st.cfg.rows + 'x' + st.cfg.cols; Object.assign(st.cfg, c); if (add) st.cfg.items = st.cfg.items.concat(add);
      if (st.cfg.timer !== wt) { st.time = st.cfg.timer; if (st.state === 'over') restart(); }
      if (st.cfg.rows + 'x' + st.cfg.cols !== wl) layout(); },
    reset(c) { st.cfg = Object.assign({}, WHACK_DEFAULT, c); st.score = 0; st.pops = []; layout(); st.state = st.cfg.auto ? 'play' : 'ready'; st.time = st.cfg.timer; },
    key() { return false; },
    destroy() { cancelAnimationFrame(st.raf); }
  };
}

// ================= 游戏四：比特回家（大屏自动演示） =================
// items: [{ icon, n(个数), hit('' | 'score' | 'slow' | 'life'), move(会不会动) }]
function HomeGame(canvas, cfg) {
  const W = 960, H = 540; canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const home = { x: W - 90, y: 90 }, start = { x: 90, y: H - 80 };
  const st = { cfg: Object.assign({}, HOME_DEFAULT, cfg), dog: { x: start.x, y: start.y }, things: [], pops: [], score: 0, lives: 0, level: 1, slow: 0, fast: 0, blink: 0, f: 0, raf: 0, path: [], banner: 0 };
  function place() {
    st.things = [];
    for (const it of st.cfg.items) {
      const n = (it.n || 1) + (st.cfg.level && it.move ? st.level - 1 : 0);
      for (let i = 0; i < n; i++) {
        let x, y, k = 0;
        do { x = 120 + Math.random() * (W - 240); y = 100 + Math.random() * (H - 200); k++; } while (k < 40 && (Math.hypot(x - start.x, y - start.y) < 160 || Math.hypot(x - home.x, y - home.y) < 150));
        const a = Math.random() * 6.28, sp = 1.4 + (st.cfg.level ? (st.level - 1) * 0.6 : 0);
        st.things.push(Object.assign({}, it, { x, y, vx: it.move ? Math.cos(a) * sp : 0, vy: it.move ? Math.sin(a) * sp : 0 }));
      }
    }
    // 自动演示：经过几根骨头再回家；tour：把场上每样不动的东西都碰一遍（规则侦探用）
    let stops;
    if (st.cfg.tour) {
      const left = st.things.filter(t => !t.move); stops = []; let cur = { x: start.x, y: start.y - 25 };
      while (left.length) { left.sort((a, b) => Math.hypot(a.x - cur.x, a.y - cur.y) - Math.hypot(b.x - cur.x, b.y - cur.y)); cur = left.shift(); stops.push(cur); }
    } else stops = st.things.filter(t => !t.move && t.icon === '🦴').sort((a, b) => (a.x + (H - a.y)) - (b.x + (H - b.y))).slice(0, 3);
    st.path = stops.map(b => ({ x: b.x, y: b.y + 25 })).concat([{ x: home.x, y: home.y + 25 }]);
  }
  function restart() { st.dog = { x: start.x, y: start.y }; st.score = 0; st.lives = st.cfg.lives; st.level = 1; place(); st.banner = st.cfg.level ? 80 : 0; }
  function pop(t, x, y, col) { st.pops.push({ t, x, y, col, life: 45 }); }
  function loop() {
    const c = st.cfg; st.f++;
    for (const t of st.things) { if (!t.move) continue; t.x += t.vx; t.y += t.vy; if (t.x < 40 || t.x > W - 40) t.vx *= -1; if (t.y < 50 || t.y > H - 40) t.vy *= -1; }
    if (c.move && c.auto && st.path.length) {
      const p = st.path[0], sp = st.slow > 0 ? 1.6 : st.fast > 0 ? 6 : 3.4, d = Math.hypot(p.x - st.dog.x, p.y - st.dog.y);
      if (d < sp) st.path.shift(); else { st.dog.x += (p.x - st.dog.x) / d * sp; st.dog.y += (p.y - st.dog.y) / d * sp; }
    }
    if (st.slow > 0) st.slow--; if (st.fast > 0) st.fast--; if (st.blink > 0) st.blink--; if (st.banner > 0) st.banner--;
    for (const t of st.things) {
      if (t.gone || Math.hypot(t.x - st.dog.x, t.y - (st.dog.y - 25)) > 46) continue;
      if (t.hit === 'score') { t.gone = true; st.score += 1; pop('+1', t.x, t.y - 30, '#18A87C'); }
      else if (t.hit === 'slow') { if (st.slow <= 0) pop('变慢了', st.dog.x, st.dog.y - 90, '#2366D1'); st.slow = 120; st.fast = 0; }
      else if (t.hit === 'fast') { t.gone = true; pop('变快了', st.dog.x, st.dog.y - 90, '#8B6CFF'); st.fast = 150; st.slow = 0; }
      else if (t.hit === 'life' && st.blink <= 0) { st.blink = 80; st.lives = Math.max(0, st.lives - 1); pop('−1 命', t.x, t.y - 30, '#E5484D'); }
    }
    st.things = st.things.filter(t => !t.gone);
    if (c.move && Math.hypot(home.x - st.dog.x, home.y - (st.dog.y - 25)) < 56) {
      if (c.level && st.level < 3) { st.level++; st.dog = { x: start.x, y: start.y }; place(); st.banner = 80; }
      else { pop(c.level ? '通关！' : '回家了！', W / 2, H / 2, '#FF8A3D'); setTimeout(restart, 0); }
    }
    // 画
    ctx.fillStyle = '#BFE6A8'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = '#A9D891';
    for (let i = 0; i < 26; i++) { ctx.beginPath(); ctx.arc((i * 151) % W, (i * 89) % H, 18 + (i % 3) * 6, 0, 7); ctx.fill(); }
    ctx.fillStyle = '#E0681C'; ctx.beginPath(); ctx.moveTo(home.x - 66, home.y - 6); ctx.lineTo(home.x, home.y - 62); ctx.lineTo(home.x + 66, home.y - 6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#FFB27A'; rr(ctx, home.x - 52, home.y - 10, 104, 56, 8); ctx.fillStyle = '#1E2A4A'; rr(ctx, home.x - 20, home.y + 6, 40, 40, 18);
    drawText(ctx, '家', home.x, home.y - 26, 22, '#fff');
    for (const t of st.things) drawEmoji(ctx, t.icon, t.x, t.y, 48);
    if (st.blink === 0 || Math.floor(st.blink / 6) % 2 === 0) drawBit(ctx, st.dog.x, st.dog.y - 31, 70);
    if (!c.move) {
      const by = st.dog.y - 120 + Math.sin(st.f / 15) * 4;
      ctx.fillStyle = '#fff'; rr(ctx, st.dog.x - 26, by - 26, 52, 52, 18); drawText(ctx, '?', st.dog.x, by + 1, 36, '#FF8A3D');
    }
    for (const p of st.pops) { ctx.globalAlpha = p.life / 45; drawText(ctx, p.t, p.x, p.y, 32, p.col); p.y -= 1; p.life--; ctx.globalAlpha = 1; }
    st.pops = st.pops.filter(p => p.life > 0);
    if (c.showScore) drawText(ctx, '分数 ' + st.score, 24, 36, 32, '#1E2A4A', 'left');
    if (c.lives > 0) drawText(ctx, '生命 ' + '♥'.repeat(st.lives), 24, 76, 28, '#E5484D', 'left');
    if (c.level) { drawText(ctx, '第 ' + st.level + ' 关', W - 190, 36, 30, '#1E2A4A', 'right'); if (st.banner > 0) { ctx.globalAlpha = Math.min(1, st.banner / 30); drawText(ctx, '第 ' + st.level + ' 关', W / 2, H / 2 - 20, 72, '#FF8A3D'); ctx.globalAlpha = 1; } }
    st.raf = requestAnimationFrame(loop);
  }
  restart(); loop();
  return {
    set(c) { Object.assign(st.cfg, c); restart(); },
    reset(c) { st.cfg = Object.assign({}, HOME_DEFAULT, c); restart(); },
    key() { return false; },
    destroy() { cancelAnimationFrame(st.raf); }
  };
}

// ===== browser/net.js =====
// 三端明确标注模拟或尚未配置，避免把规则响应当成真实模型。
function showModelStatus(view) {
  const mode = view.aiMode || 'demo';
  let banner = document.getElementById('model-status-notice');
  if (!banner) { banner = document.createElement('div'); banner.id = 'model-status-notice'; banner.setAttribute('role', 'status'); banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:10000;text-align:center;background:#fff0c9;color:#594320;font:13px sans-serif;padding:5px;pointer-events:none'; document.body.appendChild(banner); }
  banner.hidden = mode === 'api';
  banner.textContent = mode === 'demo' ? '演示模式：规则模拟，未调用真实 AI' : '尚未配置 AI：请老师在设置中填写模型接口';
}
// ================= 三端通信 =================
// 连服务器：实时推送用 SSE，操作用 fetch。
// 连本地：大屏单机模式、在线试玩版，课堂就跑在同一个页面里（window.LocalHub）。
function makeNet({ role, key, tok, hub, sid, screenToken }) {
  const who = { role, sid };
  if (hub) {
    return {
      role, local: true, hub,
      setTok(t, s) { tok = t; who.sid = s; },
      connect(onView, onStatus) { onStatus && onStatus('ok'); return hub.connect(who, v => { showModelStatus({ aiMode: 'demo' }); onView(v); }); },
      act(a) { return Promise.resolve(hub.act(who, a)); },
      post(p, body) { return hub.post(who, p, body || {}); },
      get(p, q) { return hub.get(who, p, q || {}); },
      qrUrl() { return null; }
    };
  }
  const auth = () => role === 'teacher' ? { k: key } : role === 'student' ? { t: tok } : { role: 'screen', s: screenToken };
  const qs = o => Object.keys(o).filter(k => o[k] != null).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(o[k])).join('&');
  async function req(method, p, body, q) {
    const url = '/api/' + p + (method === 'GET' ? '?' + qs(Object.assign({}, q, auth())) : '');
    const r = await fetch(url, method === 'GET' ? { cache: 'no-store' } : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({}, body, auth())) });
    let j = {}; try { j = await r.json(); } catch (e) { }
    if (!r.ok && !j.err) j.err = '网络出错（' + r.status + '）';
    return j;
  }
  return {
    role, local: false,
    setTok(t, s) { tok = t; who.sid = s; },
    connect(onView, onStatus) {
      let es = null, dead = false, retry = 0;
      const open = () => {
        if (dead) return;
        es = new EventSource('/api/stream?' + qs(auth()));
        es.onmessage = e => { retry = 0; onStatus && onStatus('ok'); try { const view = JSON.parse(e.data); showModelStatus(view); onView(view); } catch (x) { console.error(x); } };
        es.onerror = () => {
          onStatus && onStatus('lost');
          if (es.readyState === 2) { es.close(); setTimeout(open, Math.min(8000, 1000 * ++retry)); }
        };
      };
      open();
      return () => { dead = true; if (es) es.close(); };
    },
    act(a) { return req('POST', 'act', { a }); },
    post(p, body) { return req('POST', p, body || {}); },
    get(p, q) { return req('GET', p, null, q || {}); },
    qrUrl(u) { return '/api/qr?u=' + encodeURIComponent(u); }
  };
}

// 服务器时间和本机时间差一点也没关系：倒计时按服务器给的「还剩几秒」算
const Clock = {
  off: 0,
  sync(serverNow) { if (serverNow) this.off = serverNow - Date.now(); },
  now() { return Date.now() + this.off; },
  left(t) { if (!t) return 0; return t.running ? Math.max(0, (t.endsAt - this.now()) / 1000) : (t.left || 0); },
  fmt(sec) { const s = Math.ceil(sec); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
};

// 在 iframe 里安全地跑一个孩子的游戏
function runGame(frame, code, onError) {
  frame.setAttribute('sandbox', 'allow-scripts');
  frame.srcdoc = GenieCore.wrapForRun(code);
  if (frame._errOff) frame._errOff();
  const h = e => { if (e.source === frame.contentWindow && e.data && e.data.gameError) onError && onError(e.data.gameError, e.data.line); };
  window.addEventListener('message', h);
  frame._errOff = () => window.removeEventListener('message', h);
}

// ===== browser/hub.js =====
// ================= 本地课堂：整套课跑在一个页面里 =================
// 大屏单机模式（没有服务器）和在线试玩版用它。接口和服务器一样。
function createLocalHub({ starters, llm, saved, persistKey, storeKey }) {
  const mem = new Map();
  // 网页版：孩子的作品、对话也存在这台电脑的浏览器里，刷新、换窗口不丢（存不下就只放内存）
  if (storeKey) { try { const o = JSON.parse(localStorage.getItem(storeKey) || 'null'); if (o) Object.keys(o).forEach(k => mem.set(k, o[k])); } catch (e) { } }
  let st = null, dead = false;
  const saveStore = () => { if (!storeKey || st || dead) return; st = setTimeout(() => { st = null; try { localStorage.setItem(storeKey, JSON.stringify(Object.fromEntries(mem))); } catch (e) { } }, 400); };
  const store = { get: k => mem.has(k) ? mem.get(k) : null, put: (k, v) => { if (v == null) mem.delete(k); else mem.set(k, v); saveStore(); } };
  const core = ClassCore.create({ lessons: LESSONS, saved });
  const starter = name => { const g = GAMES[name]; return g ? starters[g.file] || '' : ''; };
  const svc = Service.create({ core, store, starter, llm: llm || null, dog: null, filter: null, ACTS, MOODS, GAMES });
  const conns = new Set();
  let t = null;
  core.onChange(() => {
    if (t) return;
    t = setTimeout(() => {
      t = null;
      conns.forEach(c => { try { const v = viewFor(c.who); const s = JSON.stringify(v); if (s !== c.last) { c.last = s; c.fn(v); } } catch (e) { console.error(e); } });

// ===== browser/pickshim.js =====
// ================= 下拉框替身 =================
// 有的环境（比如嵌在 Claude 应用里的网页）原生下拉框点了不弹出来。
// 网页版里打开 window.__PICKSHIM：点下拉框时换成自己画的选项面板，选完照样触发 change。
(function () {
  if (typeof document === 'undefined') return;
  let open = null;
  function close() { if (open) { open.el.remove(); document.removeEventListener('mousedown', open.out, true); document.removeEventListener('keydown', open.key, true); open = null; } }
  function show(sel) {
    close();
    const cs = getComputedStyle(sel), r = sel.getBoundingClientRect();
    const el = document.createElement('div');
    el.setAttribute('role', 'listbox');
    el.style.cssText = `position:fixed;z-index:9999;background:#fff;border-radius:12px;box-shadow:0 12px 32px rgba(30,42,74,.3);padding:6px;overflow:auto;font-family:${cs.fontFamily};font-size:${cs.fontSize};color:#1E2A4A;min-width:${Math.max(r.width, 140)}px;max-height:${Math.max(160, Math.min(420, innerHeight - 24))}px`;
    Array.from(sel.options).forEach((o, i) => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = o.textContent; b.disabled = o.disabled;
      b.setAttribute('role', 'option'); b.setAttribute('aria-selected', String(i === sel.selectedIndex));
      b.style.cssText = `display:block;width:100%;text-align:left;border:0;border-radius:8px;padding:8px 12px;font:inherit;font-weight:700;cursor:pointer;color:inherit;background:${i === sel.selectedIndex ? '#FFE3CF' : 'transparent'}`;
      b.onmouseenter = () => { if (i !== sel.selectedIndex) b.style.background = '#FFF7EC'; };
      b.onmouseleave = () => { if (i !== sel.selectedIndex) b.style.background = 'transparent'; };
      b.onclick = () => { close(); if (sel.selectedIndex !== i) { sel.selectedIndex = i; sel.dispatchEvent(new Event('input', { bubbles: true })); sel.dispatchEvent(new Event('change', { bubbles: true })); } sel.focus(); };
      el.appendChild(b);
    });
    document.body.appendChild(el);
    const h = el.offsetHeight, below = innerHeight - r.bottom - 8;
    el.style.left = Math.max(8, Math.min(r.left, innerWidth - el.offsetWidth - 8)) + 'px';
    el.style.top = (below >= h || below >= r.top ? r.bottom + 4 : Math.max(8, r.top - h - 4)) + 'px';
    const out = e => { if (!el.contains(e.target)) close(); };
    const key = e => { if (e.key === 'Escape') { e.preventDefault(); close(); sel.focus(); } };
    open = { el, out, key };
    setTimeout(() => { if (open && open.el === el) { document.addEventListener('mousedown', out, true); document.addEventListener('keydown', key, true); } }, 0);
    const cur = el.querySelector('[aria-selected="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest' });
  }
  document.addEventListener('mousedown', e => {
    if (!window.__PICKSHIM || e.button !== 0) return;
    const sel = e.target && e.target.closest && e.target.closest('select');
    if (!sel || sel.disabled || sel.multiple) return;
    e.preventDefault(); sel.focus();
    if (open) { close(); return; }
    show(sel);
  }, true);
  window.addEventListener('blur', close);
  window.addEventListener('resize', close);
})();

8, 8, 0, 22);\n  ctx.fill();\n  ctx.strokeStyle = \"#fff\"; ctx.lineWidth = 2.4; ctx.lineCap = \"round\"; ctx.lineJoin = \"round\";\n  ctx.beginPath(); ctx.moveTo(-9, -14); ctx.lineTo(-15, -8); ctx.lineTo(-9, -2); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(-2.5, -14); ctx.lineTo(2.5, -2); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(9, -14); ctx.lineTo(15, -8); ctx.lineTo(9, -2); ctx.stroke();\n  // 前腿\n  ctx.fillStyle = \"#F4F6FA\";\n  [[-16, 24], [16, 24]].forEach(([lx, ly]) => { 圆角矩形(lx - 7, ly, 14, 24, 7); });\n  ctx.fillStyle = \"#FF8A3D\";\n  [[-16, 44], [16, 44]].forEach(([lx, ly]) => { 圆角矩形(lx - 9, ly, 18, 11, 5); });\n  // 垂耳：从头两侧下垂的胶囊耳（正旋转=下垂；负旋转会变成翅耳）\n  ctx.fillStyle = \"#FF8A3D\";\n  ctx.beginPath(); ctx.ellipse(-48, -48, 13, 30, 0.35, 0, Math.PI * 2); ctx.fill();\n  ctx.beginPath(); ctx.ellipse(48, -48, 13, 30, -0.35, 0, Math.PI * 2); ctx.fill();\n  ctx.fillStyle = \"#FFC08A\";\n  ctx.beginPath(); ctx.ellipse(-48, -46, 6, 18, 0.35, 0, Math.PI * 2); ctx.fill();\n  ctx.beginPath(); ctx.ellipse(48, -46, 6, 18, -0.35, 0, Math.PI * 2); ctx.fill();\n  // 头\n  ctx.fillStyle = \"#F4F6FA\"; 圆角矩形(-40, -88, 80, 72, 30);\n  ctx.strokeStyle = \"#C5CCD8\"; ctx.lineWidth = 2; ctx.beginPath();\n  (function(x,y,w,h,r){ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();})(-40,-88,80,72,30); ctx.stroke();\n  ctx.fillStyle = \"rgba(255,255,255,.55)\"; ctx.beginPath(); ctx.ellipse(-14, -70, 16, 8, -0.3, 0, Math.PI * 2); ctx.fill();\n  // 黑面罩\n  ctx.fillStyle = \"#141820\"; ctx.beginPath(); ctx.ellipse(0, -52, 28, 22, 0, 0, Math.PI * 2); ctx.fill();\n  // 四角星星眼 ✦\n  ctx.fillStyle = \"#5BE0FF\";\n  for (const [ex, ey] of [[-12, -54], [12, -54]]) {\n    ctx.beginPath();\n    const outer = 9, inner = 9 * 0.38;\n    for (let i = 0; i < 8; i++) {\n      const a = -Math.PI / 2 + i * Math.PI / 4;\n      const rad = i % 2 === 0 ? outer : inner;\n      const x = ex + Math.cos(a) * rad, y = ey + Math.sin(a) * rad;\n      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);\n    }\n    ctx.closePath(); ctx.fill();\n  }\n  // 像素小嘴\n  [[-5, -40], [-1, -38], [3, -40]].forEach(([mx, my]) => { 圆角矩形(mx, my, 2.6, 2.2, 0.4); });\n  // 天线：橙底座 + 白杆 + 白球\n  ctx.fillStyle = \"#FF8A3D\"; ctx.beginPath(); ctx.ellipse(0, -88, 7, 4, 0, 0, Math.PI * 2); ctx.fill();\n  ctx.strokeStyle = \"#F2F4F8\"; ctx.lineWidth = 4; ctx.lineCap = \"round\";\n  ctx.beginPath(); ctx.moveTo(0, -88); ctx.lineTo(0, -104); ctx.stroke();\n  ctx.fillStyle = \"#FFFFFF\"; ctx.strokeStyle = \"#D0D6E2\"; ctx.lineWidth = 1;\n  ctx.beginPath(); ctx.arc(0, -106, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();\n  ctx.restore();\n}\nfunction 圆角矩形(x, y, w, h, r) {\n  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);\n  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); ctx.fill();\n}\nfunction 画表情(文字, x, y, 大小) {\n  ctx.font = 大小 + 'px \"Apple Color Emoji\",\"Segoe UI Emoji\",\"Noto Color Emoji\",sans-serif';\n  ctx.fillStyle = \"#000\"; ctx.textAlign = \"center\"; ctx.textBaseline = \"middle\"; ctx.fillText(文字, x, y);\n}\n\n// 画金元宝：中国古代船形金锭——底下像小船，两端向上翘起，中间隆起一个圆顶（canvas 画，不用钱袋 emoji）\nfunction 画金元宝(x, y, 大小) {\n  const s = (大小 || 56) / 100;\n  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);\n  const 金 = ctx.createLinearGradient(0, -40, 0, 40);\n  金.addColorStop(0, \"#FFF3A6\"); 金.addColorStop(0.45, \"#FFC93C\"); 金.addColorStop(1, \"#C98A00\");\n  ctx.lineJoin = \"round\"; ctx.strokeStyle = \"#9A6400\"; ctx.lineWidth = 4;\n  // 中间隆起的圆顶（先画，船身会盖住它的下半部分）\n  const 顶 = ctx.createRadialGradient(-8, -22, 4, 0, -10, 34);\n  顶.addColorStop(0, \"#FFF8C8\"); 顶.addColorStop(0.5, \"#FFD34D\"); 顶.addColorStop(1, \"#D99A00\");\n  ctx.fillStyle = 顶;\n  ctx.beginPath(); ctx.ellipse(0, -6, 26, 28, 0, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();\n  // 船形底座：两端翘起\n  ctx.fillStyle = 金;\n  ctx.beginPath();\n  ctx.moveTo(-50, -22);                              // 左边翘起的尖\n  ctx.quadraticCurveTo(-30, -2, -22, -4);            // 左边沿往里收\n  ctx.quadraticCurveTo(0, 4, 22, -4);                // 中间的口沿\n  ctx.quadraticCurveTo(30, -2, 50, -22);             // 右边翘起的尖\n  ctx.quadraticCurveTo(46, 14, 26, 26);              // 右边船身\n  ctx.quadraticCurveTo(0, 36, -26, 26);              // 船底\n  ctx.quadraticCurveTo(-46, 14, -50, -22);           // 左边船身\n  ctx.closePath(); ctx.fill(); ctx.stroke();\n  // 高光\n  ctx.strokeStyle = \"rgba(255,255,255,.75)\"; ctx.lineWidth = 3; ctx.lineCap = \"round\";\n  ctx.beginPath(); ctx.moveTo(-36, 4); ctx.quadraticCurveTo(-20, 18, 0, 20); ctx.stroke();\n  ctx.beginPath(); ctx.arc(-9, -20, 6, Math.PI * 1.1, Math.PI * 1.7); ctx.stroke();\n  ctx.restore();\n}\n\n// 每一帧都会运行一次\nfunction 游戏循环() {\n  帧数++;\n  if (帧数 % Math.max(16, 48 - 设置.掉落速度 * 4) === 0) 掉一个();\n\n  主角X = Math.max(50, Math.min(W - 50, 主角X));\n  const 主角Y = H - 地面高度 - 设置.主角大小 * 0.25;\n\n  // 移动天上的东西，看看有没有接住\n  for (const 东西 of 天上) {\n    东西.y += 东西.速度;\n    const 接住了 = Math.abs(东西.x - 主角X) < 设置.主角大小 * 0.6 && Math.abs(东西.y - (主角Y - 设置.主角大小 * 0.3)) < 设置.主角大小 * 0.5;\n    if (接住了 && !东西.不见了) 接到(东西);\n  }\n  天上 = 天上.filter(东西 => !东西.不见了 && 东西.y < H);\n\n  // 画背景和地面\n  ctx.fillStyle = 设置.背景颜色; ctx.fillRect(0, 0, W, H);\n  ctx.fillStyle = 设置.地面颜色; ctx.fillRect(0, H - 地面高度, W, 地面高度);\n\n  // 画天上的东西、主角、飘字\n  for (const 东西 of 天上) {\n    if (东西.画法 === \"金元宝\") 画金元宝(东西.x, 东西.y, 70);   // 没有 emoji 的东西用 canvas 画\n    else 画表情(东西.图案, 东西.x, 东西.y, 50);\n  }\n  if (设置.主角 === \"比特\") 画比特(主角X, 主角Y, 设置.主角大小);\n  else 画表情(设置.主角, 主角X, 主角Y - 设置.主角大小 * 0.2, 设置.主角大小);\n  for (const 字 of 飘字们) {\n    ctx.globalAlpha = 字.寿命 / 40; ctx.fillStyle = 字.颜色; ctx.font = \"bold 34px sans-serif\"; ctx.textAlign = \"center\";\n    ctx.fillText(字.文字, 字.x, 字.y); 字.y -= 1.5; 字.寿命--; ctx.globalAlpha = 1;\n  }\n  飘字们 = 飘字们.filter(字 => 字.寿命 > 0);\n\n  // 画分数\n  ctx.fillStyle = \"#1E2A4A\"; ctx.font = \"bold 36px sans-serif\"; ctx.textAlign = \"left\"; ctx.textBaseline = \"top\";\n  ctx.fillText(\"分数 \" + 分数, 24, 20);\n\n  requestAnimationFrame(游戏循环);\n}\n游戏循环();\n<\/script>\n<\/body>\n<\/html>\n", "大怪兽.html": "<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, user-scalable=no\">\n<title>大怪兽<\/title>\n<style>\n  html, body { margin: 0; height: 100%; background: #FFF7EC; font-family: \"PingFang SC\", \"Microsoft YaHei\", sans-serif; color: #1E2A4A; touch-action: none; }\n  #box { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }\n  h1 { margin: 0; font-size: 28px; }\n  canvas { width: min(96vw, 160vh); max-height: 82vh; aspect-ratio: 16 / 9; border-radius: 18px; box-shadow: 0 6px 0 #F0E2CC; background: #FFF7EC; }\n  p { margin: 0; color: #5B6683; font-size: 18px; }\n<\/style>\n<\/head>\n<body>\n<div id=\"box\">\n  <h1>大怪兽<\/h1>\n  <canvas id=\"game\" width=\"960\" height=\"540\"><\/canvas>\n  <p>点草地，比特就走过去；收齐星星，或者点 ❄️ 用雪球打倒怪兽<\/p>\n<\/div>\n\n<script>\n// ===== 游戏设置：想改游戏，先改这里 =====\nconst 设置 = {\n  比特有几颗心: 3,        // 被怪兽碰到少一颗，没了就输\n  星星有几颗: 6,          // 草地上有几颗星星，收齐就赢\n  怪兽血量: 10,           // 雪球打中一次少 1，打到 0 也赢\n  靠近是多近: 180,        // 比特离怪兽多近算\"靠近\"（像素）\n  可以扔雪球: true,       // 改成 false：没有雪球按钮\n};\n\n// ===== 状态表：怪兽有几种状态，每一行是一种 =====\n// 名字：状态叫什么；样子：一个 emoji\n// 什么时候：什么时候变成这个状态——\"一开始\" \"比特靠近\" \"比特走远\" \"被打中\" \"血量剩一半\" \"过了5秒\"（数字可以改）\n// 做什么：\"不动\" \"睡觉\" \"慢慢走\" \"追比特\" \"跑得飞快\" \"逃跑\" \"喷火\"\nconst 状态们 = [\n  { 名字: \"巡逻\", 样子: \"👹\", 什么时候: \"一开始\", 做什么: \"慢慢走\" },\n];\n\n// ===== 下面是游戏程序 =====\nconst canvas = document.getElementById(\"game\");\nconst ctx = canvas.getContext(\"2d\");\nconst W = canvas.width, H = canvas.height;\nconst 场地 = { x: 16, y: 52, 宽: 672, 高: 472 };     // 左边的草地\nconst 面板X = 704, 面板宽 = 240;                       // 右边的状态表\nconst 雪球按钮 = { x: 824, y: 466, 半径: 50 };\nconst 再来按钮 = { x: 场地.x + 场地.宽 / 2, y: 场地.y + 场地.高 / 2 + 80, 宽: 240, 高: 68 };\nconst 比特半径 = 24, 怪兽半径 = 32;\nconst 比特速度 = 4.5;\nconst 怪兽速度 = { 慢慢走: 1.2, 追比特: 2.2, 跑得飞快: 3.9, 逃跑: 2.6 };\nconst 草们 = [];\nfor (let i = 0; i < 70; i++) 草们.push({ x: 场地.x + 20 + Math.random() * (场地.宽 - 40), y: 场地.y + 20 + Math.random() * (场地.高 - 40) });\n\nlet 比特 = { x: 0, y: 0 };\nlet 目标 = null;          // 比特要走去的地方\nlet 按着 = false;         // 手指按在草地上\nlet 怪兽 = { x: 0, y: 0, 血量: 10, 方向: 0, 闪: 0, 疼: 0, 朝左: false };\nlet 星星们 = [];\nlet 星星总数 = 0, 收到的星星 = 0;\nlet 心 = 3, 最多几颗心 = 3, 最大血量 = 10;\nlet 局面 = \"玩\";          // \"玩\" \"赢了\" \"输了\"\nlet 结果 = \"\";\nlet 状态表 = [];          // 从「状态们」整理出来的，每行多了：时候、做、认不认识\nlet 现在状态 = -1;        // 怪兽现在在状态表的第几行（-1：表是空的）\nlet 状态帧数 = 0;         // 在现在这个状态待了几帧（60 帧 = 1 秒）\nlet 换了几次 = 0;\nlet 比特在近处 = false;\nlet 刚被打中 = false, 刚剩一半 = false, 剩一半过 = false;\nlet 雪球们 = [], 火球们 = [];\nlet 雪球冷却 = 0, 无敌 = 0;\nlet 帧数 = 0;\nlet 话 = \"\", 话的寿命 = 0;  // 屏幕上的一句提示\nlet 飘字们 = [];\n\n// ===== 读状态表：认识的写法 =====\nconst 中文数字 = { 零: 0, 一: 1, 两: 2, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 };\nfunction 读数(字) {\n  if (/^\\d/.test(字)) return parseFloat(字);\n  if (字.includes(\"十\")) { const 段 = 字.split(\"十\"); return (段[0] ? 中文数字[段[0]] || 0 : 1) * 10 + (段[1] ? 中文数字[段[1]] || 0 : 0); }\n  return 中文数字[字] || 0;\n}\n// \"什么时候\" → { 类型, 秒 }；看不懂就是 null\nfunction 读什么时候(字) {\n  const 文 = String(字 == null ? \"\" : 字).replace(/\\s/g, \"\");\n  if (!文) return null;\n  if (/一开始|开始|开局/.test(文)) return { 类型: \"一开始\" };\n  if (/一半|半血/.test(文)) return { 类型: \"血量剩一半\" };\n  if (/打中|被打|挨打|砸中|受伤/.test(文)) return { 类型: \"被打中\" };\n  const m = 文.match(/(\\d+(?:\\.\\d+)?|[零一两二三四五六七八九十]+)秒/);\n  if (m) { const 秒 = 读数(m[1]); return 秒 > 0 ? { 类型: \"过了\", 秒 } : null; }\n  if (/走远|离开|跑远|远离|走开|离远/.test(文)) return { 类型: \"比特走远\" };\n  if (/靠近|走近|接近|过来|很近/.test(文)) return { 类型: \"比特靠近\" };\n  return null;\n}\n// \"做什么\" → 七种做法里的一种；看不懂就是 null\nconst 做法们 = [\n  [\"喷火\", /喷火|吐火|火球|放火/],\n  [\"睡觉\", /睡/],\n  [\"不动\", /不动|站着|站住|停|不追/],\n  [\"逃跑\", /逃|躲|跑开|害怕/],\n  [\"跑得飞快\", /飞快|冲|快速|狂奔|很快|快跑|加速/],\n  [\"追比特\", /追/],\n  [\"慢慢走\", /慢慢|散步|巡逻|走来走去|随便走|闲逛|溜达/],\n];\nfunction 读做什么(字) {\n  const 文 = String(字 == null ? \"\" : 字).replace(/\\s/g, \"\");\n  for (const [做法, 认] of 做法们) if (认.test(文)) return 做法;\n  return null;\n}\nfunction 整理状态表() {\n  状态表 = [];\n  const 表 = Array.isArray(状态们) ? 状态们 : [];\n  for (let i = 0; i < 表.length; i++) {\n    const 行 = 表[i] && typeof 表[i] === \"object\" ? 表[i] : {};\n    const 时候 = 读什么时候(行.什么时候), 做 = 读做什么(行.做什么);\n    状态表.push({\n      名字: String(行.名字 || \"状态\" + (i + 1)),\n      样子: String(行.样子 || \"👹\"),\n      什么时候: 行.什么时候 == null ? \"\" : String(行.什么时候),\n      做什么: 行.做什么 == null ? \"\" : String(行.做什么),\n      时候, 做: 做 || \"不动\",                       // 不认识的做法：当作\"不动\"\n      时候不认识: !时候, 做不认识: !做,\n    });\n  }\n}\n\n// ===== 小算术 =====\nfunction 数(值, 默认, 最小, 最大) { const n = Number(值); return Number.isFinite(n) ? Math.min(最大, Math.max(最小, Math.round(n))) : 默认; }\nfunction 距离(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }\nfunction 靠近距离() { return 数(设置.靠近是多近, 180, 20, 900); }\nfunction 可以扔() { return 设置.可以扔雪球 !== false; }\nfunction 夹在场地里(x, y, 半径) {\n  return { x: Math.min(场地.x + 场地.宽 - 半径 - 4, Math.max(场地.x + 半径 + 4, x)), y: Math.min(场地.y + 场地.高 - 半径 - 4, Math.max(场地.y + 半径 + 4, y)) };\n}\n\n// 开一局新游戏\nfunction 开始() {\n  最多几颗心 = 数(设置.比特有几颗心, 3, 1, 10); 心 = 最多几颗心;\n  最大血量 = 数(设置.怪兽血量, 10, 1, 99);\n  星星总数 = 数(设置.星星有几颗, 6, 0, 20); 收到的星星 = 0;\n  比特 = { x: 场地.x + 90, y: 场地.y + 场地.高 - 80 }; 目标 = null; 按着 = false;\n  怪兽 = { x: 场地.x + 场地.宽 * 0.7, y: 场地.y + 场地.高 * 0.38, 血量: 最大血量, 方向: Math.random() * Math.PI * 2, 闪: 0, 疼: 0, 朝左: true };\n  局面 = \"玩\"; 结果 = \"\"; 雪球们 = []; 火球们 = []; 飘字们 = []; 雪球冷却 = 0; 无敌 = 0;\n  刚被打中 = false; 刚剩一半 = false; 剩一半过 = false; 换了几次 = 0; 状态帧数 = 0;\n  放星星();\n  整理状态表();\n  const 一开始的 = 状态表.findIndex(行 => 行.时候 && 行.时候.类型 === \"一开始\");\n  现在状态 = 状态表.length ? Math.max(0, 一开始的) : -1;      // 没写\"一开始\"：用第一行\n  比特在近处 = 距离(比特, 怪兽) <= 靠近距离();\n  if (!状态表.length) 说一句(\"状态表是空的\");\n  else if (状态表.some(行 => 行.时候不认识 || 行.做不认识)) 说一句(\"状态表里有看不懂的，标了「?」\");\n  else 说一句(\"收齐星星，或者用雪球打倒怪兽！\");\n}\n\nfunction 放星星() {\n  星星们 = [];\n  for (let i = 0; i < 星星总数; i++) {\n    for (let 试 = 0; 试 < 300; 试++) {\n      const 点 = { x: 场地.x + 40 + Math.random() * (场地.宽 - 80), y: 场地.y + 80 + Math.random() * (场地.高 - 120) };\n      const 好 = 距离(点, 比特) > 90 && 距离(点, 怪兽) > 110 && 星星们.every(星 => 距离(星, 点) > 70);\n      if (好 || 试 === 299) { 星星们.push(点); break; }\n    }\n  }\n}\n\n// ===== 状态怎么换：只看\"刚刚发生\"的事 =====\nfunction 检查换状态() {\n  const 发生了 = [];\n  if (刚剩一半) 发生了.push(\"血量剩一半\");\n  if (刚被打中) 发生了.push(\"被打中\");\n  刚剩一半 = false; 刚被打中 = false;\n  const d = 距离(比特, 怪兽);\n  if (!比特在近处 && d <= 靠近距离()) { 比特在近处 = true; 发生了.push(\"比特靠近\"); }\n  else if (比特在近处 && d > 靠近距离() * 1.6) { 比特在近处 = false; 发生了.push(\"比特走远\"); }\n  状态帧数++;\n  发生了.push(\"过了\");                                        // 在现在这个状态又待了一帧\n  for (const 事 of 发生了) {\n    // 换到表里第一个\"什么时候\"等于这件事、而且不是现在状态的那一行\n    const i = 状态表.findIndex((行, 第几) => 第几 !== 现在状态 && 行.时候 && 行.时候.类型 === 事 &&\n      (事 !== \"过了\" || Math.round(行.时候.秒 * 60) === 状态帧数));\n    if (i >= 0) { 换状态(i); return; }\n  }\n}\nfunction 换状态(i) {\n  const 旧 = 状态表[现在状态], 新 = 状态表[i];\n  现在状态 = i; 状态帧数 = 0; 换了几次++; 怪兽.闪 = 30;\n  说一句(\"怪兽：\" + (旧 ? 旧.名字 : \"？\") + \" → \" + 新.名字 + \"！\");\n}\n\n// ===== 怪兽照现在的状态做事 =====\nfunction 怪兽行动() {\n  const 行 = 状态表[现在状态], 做 = 行 ? 行.做 : \"不动\";\n  if (做 === \"慢慢走\") {\n    if (帧数 % 90 === 0) 怪兽.方向 += (Math.random() - 0.5) * 1.8;\n    怪兽走(Math.cos(怪兽.方向), Math.sin(怪兽.方向), 怪兽速度.慢慢走, true);\n  } else if (做 === \"追比特\" || 做 === \"跑得飞快\") {\n    const dx = 比特.x - 怪兽.x, dy = 比特.y - 怪兽.y, d = Math.hypot(dx, dy);\n    if (d > 2) 怪兽走(dx / d, dy / d, 怪兽速度[做], false);\n  } else if (做 === \"逃跑\") {\n    const dx = 怪兽.x - 比特.x, dy = 怪兽.y - 比特.y, d = Math.hypot(dx, dy) || 1;\n    怪兽走(dx / d, dy / d, 怪兽速度.逃跑, false);\n  } else if (做 === \"喷火\") {\n    if (状态帧数 % 90 === 30) 喷火球();                         // 每 1.5 秒喷一个\n  }\n  // \"不动\" \"睡觉\"：站着\n}\nfunction 怪兽走(dx, dy, 速度, 碰边转向) {\n  const 新x = 怪兽.x + dx * 速度, 新y = 怪兽.y + dy * 速度;\n  const 点 = 夹在场地里(新x, 新y, 怪兽半径 + 2);\n  if (碰边转向 && 点.x !== 新x) 怪兽.方向 = Math.PI - 怪兽.方向;\n  if (碰边转向 && 点.y !== 新y) 怪兽.方向 = -怪兽.方向;\n  怪兽.x = 点.x; 怪兽.y = 点.y;\n  if (Math.abs(dx) > 0.1) 怪兽.朝左 = dx < 0;\n}\nfunction 喷火球() {\n  const dx = 比特.x - 怪兽.x, dy = 比特.y - 怪兽.y, d = Math.hypot(dx, dy) || 1;\n  火球们.push({ x: 怪兽.x + dx / d * 30, y: 怪兽.y + dy / d * 30, vx: dx / d * 4.5, vy: dy / d * 4.5 });\n}\nfunction 怪兽被打中() {\n  怪兽.血量 = Math.max(0, 怪兽.血量 - 1); 怪兽.疼 = 12; 刚被打中 = true;\n  飘字(\"-1\", 怪兽.x, 怪兽.y - 50, \"#2D7FF9\");\n  if (!剩一半过 && 怪兽.血量 <= 最大血量 / 2) { 剩一半过 = true; 刚剩一半 = true; }\n  if (怪兽.血量 <= 0) 赢了(\"把怪兽打倒了！\");\n}\n\n// ===== 比特 =====\nfunction 比特走() {\n  if (!目标) return;\n  const dx = 目标.x - 比特.x, dy = 目标.y - 比特.y, d = Math.hypot(dx, dy);\n  if (d <= 比特速度) { 比特.x = 目标.x; 比特.y = 目标.y; 目标 = null; return; }\n  比特.x += dx / d * 比特速度; 比特.y += dy / d * 比特速度;\n}\nfunction 收星星() {\n  for (const 星 of 星星们) {\n    if (距离(星, 比特) < 比特半径 + 18) { 星.收了 = true; 收到的星星++; 飘字(\"+1\", 星.x, 星.y - 20, \"#E8A317\"); }\n  }\n  星星们 = 星星们.filter(星 => !星.收了);\n  if (星星总数 > 0 && 收到的星星 >= 星星总数) 赢了(\"星星都收齐了！\");\n}\nfunction 比特受伤(从x, 从y) {\n  if (无敌 > 0 || 局面 !== \"玩\") return;\n  心--; 无敌 = 90;                                              // 闪烁 1.5 秒，这时候不会再受伤\n  飘字(\"-1 ❤️\", 比特.x, 比特.y - 40, \"#E5484D\");\n  let dx = 比特.x - 从x, dy = 比特.y - 从y, d = Math.hypot(dx, dy);\n  if (d < 1) { dx = -1; dy = 0; d = 1; }\n  比特 = 夹在场地里(比特.x + dx / d * 90, 比特.y + dy / d * 90, 比特半径);   // 被弹开\n  目标 = null;\n  if (心 <= 0) 输了(\"心没了！\");\n}\nfunction 扔雪球() {\n  if (局面 !== \"玩\" || !可以扔() || 雪球冷却 > 0) return;\n  雪球冷却 = 30;                                                // 0.5 秒才能扔下一个\n  雪球们.push({ x: 比特.x, y: 比特.y - 10, 寿命: 120 });\n}\nfunction 雪球飞() {\n  for (const 球 of 雪球们) {\n    const dx = 怪兽.x - 球.x, dy = 怪兽.y - 球.y, d = Math.hypot(dx, dy) || 1, 步 = Math.min(10, d);\n    球.x += dx / d * 步; 球.y += dy / d * 步; 球.寿命--;\n    if (距离(球,
