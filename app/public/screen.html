>\n  ctx.fillStyle = \"#FF8A3D\";\n  ctx.beginPath();\n  ctx.moveTo(0, 22); ctx.bezierCurveTo(-18, 8, -26, -4, -16, -12); ctx.bezierCurveTo(-10, -16, -4, -12, 0, -6);\n  ctx.bezierCurveTo(4, -12, 10, -16, 16, -12); ctx.bezierCurveTo(26, -4, 18, 8, 0, 22);\n  ctx.fill();\n  ctx.strokeStyle = \"#fff\"; ctx.lineWidth = 2.4; ctx.lineCap = \"round\"; ctx.lineJoin = \"round\";\n  ctx.beginPath(); ctx.moveTo(-9, -14); ctx.lineTo(-15, -8); ctx.lineTo(-9, -2); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(-2.5, -14); ctx.lineTo(2.5, -2); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(9, -14); ctx.lineTo(15, -8); ctx.lineTo(9, -2); ctx.stroke();\n  // 前腿\n  ctx.fillStyle = \"#F4F6FA\";\n  [[-16, 24], [16, 24]].forEach(([lx, ly]) => { 圆角矩形(lx - 7, ly, 14, 24, 7); });\n  ctx.fillStyle = \"#FF8A3D\";\n  [[-16, 44], [16, 44]].forEach(([lx, ly]) => { 圆角矩形(lx - 9, ly, 18, 11, 5); });\n  // 垂耳：从头两侧下垂的胶囊耳（正旋转=下垂；负旋转会变成翅耳）\n  ctx.fillStyle = \"#FF8A3D\";\n  ctx.beginPath(); ctx.ellipse(-48, -48, 13, 30, 0.35, 0, Math.PI * 2); ctx.fill();\n  ctx.beginPath(); ctx.ellipse(48, -48, 13, 30, -0.35, 0, Math.PI * 2); ctx.fill();\n  ctx.fillStyle = \"#FFC08A\";\n  ctx.beginPath(); ctx.ellipse(-48, -46, 6, 18, 0.35, 0, Math.PI * 2); ctx.fill();\n  ctx.beginPath(); ctx.ellipse(48, -46, 6, 18, -0.35, 0, Math.PI * 2); ctx.fill();\n  // 头\n  ctx.fillStyle = \"#F4F6FA\"; 圆角矩形(-40, -88, 80, 72, 30);\n  ctx.strokeStyle = \"#C5CCD8\"; ctx.lineWidth = 2; ctx.beginPath();\n  (function(x,y,w,h,r){ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();})(-40,-88,80,72,30); ctx.stroke();\n  ctx.fillStyle = \"rgba(255,255,255,.55)\"; ctx.beginPath(); ctx.ellipse(-14, -70, 16, 8, -0.3, 0, Math.PI * 2); ctx.fill();\n  // 黑面罩\n  ctx.fillStyle = \"#141820\"; ctx.beginPath(); ctx.ellipse(0, -52, 28, 22, 0, 0, Math.PI * 2); ctx.fill();\n  // 四角星星眼 ✦\n  ctx.fillStyle = \"#5BE0FF\";\n  for (const [ex, ey] of [[-12, -54], [12, -54]]) {\n    ctx.beginPath();\n    const outer = 9, inner = 9 * 0.38;\n    for (let i = 0; i < 8; i++) {\n      const a = -Math.PI / 2 + i * Math.PI / 4;\n      const rad = i % 2 === 0 ? outer : inner;\n      const x = ex + Math.cos(a) * rad, y = ey + Math.sin(a) * rad;\n      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);\n    }\n    ctx.closePath(); ctx.fill();\n  }\n  // 像素小嘴\n  [[-5, -40], [-1, -38], [3, -40]].forEach(([mx, my]) => { 圆角矩形(mx, my, 2.6, 2.2, 0.4); });\n  // 天线：橙底座 + 白杆 + 白球\n  ctx.fillStyle = \"#FF8A3D\"; ctx.beginPath(); ctx.ellipse(0, -88, 7, 4, 0, 0, Math.PI * 2); ctx.fill();\n  ctx.strokeStyle = \"#F2F4F8\"; ctx.lineWidth = 4; ctx.lineCap = \"round\";\n  ctx.beginPath(); ctx.moveTo(0, -88); ctx.lineTo(0, -104); ctx.stroke();\n  ctx.fillStyle = \"#FFFFFF\"; ctx.strokeStyle = \"#D0D6E2\"; ctx.lineWidth = 1;\n  ctx.beginPath(); ctx.arc(0, -106, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();\n  ctx.restore();\n}\nfunction 圆角矩形(x, y, w, h, r) {\n  r = Math.min(r, w / 2, h / 2);\n  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);\n  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); ctx.fill();\n}\nfunction 画表情(文字, x, y, 大小) {\n  ctx.font = 大小 + 'px \"Apple Color Emoji\",\"Segoe UI Emoji\",\"Noto Color Emoji\",sans-serif';\n  ctx.fillStyle = \"#000\"; ctx.textAlign = \"center\"; ctx.textBaseline = \"middle\"; ctx.fillText(文字, x, y);\n}\nfunction 画文字(文字, x, y, 大小, 颜色, 对齐) {\n  ctx.fillStyle = 颜色; ctx.font = \"bold \" + 大小 + 'px \"PingFang SC\",\"Microsoft YaHei\",sans-serif';\n  ctx.textAlign = 对齐 || \"center\"; ctx.textBaseline = \"middle\"; ctx.fillText(文字, x, y);\n}\nfunction 画电量() {\n  const x = W / 2 - 130, y = 22, w = 260, h = 36;\n  ctx.fillStyle = \"rgba(255,255,255,0.9)\"; 圆角矩形(x, y, w, h, 12);\n  const 长度 = (w - 8) * 当前电量 / 100;\n  if (长度 > 2) { ctx.fillStyle = 当前电量 > 30 ? \"#2ECC9A\" : \"#E5484D\"; 圆角矩形(x + 4, y + 4, 长度, h - 8, 8); }\n  画文字(\"电量 \" + Math.ceil(当前电量), W / 2, y + h / 2, 22, \"#1E2A4A\");\n}\n\nfunction 画() {\n  画背景();\n  for (const 东西 of 路上) 画表情(东西.图案, 东西.x, 地面Y - 28, 58);\n  const 显示狗 = 闪烁 === 0 || Math.floor(闪烁 / 5) % 2 === 0;\n  if (显示狗) {\n    if (设置.主角 === \"比特\") 画比特(狗.x, 狗.y, 设置.主角大小);\n    else 画表情(设置.主角, 狗.x, 狗.y - 设置.主角大小 * 0.45, 设置.主角大小);\n  }\n  for (const 字 of 飘字们) {\n    ctx.globalAlpha = 字.寿命 / 45; 画文字(字.文字, 字.x, 字.y, 30, 字.颜色); 字.y -= 1.2; 字.寿命--; ctx.globalAlpha = 1;\n  }\n  飘字们 = 飘字们.filter(字 => 字.寿命 > 0);\n  const 字色 = 设置.背景 === \"白天\" ? \"#1E2A4A\" : \"#FFFFFF\";\n  if (状态 !== \"准备\") {\n    if (设置.显示分数) 画文字(\"分数 \" + 分数, 24, 40, 34, 字色, \"left\");\n    if (设置.生命 > 0) 画文字(\"生命 \" + \"♥\".repeat(Math.max(0, 剩余生命)), 24, 84, 30, \"#E5484D\", \"left\");\n    if (设置.倒计时 > 0) 画文字(\"倒计时 \" + Math.ceil(剩余时间), W - 24, 40, 34, 字色, \"right\");\n    if (设置.电量) 画电量();\n  }\n  if (状态 === \"准备\") { 画文字(\"点一下，开始跑！\", W / 2, H / 2 - 40, 52, 字色); }\n  if (状态 === \"结束\") {\n    ctx.fillStyle = \"rgba(30,42,74,0.55)\"; ctx.fillRect(0, 0, W, H);\n    画文字(结束原因 + \"！\", W / 2, H / 2 - 50, 64, \"#FFFFFF\");\n    if (设置.显示分数) 画文字(\"得分 \" + 分数, W / 2, H / 2 + 20, 44, \"#FFC93D\");\n    画文字(\"点一下，再来一次\", W / 2, H / 2 + 80, 32, \"#FFFFFF\");\n  }\n}\n\nfunction 游戏循环() { 更新(); 画(); requestAnimationFrame(游戏循环); }\n游戏循环();\n<\/script>\n<\/body>\n<\/html>\n", "比特跑酷.html": "<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, user-scalable=no\">\n<title>比特跑酷<\/title>\n<style>\n  html, body { margin: 0; height: 100%; background: #FFF7EC; font-family: \"PingFang SC\", \"Microsoft YaHei\", sans-serif; color: #1E2A4A; touch-action: manipulation; }\n  #box { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }\n  h1 { margin: 0; font-size: 28px; }\n  canvas { width: min(96vw, 160vh); max-height: 82vh; aspect-ratio: 16 / 9; border-radius: 18px; box-shadow: 0 6px 0 #F0E2CC; background: #BDE6FF; }\n  p { margin: 0; color: #5B6683; font-size: 18px; }\n<\/style>\n<\/head>\n<body>\n<div id=\"box\">\n  <h1>比特跑酷<\/h1>\n  <canvas id=\"game\" width=\"960\" height=\"540\"><\/canvas>\n  <p>点一下屏幕（或按空格）让比特跳起来<\/p>\n<\/div>\n\n<script>\n// ===== 游戏设置：想改游戏，先改这里 =====\nconst 设置 = {\n  主角: \"比特\",        // \"比特\" 是驯狗学院的机器狗；也可以换成表情，比如 \"🐰\"\n  主角大小: 90,        // 数字越大，主角越大\n  背景: \"白天\",        // 可以填 \"白天\"、\"夜晚\"、\"太空\"\n  奔跑速度: 6,         // 数字越大，跑得越快\n  跳跃力气: 16,        // 数字越大，跳得越高\n  重力: 0.8,           // 数字越大，落得越快\n  显示分数: false,     // 是否显示分数\n  跳过加分: 1,         // 跳过一个“撞倒”的东西，加几分\n  生命: 0,             // 有几条命；填 0 表示撞一下就结束\n  倒计时: 0,           // 游戏时间（秒）；填 0 表示不限时\n  越来越快: false,     // 每得 5 分，速度变快一点\n  电量: false,         // 是否有电量：跑步会耗电，吃“加电量”的东西能充电，电用完游戏结束\n  每秒耗电: 5,         // 每秒用掉多少电（电量满格是 100）\n};\n\n// ===== 路上会出现的东西：只要你想得到，都可以加进来 =====\n// 碰到会：\"撞倒\"（比特要跳过去）或 \"吃掉\"（比特会把它吃了）\n// 吃掉以后会怎样：加分、加电量……想让它发生什么，就告诉代码精灵\n// 出现机会：数字越大，越常出现\nconst 路上的东西 = [\n  { 名字: \"仙人掌\", 图案: \"🌵\", 碰到会: \"撞倒\", 出现机会: 1 },\n];\n\n// ===== 下面是游戏程序 =====\nconst canvas = document.getElementById(\"game\");\nconst ctx = canvas.getContext(\"2d\");\nconst W = canvas.width, H = canvas.height;\nconst 地面Y = H - 90;\n\nlet 状态 = \"准备\";            // \"准备\"、\"跑\"、\"结束\"\nlet 分数 = 0, 剩余生命 = 设置.生命, 剩余时间 = 设置.倒计时, 当前电量 = 100, 路程 = 0;\nlet 路上 = [], 下一个距离 = 300, 闪烁 = 0, 结束原因 = \"\", 飘字们 = [];\nconst 狗 = { x: 170, y: 地面Y, vy: 0 };\n\nfunction 重新开始() {\n  分数 = 0;\n  剩余生命 = 设置.生命;\n  剩余时间 = 设置.倒计时;\n  当前电量 = 100;\n  路程 = 0;\n  路上 = [];\n  下一个距离 = 300;\n  闪烁 = 0;\n  飘字们 = [];\n  狗.y = 地面Y; 狗.vy = 0;\n  状态 = \"跑\";\n}\n\n// 点屏幕或按空格：开始 / 跳跃 / 重来\nfunction 按下() {\n  if (状态 !== \"跑\") { 重新开始(); return; }\n  if (狗.y >= 地面Y) 狗.vy = -设置.跳跃力气;\n}\ncanvas.addEventListener(\"pointerdown\", 按下);\ndocument.addEventListener(\"keydown\", e => { if (e.code === \"Space\" || e.key === \"ArrowUp\") { e.preventDefault(); 按下(); } });\n\nfunction 当前速度() {\n  if (设置.越来越快) return 设置.奔跑速度 + Math.floor(Math.max(0, 分数) / 5) * 0.6;\n  return 设置.奔跑速度;\n}\n\n// 按“出现机会”随机挑一个东西放到路上\nfunction 挑一个东西() {\n  let 总数 = 0;\n  for (const 东西 of 路上的东西) 总数 += 东西.出现机会 || 1;\n  let 随机 = Math.random() * 总数;\n  for (const 东西 of 路上的东西) {\n    随机 -= 东西.出现机会 || 1;\n    if (随机 <= 0) return 东西;\n  }\n  return 路上的东西[0];\n}\n\n// 两个方框有没有碰到\nfunction 撞到了(a, b) {\n  return a.左 < b.右 && a.右 > b.左 && a.上 < b.下 && a.下 > b.上;\n}\n\nfunction 飘字(文字, x, y, 颜色) { 飘字们.push({ 文字, x, y, 颜色, 寿命: 45 }); }\n\n// 比特碰到路上的东西时，会发生什么\nfunction 碰到(东西) {\n  if (东西.碰到会 === \"吃掉\") {\n    东西.不见了 = true;\n    if (东西.加分) { 分数 += 东西.加分; 飘字(\"+\" + 东西.加分 + \" 分\", 东西.x, 地面Y - 100, \"#18A87C\"); }\n    if (设置.电量 && 东西.加电量) { 当前电量 = Math.min(100, 当前电量 + 东西.加电量); 飘字(\"电量 +\" + 东西.加电量, 东西.x, 地面Y - 140, \"#2366D1\"); }\n    if (!东西.加分 && !(设置.电量 && 东西.加电量)) 飘字(\"好吃！\", 东西.x, 地面Y - 100, \"#18A87C\");\n    return;\n  }\n  if (东西.碰到会 === \"撞倒\") {\n    东西.撞过 = true;\n    if (设置.生命 > 0) {\n      剩余生命 -= 1;\n      闪烁 = 40;\n      if (剩余生命 <= 0) { 状态 = \"结束\"; 结束原因 = \"没有生命了\"; }\n    } else { 状态 = \"结束\"; 结束原因 = \"撞到\" + 东西.名字 + \"了\"; }\n  }\n}\n\nfunction 更新() {\n  if (状态 !== \"跑\") return;\n  const 速度 = 当前速度();\n  路程 += 速度;\n\n  // 跳跃和下落\n  狗.y += 狗.vy;\n  狗.vy += 设置.重力;\n  if (狗.y >= 地面Y) { 狗.y = 地面Y; 狗.vy = 0; }\n\n  // 往路上放新东西\n  下一个距离 -= 速度;\n  if (下一个距离 <= 0) {\n    路上.push(Object.assign({ x: W + 40 }, 挑一个东西()));\n    下一个距离 = 260 + Math.random() * 300;\n  }\n\n  // 移动路上的东西，看看比特有没有碰到\n  const s = 设置.主角大小 / 100;\n  const 狗框 = { 左: 狗.x - 45 * s, 右: 狗.x + 70 * s, 上: 狗.y - 95 * s, 下: 狗.y - 4 };\n  for (const 东西 of 路上) {\n    东西.x -= 速度;\n    const 框 = { 左: 东西.x - 20, 右: 东西.x + 20, 上: 地面Y - 50, 下: 地面Y };\n    if (!东西.不见了 && !东西.撞过 && 撞到了(狗框, 框)) 碰到(东西);\n    if (东西.碰到会 === \"撞倒\" && !东西.过了 && 东西.x + 20 < 狗框.左) {\n      东西.过了 = true;\n      if (设置.显示分数 && !东西.撞过) 分数 += 设置.跳过加分;\n    }\n  }\n  路上 = 路上.filter(东西 => 东西.x > -60 && !东西.不见了);\n\n  // 电量：跑步会耗电\n  if (设置.电量) {\n    当前电量 -= 设置.每秒耗电 / 60;\n    if (当前电量 <= 0) { 当前电量 = 0; 状态 = \"结束\"; 结束原因 = \"没电了\"; }\n  }\n\n  // 倒计时\n  if (设置.倒计时 > 0) {\n    剩余时间 -= 1 / 60;\n    if (剩余时间 <= 0) { 剩余时间 = 0; 状态 = \"结束\"; 结束原因 = \"时间到\"; }\n  }\n  if (闪烁 > 0) 闪烁--;\n}\n\n// ===== 画画 =====\nfunction 画背景() {\n  const 主题 = { 白天: [\"#BDE6FF\", \"#F2C48D\"], 夜晚: [\"#1E2A4A\", \"#3B4B6E\"], 太空: [\"#140C33\", \"#4B3F72\"] }[设置.背景] || [\"#BDE6FF\", \"#F2C48D\"];\n  ctx.fillStyle = 主题[0]; ctx.fillRect(0, 0, W, H);\n  const 偏移 = 路程 * 0.2;\n  if (设置.背景 === \"白天\") {\n    ctx.fillStyle = \"#FFC93D\"; ctx.beginPath(); ctx.arc(860, 120, 40, 0, Math.PI * 2); ctx.fill();\n    ctx.fillStyle = \"#FFFFFF\";\n    for (let i = 0; i < 4; i++) { const x = ((i * 300 - 偏移) % 1200 + 1200) % 1200 - 120; 云(x, 110 + (i % 2) * 60); }\n  } else {\n    ctx.fillStyle = \"#FFFFFF\";\n    for (let i = 0; i < 40; i++) { const x = ((i * 97 - 偏移 * 0.5) % W + W) % W; ctx.fillRect(x, (i * 53) % (地面Y - 40), 3, 3); }\n    if (设置.背景 === \"夜晚\") { ctx.fillStyle = \"#FFF3C4\"; ctx.beginPath(); ctx.arc(840, 120, 36, 0, Math.PI * 2); ctx.fill(); }\n    if (设置.背景 === \"太空\") { ctx.fillStyle = \"#8B6CFF\"; ctx.beginPath(); ctx.arc(800, 140, 50, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = \"#FFC93D\"; ctx.lineWidth = 6; ctx.beginPath(); ctx.ellipse(800, 140, 80, 18, -0.3, 0, Math.PI * 2); ctx.stroke(); }\n  }\n  ctx.fillStyle = 主题[1]; ctx.fillRect(0, 地面Y, W, H - 地面Y);\n  ctx.fillStyle = \"rgba(0,0,0,0.12)\";\n  for (let i = 0; i < 12; i++) { const x = ((i * 90 - 路程) % 1080 + 1080) % 1080 - 60; ctx.fillRect(x, 地面Y + 22, 40, 6); }\n}\nfunction 云(x, y) { ctx.beginPath(); ctx.arc(x, y, 26, 0, 7); ctx.arc(x + 30, y - 12, 32, 0, 7); ctx.arc(x + 64, y, 24, 0, 7); ctx.fill(); }\n\nfunction 画比特(x, y, 大小) {\n  const s = 大小 / 100;\n  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);\n  // 影子\n  ctx.fillStyle = \"rgba(36,48,94,.16)\"; ctx.beginPath(); ctx.ellipse(0, 54, 40, 6, 0, 0, Math.PI * 2); ctx.fill();\n  // 后腿\n  ctx.fillStyle = \"#F4F6FA\"; ctx.strokeStyle = \"#C5CCD8\"; ctx.lineWidth = 1.5;\n  [[-28, 20], [28, 20]].forEach(([lx, ly]) => { 圆角矩形(lx - 8, ly, 16, 26, 8); });\n  ctx.fillStyle = \"#FF8A3D\";\n  [[-28, 42], [28, 42]].forEach(([lx, ly]) => { 圆角矩形(lx - 10, ly, 20, 12, 5); });\n  // 尾巴\n  ctx.strokeStyle = \"#FF8A3D\"; ctx.lineWidth = 9; ctx.lineCap = \"round\";\n  ctx.beginPath(); ctx.moveTo(26, 8); ctx.quadraticCurveTo(44, 14, 40, 30); ctx.stroke();\n  // 身体\n  ctx.fillStyle = \"#F4F6FA\"; 圆角矩形(-34, -18, 68, 56, 22);\n  ctx.strokeStyle = \"#C5CCD8\"; ctx.lineWidth = 2; ctx.beginPath();\n  (function(x,y,w,h,r){ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();})(-34,-18,68,56,22); ctx.stroke();\n  // 橙心 <\/>\n  ctx.fillStyle = \"#FF8A3D\";\n  ctx.beginPath();\n  ctx.moveTo(0, 22); ctx.bezierCurveTo(-18, 8, -26, -4, -16, -12); ctx.bezierCurveTo(-10, -16, -4, -12, 0, -6);\n  ctx.bezierCurveTo(4, -12, 10, -16, 16, -12); ctx.bezierCurveTo(26, -4, 18, 8, 0, 22);\n  ctx.fill();\n  ctx.strokeStyle = \"#fff\"; ctx.lineWidth = 2.4; ctx.lineCap = \"round\"; ctx.lineJoin = \"round\";\n  ctx.beginPath(); ctx.moveTo(-9, -14); ctx.lineTo(-15, -8); ctx.lineTo(-9, -2); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(-2.5, -14); ctx.lineTo(2.5, -2); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(9, -14); ctx.lineTo(15, -8); ctx.lineTo(9, -2); ctx.stroke();\n  // 前腿\n  ctx.fillStyle = \"#F4F6FA\";\n  [[-16, 24], [16, 24]].forEach(([lx, ly]) => { 圆角矩形(lx - 7, ly, 14, 24, 7); });\n  ctx.fillStyle = \"#FF8A3D\";\n  [[-16, 44], [16, 44]].forEach(([lx, ly]) => { 圆角矩形(lx - 9, ly, 18, 11, 5); });\n  // 垂耳：从头两侧下垂的胶囊耳（正旋转=下垂；负旋转会变成翅耳）\n  ctx.fillStyle = \"#FF8A3D\";\n  ctx.beginPath(); ctx.ellipse(-48, -48, 13, 30, 0.35, 0, Math.PI * 2); ctx.fill();\n  ctx.beginPath(); ctx.ellipse(48, -48, 13, 30, -0.35, 0, Math.PI * 2); ctx.fill();\n  ctx.fillStyle = \"#FFC08A\";\n  ctx.beginPath(); ctx.ellipse(-48, -46, 6, 18, 0.35, 0, Math.PI * 2); ctx.fill();\n  ctx.beginPath(); ctx.ellipse(48, -46, 6, 18, -0.35, 0, Math.PI * 2); ctx.fill();\n  // 头\n  ctx.fillStyle = \"#F4F6FA\"; 圆角矩形(-40, -88, 80, 72, 30);\n  ctx.strokeStyle = \"#C5CCD8\"; ctx.lineWidth = 2; ctx.beginPath();\n  (function(x,y,w,h,r){ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();})(-40,-88,80,72,30); ctx.stroke();\n  ctx.fillStyle = \"rgba(255,255,255,.55)\"; ctx.beginPath(); ctx.ellipse(-14, -70, 16, 8, -0.3, 0, Math.PI * 2); ctx.fill();\n  // 黑面罩\n  ctx.fillStyle = \"#141820\"; ctx.beginPath(); ctx.ellipse(0, -52, 28, 22, 0, 0, Math.PI * 2); ctx.fill();\n  // 四角星星眼 ✦\n  ctx.fillStyle = \"#5BE0FF\";\n  for (const [ex, ey] of [[-12, -54], [12, -54]]) {\n    ctx.beginPath();\n    const outer = 9, inner = 9 * 0.38;\n    for (let i = 0; i < 8; i++) {\n      const a = -Math.PI / 2 + i * Math.PI / 4;\n      const rad = i % 2 === 0 ? outer : inner;\n      const x = ex + Math.cos(a) * rad, y = ey + Math.sin(a) * rad;\n      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);\n    }\n    ctx.closePath(); ctx.fill();\n  }\n  // 像素小嘴\n  [[-5, -40], [-1, -38], [3, -40]].forEach(([mx, my]) => { 圆角矩形(mx, my, 2.6, 2.2, 0.4); });\n  // 天线：橙底座 + 白杆 + 白球\n  ctx.fillStyle = \"#FF8A3D\"; ctx.beginPath(); ctx.ellipse(0, -88, 7, 4, 0, 0, Math.PI * 2); ctx.fill();\n  ctx.strokeStyle = \"#F2F4F8\"; ctx.lineWidth = 4; ctx.lineCap = \"round\";\n  ctx.beginPath(); ctx.moveTo(0, -88); ctx.lineTo(0, -104); ctx.stroke();\n  ctx.fillStyle = \"#FFFFFF\"; ctx.strokeStyle = \"#D0D6E2\"; ctx.lineWidth = 1;\n  ctx.beginPath(); ctx.arc(0, -106, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();\n  ctx.restore();\n}\nfunction 圆角矩形(x, y, w, h, r) {\n  r = Math.min(r, w / 2, h / 2);\n  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);\n  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); ctx.fill();\n}\nfunction 画表情(文字, x, y, 大小) {\n  ctx.font = 大小 + 'px \"Apple Color Emoji\",\"Segoe UI Emoji\",\"Noto Color Emoji\",sans-serif';\n  ctx.fillStyle = \"#000\"; ctx.textAlign = \"center\"; ctx.textBaseline = \"middle\"; ctx.fillText(文字, x, y);\n}\nfunction 画文字(文字, x, y, 大小, 颜色, 对齐) {\n  ctx.fillStyle = 颜色; ctx.font = \"bold \" + 大小 + 'px \"PingFang SC\",\"Microsoft YaHei\",sans-serif';\n  ctx.textAlign = 对齐 || \"center\"; ctx.textBaseline = \"middle\"; ctx.fillText(文字, x, y);\n}\nfunction 画电量() {\n  const x = W / 2 - 130, y = 22, w = 260, h = 36;\n  ctx.fillStyle = \"rgba(255,255,255,0.9)\"; 圆角矩形(x, y, w, h, 12);\n  const 长度 = (w - 8) * 当前电量 / 100;\n  if (长度 > 2) { ctx.fillStyle = 当前电量 > 30 ? \"#2ECC9A\" : \"#E5484D\"; 圆角矩形(x + 4, y + 4, 长度, h - 8, 8); }\n  画文字(\"电量 \" + Math.ceil(当前电量), W / 2, y + h / 2, 22, \"#1E2A4A\");\n}\n\nfunction 画() {\n  画背景();\n  for (const 东西 of 路上) 画表情(东西.图案, 东西.x, 地面Y - 28, 58);\n  const 显示狗 = 闪烁 === 0 || Math.floor(闪烁 / 5) % 2 === 0;\n  if (显示狗) {\n    if (设置.主角 === \"比特\") 画比特(狗.x, 狗.y, 设置.主角大小);\n    else 画表情(设置.主角, 狗.x, 狗.y - 设置.主角大小 * 0.45, 设置.主角大小);\n  }\n  for (const 字 of 飘字们) {\n    ctx.globalAlpha = 字.寿命 / 45; 画文字(字.文字, 字.x, 字.y, 30, 字.颜色); 字.y -= 1.2; 字.寿命--; ctx.globalAlpha = 1;\n  }\n  飘字们 = 飘字们.filter(字 => 字.寿命 > 0);\n  const 字色 = 设置.背景 === \"白天\" ? \"#1E2A4A\" : \"#FFFFFF\";\n  if (状态 !== \"准备\") {\n    if (设置.显示分数) 画文字(\"分数 \" + 分数, 24, 40, 34, 字色, \"left\");\n    if (设置.生命 > 0) 画文字(\"生命 \" + \"♥\".repeat(Math.max(0, 剩余生命)), 24, 84, 30, \"#E5484D\", \"left\");\n    if (设置.倒计时 > 0) 画文字(\"倒计时 \" + Math.ceil(剩余时间), W - 24, 40, 34, 字色, \"right\");\n    if (设置.电量) 画电量();\n  }\n  if (状态 === \"准备\") { 画文字(\"点一下，开始跑！\", W / 2, H / 2 - 40, 52, 字色); }\n  if (状态 === \"结束\") {\n    ctx.fillStyle = \"rgba(30,42,74,0.55)\"; ctx.fillRect(0, 0, W, H);\n    画文字(结束原因 + \"！\", W / 2, H / 2 - 50, 64, \"#FFFFFF\");\n    if (设置.显示分数) 画文字(\"得分 \" + 分数, W / 2, H / 2 + 20, 44, \"#FFC93D\");\n    画文字(\"点一下，再来一次\", W / 2, H / 2 + 80, 32, \"#FFFFFF\");\n  }\n}\n\nfunction 游戏循环() { 更新(); 画(); requestAnimationFrame(游戏循环); }\n游戏循环();\n<\/script>\n<\/body>\n<\/html>\n", "比特闯关.html": "<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, user-scalable=no\">\n<title>比特闯关<\/title>\n<style>\n  html, body { margin: 0; height: 100%; background: #FFF7EC; font-family: \"PingFang SC\", \"Microsoft YaHei\", sans-serif; color: #1E2A4A; touch-action: none; -webkit-user-select: none; user-select: none; }\n  #box { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }\n  h1 { margin: 0; font-size: 28px; }\n  canvas { width: min(96vw, 160vh); max-height: 82vh; aspect-ratio: 16 / 9; border-radius: 18px; box-shadow: 0 6px 0 #F0E2CC; background: #FFF7EC; touch-action: none; }\n  p { margin: 0; color: #5B6683; font-size: 18px; }\n<\/style>\n<\/head>\n<body>\n<div id=\"box\">\n  <h1>比特闯关<\/h1>\n  <canvas id=\"game\" width=\"960\" height=\"540\"><\/canvas>\n  <p>点右边的箭头（或者按方向键），比特走一格。吃星星、躲开刺，走到狗窝 🏠 就过关<\/p>\n<\/div>\n\n<script>\n// ===== 游戏设置：想改游戏，先改这里 =====\nconst 设置 = {\n  有几条命: 3,            // 一共几条命\n  刺会扣命: true,          // 改成 false：踩到刺不扣命，也不用回起点\n  可以自己画: false,       // 改成 true：右上角出现「画关卡」按钮，可以在游戏里自己画关卡\n};\n\n// ===== 关卡地图：每一行是一串字，一个字是一格 =====\n// # 墙   . 路   S 起点   E 终点   * 星星   ^ 刺\n// 最多 8 行、14 列（多出来的不要）；短的行，后面补成墙；不认识的字当成路\nconst 地图 = [\n  \"############\",\n  \"#S...#....*#\",\n  \"####.#.##..#\",\n  \"#*...#.#^..#\",\n  \"#.####.#..##\",\n  \"#......#*.E#\",\n  \"############\",\n];\n\n// ===== 下面是游戏程序 =====\nconst canvas = document.getElementById(\"game\");\nconst ctx = canvas.getContext(\"2d\");\nconst W = canvas.width, H = canvas.height;\nconst 地图区 = { x: 20, y: 70, 宽: 640, 高: 460 };   // 地图画在左边这一块里，居中\nconst 最多几行 = 8, 最多几列 = 14;\nconst 走法 = { 上: [-1, 0], 下: [1, 0], 左: [0, -1], 右: [0, 1] };   // 往哪走：行变多少、列变多少\n// 认得的字（小写的 s、e，全角的符号也认）；别的字都当成路\nconst 认得的字 = { \"#\": \"#\", \".\": \".\", \"S\": \"S\", \"E\": \"E\", \"*\": \"*\", \"^\": \"^\", \"s\": \"S\", \"e\": \"E\", \"＃\": \"#\", \"．\": \".\", \"。\": \".\", \"Ｓ\": \"S\", \"Ｅ\": \"E\", \"＊\": \"*\", \"＾\": \"^\" };\n\nlet 当前地图 = null;      // 现在用的关卡：当前地图[行][列] 是一个字（第一次开始时从「地图」读进来；画关卡改的就是它）\nlet 地图是空的 = false;\nlet 场地 = [];            // 这一局的地图（吃掉的星星会变成路）\nlet 行数 = 0, 列数 = 0, 格子大小 = 40, 地图X = 0, 地图Y = 0;\nlet 起点 = { 行: 0, 列: 0 };\nlet 比特 = { 行: 0, 列: 0 };       // 比特在第几行、第几列\nlet 比特画在 = { 行: 0, 列: 0 };   // 画的时候慢慢滑过去\nlet 星星数 = 0, 星星总数 = 0;\nlet 命 = 3;\nlet 状态 = \"玩\";          // \"玩\"、\"过关\"、\"输了\"、\"画\"（画关卡）\nlet 画笔 = \"#\";           // 画关卡时选中的格子\nlet 按着画 = false;\nlet 帧数 = 0;\nlet 话 = \"\", 话的寿命 = 0;  // 屏幕上的一句提示\nlet 飘字们 = [];\nlet 受伤 = 0, 跳 = 0;     // 踩到刺闪一闪；走一步跳一下\n\n// 设置里写 true / false（写成 \"true\"、\"是\" 也认）；写错了用默认的\nfunction 开着(值, 默认) {\n  if (值 === true || 值 === \"true\" || 值 === \"是\") return true;\n  if (值 === false || 值 === \"false\" || 值 === \"否\") return false;\n  return 默认;\n}\nfunction 几条命() { const n = Math.round(Number(设置.有几条命)); return n >= 1 ? Math.min(n, 99) : 3; }\n\n// 把「地图」整理成整整齐齐的格子：太大的切掉，短的行补墙，不认识的字当路，起点只留第一个\nfunction 整理地图(原来的) {\n  let 行们 = Array.isArray(原来的) ? 原来的 : typeof 原来的 === \"string\" ? 原来的.split(\"\\n\") : [];\n  行们 = 行们.slice(0, 最多几行).map(行 => Array.from(Array.isArray(行) ? 行.join(\"\") : String(行 == null ? \"\" : 行)).slice(0, 最多几列));\n  while (行们.length && 行们[行们.length - 1].length === 0) 行们.pop();\n  const 宽 = Math.max(0, ...行们.map(行 => 行.length));\n  if (!宽) return [];\n  let 有起点了 = false;\n  return 行们.map(行 => {\n    const 新行 = 行.map(字 => 认得的字[字] || \".\");\n    while (新行.length < 宽) 新行.push(\"#\");\n    for (let i = 0; i < 新行.length; i++) if (新行[i] === \"S\") { if (有起点了) 新行[i] = \".\"; 有起点了 = true; }\n    return 新行;\n  });\n}\n// 地图是空的：先给一块四周是墙的空地（可以在上面画关卡）\nfunction 空白地图() {\n  const 结果 = [];\n  for (let 行 = 0; 行 < 7; 行++) { const 一行 = []; for (let 列 = 0; 列 < 12; 列++) 一行.push(行 === 0 || 列 === 0 || 行 === 6 || 列 === 11 ? \"#\" : \".\"); 结果.push(一行); }\n  return 结果;\n}\nfunction 读地图() {\n  当前地图 = 整理地图(地图);\n  地图是空的 = 当前地图.length === 0;\n  if (地图是空的) 当前地图 = 空白地图();\n}\n// 格子大小按地图大小自动算，地图在左边居中\nfunction 算大小() {\n  行数 = 当前地图.length; 列数 = 行数 ? 当前地图[0].length : 0;\n  格子大小 = 行数 ? Math.floor(Math.min(地图区.宽 / 列数, 地图区.高 / 行数, 80)) : 40;\n  地图X = 地图区.x + Math.floor((地图区.宽 - 格子大小 * 列数) / 2);\n  地图Y = 地图区.y + Math.floor((地图区.高 - 格子大小 * 行数) / 2);\n}\nfunction 数一数(字) { let n = 0; for (const 一行 of 场地) for (const 格 of 一行) if (格 === 字) n++; return n; }\n// 起点：有 S 就站在 S；没有就站在第一格路上\nfunction 找起点() {\n  for (const 要找 of [\"S\", \".\", \"不是墙\"])\n    for (let 行 = 0; 行 < 行数; 行++) for (let 列 = 0; 列 < 列数; 列++)\n      if (场地[行][列] === 要找 || (要找 === \"不是墙\" && 场地[行][列] !== \"#\")) return { 行, 列 };\n  return { 行: 0, 列: 0 };\n}\n// 从起点出发，不穿墙，能不能走到终点\nfunction 走得到终点() {\n  const 去过 = new Set([起点.行 + \",\" + 起点.列]), 要走 = [起点];\n  while (要走.length) {\n    const 这格 = 要走.shift();\n    if (场地[这格.行][这格.列] === \"E\") return true;\n    for (const 方向 in 走法) {\n      const 行 = 这格.行 + 走法[方向][0], 列 = 这格.列 + 走法[方向][1];\n      if (行 < 0 || 列 < 0 || 行 >= 行数 || 列 >= 列数 || 场地[行][列] === \"#\" || 去过.has(行 + \",\" + 列)) continue;\n      去过.add(行 + \",\" + 列); 要走.push({ 行, 列 });\n    }\n  }\n  return false;\n}\n\n// 开一局新游戏（用当前地图，从起点出发）\nfunction 开始() {\n  if (!当前地图) 读地图();\n  算大小();\n  场地 = 当前地图.map(一行 => 一行.slice());\n  起点 = 找起点();\n  比特 = { 行: 起点.行, 列: 起点.列 }; 比特画在 = { 行: 起点.行, 列: 起点.列 };\n  星星数 = 0; 星星总数 = 数一数(\"*\"); 命 = 几条命();\n  状态 = \"玩\"; 飘字们 = []; 受伤 = 0; 跳 = 0; 按着画 = false;\n  if (地图是空的) 说一句(\"地图是空的\" + (开着(设置.可以自己画, false) ? \"，点「画关卡」画一张吧\" : \"\"));\n  else if (!数一数(\"E\")) 说一句(\"地图上没有终点 E\");\n  else if (!走得到终点()) 说一句(\"从起点走不到终点，被墙堵住了\");\n}\n\n// 比特走一格\nfunction 走(方向) {\n  if (状态 !== \"玩\" || !走法[方向]) return;\n  const 行 = 比特.行 + 走法[方向][0], 列 = 比特.列 + 走法[方向][1];\n  if (行 < 0 || 列 < 0 || 行 >= 行数 || 列 >= 列数 || 场地[行][列] === \"#\") return 撞墙();\n  比特 = { 行, 列 }; 跳 = 8;\n  踩到(场地[行][列], 行, 列);\n}\nfunction 撞墙() { 飘字(\"咚\", 比特.行, 比特.列, \"#9AA3B8\"); }\n// 走到一格上，会发生什么\nfunction 踩到(字, 行, 列) {\n  if (字 === \"*\") { 星星数++; 场地[行 , 28, \"#FFFFFF\");\n}\n\n// 画一格：x、y 是左上角，s 是大小\nfunction 画格子(字, x, y, s) {\n  if (字 === \"#\") {   // 墙：圆角砖块\n    ctx.fillStyle = \"#C98559\"; 圆角矩形(x + 1, y + 1, s - 2, s - 2, s * 0.2);\n    ctx.fillStyle = \"#DE9E71\"; 圆角矩形(x + 4, y + 3, s - 8, s * 0.3, s * 0.12);\n    ctx.strokeStyle = \"rgba(110,60,30,0.35)\"; ctx.lineWidth = 2;\n    ctx.beginPath();\n    ctx.moveTo(x + 5, y + s * 0.56); ctx.lineTo(x + s - 5, y + s * 0.56);\n    ctx.moveTo(x + s * 0.5, y + s * 0.56); ctx.lineTo(x + s * 0.5, y + s - 4);\n    ctx.stroke();\n    return;\n  }\n  ctx.fillStyle = 字 === \"^\" ? \"#FFE6E1\" : \"#FFFDF7\"; 圆角矩形(x + 2, y + 2, s - 4, s - 4, s * 0.2);\n  const cx = x + s / 2, cy = y + s / 2;\n  if (字 === \"S\") {   // 起点：绿圈 + 小旗\n    ctx.strokeStyle = \"#2ECC9A\"; ctx.lineWidth = Math.max(3, s * 0.07);\n    ctx.beginPath(); ctx.arc(cx, cy, s * 0.36, 0, Math.PI * 2); ctx.stroke();\n    ctx.strokeStyle = \"#1E2A4A\"; ctx.lineWidth = Math.max(2, s * 0.04);\n    ctx.beginPath(); ctx.moveTo(cx - s * 0.08, cy + s * 0.2); ctx.lineTo(cx - s * 0.08, cy - s * 0.22); ctx.stroke();\n    ctx.fillStyle = \"#2ECC9A\";\n    ctx.beginPath(); ctx.moveTo(cx - s * 0.08, cy - s * 0.22); ctx.lineTo(cx + s * 0.2, cy - s * 0.12); ctx.lineTo(cx - s * 0.08, cy - s * 0.02); ctx.closePath(); ctx.fill();\n  } else if (字 === \"E\") {   // 终点：狗窝\n    ctx.fillStyle = \"#FFF0B8\"; ctx.beginPath(); ctx.arc(cx, cy, s * 0.4, 0, Math.PI * 2); ctx.fill();\n    画表情(\"🏠\", cx, cy, s * 0.7);\n  } else if (字 === \"*\") {\n    画表情(\"⭐\", cx, cy + Math.sin(帧数 / 12 + x / 50) * s * 0.05, s * 0.62);\n  } else if (字 === \"^\") {   // 刺：三根红色尖尖\n    ctx.fillStyle = \"#E5484D\";\n    for (let i = 0; i < 3; i++) {\n      const 左 = x + s * (0.14 + i * 0.24);\n      ctx.beginPath(); ctx.moveTo(左, y + s * 0.78); ctx.lineTo(左 + s * 0.12, y + s * 0.24); ctx.lineTo(左 + s * 0.24, y + s * 0.78); ctx.closePath(); ctx.fill();\n    }\n    ctx.fillStyle = \"#B8323A\"; ctx.fillRect(x + s * 0.12, y + s * 0.76, s * 0.76, s * 0.08);\n  }\n}\nfunction 画地图(格子们) {\n  if (!行数) return;\n  ctx.fillStyle = \"#F1E1C4\"; 圆角矩形(地图X - 8, 地图Y - 8, 列数 * 格子大小 + 16, 行数 * 格子大小 + 16, 16);\n  for (let 行 = 0; 行 < 行数; 行++) for (let 列 = 0; 列 < 列数; 列++) 画格子(格子们[行][列], 地图X + 列 * 格子大小, 地图Y + 行 * 格子大小, 格子大小);\n}\n// 比特：机器小狗，头上有根天线\nfunction 画比特形象(x, y, 大小) {\n  const s = 大小 / 100;\n  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);\n  // 影子\n  ctx.fillStyle = \"rgba(36,48,94,.16)\"; ctx.beginPath(); ctx.ellipse(0, 54, 40, 6, 0, 0, Math.PI * 2); ctx.fill();\n  // 后腿\n  ctx.fillStyle = \"#F4F6FA\"; ctx.strokeStyle = \"#C5CCD8\"; ctx.lineWidth = 1.5;\n  [[-28, 20], [28, 20]].forEach(([lx, ly]) => { 圆角矩形(lx - 8, ly, 16, 26, 8); });\n  ctx.fillStyle = \"#FF8A3D\";\n  [[-28, 42], [28, 42]].forEach(([lx, ly]) => { 圆角矩形(lx - 10, ly, 20, 12, 5); });\n  // 尾巴\n  ctx.strokeStyle = \"#FF8A3D\"; ctx.lineWidth = 9; ctx.lineCap = \"round\";\n  ctx.beginPath(); ctx.moveTo(26, 8); ctx.quadraticCurveTo(44, 14, 40, 30); ctx.stroke();\n  // 身体\n  ctx.fillStyle = \"#F4F6FA\"; 圆角矩形(-34, -18, 68, 56, 22);\n  ctx.strokeStyle = \"#C5CCD8\"; ctx.lineWidth = 2; ctx.beginPath();\n  (function(x,y,w,h,r){ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();})(-34,-18,68,56,22); ctx.stroke();\n  // 橙心 <\/>\n  ctx.fillStyle = \"#FF8A3D\";\n  ctx.beginPath();\n  ctx.moveTo(0, 22); ctx.bezierCurveTo(-18, 8, -26, -4, -16, -12); ctx.bezierCurveTo(-10, -16, -4, -12, 0, -6);\n  ctx.bezierCurveTo(4, -12, 10, -16, 16, -12); ctx.bezierCurveTo(26, -4, 18, 8, 0, 22);\n  ctx.fill();\n  ctx.strokeStyle = \"#fff\"; ctx.lineWidth = 2.4; ctx.lineCap = \"round\"; ctx.lineJoin = \"round\";\n  ctx.beginPath(); ctx.moveTo(-9, -14); ctx.lineTo(-15, -8); ctx.lineTo(-9, -2); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(-2.5, -14); ctx.lineTo(2.5, -2); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(9, -14); ctx.lineTo(15, -8); ctx.lineTo(9, -2); ctx.stroke();\n  // 前腿\n  ctx.fillStyle = \"#F4F6FA\";\n  [[-16, 24], [16, 24]].forEach(([lx, ly]) => { 圆角矩形(lx - 7, ly, 14, 24, 7); });\n  ctx.fillStyle = \"#FF8A3D\";\n  [[-16, 44], [16, 44]].forEach(([lx, ly]) => { 圆角矩形(lx - 9, ly, 18, 11, 5); });\n  // 垂耳：从头两侧下垂的胶囊耳（正旋转=下垂；负旋转会变成翅耳）\n  ctx.fillStyle = \"#FF8A3D\";\n  ctx.beginPath(); ctx.ellipse(-48, -48, 13, 30, 0.35, 0, Math.PI * 2); ctx.fill();\n  ctx.beginPath(); ctx.ellipse(48, -48, 13, 30, -0.35, 0, Math.PI * 2); ctx.fill();\n  ctx.fillStyle = \"#FFC08A\";\n  ctx.beginPath(); ctx.ellipse(-48, -46, 6, 18, 0.35, 0, Math.PI * 2); ctx.fill();\n  ctx.beginPath(); ctx.ellipse(48, -46, 6, 18, -0.35, 0, Math.PI * 2); ctx.fill();\n  // 头\n  ctx.fillStyle = \"#F4F6FA\"; 圆角矩形(-40, -88, 80, 72, 30);\n  ctx.strokeStyle = \"#C5CCD8\"; ctx.lineWidth = 2; ctx.beginPath();\n  (function(x,y,w,h,r){ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();})(-40,-88,80,72,30); ctx.stroke();\n  ctx.fillStyle = \"rgba(255,255,255,.55)\"; ctx.beginPath(); ctx.ellipse(-14, -70, 16, 8, -0.3, 0, Math.PI * 2); ctx.fill();\n  // 黑面罩\n  ctx.fillStyle = \"#141820\"; ctx.beginPath(); ctx.ellipse(0, -52, 28, 22, 0, 0, Math.PI * 2); ctx.fill();\n  // 四角星星眼 ✦\n  ctx.fillStyle = \"#5BE0FF\";\n  for (const [ex, ey] of [[-12, -54], [12, -54]]) {\n    ctx.beginPath();\n    const outer = 9, inner = 9 * 0.38;\n    for (let i = 0; i < 8; i++) {\n      const a = -Math.PI / 2 + i * Math.PI / 4;\n      const rad = i % 2 === 0 ? outer : inner;\n      const x = ex + Math.cos(a) * rad, y = ey + Math.sin(a) * rad;\n      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);\n    }\n    ctx.closePath(); ctx.fill();\n  }\n  // 像素小嘴\n  [[-5, -40], [-1, -38], [3, -40]].forEach(([mx, my]) => { 圆角矩形(mx, my, 2.6, 2.2, 0.4); });\n  // 天线：橙底座 + 白杆 + 白球\n  ctx.fillStyle = \"#FF8A3D\"; ctx.beginPath(); ctx.ellipse(0, -88, 7, 4, 0, 0, Math.PI * 2); ctx.fill();\n  ctx.strokeStyle = \"#F2F4F8\"; ctx.lineWidth = 4; ctx.lineCap = \"round\";\n  ctx.beginPath(); ctx.moveTo(0, -88); ctx.lineTo(0, -104); ctx.stroke();\n  ctx.fillStyle = \"#FFFFFF\"; ctx.strokeStyle = \"#D0D6E2\"; ctx.lineWidth = 1;\n  ctx.beginPath(); ctx.arc(0, -106, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();\n  ctx.restore();\n}\n\nfunction 画比特() {\n  const s = 格子大小;\n  比特画在.行 += (比特.行 - 比特画在.行) * 0.35; 比特画在.列 += (比特.列 - 比特画在.列) * 0.35;\n  if (受伤 > 0) { 受伤--; if (Math.floor(受伤 / 5) % 2) return; }\n  const 跳高 = 跳 > 0 ? Math.sin(跳 / 8 * Math.PI) * s * 0.15 : 0;\n  if (跳 > 0) 跳--;\n  const cx = 地图X + 比特画在.列 * s + s / 2, cy = 地图Y + 比特画在.行 * s + s / 2 - 跳高;\n  画比特形象(cx, cy, s * 0.78);\n}\n// 顶上：星星、命\nfunction 画顶上() {\n  if (状态 === \"画\") { 画文字(\"画关卡：先选右边的格子，再点地图上的格子\", 340, 36, 24, \"#1E2A4A\"); return; }\n  ctx.fillStyle = \"#FFFFFF\"; 圆角矩形(30, 12, 250, 48, 24); 圆角矩形(300, 12, 340, 48, 24);\n  画表情(\"⭐\", 64, 36, 28); 画文字(\"星星 \" + 星星数 + \" / \" + 星星总数, 168, 37, 26, \"#1E2A4A\");\n  画文字(\"命\", 336, 37, 26, \"#1E2A4A\");\n  const 一共 = 几条命();\n  if (一共 <= 8) for (let i = 0; i < 一共; i++) 画表情(i < 命 ? \"❤️\" : \"🤍\", 376 + i * 32, 36, 24);\n  else { 画表情(\"❤️\", 380, 36, 24); 画文字(\"× \" + 命, 430, 37, 26, \"#1E2A4A\"); }\n}\n// 右边：方向按钮；画关卡时是格子种类和「试玩」\nfunction 画右边() {\n  if (状态 === \"画\") {\n    画文字(\"画关卡\", 810, 46, 32, \"#1E2A4A\");\n    画文字(\"选一种格子\", 810, 94, 22, \"#5B6683\");\n    for (const 种 of 格子种类) {\n      const 选中 = 种.字 === 画笔;\n      ctx.fillStyle = 选中 ? \"#FF8A3D\" : \"#E2CDA8\"; 圆角矩形(种.x - 56, 种.y - 42, 112, 84, 18);\n      ctx.fillStyle = 选中 ? \"#FFF3E6\" : \"#FFFFFF\"; 圆角矩形(种.x - 52, 种.y - 38, 104, 76, 15);\n      ctx.fillStyle = \"#F1E1C4\"; 圆角矩形(种.x - 50, 种.y - 24, 48, 48, 10);\n      画格子(种.字, 种.x - 48, 种.y - 22, 44);\n      画文字(种.叫, 种.x + 24, 种.y, 种.叫.length > 1 ? 22 : 26, \"#1E2A4A\");\n    }\n    画按钮(试玩按钮, \"试玩\", \"#2ECC9A\");\n    return;\n  }\n  if (开着(设置.可以自己画, false)) 画按钮(画关卡按钮, \"画关卡\", \"#4C7DFF\");\n  for (const b of 方向按钮们) {\n    ctx.fillStyle = \"#FFFFFF\"; ctx.beginPath(); ctx.arc(b.x, b.y, 44, 0, Math.PI * 2); ctx.fill();\n    ctx.strokeStyle = \"#E2CDA8\"; ctx.lineWidth = 4; ctx.stroke();\n    画文字(b.字, b.x, b.y, 30, \"#FF8A3D\");\n  }\n  画文字(\"走到 🏠 就过关\", 810, 500, 22, \"#5B6683\");\n}\n// 过关、输了：盖一块牌子，下面是「再来一次」\nfunction 画结果() {\n  const cx = 地图区.x + 地图区.宽 / 2, cy = 地图区.y + 地图区.高 / 2;\n  ctx.fillStyle = \"rgba(255,247,236,0.75)\"; 圆角矩形(地图区.x, 地图区.y, 地图区.宽, 地图区.高, 18);\n  ctx.fillStyle = \"#F0E2CC\"; 圆角矩形(cx - 220, cy - 124, 440, 262, 26);\n  ctx.fillStyle = \"#FFFFFF\"; 圆角矩形(cx - 220, cy - 130, 440, 260, 26);\n  if (状态 === \"过关\") { 画文字(\"过关！\", cx, cy - 82, 50, \"#18A87C\"); 画文字(\"吃到 \" + 星星数 + \" 颗星\", cx, cy - 32, 28, \"#1E2A4A\"); }\n  else { 画文字(\"命没了\", cx, cy - 82, 50, \"#E5484D\"); 画文字(\"吃到 \" + 星星数 + \" 颗星，再试一次吧\", cx, cy - 32, 26, \"#5B6683\"); }\n  const 画几颗 = Math.min(星星总数, 8);\n  for (let i = 0; i < 画几颗; i++) {\n    ctx.globalAlpha = i < 星星数 ? 1 : 0.25;\n    画表情(\"⭐\", cx + (i - (画几颗 - 1) / 2) * 40, cy + 16, 32);\n    ctx.globalAlpha = 1;\n  }\n  画按钮(再来按钮, \"再来一次\", \"#FF8A3D\");\n}\n\n// 每一帧都会运行一次\nfunction 游戏循环() {\n  帧数++;\n  ctx.fillStyle = \"#FFF7EC\"; ctx.fillRect(0, 0, W, H);\n  画地图(状态 === \"画\" ? 当前地图 : 场地);\n  if (状态 !== \"画\") 画比特();\n\n  // 飘字\n  for (const 字 of 飘字们) {\n    ctx.globalAlpha = 字.寿命 / 40; 画文字(字.文字, 字.x, 字.y, 30, 字.颜色); 字.y -= 1.2; 字.寿命--; ctx.globalAlpha = 1;\n  }\n  飘字们 = 飘字们.filter(字 => 字.寿命 > 0);\n\n  画顶上();\n  画右边();\n  if (状态 === \"过关\" || 状态 === \"输了\") 画结果();\n\n  // 一句提示\n  if (话的寿命 > 0) {\n    话的寿命--;\n    ctx.globalAlpha = Math.min(1, 话的寿命 / 30);\n    ctx.fillStyle = \"rgba(255,255,255,0.94)\"; 圆角矩形(地图区.x + 50, 地图区.y + 6, 地图区.宽 - 100, 56, 18);\n    画文字(话, 地图区.x + 地图区.宽 / 2, 地图区.y + 34, 26, \"#1E2A4A\");\n    ctx.globalAlpha = 1;\n  }\n\n  requestAnimationFrame(游戏循环);\n}\n开始();\n游戏循环();\n<\/script>\n<\/body>\n<\/html>\n", "空白游戏.html": "<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, user-scalable=no\">\n<title>我的新游戏<\/title>\n<style>\n  html, body { margin: 0; height: 100%; background: #FFF7EC; font-family: \"PingFang SC\", \"Microsoft YaHei\", sans-serif; color: #1E2A4A; touch-action: manipulation; }\n  #box { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }\n  h1 { margin: 0; font-size: 28px; }\n  canvas { width: min(96vw, 160vh); max-height: 82vh; aspect-ratio: 16 / 9; border-radius: 18px; box-shadow: 0 6px 0 #F0E2CC; background: #FFFFFF; }\n  p { margin: 0; color: #5B6683; font-size: 18px; }\n<\/style>\n<\/head>\n<body>\n<div id=\"box\">\n  <h1>我的新游戏<\/h1>\n  <canvas id=\"game\" width=\"960\" height=\"540\"><\/canvas>\n  <p>这里还什么都没有<\/p>\n<\/div>\n<script>\n// ===== 这是一个空白游戏 =====\n// 告诉代码精灵你想做什么游戏：叫什么名字、怎么玩、怎么得分、什么时候结束。\nconst canvas = document.getElementById(\"game\");\nconst ctx = canvas.getContext(\"2d\");\nconst W = canvas.width, H = canvas.height;\nlet 帧数 = 0;\nfunction 游戏循环() {\n  帧数++;\n  ctx.fillStyle = \"#FFFFFF\"; ctx.fillRect(0, 0, W, H);\n  ctx.fillStyle = \"#1E2A4A\"; ctx.textAlign = \"center\"; ctx.textBaseline = \"middle\";\n  ctx.font = 'bold 44px \"PingFang SC\",\"Microsoft YaHei\",sans-serif';\n  ctx.fillText(\"说出你想做的游戏\", W / 2, H / 2 - 30);\n  ctx.font = '28px \"PingFang SC\",\"Microsoft YaHei\",sans-serif'; ctx.fillStyle = \"#5B6683\";\n  ctx.fillText(\"代码精灵会帮你做出来\", W / 2, H / 2 + 30);\n  ctx.font = '60px \"Apple Color Emoji\",\"Segoe UI Emoji\",\"Noto Color Emoji\",sans-serif';\n  ctx.fillText(\"✨\", W / 2 + Math.sin(帧数 / 20) * 200, H / 2 + 120);\n  requestAnimationFrame(游戏循环);\n}\n游戏循环();\n<\/script>\n<\/body>\n<\/html>\n", "贪吃蛇.html": "<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, user-scalable=no\">\n<title>贪吃蛇<\/title>\n<style>\n  html, body { margin: 0; height: 100%; background: #FFF7EC; font-family: \"PingFang SC\", \"Microsoft YaHei\", sans-serif; color: #1E2A4A; touch-action: none; }\n  #box { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }\n  h1 { margin: 0; font-size: 28px; }\n  canvas { width: min(96vw, 160vh); max-height: 82vh; aspect-ratio: 16 / 9; border-radius: 18px; box-shadow: 0 6px 0 #F0E2CC; background: #FFF7EC; }\n  p { margin: 0; color: #5B6683; font-size: 18px; }\n<\/style>\n<\/head>\n<body>\n<div id=\"box\">\n  <h1>贪吃蛇<\/h1>\n  <canvas id=\"game\" width=\"960\" height=\"540\"><\/canvas>\n  <p>点右边的箭头，或者按方向键，带蛇去吃东西<\/p>\n<\/div>\n\n<script>\n// ===== 游戏设置：想改游戏，先改这里 =====\nconst 设置 = {\n  格子数: 10,            // 地图有几行、几列\n  走一格要几帧: 24,       // 数字越大，蛇走得越慢\n  一开始几格长: 3,        // 蛇一开始有几格\n  蛇的颜色: \"#2ECC9A\",   // 蛇身的颜色\n  背景颜色: \"#BDE6FF\",   // 地图的颜色\n  撞墙会输: true,         // 改成 false：从墙这边钻进去，从另一边出来\n};\n\n// ===== 地图上会出现的食物：吃到会怎样，写在这里 =====\n// 加几分：吃到加几分\n// 出现机会：数字越大，越常出现\nconst 食物们 = [\n  { 名字: \"苹果\", 图案: \"🍎\", 加几分: 1, 出现机会: 1 },\n];\n\n// ===== 下面是游戏程序 =====\nconst canvas = document.getElementById(\"game\");\nconst ctx = canvas.getContext(\"2d\");\nconst W = canvas.width, H = canvas.height;\nconst 格子大小 = Math.floor(500 / 设置.格子数);\nconst 地图X = 40, 地图Y = Math.floor((H - 格子大小 * 设置.格子数) / 2);\nconst 上下 = { 上: -1, 下: 1, 左: 0, 右: 0 };\nconst 左右 = { 上: 0, 下: 0, 左: -1, 右: 1 };\nconst 反方向 = { 上: \"下\", 下: \"上\", 左: \"右\", 右: \"左\" };\n\nlet 蛇身 = [];            // 蛇的身体：一串排好队的格子，第一个是头\nlet 方向 = \"右\", 下一个方向 = \"右\";\nlet 食物 = null;          // 现在地图上的食物：{ 行, 列, 东西 }\nlet 分数 = 0;\nlet 状态 = \"玩\";          // \"玩\" 或 \"输了\"\nlet 帧数 = 0;\nlet 话 = \"\", 话的寿命 = 0;  // 屏幕上的一句提示\nlet 飘字们 = [];\n\n// 开一局新游戏\nfunction 开始() {\n  蛇身 = [];\n  for (let i = 0; i < 设置.一开始几格长; i++) 蛇身.push({ 行: Math.floor(设置.格子数 / 2), 列: 3 - i });\n  方向 = \"右\"; 下一个方向 = \"右\"; 分数 = 0; 状态 = \"玩\"; 飘字们 = [];\n  放食物();\n}\n\n// 按\"出现机会\"随机挑一种食物，放在空格子上\nfunction 放食物() {\n  let 总数 = 0;\n  for (const 东西 of 食物们) 总数 += 东西.出现机会 || 1;\n  let 随机 = Math.random() * 总数, 选中 = 食物们[0];\n  for (const 东西 of 食物们) { 随机 -= 东西.出现机会 || 1; if (随机 <= 0) { 选 0; }\nfunction 飘字(文字, 行, 列, 颜色) { 飘字们.push({ 文字, x: 地图X + 列 * 格子大小 + 格子大小 / 2, y: 地图Y + 行 * 格子大小, 颜色, 寿命: 40 }); }\nfunction 圆角矩形(x, y, w, h, r) {\n  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);\n  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); ctx.fill();\n}\nfunction 画表情(文字, x, y, 大小) {\n  ctx.font = 大小 + 'px \"Apple Color Emoji\",\"Segoe UI Emoji\",\"Noto Color Emoji\",sans-serif';\n  ctx.fillStyle = \"#000\"; ctx.textAlign = \"center\"; ctx.textBaseline = \"middle\"; ctx.fillText(文字, x, y);\n}\nfunction 画文字(文字, x, y, 大小, 颜色) {\n  ctx.fillStyle = 颜色; ctx.font = \"bold \" + 大小 + 'px \"PingFang SC\",\"Microsoft YaHei\",sans-serif';\n  ctx.textAlign = \"center\"; ctx.textBaseline = \"middle\"; ctx.fillText(文字, x, y);\n}\n\n// 每一帧都会运行一次\nfunction 游戏循环() {\n  帧数++;\n  if (状态 === \"玩\" && 帧数 % 走一格的间隔() === 0) 走一步();\n\n  // 地图\n  ctx.fillStyle = \"#FFF7EC\"; ctx.fillRect(0, 0, W, H);\n  ctx.fillStyle = 设置.背景颜色; 圆角矩形(地图X - 6, 地图Y - 6, 格子大小 * 设置.格子数 + 12, 格子大小 * 设置.格子数 + 12, 14);\n  ctx.strokeStyle = \"rgba(30,42,74,0.08)\"; ctx.lineWidth = 2;\n  for (let i = 1; i < 设置.格子数; i++) {\n    ctx.beginPath(); ctx.moveTo(地图X + i * 格子大小, 地图Y); ctx.lineTo(地图X + i * 格子大小, 地图Y + 设置.格子数 * 格子大小); ctx.stroke();\n    ctx.beginPath(); ctx.moveTo(地图X, 地图Y + i * 格子大小); ctx.lineTo(地图X + 设置.格子数 * 格子大小, 地图Y + i * 格子大小); ctx.stroke();\n  }\n\n  // 食物\n  if (食物) 画表情(食物.东西.图案, 地图X + 食物.列 * 格子大小 + 格子大小 / 2, 地图Y + 食物.行 * 格子大小 + 格子大小 / 2, 格子大小 * 0.8);\n\n  // 蛇：从尾巴画到头，头上戴一顶小帽子\n  for (let i = 蛇身.length - 1; i >= 0; i--) {\n    const 节 = 蛇身[i], x = 地图X + 节.列 * 格子大小, y = 地图Y + 节.行 * 格子大小;\n    ctx.fillStyle = i === 0 ? \"#1E2A4A\" : 设置.蛇的颜色;\n    圆角矩形(x + 3, y + 3, 格子大小 - 6, 格子大小 - 6, 12);\n    if (i === 0) {\n      ctx.fillStyle = \"#5BE0FF\";\n      ctx.beginPath(); ctx.arc(x + 格子大小 * 0.35, y + 格子大小 * 0.45, 5, 0, Math.PI * 2); ctx.arc(x + 格子大小 * 0.65, y + 格子大小 * 0.45, 5, 0, Math.PI * 2); ctx.fill();\n      ctx.fillStyle = \"#FFC93D\";\n      ctx.beginPath(); ctx.moveTo(x + 格子大小 * 0.3, y + 6); ctx.lineTo(x + 格子大小 * 0.5, y - 12); ctx.lineTo(x + 格子大小 * 0.7, y + 6); ctx.closePath(); ctx.fill();\n    }\n  }\n\n  // 飘字\n  for (const 字 of 飘字们) {\n    ctx.globalAlpha = 字.寿命 / 40; 画文字(字.文字, 字.x, 字.y, 30, 字.颜色); 字.y -= 1.2; 字.寿命--; ctx.globalAlpha = 1;\n  }\n  飘字们 = 飘字们.filter(字 => 字.寿命 > 0);\n\n  // 右边：分数、蛇有几格长、箭头\n  画文字(\"分数 \" + 分数, 760, 50, 34, \"#1E2A4A\");\n  画文字(\"蛇有 \" + 蛇身.length + \" 格长\", 760, 100, 26, \"#5B6683\");\n  for (const b of 按钮们) {\n    ctx.fillStyle = \"#FFFFFF\"; ctx.beginPath(); ctx.arc(b.x, b.y, 44, 0, Math.PI * 2); ctx.fill();\n    ctx.strokeStyle = \"#E2CDA8\"; ctx.lineWidth = 4; ctx.stroke();\n    画文字(b.字, b.x, b.y, 30, \"#FF8A3D\");\n  }\n  if (状态 === \"输了\") {\n    ctx.fillStyle = \"#FF8A3D\"; 圆角矩形(再来按钮.x - 再来按钮.宽 / 2, 再来按钮.y - 再来按钮.高 / 2, 再来按钮.宽, 再来按钮.高, 20);\n    画文字(\"再来一局\", 再来按钮.x, 再来按钮.y, 28, \"#FFFFFF\");\n  }\n\n  // 一句提示\n  if (话的寿命 > 0) {\n    话的寿命--;\n    ctx.globalAlpha = Math.min(1, 话的寿命 / 30);\n    ctx.fillStyle = \"rgba(255,255,255,0.92)\"; 圆角矩形(地图X + 40, 地图Y + 20, 格子大小 * 设置.格子数 - 80, 56, 18);\n    画文字(话, 地图X + 格子大小 * 设置.格子数 / 2, 地图Y + 48, 26, \"#1E2A4A\");\n    ctx.globalAlpha = 1;\n  }\n\n  requestAnimationFrame(游戏循环);\n}\n开始();\n游戏循环();\n<\/script>\n<\/body>\n<\/html>\n"};

          $('#dsay', el).textContent = a.a;
          if (!SC.mini) speakScreen(a.a, c.voice);
          token.stop = true; await sleep(30); token = { stop: false };
          if (a.acts && a.acts.length) playSeq(bit, a.acts, '开心', null, token); else { bit.classList.add('say'); setTimeout(() => bit.classList.remove('say'), 1500); }

      },

  duel(s, L, el, X) {
    const left = s.target ? `<div class="duel-tg"><div class="ml" style="background:${C.orange}">目标</div><canvas></canvas></div>`
      : `<div class="duel-big"><div class="k">${esc(s.bigLabel || '')}</div><div class="v">${esc(s.big)}</div><div class="k" id="phase" style="margin-top:12px"></div></div>`;

            ${SC.canCtl ? `<button class="btn sm dwin" data-t="o">${esc(tn('o'))}赢 +2</button><button class="btn sm blue dwin" data-t="b">${esc(tn('b'))}赢 +2</button>` : ''}</div>
        </div></div>`;
    let G = null;

    const sw = $('#swap', el); if (sw) sw.onclick = () => X.ctl({ type: 'balance.swap' });
    $$('.dwin', el).forEach(b => b.onclick = () => X.ctl({ type: 'duel.award', t: b.dataset.t }));
    const upd = () => {
      const d = sdata(), aw = d.awarded || {};
      const total = t => roster().filter(r => r.team === t).length;
      let html = '';
      if (s.kind === 'report') {
        const b = d.report || { hit: { o: 0, b: 0 }, total: { o: 0, b: 0 } };
        html = ['o', 'b'].map(t => progressRow(`${esc(tn(t))}${esc(s.report.hitLabel || '做得好')}`, t, b.hit[t], b.total[t] || total(t))).join('');
        const ph = $('#phase', el); if (ph) ph.textContent = d.phase === 'swap' ? `已交换：玩对方的游戏，报结果（已报 ${b.reported || 0} 人）` : '先检查自己的游戏';

      } else {

    };

  quiz(s, L, el, X) {

    const optsH = `<div class="opts ${s.engine || s.show ? 'one' : s.hints ? 'sm' : ''}">${s.opts.map((o, i) => `<div class="opt ${Ls[i]}" data-i="${i}"><div class="L">${Ls[i]}</div><span class="grow">${esc(o)}</span><b class="cnt"></b></div>`).join('')}</div>`;
    const head = `<div class="row" style="align-items:center;gap:16px"><span class="tag">${s.badge ? esc(s.badge) : '在平板上选'}</span><span class="sm">${esc(s.note || (s.hints ? '线索一张张翻开，越早猜对越厉害 · 全队过半答对 +1 能量' : '每队商量 10 秒，再每人在平板上选 · 全队过半答对 +1 能量'))}</span><span class="grow"></span><span class="tag" id="qn" style="font-size:28px"></span>${ctlBtn('rv', '揭晓', 'green')}</div>`;
    const explain = s.explain ? `<div class="sentence qexp" id="qexp" style="display:none;font-size:30px;padding:12px 24px;margin-top:16px">${svgSize(IC.wand, 44)}<span>${esc(s.explain)}</span></div>` : '';
    if (s.engine) {
      el.innerHTML = `${head}<div class="row grow" style="gap:28px;margin-top:14px;min-height:0;align-items:flex-start">
        <div style="width:720px;flex:none"><div class="gamebox"><canvas></canvas><div class="gamehint">${esc(s.gameLabel || '看比特碰到了什么')}</div></div></div>
        <div class="col grow" style="min-width:0;gap:10px"><h2 class="t2" style="margin:0;font-size:${s.q.length > 12 ? 38 : 46}px;line-height:1.25">${esc(s.q)}</h2>${optsH}${explain.replace('margin-top:16px', 'margin-top:4px;font-size:26px')}<div id="qres" class="row" style="gap:12px;justify-content:center;flex-wrap:wrap"></div></div></div>`;
    } else if (s.show) {   // 第二季：左边给大家看精灵的计划、怪兽的样子、代码……
      el.innerHTML = `${head}<div class="row grow" style="gap:30px;margin-top:14px;min-height:0;align-items:flex-start">
        <div style="width:${s.showW || 640}px;flex:none;--qs-font:30px;max-height:100%;overflow:auto">${quizShowHTML(s.show)}</div>
        <div class="col grow" style="min-width:0;gap:10px"><h2 class="t2" style="margin:0;font-size:${s.q.length > 18 ? 38 : 46}px;line-height:1.25">${esc(s.q)}</h2>${optsH}${explain.replace('margin-top:16px', 'margin-top:4px;font-size:26px')}<div id="qres" class="row" style="gap:12px;justify-content:center;flex-wrap:wrap"></div></div></div>`;
    } else {
      el.innerHTML = `${head}<h2 class="t2" style="margin:14px 0 ${s.hints ? 14 : 20}px">${esc(s.q)}</h2>${hints}${optsH}${explain}
      <div id="qres" class="row" style="gap:20px;margin-top:${s.hints ? 14 : 22}px;justify-content:center"></div>`;
    }
    const G = s.engine ? ENGINES[s.engine]($('canvas', el), Object.assign({ auto: true }, s.preset || {})) : null;
    const rv = $('#rv', el); if (rv) rv.onclick = () => X.ctl({ type: 'quiz.reveal' });
    if (SC.canCtl) $$('.hintc', el).forEach(h => h.onclick = () => { if (h.classList.contains('off')) X.ctl({ type: 'cue', n: 'reveal', a: +h.dataset.h }); });
    let shown = false;
    const upd = (v, fromCue) => {
      const q = (sdata().quiz) || { answered: 0, revealed: false };
      $('#qn', el).textContent = SC.standalone ? '' : `已答 ${q.answered} / ${roster().length}`;
      if (q.revealed && !shown) {
        shown = true;
        $$('.opt', el).forEach(x => { const j = +x.dataset.i; if (s.ans != null) { x.classList.toggle('right', j === s.ans); x.classList.toggle('dim', j !== s.ans); } if (q.counts) $('.cnt', x).textContent = q.counts[j] + ' 人'; });
        $$('.hintc', el).forEach(h => h.classList.remove('off'));
        const ex = $('#qexp', el); if (ex) ex.style.display = 'flex';
        if (q.res) $('#qres', el).innerHTML = ['o', 'b'].map(t => { const r = q.res[t]; return r && r.n ? `<div class="tag" style="font-size:30px;padding:10px 22px;background:${r.pass ? C.green + '22' : '#eee'}">${esc(tn(t))}：${r.right}/${r.n} 答对${r.pass ? ' · +1' : ''}</div>` : ''; }).join('');
        if (fromCue !== 'replay') s.ans != null ? Snd.ding() : Snd.pop();
      }
      if (!q.revealed && shown) { shown = false; $$('.opt', el).forEach(x => { x.classList.remove('right', 'dim'); $('.cnt', x).textContent = ''; }); $('#qres', el).innerHTML = ''; const ex = $('#qexp', el); if (ex) ex.style.display = 'none'; }
    };
    upd(null, 'replay');
    return {
      upd, off() { if (G) G.destroy(); },
      cue(c, replay) {
        if (c.n === 'reveal') { const h = $(`.hintc[data-h="${c.a}"]`, el); if (h && h.classList.contains('off')) { h.classList.remove('off'); if (!replay) { h.style.animation = 'none'; void h.offsetWidth; h.style.animation = 'popIn .45s both'; Snd.pop(); } } }
        if (c.n === 'reset') { $$('.hintc', el).forEach(h => h.classList.add('off')); }

    };

  dance(s, L, el, X) {
    const mode = s.mode;
    let seq = (s.seq || []).slice(), loops = 1, mood = '开心', token = { stop: true }, shown = mode === 'follow' ? seq : [];
    const right = mode === 'follow'
      ? (SC.canCtl ? `<div class="acts">${ACTS.map(a => `<button class="act" data-a="${a}">${a}</button>`).join('')}</div>` : '<div class="sm">孩子说动作，老师在老师端排</div>')
      : (SC.canCtl ? `<div style="font-size:30px;font-weight:900">对精灵说：</div>
        <div class="col" style="gap:12px">${s.moods.map(m => `<button class="spell" data-m="${m}">${IC.wand.replace('<svg', '<svg class="wand"')}<span>跳一段${m === '困了' ? '困困' : m}的舞</span></button>`).join('')}</div>
        <div class="row" style="gap:10px"><input class="say-in" id="sin" placeholder="把孩子说的话打在这里"><button class="btn sm" id="sgo">说</button></div>` : '<div class="chat" id="chat"></div>');
    el.innerHTML = `<div class="row" style="align-items:center;justify-content:space-between;margin-bottom:14px"><div>${s.badge ? `<span class="tag">${esc(s.badge)}</span>` : ''}
      <h2 class="t2" style="margin:${s.badge ? '10px' : '0'} 0 0">${esc(s.title)}</h2>${s.sub ? `<p class="lead" style="margin:4px 0 0;font-size:30px">${esc(s.sub)}</p>` : ''}</div>${mode === 'genie' ? '<span class="tag">精灵演示</span>' : ''}</div>
      <div class="row grow" style="gap:30px;min-height:0">
        <div class="dogstage" id="ds" style="width:560px;flex:none"><div class="floor"></div><div style="margin-bottom:56px">${bitEl(380, 'idle')}</div></div>
        <div class="col grow" style="min-height:0;gap:16px">
          <div style="font-size:28px;font-weight:900">动作顺序 <span class="term" style="font-size:22px">顺序 Sequence</span> <span class="term" style="font-size:22px">重复 = 循环 Loop</span></div>
          <div class="seq" id="seq"></div><div class="sm" id="reply" style="font-size:26px;min-height:34px"></div>
          ${right}
          <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:auto">
            <b style="font-size:28px">重复</b>${[1, 2, 3].map(n => `<button class="mood loopb" data-n="${n}" style="height:56px;font-size:26px">${n} 次</button>`).join('')}
            <span style="flex:1"></span>
            ${SC.canCtl && mode === 'follow' ? `<button class="btn ghost sm" id="clr">清空</button>` : ''}
            ${SC.canCtl ? `<button class="btn sm" id="play">${IC.play} 跳！</button>` : ''}
          </div>
        </div></div>`;
    const bit = $('#ds .bit', el);
    const drawLoops = () => $$('.loopb', el).forEach(x => x.style.background = +x.dataset.n === loops ? C.navy : '#C9B79A');
    const drawSeq = (now = -1) => { const box = $('#seq', el); box.innerHTML = shown.length ? shown.map((a, i) => `<div class="s ${i === now ? 'now' : ''}" data-i="${i}">${a}${SC.canCtl && mode === 'follow' ? ' <span style="opacity:.5">×</span>' : ''}</div>`).join('') : `<span class="ph">${mode === 'genie' ? '对精灵说一句，它会排好动作' : '点下面的动作卡，排出顺序'}</span>`; if (SC.canCtl && mode === 'follow') $$('.s', box).forEach(c => c.onclick = () => { const n = seq.slice(); n.splice(+c.dataset.i, 1); X.ctl({ type: 'cue', n: 'seq', a: { seq: n, loops } }); }); };
    const run = async (list, md) => { token.stop = true; await sleep(30); token = { stop: false }; const my = token; const full = []; for (let k = 0; k < loops; k++) full.push(...list); await playSeq(bit, full, md, i => drawSeq(i < 0 ? -1 : i % list.length), my); };
    drawSeq(); drawLoops();
    $$('.act', el).forEach(b => b.onclick = () => { if (seq.length >= 10) return; X.ctl({ type: 'cue', n: 'seq', a: { seq: seq.concat([b.dataset.a]), loops } }); });
    $$('[data-m]', el).forEach(b => b.onclick = () => SC.net.post('demo-dance', { mood: b.dataset.m }));
    const sgo = $('#sgo', el); if (sgo) { sgo.onclick = () => { const p = $('#sin', el).value.trim(); if (p) SC.net.post('demo-dance', { prompt: p }); $('#sin', el).value = ''; }; $('#sin', el).onkeydown = e => { if (e.key === 'Enter') sgo.onclick(); }; }
    $$('.loopb', el).forEach(b => b.onclick = () => { if (SC.canCtl) X.ctl({ type: 'cue', n: 'seq', a: { seq, loops: +b.dataset.n } }); });
    const clr = $('#clr', el); if (clr) clr.onclick = () => X.ctl({ type: 'cue', n: 'seq', a: { seq: [], loops } });
    const play = $('#play', el); if (play) play.onclick = () => X.ctl({ type: 'cue', n: 'play' });
    let ghost = null;
    return {
      async cue(c, replay) {
        if (c.n === 'seq') { seq = c.a.seq.slice(); loops = c.a.loops || 1; shown = seq; drawSeq(); drawLoops(); if (!replay) Snd.pop(); }
        if (c.n === 'danceThink' && !replay) { token.stop = true; if (ghost) ghost.remove(); ghost = await genieCast($('#ds', el), c.a.prompt, true); }
        if (c.n === 'dance') {
          if (ghost) { ghost.remove(); ghost = null; }
          seq = c.a.seq.slice(); mood = c.a.mood; loops = c.a.repeat || 1; shown = seq; drawSeq(); drawLoops();
          $('#reply', el).textContent = (c.a.prompt ? `「${c.a.prompt}」→ ` : `${c.a.mood}的舞 → `) + (c.a.reply || '');
          if (!replay) { if (!c.a.prompt) await genieCast($('#ds', el), `跳一段${c.a.mood}的舞`); run(seq, mood); }
        }
        if (c.n === 'play' && !replay && seq.length) run(seq, mood);
      },
      off() { token.stop = true; }
    };
  },

  countdown(s, L, el, X) {

      },
      off() { alive = false; }
    };

            <div class="row" style="gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center"><span class="sm" style="font-size:22px">下一步吃到：</span>${Object.keys(SNAKE_FOOD).map(f => `<button class="btn sm ghost" data-f="${f}">${SNAKE_FOOD[f].icon} ${f}</button>`).join('')}<button class="btn sm ghost" id="rs">${IC.redo} 重来</button></div></div>` : ''}
        </div></div>`;
    $$('[data-d]', el).forEach(b => b.onclick = () => X.ctl({ type: 'snake.step', d: b.dataset.d }));
    $$('[data-f]', el).forEach(b => b.onclick = () => { const cur = (sdata().snake || {}).food; X.ctl({ type: 'snake.food', food: cur === b.dataset.f ? null : b.dataset.f }); });
    const rs = $('#rs', el); if (rs) rs.onclick = () => X.ctl({ type: 'snake.reset' });
    let lastN = null;
    const upd = () => {
      const b = sdata().snake || { cells: s.init, n: 0 };
      const mark = {};

      if (b.removed) mark[b.removed.join(',')] = 'gone';
      $('#sg', el).innerHTML = snakeGrid(s.size || 6, b.cells, { labels: s.labels, mark });
      $('#len', el).textContent = `${b.cells.length} 格长`;
      $('#pos', el).textContent = s.labels ? `头在第 ${b.cells[0][0]} 行第 ${b.cells[0][1]} 格` : '';
      const ate = b.ate && SNAKE_FOOD[b.ate];
      $('#note', el).textContent = b.food ? `下一步会吃到${b.food}${SNAKE_FOOD[b.food].icon}`
        : !b.n ? '老师按方向，蛇走一步'
        : ate && ate.剪 ? `吃到${b.ate}${ate.icon}：尾巴剪掉 ${ate.剪} 格`
        : ate ? `吃到${b.ate}${ate.icon}：这一步尾巴不去掉${b.grow ? `，还要长 ${b.grow} 格` : ''}`

      $$('[data-f]', el).forEach(x => x.classList.toggle('dark', x.dataset.f === b.food));

  // 蛇身预测赛：出题 → 孩子在平板上答 → 揭晓时一步一步走给大家看
  snakequiz(s, L, el, X) {
    const ASK = { len: '走完以后，蛇有几格长？', head: '走完以后，头在第几行第几格？', cells: '走完以后，蛇在哪几格？' };
    el.innerHTML = `<div class="row" style="align-items:flex-end;justify-content:space-between;margin-bottom:12px"><div><span class="tag">${esc(s.badge || '两队比拼')}</span><h2 class="t2" style="margin:10px 0 0">${esc(s.title)}</h2><p class="lead" style="margin:4px 0 0;font-size:28px">${esc(s.sub || '')}</p></div><span class="tag" id="cnt" style="font-size:26px"></span></div>
      <div class="row grow" style="gap:40px;min-height:0;align-items:center">
        <div id="sg" style="width:470px;flex:none"></div>
        <div class="col grow" style="gap:16px;min-width:0;align-self:stretch;justify-content:center">
          <div class="card" style="padding:18px 26px"><div class="sm" style="font-size:24px" id="qn">等老师出题</div><div id="q" style="font-size:40px;font-weight:900;line-height:1.3"></div><div id="steps" class="sqsteps"></div></div>
          <div id="ans" style="font-size:38px;font-weight:900;color:#18A87C;min-height:50px"></div>
          <div id="res" class="row" style="gap:14px;flex-wrap:wrap"></div>
          ${SC.canCtl ? `<div class="row" style="gap:10px;flex-wrap:wrap">${s.rounds.map((r, i) => `<button class="btn sm ghost" data-r="${i}">第 ${i + 1} 题</button>`).join('')}<button class="btn sm green" id="rv">揭晓</button></div>` : ''}
        </div></div>`;
    $$('[data-r]', el).forEach(b => b.onclick = () => X.ctl({ type: 'sq.round', i: +b.dataset.r }));
    const rv = $('#rv', el); if (rv) rv.onclick = () => X.ctl({ type: 'sq.reveal' });
    let shown = '', token = { stop: true };
    const ansText = (r, a) => r.ask === 'len' ? `答案：${a} 格` : r.ask === 'head' ? `答案：第 ${a.split(',')[0]} 行第 ${a.split(',')[1]} 格` : `答案：蛇有 ${a.split('|').length} 格，看格子上的绿框`;
    const drawStep = (r, k) => { $('#steps', el).innerHTML = '口令：' + r.steps.map((st, j) => `<span class="${j < k ? 'done' : j === k ? 'now' : ''}">${esc(snakeStepText(st))}</span>`).join(' → '); };
    const showFinal = (r, q) => {
      const f = q.frames[q.frames.length - 1], mark = {};
      if (r.ask !== 'len') (r.ask === 'head' ? [q.answer] : q.answer.split('|')).forEach(k => { mark[k] = 'ans'; });
      $('#sg', el).innerHTML = snakeGrid(s.size || 6, f.cells, { labels: s.labels, mark });
      drawStep(r, r.steps.length); $('#ans', el).textContent = ansText(r, q.answer);
      $('#res', el).innerHTML = q.res ? ['o', 'b'].map(t => `<span class="tag ${t === 'b' ? 'blue' : ''}" style="font-size:24px">${esc(tn(t))} ${q.res[t].right}/${q.res[t].n} 答对${q.res[t].pass ? ' +1' : ''}</span>`).join('') : '';
    };
    const upd = async (v, mode) => {
      const q = sdata().sq;
      $$('[data-r]', el).forEach(b => b.classList.toggle('dark', !!(q && q.i === +b.dataset.r)));
      if (!q) { $('#sg', el).innerHTML = snakeGrid(s.size || 6, [], { labels: s.labels }); return; }
      const r = s.rounds[q.i];
      $('#qn', el).textContent = `第 ${q.i + 1} 题 · 开始时蛇有 ${r.start.length} 格`;
      $('#q', el).textContent = ASK[r.ask] || '';
      $('#cnt', el).textContent = q.revealed ? '' : `已答 ${q.answered} 人`;
      const key = q.i + ':' + q.revealed;
      if (key === shown) return;
      shown = key; token.stop = true;
      if (!q.revealed) { $('#sg', el).innerHTML = snakeGrid(s.size || 6, r.start, { labels: s.labels, food: q.foodCells }); drawStep(r, -1); $('#ans', el).textContent = ''; $('#res', el).innerHTML = ''; return; }
      if (mode === 'replay') return showFinal(r, q);
      const my = token = { stop: false };   // 一步一步走给大家看
      for (let k = 1; k < q.frames.length; k++) {
        await sleep(k === 1 ? 300 : 900); if (my.stop) return;
        const f = q.frames[k], mark = {};
        if (f.added) mark[f.added.join(',')] = 'new';
        if (f.removed) mark[f.removed.join(',')] = 'gone';
        $('#sg', el).innerHTML = snakeGrid(s.size || 6, f.cells, { labels: s.labels, mark }); drawStep(r, k - 1); Snd.tick();
      }
      await sleep(900); if (my.stop) return;
      showFinal(r, q); Snd.tada();
    };
    upd(null, 'replay');
    return { upd, off() { token.stop = true; } };
  },

function drawBubbles(box, items, empty) {

  $('#stage').innerHTML = ''; $('#stage').appendChild(el);
  let res = null; const L = lessonById(V.lesson);
  if (L) { const mi = MONTHS.findIndex(m => m.ids.includes(L.id)); if (mi >= 0) SC.month = mi; }
  $('#app').dataset.type = L ? (L.slides[V.slide] || {}).type || '' : 'map';   // 大屏背景按页面类型换（休息页是傍晚）

  }

  renderBar(); renderNav();
}
function applyCues() {
  const V = SC.V, res = SC.cur && SC.cur.res;

  });
}

// ---------- 收到新的课堂数据 ----------
function onView(v) {

  else { applyCues(); if (SC.cur.res && SC.cur.res.upd) { try { SC.cur.res.upd(v); } catch (e) { console.error(e); } } updBar(); if (prev.teamNames !== v.teamNames) renderBar(); }
  overlays(prev, v);
}

function overlays(prev, v) {
  const q = $('#quiet');

    q.dataset.k = 'quiet';
    q.innerHTML = `<div class="kc-quiet-bit">${bitEl(340, 'sitting')}</div><div class="call">驯狗师！</div><div class="resp" id="qr">准备就绪！</div><div class="sub">双手离开平板，看大屏</div>`;
    q.classList.add('show'); q.onclick = () => X.ctl({ type: 'quiet', on: false });

  } else if (!v.quiet && q.classList.contains('show') && q.dataset.k !== 'sleep') q.classList.remove('show');
  if (!v.quiet) {

  }
}

// ---------- 单机模式才用的：计时器、课前设置 ----------
function openTimer() {
  const o = $('#timerOv');
  o.innerHTML = `<div class="panel" style="min-width:1000px"><button class="close">×</button><div class="t3" style="text-align:center">计时器</div>
    <div class="presets" style="margin-top:30px">${[1, 2, 3, 5, 8, 10, 12, 15].map(m => `<button data-m="${m}">${m} 分钟</button>`).join('')}</div>
    <div class="ctrls"><button class="btn green" id="ts">${IC.play} 暂停 / 继续</button><button class="btn ghost" id="ta">+1 分钟</button><button class="btn ghost" id="tc">${IC.square} 结束</button></div></div>`;
  o.classList.add('show');
  $$('.presets button', o).forEach(b => b.onclick = () => { X.ctl({ type: 'timer.start', sec: +b.dataset.m * 60 }); o.classList.remove('show'); });
  $('#ts', o).onclick = () => X.ctl({ type: 'timer.toggle' }); $('#ta', o).onclick = () => X.ctl({ type: 'timer.add', sec: 60 }); $('#tc', o).onclick = () => X.ctl({ type: 'timer.stop' });
  $('.close', o).onclick = () => o.classList.remove('show');
}
function openSettings() {
  const o = $('#setOv');
  o.innerHTML = `<div class="panel" style="width:1100px"><button class="close">×</button><div class="t3">课前设置（单机模式）</div>
    <p class="sm" style="margin:14px 0 10px">学生名字（用空格、逗号或换行隔开）；分队和点名都会用到</p>
    <textarea class="names" id="nm">${esc((SC.V.roster || []).map(r => r.name).join('\n'))}</textarea>
    <div class="ctrls" style="justify-content:flex-start;margin-top:24px;flex-wrap:wrap">
      <button class="btn green sm" id="sv">保存名字</button><button class="btn ghost sm" id="rb">能量全部清零</button>
    </div><p class="sm" id="msg" style="margin-top:16px;color:var(--green-d)"></p></div>`;
  o.classList.add('show');
  $('#sv', o).onclick = () => { const names = $('#nm', o).value.split(/[\s,，、]+/).map(s => s.trim()).filter(Boolean); X.ctl({ type: 'roster.set', names }); $('#msg', o).textContent = `已保存 ${names.length} 个名字`; };
  $('#rb', o).onclick = () => { X.ctl({ type: 'pts.reset' }); $('#msg', o).textContent = '能量已清零'; };
  $('.close', o).onclick = () => o.classList.remove('show');
}
function fullscreen() { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (e) { } }

// ---------- 启动 ----------
function fit() { const s = Math.min(innerWidth / 1600, innerHeight / 900); $('#app').style.transform = `scale(${s})`; }
addEventListener('resize', fit);
document.addEventListener('keydown', e => {
  if (!SC.canCtl || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape') { $$('.overlay.show').forEach(o => o.classList.remove('show')); return; }
  const k = e.key;
  if (k === 'ArrowRight' || k === 'PageDown') { e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); prev(); }
  else if (k === 'q' || k === 'Q') X.ctl({ type: 'quiet', on: !SC.V.quiet });
  else if ((k === 'z' || k === 'Z') && REAL_DOG) X.ctl({ type: 'dogs.sleep', on: !SC.V.sleep });
  else if (k === 't' || k === 'T') openTimer();
  else if (k === 'p' || k === 'P') X.ctl({ type: 'pick' });
  else if (k === 'm' || k === 'M') X.ctl({ type: 'go', lesson: null, slide: 0 });
  else if (k === 'f' || k === 'F') fullscreen();
});
function startScreen(opts) {
  opts = opts || {};
  fit();
  const qp = new URLSearchParams(location.search);
  const key = qp.get('k'), screenToken = qp.get('s');
  SC.mini = qp.get('mini') === '1'; if (SC.mini) window.__MUTE = 1;
  SC.standalone = opts.standalone || location.protocol === 'file:' || qp.get('local') === '1';
  if (SC.standalone) {
    let saved = null; try { saved = JSON.parse(localStorage.getItem('xgxy2_screen') || 'null'); } catch (e) { }
    const hub = opts.hub || createLocalHub({ starters: typeof STARTERS !== 'undefined' ? STARTERS : {}, saved, persistKey: 'xgxy2_screen' });
    SC.net = makeNet({ role: 'teacher', hub }); SC.canCtl = true;
  } else {
    SC.net = makeNet({ role: key && !screenToken ? 'teacher' : 'screen', key, screenToken }); SC.canCtl = !!key && !screenToken;
  }
  if (opts.hub && !opts.standalone) { SC.net = makeNet({ role: opts.role || 'screen', hub: opts.hub }); SC.canCtl = !!opts.canCtl; }
  SC.net.connect(onView, st => { SC.status = st; const c = $('#conn'); if (c) c.className = 'conn ' + st; });
}

if (!window.__NO_AUTOSTART) startScreen();
</script>
