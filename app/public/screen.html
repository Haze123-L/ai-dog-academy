 飘字们.filter(字 => 字.寿命 > 0);\n\n  // 一句提示\n  if (话的寿命 > 0) {\n    话的寿命--;\n    ctx.globalAlpha = Math.min(1, 话的寿命 / 30);\n    ctx.fillStyle = \"#E2CDA8\"; 圆角矩形(W / 2 - 282, 74, 564, 60, 20);\n    ctx.fillStyle = \"#FFFFFF\"; 圆角矩形(W / 2 - 280, 76, 560, 56, 18);\n    画文字(话, W / 2, 104, 24, \"#1E2A4A\");\n    ctx.globalAlpha = 1;\n  }\n\n  requestAnimationFrame(游戏循环);\n}\n开始();\n游戏循环();\n<\/script>\n<\/body>\n<\/html>\n", "有虫的接金币.html": "<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, user-scalable=no\">\n<title>有虫的接金币<\/title>\n<style>\n  html, body { margin: 0; height: 100%; background: #FFF7EC; font-family: \"PingFang SC\", \"Microsoft YaHei\", sans-serif; color: #1E2A4A; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }\n  #box { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }\n  h1 { margin: 0; font-size: 28px; }\n  canvas { width: min(96vw, 160vh); max-height: 82vh; aspect-ratio: 16 / 9; border-radius: 18px; box-shadow: 0 6px 0 #F0E2CC; background: #FFF7EC; touch-action: none; }\n  p { margin: 0; color: #5B6683; font-size: 18px; }\n<\/style>\n<\/head>\n<body>\n<div id=\"box\">\n  <h1>有虫的接金币<\/h1>\n  <canvas id=\"game\" width=\"960\" height=\"540\"><\/canvas>\n  <p>按住下面的 ◀ ▶ 走路（也能按方向键），接金币、躲炸弹，攒够金币买护盾<\/p>\n<\/div>\n\n<script>\n// ===== 游戏设置：想改游戏，先改这里 =====\nconst 设置 = {\n  一开始几条命: 3,        // 开局有几颗心\n  护盾价钱: 5,            // 买一个护盾要几个金币\n  移动速度: 8,            // 按住按钮时，比特每一帧走多远\n  掉东西间隔帧: 40,       // 隔几帧掉一个东西（60 帧 = 1 秒），越小掉得越多\n  炸弹出现机会: 0.3,     // 0～1，掉下来的东西里炸弹占多少\n};\n\n// ===== 下面是游戏程序 =====\nconst canvas = document.getElementById(\"game\");\nconst ctx = canvas.getContext(\"2d\");\nconst W = canvas.width, H = canvas.height;\nconst 地面Y = 420;          // 比特站的地面有多高\nconst 方向表 = { 左: -1, 右: 1 };\n\nlet 比特 = { x: W / 2, y: 地面Y - 42, 在走: false };\nlet 心们 = [];             // 上面那一排心，每颗心：{ 图案, 跳一下 }\nlet 金币 = 0;\nlet 有护盾 = false;\nlet 天上的东西 = [];        // 正在往下掉的东西：{ 是炸弹, x, y, 速度 }\nlet 状态 = \"玩\";           // \"玩\" 或 \"输了\"\nlet 帧数 = 0;\nlet 话 = \"\", 话的寿命 = 0;  // 屏幕上的一句提示\nlet 飘字们 = [];\n\n// 开一局新游戏\nfunction 开始() {\n  心们 = [];\n  for (let i = 0; i < 设置.一开始几条命 && i < 99; i++) 心们.push({ 图案: \"❤️\", 跳一下: 0 });\n  金币 = 0; 有护盾 = false; 天上的东西 = []; 飘字们 = [];\n  比特.x = W / 2;\n  状态 = \"玩\";\n}\n\n// 碰到炸弹：掉一条命\nfunction 掉一条命() {\n  心们.pop();                           // 去掉一颗心\n  心们[心们.length - 1].跳一下 = 20;     // 剩下的最后一颗心跳一下，提醒你\n  if (心们.length === 0) 输了();\n}\n\nfunction 输了() { 状态 = \"输了\"; }\n\n// 点右上角的按钮：花金币买一个护盾，下一次碰到炸弹不掉命\nfunction 买护盾() {\n  金币 = 金币 - 设置.护盾价钱;   // 付钱\n  有护盾 = true;\n  说一句(\"买到护盾了！\");\n}\n\n// 每一帧：比特往按着的方向走\nfunction 移动比特() {\n  let 按着的键 = \"\";\n  if (按着.左) 按着的键 += \"左\";\n  if (按着.右) 按着的键 += \"右\";\n  if (按着的键) 比特.x += 设置.移动速度 * 方向表[按着的键];\n  比特.x = Math.max(40, Math.min(W - 40, 比特.x));   // 别走出画面\n  比特.在走 = 按着的键 !== \"\";\n}\n\n// 每一帧：天上掉东西，掉到比特身上就算接住\nfunction 东西往下掉() {\n  const 间隔 = Math.max(5, Math.round(设置.掉东西间隔帧) || 40);\n  if (帧数 % 间隔 === 0) {\n    天上的东西.push({ 是炸弹: Math.random() < 设置.炸弹出现机会, x: 70 + Math.random() * (W - 140), y: 110, 速度: 3 + Math.random() * 2 });\n  }\n  for (const 东西 of 天上的东西) {\n    东西.y += 东西.速度;\n    const 碰到了 = Math.abs(东西.x - 比特.x) < 60 && Math.abs(东西.y - 比特.y) < 45;\n    if (!碰到了 || 东西.接住了) continue;\n    东西.接住了 = true;\n    if (!东西.是炸弹) { 金币 += 1; 飘字(\"+1\", 东西.x, 东西.y - 40, \"#E0A100\"); }\n    else if (有护盾) { 有护盾 = false; 飘字(\"护盾挡住了！\", 东西.x, 东西.y - 40, \"#3A7BD5\"); }\n    else { 飘字(\"💥\", 东西.x, 东西.y - 20, \"#E5484D\"); 掉一条命(); }\n  }\n  天上的东西 = 天上的东西.filter(东西 => !东西.接住了 && 东西.y < 地面Y + 20);\n}\n\n// ===== 操作：按住下面的 ◀ ▶ 走路（两根手指可以各按一个），或者按方向键 =====\nconst 按着 = { 左: false, 右: false };      // 现在往哪边按着\nlet 手指们 = {};                            // 每根按下的手指在哪个按钮上：{ 手指编号: \"左\" / \"右\" / null }\nconst 键盘按着 = { 左: false, 右: false };\nconst 方向按钮们 = [\n  { 方向: \"左\", x: 24, y: 458, 宽: 300, 高: 72 },\n  { 方向: \"右\", x: 636, y: 458, 宽: 300, 高: 72 },\n];\nconst 护盾按钮 = { x: 690, y: 14, 宽: 250, 高: 56 };\nconst 再来按钮 = { x: 360, y: 305, 宽: 240, 高: 72 };\n\nfunction 点在框里(x, y, 框) { return x >= 框.x && x <= 框.x + 框.宽 && y >= 框.y && y <= 框.y + 框.高; }\nfunction 哪个方向按钮(x, y) {\n  for (const b of 方向按钮们) if (点在框里(x, y, b)) return b.方向;\n  return null;\n}\nfunction 算一算按着() {\n  const 手指按的 = Object.values(手指们);\n  按着.左 = 键盘按着.左 || 手指按的.includes(\"左\");\n  按着.右 = 键盘按着.右 || 手指按的.includes(\"右\");\n}\nfunction 画布上的点(e) {\n  const r = canvas.getBoundingClientRect();\n  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };\n}\ncanvas.addEventListener(\"pointerdown\", e => {\n  const 点 = 画布上的点(e);\n  手指们[e.pointerId] = 哪个方向按钮(点.x, 点.y);\n  算一算按着();\n  if (状态 === \"玩\" && 点在框里(点.x, 点.y, 护盾按钮)) 买护盾();\n  if (状态 === \"输了\" && 点在框里(点.x, 点.y, 再来按钮)) 开始();\n});\ncanvas.addEventListener(\"pointermove\", e => {\n  if (!(e.pointerId in 手指们)) return;   // 没按下去的（比如鼠标在上面晃）不算\n  const 点 = 画布上的点(e);\n  手指们[e.pointerId] = 哪个方向按钮(点.x, 点.y);\n  算一算按着();\n});\nfunction 松开手指(e) { delete 手指们[e.pointerId]; 算一算按着(); }\ncanvas.addEventListener(\"pointerup\", 松开手指);\ncanvas.addEventListener(\"pointercancel\", 松开手指);\ncanvas.addEventListener(\"pointerleave\", 松开手指);\ndocument.addEventListener(\"keydown\", e => {\n  const 方向 = { ArrowLeft: \"左\", ArrowRight: \"右\" }[e.key];\n  if (方向) { 键盘按着[方向] = true; 算一算按着(); e.preventDefault(); }\n});\ndocument.addEventListener(\"keyup\", e => {\n  const 方向 = { ArrowLeft: \"左\", ArrowRight: \"右\" }[e.key];\n  if (方向) { 键盘按着[方向] = false; 算一算按着(); }\n});\n\n// ===== 画画的小工具 =====\nfunction 说一句(文字) { 话 = 文字; 话的寿命 = 150; }\nfunction 飘字(文字, x, y, 颜色) { 飘字们.push({ 文字, x, y, 颜色, 寿命: 40 }); }\nfunction 圆角矩形(x, y, w, h, r) {\n  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);\n  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); ctx.fill();\n}\nfunction 画表情(文字, x, y, 大小) {\n  ctx.font = 大小 + 'px \"Apple Color Emoji\",\"Segoe UI Emoji\",\"Noto Color Emoji\",sans-serif';\n  ctx.fillStyle = \"#000\"; ctx.textAlign = \"center\"; ctx.textBaseline = \"middle\"; ctx.fillText(文字, x, y);\n}\nfunction 画文字(文字, x, y, 大小, 颜色) {\n  ctx.fillStyle = 颜色; ctx.font = \"bold \" + 大小 + 'px \"PingFang SC\",\"Microsoft YaHei\",sans-serif';\n  ctx.textAlign = \"center\"; ctx.textBaseline = \"middle\"; ctx.fillText(文字, x, y);\n}\nfunction 画金币(x, y, 大小) {\n  ctx.fillStyle = \"#E3A21A\"; ctx.beginPath(); ctx.arc(x, y, 大小 / 2, 0, Math.PI * 2); ctx.fill();\n  ctx.fillStyle = \"#FFD447\"; ctx.beginPath(); ctx.arc(x, y, 大小 / 2 - 4, 0, Math.PI * 2); ctx.fill();\n  ctx.strokeStyle = \"#E3A21A\"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 大小 / 2 - 9, 0, Math.PI * 2); ctx.stroke();\n  ctx.fillStyle = \"#FFF3B8\"; ctx.beginPath(); ctx.ellipse(x - 大小 * 0.14, y - 大小 * 0.14, 大小 * 0.07, 大小 * 0.14, 0.6, 0, Math.PI * 2); ctx.fill();\n}\n\n// 每一帧都会运行一次\nfunction 游戏循环() {\n  帧数++;\n  if (状态 === \"玩\") {\n    移动比特();\n    东西往下掉();\n  }\n\n  // 天空和地面\n  ctx.fillStyle = \"#FFF7EC\"; ctx.fillRect(0, 0, W, H);\n  const 天 = ctx.createLinearGradient(0, 84, 0, 446), 地面在哪 = (地面Y - 84) / 362;\n  天.addColorStop(0, \"#C9E9FF\"); 天.addColorStop(地面在哪, \"#EEF8FF\"); 天.addColorStop(地面在哪, \"#F2D49B\"); 天.addColorStop(1, \"#E9C27F\");\n  ctx.fillStyle = 天; 圆角矩形(16, 84, W - 32, 362, 18);\n  ctx.fillStyle = \"#E2B873\"; ctx.fillRect(16, 地面Y, W - 32, 4);\n  ctx.fillStyle = \"rgba(255,255,255,0.85)\";\n  for (let i = 0; i < 3; i++) {\n    const 云x = (i * 340 + 帧数 * 0.25) % (W + 160) - 80, 云y = 150 + i * 46;\n    ctx.beginPath(); ctx.arc(云x, 云y, 22, 0, Math.PI * 2); ctx.arc(云x + 26, 云y - 10, 28, 0, Math.PI * 2); ctx.arc(云x + 56, 云y, 22, 0, Math.PI * 2); ctx.fill();\n  }\n\n  // 天上掉的金币和炸弹\n  for (const 东西 of 天上的东西) {\n    if (东西.是炸弹) 画表情(\"💣\", 东西.x, 东西.y, 54); else 画金币(东西.x, 东西.y, 46);\n  }\n\n  // 比特：脚下有影子，头上有天线，走路时一颠一颠\n  const 颠 = 比特.在走 ? -Math.abs(Math.sin(帧数 / 4)) * 8 : 0;\n  ctx.fillStyle = \"rgba(30,42,74,0.15)\"; ctx.beginPath(); ctx.ellipse(比特.x, 地面Y + 2, 38, 8, 0, 0, Math.PI * 2); ctx.fill();\n  ctx.strokeStyle = \"#1E2A4A\"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(比特.x, 比特.y - 34 + 颠); ctx.lineTo(比特.x + 6, 比特.y - 58 + 颠); ctx.stroke();\n  ctx.fillStyle = \"#FF8A3D\"; ctx.beginPath(); ctx.arc(比特.x + 6, 比特.y - 60 + 颠, 7, 0, Math.PI * 2); ctx.fill();\n  画表情(\"🐶\", 比特.x, 比特.y + 颠, 84);\n  if (有护盾) {\n    ctx.fillStyle = \"rgba(91,192,255,0.18)\"; ctx.strokeStyle = \"#5BC0FF\"; ctx.lineWidth = 5;\n    ctx.beginPath(); ctx.arc(比特.x, 比特.y + 颠 - 6, 60, 0, Math.PI * 2); ctx.fill(); ctx.stroke();\n  }\n\n  // 飘字\n  for (const 字 of 飘字们) {\n    ctx.globalAlpha = 字.寿命 / 40; 画文字(字.文字, 字.x, 字.y, 30, 字.颜色); 字.y -= 1.2; 字.寿命--; ctx.globalAlpha = 1;\n  }\n  飘字们 = 飘字们.filter(字 => 字.寿命 > 0);\n\n  // 上面：一排心、金币、护盾、买护盾的按钮\n  const 间距 = Math.min(46, 300 / Math.max(1, 心们.length));\n  for (let i = 0; i < 心们.length; i++) {\n    const 心 = 心们[i];\n    const 跳 = 心.跳一下 > 0 ? Math.sin(心.跳一下 / 20 * Math.PI) * 18 : 0;\n    画表情(心.图案, 40 + i * 间距, 44 - 跳, 36);\n    if (心.跳一下 > 0) 心.跳一下--;\n  }\n  画金币(385, 44, 38);\n  画文字(\"金币 \" + 金币, 455, 45, 28, \"#1E2A4A\");\n  ctx.globalAlpha = 有护盾 ? 1 : 0.35; 画表情(\"🛡️\", 548, 44, 32); ctx.globalAlpha = 1;\n  画文字(有护盾 ? \"有护盾\" : \"没护盾\", 612, 45, 22, 有护盾 ? \"#3A7BD5\" : \"#9AA3B8\");\n  ctx.fillStyle = \"#FF8A3D\"; 圆角矩形(护盾按钮.x, 护盾按钮.y, 护盾按钮.宽, 护盾按钮.高, 18);\n  画文字(\"买护盾（\" + 设置.护盾价钱 + \" 金币）\", 护盾按钮.x + 护盾按钮.宽 / 2, 护盾按钮.y + 护盾按钮.高 / 2, 24, \"#FFFFFF\");\n\n  // 下面：两个大按钮，按着的那个变色\n  for (const b of 方向按钮们) {\n    ctx.fillStyle = 按着[b.方向] ? \"#FFE2C2\" : \"#FFFFFF\"; 圆角矩形(b.x, b.y, b.宽, b.高, 22);\n    ctx.strokeStyle = \"#E2CDA8\"; ctx.lineWidth = 4; ctx.stroke();\n    const 中x = b.x + b.宽 / 2, 中y = b.y + b.高 / 2, 朝 = b.方向 === \"左\" ? -1 : 1;\n    ctx.fillStyle = \"#FF8A3D\"; ctx.beginPath();\n    ctx.moveTo(中x + 朝 * 22, 中y); ctx.lineTo(中x - 朝 * 16, 中y - 22); ctx.lineTo(中x - 朝 * 16, 中y + 22); ctx.closePath(); ctx.fill();\n  }\n  画文字(\"按住走路\", W / 2, 494, 22, \"#9AA3B8\");\n\n  // 输了：游戏结束、再来一局\n  if (状态 === \"输了\") {\n    ctx.fillStyle = \"rgba(255,247,236,0.85)\"; 圆角矩形(16, 84, W - 32, 362, 18);\n    画文字(\"游戏结束\", W / 2, 200, 60, \"#1E2A4A\");\n    画文字(\"这一局攒了 \" + 金币 + \" 个金币\", W / 2, 262, 28, \"#5B6683\");\n    ctx.fillStyle = \"#FF8A3D\"; 圆角矩形(再来按钮.x, 再来按钮.y, 再来按钮.宽, 再来按钮.高, 22);\n    画文字(\"再来一局\", 再来按钮.x + 再来按钮.宽 / 2, 再来按钮.y + 再来按钮.高 / 2, 30, \"#FFFFFF\");\n  }\n\n  // 一句提示\n  if (话的寿命 > 0) {\n    话的寿命--;\n    ctx.globalAlpha = Math.min(1, 话的寿命 / 30);\n    const 宽 = Math.max(300, 话.length * 28 + 60);\n    ctx.fillStyle = \"rgba(255,255,255,0.92)\"; 圆角矩形(W / 2 - 宽 / 2, 104, 宽, 56, 18);\n    画文字(话, W / 2, 132, 26, \"#1E2A4A\");\n    ctx.globalAlpha = 1;\n  }\n\n  requestAnimationFrame(游戏循环);\n}\n开始();\n游戏循环();\n<\/script>\n<\/body>\n<\/html>\n", "比特回家-会动版.html": "<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, user-scalable=no\">\n<title>比特回家<\/title>\n<style>\n  html, body { margin: 0; height: 100%; background: #FFF7EC; font-family: \"PingFang SC\", \"Microsoft YaHei\", sans-serif; color: #1E2A4A; touch-action: none; -webkit-user-select: none; user-select: none; }\n  #box { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }\n  h1 { margin: 0; font-size: 28px; }\n  canvas { width: min(96vw, 160vh); max-height: 82vh; aspect-ratio: 16 / 9; border-radius: 18px; box-shadow: 0 6px 0 #F0E2CC; background: #BFE6A8; touch-action: none; }\n  p { margin: 0; color: #5B6683; font-size: 18px; }\n<\/style>\n<\/head>\n<body>\n<div id=\"box\">\n  <h1>比特回家<\/h1>\n  <canvas id=\"game\" width=\"960\" height=\"540\"><\/canvas>\n  <p>用按钮或点屏幕，带比特回家<\/p>\n<\/div>\n\n<script>\n// ===== 游戏设置：想改游戏，先改这里 =====\nconst 设置 = {\n  主角: \"比特\",        // \"比特\" 是驯狗学院的机器狗；也可以换成表情，比如 \"🐰\"\n  主角大小: 70,        // 数字越大，主角越大\n  背景: \"草地\",        // 可以填 \"草地\"、\"夜晚\"、\"雪地\"\n  走路速度: 4,         // 数字越大，走得越快\n  显示分数: false,     // 是否显示分数\n  生命: 0,             // 有几条命；填 0 表示不算命\n  倒计时: 0,           // 游戏时间（秒）；填 0 表示不限时\n  关卡: false,         // 回到狗窝以后，是不是进下一关（每一关多一只猫，猫跑得快一点）\n  最后一关: 3,         // 打通第几关算通关\n};\n\n// ===== 怎么指挥比特：每一种操作，就是一个「事件」 =====\n// 发生一件事（按下按键、点到屏幕），程序就去做一件事（比特走一步）\n// true = 打开，false = 关着\nconst 操作 = {\n  方向键: true,      // 按键盘上的方向键走（电脑上用）\n  屏幕按钮: true,    // 屏幕右下角出现四个箭头按钮，按住就走（平板上用）\n  点哪走哪: true,    // 点一下屏幕，比特走到那里\n  拖着走: false,      // 手指按住比特，拖到哪里走到哪里\n  冲刺: false,        // 按空格键或屏幕上的「冲」按钮：3 秒内跑得飞快\n};\n\n// ===== 场上的东西：碰到了会发生什么，写在「碰到会」里 =====\n// 碰到会：\"\"（什么也不发生）、\"加分\"、\"扣命\"、\"变慢\"、\"变快\"、\"结束\"\n// 加几分：碰到会 \"加分\" 时加几分；几秒：碰到会 \"变慢\" 或 \"变快\" 时持续几秒\n// 数量：每一关放几个；会动：会不会走来走去\nconst 场上的东西 = [\n  { 名字: \"骨头\", 图案: \"🦴\", 数量: 5, 碰到会: \"\", 会动: false },\n  { 名字: \"水坑\", 图案: \"💧\", 数量: 3, 碰到会: \"\", 会动: false },\n  { 名字: \"猫\", 图案: \"🐱\", 数量: 1, 碰到会: \"\", 会动: true },\n];\n\n// ===== 下面是游戏程序 =====\nconst canvas = document.getElementById(\"game\");\nconst ctx = canvas.getContext(\"2d\");\nconst W = canvas.width, H = canvas.height;\nconst 狗窝 = { x: W - 90, y: 90 };\nconst 起点 = { x: 90, y: H - 80 };\n\nlet 状态 = \"准备\";          // \"准备\"、\"玩\"、\"结束\"、\"回家了\"\nlet 分数 = 0, 剩余生命 = 设置.生命, 剩余时间 = 设置.倒计时, 第几关 = 1;\nlet 东西们 = [], 飘字们 = [], 闪烁 = 0, 慢的时间 = 0, 快的时间 = 0, 冲刺时间 = 0, 结束原因 = \"\", 横幅 = 0, 帧数 = 0, 没动的时间 = 0;\nconst 狗 = { x: 起点.x, y: 起点.y };\nlet 目标 = null, 拖着 = false;\nconst 按着 = {};\n\n// 按出现位置放东西：不放在起点和狗窝旁边\nfunction 放东西() {\n  东西们 = [];\n  for (const 东西 of 场上的东西) {\n    let 个数 = 东西.数量 || 1;\n    if (设置.关卡 && 东西.会动) 个数 += 第几关 - 1;   // 每一关多一只会动的\n    for (let i = 0; i < 个数; i++) {\n      let x, y, 试 = 0;\n      do { x = 80 + Math.random() * (W - 160); y = 80 + Math.random() * (H - 160); 试++; }\n      while (试 < 50 && (Math.hypot(x - 起点.x, y - 起点.y) < 150 || Math.hypot(x - 狗窝.x, y - 狗窝.y) < 140));\n      const 角度 = Math.random() * Math.PI * 2, 快慢 = 1.4 + (设置.关卡 ? (第几关 - 1) * 0.6 : 0);\n      东西们.push(Object.assign({}, 东西, { x, y, vx: 东西.会动 ? Math.cos(角度) * 快慢 : 0, vy: 东西.会动 ? Math.sin(角度) * 快慢 : 0 }));\n    }\n  }\n}\n\nfunction 重新开始() {\n  分数 = 0; 剩余生命 = 设置.生命; 剩余时间 = 设置.倒计时; 第几关 = 1;\n  狗.x = 起点.x; 狗.y = 起点.y; 目标 = null; 闪烁 = 0; 慢的时间 = 0; 快的时间 = 0; 冲刺时间 = 0; 没动的时间 = 0;\n  飘字们 = []; 放东西(); 横幅 = 设置.关卡 ? 90 : 0;\n  状态 = \"玩\";\n}\n\nfunction 飘字(文字, x, y, 颜色) { 飘字们.push({ 文字, x, y, 颜色, 寿命: 50 }); }\n\n// 屏幕坐标换成游戏里的坐标\nfunction 位置(e) {\n  const r = canvas.getBoundingClientRect();\n  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };\n}\n\n// 屏幕右下角的按钮\nconst 按钮们 = [\n  { 名字: \"上\", x: W - 130, y: H - 165, dx: 0, dy: -1 },\n  { 名字: \"下\", x: W - 130, y: H - 55, dx: 0, dy: 1 },\n  { 名字: \"左\", x: W - 185, y: H - 110, dx: -1, dy: 0 },\n  { 名字: \"右\", x: W - 75, y: H - 110, dx: 1, dy: 0 },\n];\nconst 冲按钮 = { x: 80, y: H - 80, 半径: 46 };\nlet 按住的按钮 = null;\n\n// ===== 事件：手指或鼠标按下 =====\ncanvas.addEventListener(\"pointerdown\", e => {\n  e.preventDefault();\n  const p = 位置(e);\n  if (状态 !== \"玩\") { 重新开始(); return; }\n  if (操作.冲刺 && Math.hypot(p.x - 冲按钮.x, p.y - 冲按钮.y) < 冲按钮.半径 + 8) { 开始冲刺(); return; }\n  if (操作.屏幕按钮) {\n    for (const 按钮 of 按钮们) if (Math.hypot(p.x - 按钮.x, p.y - 按钮.y) < 44) { 按住的按钮 = 按钮; return; }\n  }\n  if (操作.拖着走 && Math.hypot(p.x - 狗.x, p.y - (狗.y - 30)) < 80) { 拖着 = true; return; }\n  if (操作.点哪走哪) 目标 = p;\n});\ncanvas.addEventListener(\"pointermove\", e => { if (拖着 && 操作.拖着走) { const p = 位置(e); 狗.x = p.x; 狗.y = p.y + 30; } });\nwindow.addEventListener(\"pointerup\", () => { 按住的按钮 = null; 拖着 = false; });\n\n// ===== 事件：按下键盘 =====\ndocument.addEventListener(\"keydown\", e => {\n  if (状态 !== \"玩\" && (e.key === \" \" || e.key === \"Enter\")) { 重新开始(); return; }\n  if (操作.方向键 && [\"ArrowUp\", \"ArrowDown\", \"ArrowLeft\", \"ArrowRight\"].includes(e.key)) { 按着[e.key] = true; e.preventDefault(); }\n  if (操作.冲刺 && e.key === \" \") { 开始冲刺(); e.preventDefault(); }\n});\ndocument.addEventListener(\"keyup\", e => { 按着[e.key] = false; });\n\nfunction 开始冲刺() { if (冲刺时间 <= 0) { 冲刺时间 = 180; 飘字(\"冲！\", 狗.x, 狗.y - 90, \"#FF8A3D\"); } }\n\n// 比特碰到场上的东西时，会发生什么\nfunction 碰到(东西) {\n  if (东西.碰到会 === \"加分\") {\n    东西.不见了 = true; 分数 += 东西.加几分 || 1;\n    飘字(\"+\" + (东西.加几分 || 1), 东西.x, 东西.y - 40, \"#18A87C\");\n  } else if (东西.碰到会 === \"扣命\") {\n    if (闪烁 > 0) return;\n    闪烁 = 90;\n    if (设置.生命 > 0) {\n      剩余生命 -= 1; 飘字(\"−1 命\", 东西.x, 东西.y - 40, \"#E5484D\");\n      if (剩余生命 <= 0) { 状态 = \"结束\"; 结束原因 = \"没有命了\"; }\n    } else { 状态 = \"结束\"; 结束原因 = \"碰到\" + 东西.名字 + \"了\"; }\n  } else if (东西.碰到会 === \"变慢\") {\n    if (慢的时间 <= 0) 飘字(\"变慢了\", 狗.x, 狗.y - 90, \"#2366D1\");\n    慢的时间 = (东西.几秒 || 3) * 60;\n  } else if (东西.碰到会 === \"变快\") {\n    东西.不见了 = true; 快的时间 = (东西.几秒 || 3) * 60; 飘字(\"变快！\", 狗.x, 狗.y - 90, \"#FF8A3D\");\n  } else if (东西.碰到会 === \"结束\") {\n    状态 = \"结束\"; 结束原因 = \"碰到\" + 东西.名字 + \"了\";\n  }\n}\n\n// 回到狗窝\nfunction 到家了() {\n  if (设置.关卡 && 第几关 < 设置.最后一关) {\n    第几关 += 1; 分数 += 5; 飘字(\"第 \" + 第几关 + \" 关！\", W / 2, H / 2, \"#FF8A3D\");\n    狗.x = 起点.x; 狗.y = 起点.y; 目标 = null; 放东西(); 横幅 = 90;\n    if (设置.倒计时 > 0) 剩余时间 = 设置.倒计时;\n    return;\n  }\n  状态 = \"回家了\"; 结束原因 = 设置.关卡 ? \"通关！\" : \"回家了！\";\n}\n\nfunction 更新() {\n  帧数++;\n  if (状态 !== \"玩\") return;\n  let 速度 = 设置.走路速度;\n  if (慢的时间 > 0) { 速度 *= 0.45; 慢的时间--; }\n  if (快的时间 > 0) { 速度 *= 1.8; 快的时间--; }\n  if (冲刺时间 > 0) { 速度 *= 2; 冲刺时间--; }\n\n  // 按方向键或屏幕按钮：往那边走\n  let dx = 0, dy = 0;\n  if (操作.方向键) {\n    if (按着.ArrowLeft) dx -= 1; if (按着.ArrowRight) dx += 1;\n    if (按着.ArrowUp) dy -= 1; if (按着.ArrowDown) dy += 1;\n  }\n  if (操作.屏幕按钮 && 按住的按钮) { dx += 按住的按钮.dx; dy += 按住的按钮.dy; }\n  if (dx || dy) { const 长 = Math.hypot(dx, dy); 狗.x += dx / 长 * 速度; 狗.y += dy / 长 * 速度; 目标 = null; }\n  // 点了屏幕：走到点的地方\n  if (目标 && 操作.点哪走哪) {\n    const 距离 = Math.hypot(目标.x - 狗.x, 目标.y - 狗.y);\n    if (距离 < 速度) 目标 = null; else { 狗.x += (目标.x - 狗.x) / 距离 * 速度; 狗.y += (目标.y - 狗.y) / 距离 * 速度; }\n  }\n  狗.x = Math.max(30, Math.min(W - 30, 狗.x)); 狗.y = Math.max(60, Math.min(H - 10, 狗.y));\n  if (dx || dy || 目标 || 拖着) 没动的时间 = 0; else 没动的时间++;\n\n  // 会动的东西走来走去，碰到边就掉头\n  for (const 东西 of 东西们) {\n    if (!东西.会动) continue;\n    东西.x += 东西.vx; 东西.y += 东西.vy;\n    if (东西.x < 40 || 东西.x > W - 40) 东西.vx *= -1;\n    if (东西.y < 50 || 东西.y > H - 40) 东西.vy *= -1;\n  }\n  // 碰到了吗？\n  for (const 东西 of 东西们) {\n    if (!东西.不见了 && Math.hypot(东西.x - 狗.x, 东西.y - (狗.y - 25)) < 48) 碰到(东西);\n    if (状态 !== \"玩\") return;\n  }\n  东西们 = 东西们.filter(东西 => !东西.不见了);\n  if (Math.hypot(狗窝.x - 狗.x, 狗窝.y - (狗.y - 25)) < 60) 到家了();\n\n  if (设置.倒计时 > 0) {\n    剩余时间 -= 1 / 60;\n    if (剩余时间 <= 0) { 剩余时间 = 0; 状态 = \"结束\"; 结束原因 = \"时间到\"; }\n  }\n  if (闪烁 > 0) 闪烁--;\n  if (横幅 > 0) 横幅--;\n}\n\n// ===== 画画 =====\nfunction 画背景() {\n  const 颜色 = { 草地: [\"#BFE6A8\", \"#A9D891\"], 夜晚: [\"#24345A\", \"#2D4170\"], 雪地: [\"#F4F8FF\", \"#DDE8F7\"] }[设置.背景] || [\"#BFE6A8\", \"#A9D891\"];\n  ctx.fillStyle = 颜色[0]; ctx.fillRect(0, 0, W, H);\n  ctx.fillStyle = 颜色[1];\n  for (let i = 0; i < 26; i++) { ctx.beginPath(); ctx.arc((i * 151) % W, (i * 89) % H, 18 + (i % 3) * 6, 0, Math.PI * 2); ctx.fill(); }\n  if (设置.背景 === \"夜晚\") { ctx.fillStyle = \"#FFFFFF\"; for (let i = 0; i < 30; i++) ctx.fillRect((i * 97) % W, (i * 53) % H, 3, 3); }\n}\nfunction 画狗窝() {\n  ctx.fillStyle = \"rgba(0,0,0,0.12)\"; ctx.beginPath(); ctx.ellipse(狗窝.x, 狗窝.y + 44, 64, 12, 0, 0, Math.PI * 2); ctx.fill();\n  ctx.fillStyle = \"#E0681C\"; ctx.beginPath(); ctx.moveTo(狗窝.x - 66, 狗窝.y - 6); ctx.lineTo(狗窝.x, 狗窝.y - 62); ctx.lineTo(狗窝.x + 66, 狗窝.y - 6); ctx.closePath(); ctx.fill();\n  ctx.fillStyle = \"#FFB27A\"; 圆角矩形(狗窝.x - 52, 狗窝.y - 10, 104, 56, 8);\n  ctx.fillStyle = \"#1E2A4A\"; 圆角矩形(狗窝.x - 20, 狗窝.y + 6, 40, 40, 18);\n  画文字(\"家\", 狗窝.x, 狗窝.y - 26, 22, \"#FFFFFF\");\n}\nfunction 画比特(x, y, 大小) {\n  const s = 大小 / 100;\n  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);\n  // 影子\n  ctx.fillStyle = \"rgba(36,48,94,.16)\"; ctx.beginPath(); ctx.ellipse(0, 54, 40, 6, 0, 0, Math.PI * 2); ctx.fill();\n  // 后腿\n  ctx.fillStyle = \"#F4F6FA\"; ctx.strokeStyle = \"#C5CCD8\"; ctx.lineWidth = 1.5;\n  [[-28, 20], [28, 20]].forEach(([lx, ly]) => { 圆角矩形(lx - 8, ly, 16, 26, 8); });\n  ctx.fillStyle = \"#FF8A3D\";\n  [[-28, 42], [28, 42]].forEach(([lx, ly]) => { 圆角矩形(lx - 10, ly, 20, 12, 5); });\n  // 尾巴\n  ctx.strokeStyle = \"#FF8A3D\"; ctx.lineWidth = 9; ctx.lineCap = \"round\";\n  ctx.beginPath(); ctx.moveTo(26, 8); ctx.quadraticCurveTo(44, 14, 40, 30); ctx.stroke();\n  // 身体\n  ctx.fillStyle = \"#F4F6FA\"; 圆角矩形(-34, -18, 68, 56, 22);\n  ctx.strokeStyle = \"#C5CCD8\"; ctx.lineWidth = 2; ctx.beginPath();\n  (function(x,y,w,h,r){ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();})(-34,-18,68,56,22); ctx.stroke();\n  // 橙心 <\/>\n  ctx.fillStyle = \"#FF8A3D\";\n  ctx.beginPath();\n  ctx.moveTo(0, 22); ctx.bezierCurveTo(-18, 8, -26, -4, -16, -12); ctx.bezierCurveTo(-10, -16, -4, -12, 0, -6);\n  ctx.bezierCurveTo(4, -12, 10, -16, 16, -12); ctx.bezierCurveTo(26, -4, 18, 8, 0, 22);\n  ctx.fill();\n  ctx.strokeStyle = \"#fff\"; ctx.lineWidth = 2.4; ctx.lineCap = \"round\"; ctx.lineJoin = \"round\";\n  ctx.beginPath(); ctx.moveTo(-9, -14); ctx.lineTo(-15, -8); ctx.lineTo(-9, -2); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(-2.5, -14); ctx.lineTo(2.5, -2); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(9, -14); ctx.lineTo(15, -8); ctx.lineTo(9, -2); ctx.stroke();\n  // 前腿\n  ctx.fillStyle = \"#F4F6FA\";\n  [[-16, 24], [16, 24]].forEach(([lx, ly]) => { 圆角矩形(lx - 7, ly, 14, 24, 7); });\n  ctx.fillStyle = \"#FF8A3D\";\n  [[-16, 44], [16, 44]].forEach(([lx, ly]) => { 圆角矩形(lx - 9, ly, 18, 11, 5); });\n  // 垂耳：从头两侧下垂的胶囊耳（正旋转=下垂；负旋转会变成翅耳）\n  ctx.fillStyle = \"#FF8A3D\";\n  ctx.beginPath(); ctx.ellipse(-48, -48, 13, 30, 0.35, 0, Math.PI * 2); ctx.fill();\n  ctx.beginPath(); ctx.ellipse(48, -48, 13, 30, -0.35, 0, Math.PI * 2); ctx.fill();\n  ctx.fillStyle = \"#FFC08A\";\n  ctx.beginPath(); ctx.ellipse(-48, -46, 6, 18, 0.35, 0, Math.PI * 2); ctx.fill();\n  ctx.beginPath(); ctx.ellipse(48, -46, 6, 18, -0.35, 0, Math.PI * 2); ctx.fill();\n  // 头\n  ctx.fillStyle = \"#F4F6FA\"; 圆角矩形(-40, -88, 80, 72, 30);\n  ctx.strokeStyle = \"#C5CCD8\"; ctx.lineWidth = 2; ctx.beginPath();\n  (function(x,y,w,h,r){ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();})(-40,-88,80,72,30); ctx.stroke();\n  ctx.fillStyle = \"rgba(255,255,255,.55)\"; ctx.beginPath(); ctx.ellipse(-14, -70, 16, 8, -0.3, 0, Math.PI * 2); ctx.fill();\n  // 黑面罩\n  ctx.fillStyle = \"#141820\"; ctx.beginPath(); ctx.ellipse(0, -52, 28, 22, 0, 0, Math.PI * 2); ctx.fill();\n  // 四角星星眼 ✦\n  ctx.fillStyle = \"#5BE0FF\";\n  for (const [ex, ey] of [[-12, -54], [12, -54]]) {\n    ctx.beginPath();\n    const outer = 9, inner = 9 * 0.38;\n    for (let i = 0; i < 8; i++) {\n      const a = -Math.PI / 2 + i * Math.PI / 4;\n      const rad = i % 2 === 0 ? outer : inner;\n      const x = ex + Math.cos(a) * rad, y = ey + Math.sin(a) * rad;\n      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);\n    }\n    ctx.closePath(); ctx.fill();\n  }\n  // 像素小嘴\n  [[-5, -40], [-1, -38], [3, -40]].forEach(([mx, my]) => { 圆角矩形(mx, my, 2.6, 2.2, 0.4); });\n  // 天线：橙底座 + 白杆 + 白球\n  ctx.fillStyle = \"#FF8A3D\"; ctx.beginPath(); ctx.ellipse(0, -88, 7, 4, 0, 0, Math.PI * 2); ctx.fill();\n  ctx.strokeStyle = \"#F2F4F8\"; ctx.lineWidth = 4; ctx.lineCap = \"round\";\n  ctx.beginPath(); ctx.moveTo(0, -88); ctx.lineTo(0, -104); ctx.stroke();\n  ctx.fillStyle = \"#FFFFFF\"; ctx.strokeStyle = \"#D0D6E2\"; ctx.lineWidth = 1;\n  ctx.beginPath(); ctx.arc(0, -106, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();\n  ctx.restore();\n}\nfunction 圆角矩形(x, y, w, h, r) {\n  r = Math.min(r, w / 2, h / 2);\n  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);\n  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); ctx.fill();\n}\nfunction 画表情(文字, x, y, 大小) {\n  ctx.font = 大小 + 'px \"Apple Color Emoji\",\"Segoe UI Emoji\",\"Noto Color Emoji\",sans-serif';\n  ctx.fillStyle = \"#000\"; ctx.textAlign = \"center\"; ctx.textBaseline = \"middle\"; ctx.fillText(文字, x, y);\n}\nfunction 画文字(文字, x, y, 大小, 颜色, 对齐) {\n  ctx.fillStyle = 颜色; ctx.font = \"bold \" + 大小 + 'px \"PingFang SC\",\"Microsoft YaHei\",sans-serif';\n  ctx.textAlign = 对齐 || \"center\"; ctx.textBaseline = \"middle\"; ctx.fillText(文字, x, y);\n}\nfunction 画按钮() {\n  if (操作.屏幕按钮) {\n    for (const 按钮 of 按钮们) {\n      ctx.fillStyle = 按住的按钮 === 按钮 ? \"rgba(30,42,74,0.75)\" : \"rgba(30,42,74,0.4)\";\n      ctx.beginPath(); ctx.arc(按钮.x, 按钮.y, 36, 0, Math.PI * 2); ctx.fill();\n      画文字({ 上: \"↑\", 下: \"↓\", 左: \"←\", 右: \"→\" }[按钮.名字], 按钮.x, 按钮.y + 2, 36, \"#FFFFFF\");\n    }\n  }\n  if (操作.冲刺) {\n    ctx.fillStyle = 冲刺时间 > 0 ? \"rgba(255,138,61,0.5)\" : \"#FF8A3D\";\n    ctx.beginPath(); ctx.arc(冲按钮.x, 冲按钮.y, 冲按钮.半径, 0, Math.PI * 2); ctx.fill();\n    画文字(\"冲\", 冲按钮.x, 冲按钮.y, 30, \"#FFFFFF\");\n  }\n}\n\nfunction 画() {\n  画背景();\n  画狗窝();\n  if (目标) { ctx.strokeStyle = \"rgba(30,42,74,0.35)\"; ctx.lineWidth = 3; ctx.setLineDash([8, 8]); ctx.beginPath(); ctx.moveTo(狗.x, 狗.y - 25); ctx.lineTo(目标.x, 目标.y); ctx.stroke(); ctx.setLineDash([]); }\n  for (const 东西 of 东西们) 画表情(东西.图案, 东西.x, 东西.y, 48);\n  const 显示狗 = 闪烁 === 0 || Math.floor(闪烁 / 6) % 2 === 0;\n  if (显示狗) {\n    if (设置.主角 === \"比特\") 画比特(狗.x, 狗.y, 设置.主角大小);\n    else 画表情(设置.主角, 狗.x, 狗.y - 设置.主角大小 * 0.45, 设置.主角大小);\n  }\n  for (const 字 of 飘字们) { ctx.globalAlpha = 字.寿命 / 50; 画文字(字.文字, 字.x, 字.y, 30, 字.颜色); 字.y -= 1; 字.寿命--; ctx.globalAlpha = 1; }\n  飘字们 = 飘字们.filter(字 => 字.寿命 > 0);\n  const 字色 = 设置.背景 === \"夜晚\" ? \"#FFFFFF\" : \"#1E2A4A\";\n  if (状态 === \"玩\") {\n    画按钮();\n    if (设置.显示分数) 画文字(\"分数 \" + 分数, 24, 36, 32, 字色, \"left\");\n    if (设置.生命 > 0) 画文字(\"生命 \" + \"♥\".repeat(Math.max(0, 剩余生命)), 24, 76, 28, \"#E5484D\", \"left\");\n    if (设置.倒计时 > 0) 画文字(\"倒计时 \" + Math.ceil(剩余时间), W / 2, 36, 32, 字色);\n    if (设置.关卡) 画文字(\"第 \" + 第几关 + \" 关\", W - 190, 36, 30, 字色, \"right\");\n    if (横幅 > 0 && 设置.关卡) { ctx.globalAlpha = Math.min(1, 横幅 / 30); 画文字(\"第 \" + 第几关 + \" 关\", W / 2, H / 2 - 20, 72, \"#FF8A3D\"); ctx.globalAlpha = 1; }\n    const 能动 = 操作.方向键 || 操作.屏幕按钮 || 操作.点哪走哪 || 操作.拖着走;\n    if (!能动 && 没动的时间 > 120) 画文字(\"比特还不会动……怎么让它听你的指挥？\", W / 2, H - 40, 28, 字色);\n  }\n  if (状态 === \"准备\") {\n    ctx.fillStyle = \"rgba(255,255,255,0.6)\"; ctx.fillRect(0, H / 2 - 80, W, 140);\n    画文字(\"把比特送回狗窝\", W / 2, H / 2 - 30, 52, \"#1E2A4A\");\n    画文字(\"点一下，开始\", W / 2, H / 2 + 30, 30, \"#5B6683\");\n  }\n  if (状态 === \"结束\" || 状态 === \"回家了\") {\n    ctx.fillStyle = 状态 === \"回家了\" ? \"rgba(24,168,124,0.6)\" : \"rgba(30,42,74,0.55)\"; ctx.fillRect(0, 0, W, H);\n    画文字(结束原因, W / 2, H / 2 - 50, 64, \"#FFFFFF\");\n    if (设置.显示分数) 画文字(\"得分 \" + 分数, W / 2, H / 2 + 20, 44, \"#FFC93D\");\n    画文字(\"点一下，再来一次\", W / 2, H / 2 + 80, 30, \"#FFFFFF\");\n  }\n}\n\nfunction 游戏循环() { 更新(); 画(); requestAnimationFrame(游戏循环); }\n放东西();\n游戏循环();\n<\/script>\n<\/body>\n<\/html>\n", "比特回家-完整版.html": "<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, user-scalable=no\">\n<title>比特回家<\/title>\n<style>\n  html, body { margin: 0; height: 100%; background: #FFF7EC; font-family: \"PingFang SC\", \"Microsoft YaHei\", sans-serif; color: #1E2A4A; touch-action: none; -webkit-user-select: none; user-select: none; }\n  #box { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }\n  h1 { margin: 0; font-size: 28px; }\n  canvas { width: min(96vw, 160vh); max-height: 82vh; aspect-ratio: 16 / 9; border-radius: 18px; box-shadow: 0 6px 0 #F0E2CC; background: #BFE6A8; touch-action: none; }\n  p { margin: 0; color: #5B6683; font-size: 18px; }\n<\/style>\n<\/head>\n<body>\n<div id=\"box\">\n  <h1>比特回家<\/h1>\n  <canvas id=\"game\" width=\"960\" height=\"540\"><\/canvas>\n  <p>带比特回家：捡骨头，躲开猫<\/p>\n<\/div>\n\n<script>\n// ===== 游戏设置：想改游戏，先改这里 =====\nconst 设置 = {\n  主角: \"比特\",        // \"比特\" 是驯狗学院的机器狗；也可以换成表情，比如 \"🐰\"\n  主角大小: 70,        // 数字越大，主角越大\n  背景: \"草地\",        // 可以填 \"草地\"、\"夜晚\"、\"雪地\"\n  走路速度: 4,         // 数字越大，走得越快\n  显示分数: true,     // 是否显示分数\n  生命: 3,             // 有几条命；填 0 表示不算命\n  倒计时: 60,           // 游戏时间（秒）；填 0 表示不限时\n  关卡: false,         // 回到狗窝以后，是不是进下一关（每一关多一只猫，猫跑得快一点）\n  最后一关: 3,         // 打通第几关算通关\n};\n\n// ===== 怎么指挥比特：每一种操作，就是一个「事件」 =====\n// 发生一件事（按下按键、点到屏幕），程序就去做一件事（比特走一步）\n// true = 打开，false = 关着\nconst 操作 = {\n  方向键: true,      // 按键盘上的方向键走（电脑上用）\n  屏幕按钮: true,    // 屏幕右下角出现四个箭头按钮，按住就走（平板上用）\n  点哪走哪: true,    // 点一下屏幕，比特走到那里\n  拖着走: false,      // 手指按住比特，拖到哪里走到哪里\n  冲刺: false,        // 按空格键或屏幕上的「冲」按钮：3 秒内跑得飞快\n};\n\n// ===== 场上的东西：碰到了会发生什么，写在「碰到会」里 =====\n// 碰到会：\"\"（什么也不发生）、\"加分\"、\"扣命\"、\"变慢\"、\"变快\"、\"结束\"\n// 加几分：碰到会 \"加分\" 时加几分；几秒：碰到会 \"变慢\" 或 \"变快\" 时持续几秒\n// 数量：每一关放几个；会动：会不会走来走去\nconst 场上的东西 = [\n  { 名字: \"骨头\", 图案: \"🦴\", 数量: 5, 碰到会: \"加分\", 加几分: 1, 会动: false },\n  { 名字: \"水坑\", 图案: \"💧\", 数量: 3, 碰到会: \"变慢\", 几秒: 3, 会动: false },\n  { 名字: \"猫\", 图案: \"🐱\", 数量: 1, 碰到会: \"扣命\", 会动: true },\n];\n\n// ===== 下面是游戏程序 =====\nconst canvas = document.getElementById(\"game\");\nconst ctx = canvas.getContext(\"2d\");\nconst W = canvas.width, H = canvas.height;\nconst 狗窝 = { x: W - 90, y: 90 };\nconst 起点 = { x: 90, y: H - 80 };\n\nlet 状态 = \"准备\";          // \"准备\"、\"玩\"、\"结束\"、\"回家了\"\nlet 分数 = 0, 剩余生命 = 设置.生命, 剩余时间 = 设置.倒计时, 第几关 = 1;\nlet 东西们 = [], 飘字们 = [], 闪烁 = 0, 慢的时间 = 0, 快的时间 = 0, 冲刺时间 = 0, 结束原因 = \"\", 横幅 = 0, 帧数 = 0, 没动的时间 = 0;\nconst 狗 = { x: 起点.x, y: 起点.y };\nlet 目标 = null, 拖着 = false;\nconst 按着 = {};\n\n// 按出现位置放东西：不放在起点和狗窝旁边\nfunction 放东西() {\n  东西们 = [];\n  for (const 东西 of 场上的东西) {\n    let 个数 = 东西.数量 || 1;\n    if (设置.关卡 && 东西.会动) 个数 += 第几关 - 1;   // 每一关多一只会动的\n    for (let i = 0; i < 个数; i++) {\n      let x, y, 试 = 0;\n      do { x = 80 + Math.random() * (W - 160); y = 80 + Math.random() * (H - 160); 试++; }\n      while (试 < 50 && (Math.hypot(x - 起点.x, y - 起点.y) < 150 || Math.hypot(x - 狗窝.x, y - 狗窝.y) < 140));\n      const 角度 = Math.random() * Math.PI * 2, 快慢 = 1.4 + (设置.关卡 ? (第几关 - 1) * 0.6 : 0);\n      东西们.push(Object.assign({}, 东西, { x, y, vx: 东西.会动 ? Math.cos(角度) * 快慢 : 0, vy: 东西.会动 ? Math.sin(角度) * 快慢 : 0 }));\n    }\n  }\n}\n\nfunction 重新开始() {\n  分数 = 0; 剩余生命 = 设置.生命; 剩余时间 = 设置.倒计时; 第几关 = 1;\n  狗.x = 起点.x; 狗.y = 起点.y; 目标 = null; 闪烁 = 0; 慢的时间 = 0; 快的时间 = 0; 冲刺时间 = 0; 没动的时间 = 0;\n  飘字们 = []; 放东西(); 横幅 = 设置.关卡 ? 90 : 0;\n  状态 = \"玩\";\n}\n\nfunction 飘字(文字, x, y, 颜色) { 飘字们.push({ 文字, x, y, 颜色, 寿命: 50 }); }\n\n// 屏幕坐标换成游戏里的坐标\nfunction 位置(e) {\n  const r = canvas.getBoundingClientRect();\n  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };\n}\n\n// 屏幕右下角的按钮\nconst 按钮们 = [\n  { 名字: \"上\", x: W - 130, y: H - 165, dx: 0, dy: -1 },\n  { 名字: \"下\", x: W - 130, y: H - 55, dx: 0, dy: 1 },\n  { 名字: \"左\", x: W - 185, y: H - 110, dx: -1, dy: 0 },\n  { 名字: \"右\", x: W - 75, y: H - 110, dx: 1, dy: 0 },\n];\nconst 冲按钮 = { x: 80, y: H - 80, 半径: 46 };\nlet 按住的按钮 = null;\n\n// ===== 事件：手指或鼠标按下 =====\ncanvas.addEventListener(\"pointerdown\", e => {\n  e.preventDefault();\n  const p = 位置(e);\n  if (状态 !== \"玩\") { 重新开始(); return; }\n  if (操作.冲刺 && Math.hypot(p.x - 冲按钮.x, p.y - 冲按钮.y) < 冲按钮.半径 + 8) { 开始冲刺(); return; }\n  if (操作.屏幕按钮) {\n    for (const 按钮 of 按钮们) if (Math.hypot(p.x - 按钮.x, p.y - 按钮.y) < 44) { 按住的按钮 = 按钮; return; }\n  }\n  if (操作.拖着走 && Math.hypot(p.x - 狗.x, p.y - (狗.y - 30)) < 80) { 拖着 = true; return; }\n  if (操作.点哪走哪) 目标 = p;\n});\ncanvas.addEventListener(\"pointermove\", e => { if (拖着 && 操作.拖着走) { const p = 位置(e); 狗.x = p.x; 狗.y = p.y + 30; } });\nwindow.addEventListener(\"pointerup\", () => { 按住的按钮 = null; 拖着 = false; });\n\n// ===== 事件：按下键盘 =====\ndocument.addEventListener(\"keydown\", e => {\n  if (状态 !== \"玩\" && (e.key === \" \" || e.key === \"Enter\")) { 重新开始(); return; }\n  if (操作.方向键 && [\"ArrowUp\", \"ArrowDown\", \"ArrowLeft\", \"ArrowRight\"].includes(e.key)) { 按着[e.key] = true; e.preventDefault(); }\n  if (操作.冲刺 && e.key === \" \") { 开始冲刺(); e.preventDefault(); }\n});\ndocument.addEventListener(\"keyup\", e => { 按着[e.key] = false; });\n\nfunction 开始冲刺() { if (冲刺时间 <= 0) { 冲刺时间 = 180; 飘字(\"冲！\", 狗.x, 狗.y - 90, \"#FF8A3D\"); } }\n\n// 比特碰到场上的东西时，会发生什么\nfunction 碰到(东西) {\n  if (东西.碰到会 === \"加分\") {\n    东西.不见了 = true; 分数 += 东西.加几分 || 1;\n    飘字(\"+\" + (东西.加几分 || 1), 东西.x, 东西.y - 40, \"#18A87C\");\n  } else if (东西.碰到会 === \"扣命\") {\n    if (闪烁 > 0) return;\n    闪烁 = 90;\n    if (设置.生命 > 0) {\n      剩余生命 -= 1; 飘字(\"−1 命\", 东西.x, 东西.y - 40, \"#E5484D\");\n      if (剩余生命 <= 0) { 状态 = \"结束\"; 结束原因 = \"没有命了\"; }\n    } else { 状态 = \"结束\"; 结束原因 = \"碰到\" + 东西.名字 + \"了\"; }\n  } else if (东西.碰到会 === \"变慢\") {\n    if (慢的时间 <= 0) 飘字(\"变慢了\", 狗.x, 狗.y - 90, \"#2366D1\");\n    慢的时间 = (东西.几秒 || 3) * 60;\n  } else if (东西.碰到会 === \"变快\") {\n    东西.不见了 = true; 快的时间 = (东西.几秒 || 3) * 60; 飘字(\"变快！\", 狗.x, 狗.y - 90, \"#FF8A3D\");\n  } else if (东西.碰到会 === \"结束\") {\n    状态 = \"结束\"; 结束原因 = \"碰到\" + 东西.名字 + \"了\";\n  }\n}\n\n// 回到狗窝\nfunction 到家了() {\n  if (设置.关卡 && 第几关 < 设置.最后一关) {\n    第几关 += 1; 分数 += 5; 飘字(\"第 \" + 第几关 + \" 关！\", W / 2, H / 2, \"#FF8A3D\");\n    狗.x = 起点.x; 狗.y = 起点.y; 目标 = null; 放东西(); 横幅 = 90;\n    if (设置.倒计时 > 0) 剩余时间 = 设置.倒计时;\n    return;\n  }\n  状态 = \"回家了\"; 结束原因 = 设置.关卡 ? \"通关！\" : \"回家了！\";\n}\n\nfunction 更新() {\n  帧数++;\n  if (状态 !== \"玩\") return;\n  let 速度 = 设置.走路速度;\n  if (慢的时间 > 0) { 速度 *= 0.45; 慢的时间--; }\n  if (快的时间 > 0) { 速度 *= 1.8; 快的时间--; }\n  if (冲刺时间 > 0) { 速度 *= 2; 冲刺时间--; }\n\n  // 按方向键或屏幕按钮：往那边走\n  let dx = 0, dy = 0;\n  if (操作.方向键) {\n    if (按着.ArrowLeft) dx -= 1; if (按着.ArrowRight) dx += 1;\n    if (按着.ArrowUp) dy -= 1; if (按着.ArrowDown) dy += 1;\n  }\n  if (操作.屏幕按钮 && 按住的按钮) { dx += 按住的按钮.dx; dy += 按住的按钮.dy; }\n  if (dx || dy) { const 长 = Math.hypot(dx, dy); 狗.x += dx / 长 * 速度; 狗.y += dy / 长 * 速度; 目标 = null; }\n  // 点了屏幕：走到点的地方\n  if (目标 && 操作.点哪走哪) {\n    const 距离 = Math.hypot(目标.x - 狗.x, 目标.y - 狗.y);\n    if (距离 < 速度) 目标 = null; else { 狗.x += (目标.x - 狗.x) / 距离 * 速度; 狗.y += (目标.y - 狗.y) / 距离 * 速度; }\n  }\n  狗.x = Math.max(30, Math.min(W - 30, 狗.x)); 狗.y = Math.max(60, Math.min(H - 10, 狗.y));\n  if (dx || dy || 目标 || 拖着) 没动的时间 = 0; else 没动的时间++;\n\n  // 会动的东西走来走去，碰到边就掉头\n  for (const 东西 of 东西们) {\n    if (!东西.会动) continue;\n    东西.x += 东西.vx; 东西.y += 东西.vy;\n    if (东西.x < 40 || 东西.x > W - 40) 东西.vx *= -1;\n    if (东西.y < 50 || 东西.y > H - 40) 东西.vy *= -1;\n  }\n  // 碰到了吗？\n  for (const 东西 of 东西们) {\n    if (!东西.不见了 && Math.hypot(东西.x - 狗.x, 东西.y - (狗.y - 25)) < 48) 碰到(东西);\n    if (状态 !== \"玩\") return;\n  }\n  东西们 = 东西们.filter(东西 => !东西.不见了);\n  if (Math.hypot(狗窝.x - 狗.x, 狗窝.y - (狗.y - 25)) < 60) 到家了();\n\n  if (设置.倒计时 > 0) {\n    剩余时间 -= 1 / 60;\n    if (剩余时间 <= 0) { 剩余时间 = 0; 状态 = \"结束\"; 结束原因 = \"时间到\"; }\n  }\n  if (闪烁 > 0) 闪烁--;\n  if (横幅 > 0) 横幅--;\n}\n\n// ===== 画画 =====\nfunction 画背景() {\n  const 颜色 = { 草地: [\"#BFE6A8\", \"#A9D891\"], 夜晚: [\"#24345A\", \"#2D4170\"], 雪地: [\"#F4F8FF\", \"#DDE8F7\"] }[设置.背景] || [\"#BFE6A8\", \"#A9D891\"];\n  ctx.fillStyle = 颜色[0]; ctx.fillRect(0, 0, W, H);\n  ctx.fillStyle = 颜色[1];\n  for (let i = 0; i < 26; i++) { ctx.beginPath(); ctx.arc((i * 151) % W, (i * 89) % H, 18 + (i % 3) * 6, 0, Math.PI * 2); ctx.fill(); }\n  if (设置.背景 === \"夜晚\") { ctx.fillStyle = \"#FFFFFF\"; for (let i = 0; i < 30; i++) ctx.fillRect((i * 97) % W, (i * 53) % H, 3, 3); }\n}\nfunction 画狗窝() {\n  ctx.fillStyle = \"rgba(0,0,0,0.12)\"; ctx.beginPath(); ctx.ellipse(狗窝.x, 狗窝.y + 44, 64, 12, 0, 0, Math.PI * 2); ctx.fill();\n  ctx.fillStyle = \"#E0681C\"; ctx.beginPath(); ctx.moveTo(狗窝.x - 66, 狗窝.y - 6); ctx.lineTo(狗窝.x, 狗窝.y - 62); ctx.lineTo(狗窝.x + 66, 狗窝.y - 6); ctx.closePath(); ctx.fill();\n  ctx.fillStyle = \"#FFB27A\"; 圆角矩形(狗窝.x - 52, 狗窝.y - 10, 104, 56, 8);\n  ctx.fillStyle = \"#1E2A4A\"; 圆角矩形(狗窝.x - 20, 狗窝.y + 6, 40, 40, 18);\n  画文字(\"家\", 狗窝.x, 狗窝.y - 26, 22, \"#FFFFFF\");\n}\nfunction 画比特(x, y, 大小) {\n  const s = 大小 / 100;\n  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);\n  // 影子\n  ctx.fillStyle = \"rgba(36,48,94,.16)\"; ctx.beginPath(); ctx.ellipse(0, 54, 40, 6, 0, 0, Math.PI * 2); ctx.fill();\n  // 后腿\n  ctx.fillStyle = \"#F4F6FA\"; ctx.strokeStyle = \"#C5CCD8\"; ctx.lineWidth = 1.5;\n  [[-28, 20], [28, 20]].forEach(([lx, ly]) => { 圆角矩形(lx - 8, ly, 16, 26, 8); });\n  ctx.fillStyle = \"#FF8A3D\";\n  [[-28, 42], [28, 42]].forEach(([lx, ly]) => { 圆角矩形(lx - 10, ly, 20, 12, 5); });\n  // 尾巴\n  ctx.strokeStyle = \"#FF8A3D\"; ctx.lineWidth = 9; ctx.lineCap = \"round\";\n  ctx.beginPath(); ctx.moveTo(26, 8); ctx.quadraticCurveTo(44, 14, 40, 30); ctx.stroke();\n  // 身体\n  ctx.fillStyle = \"#F4F6FA\"; 圆角矩形(-34, -18, 68, 56, 22);\n  ctx.strokeStyle = \"#C5CCD8\"; ctx.lineWidth = 2; ctx.beginPath();\n  (function(x,y,w,h,r){ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();})(-34,-18,68,56,22); ctx.stroke();\n  // 橙心 <\/>\n  ctx.fillStyle = \"#FF8A3D\";\n  ctx.beginPath();\n  ctx.moveTo(0, 22); ctx.bezierCurveTo(-18, 8, -26, -4, -16, -12); ctx.bezierCurveTo(-10, -16, -4, -12, 0, -6);\n  ctx.bezierCurveTo(4, -12, 10, -16, 16, -12); ctx.bezierCurveTo(26, -4, 18, 8, 0, 22);\n  ctx.fill();\n  ctx.strokeStyle = \"#fff\"; ctx.lineWidth = 2.4; ctx.lineCap = \"round\"; ctx.lineJoin = \"round\";\n  ctx.beginPath(); ctx.moveTo(-9, -14); ctx.lineTo(-15, -8); ctx.lineTo(-9, -2); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(-2.5, -14); ctx.lineTo(2.5, -2); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(9, -14); ctx.lineTo(15, -8); ctx.lineTo(9, -2); ctx.stroke();\n  // 前腿\n  ctx.fillStyle = \"#F4F6FA\";\n  [[-16, 24], [16, 24]].forEach(([lx, ly]) => { 圆角矩形(lx - 7, ly, 14, 24, 7); });\n  ctx.fillStyle = \"#FF8A3D\";\n  [[-16, 44], [16, 44]].forEach(([lx, ly]) => { 圆角矩形(lx - 9, ly, 18, 11, 5); });\n  // 垂耳：从头两侧下垂的胶囊耳（正旋转=下垂；负旋转会变成翅耳）\n  ctx.fillStyle = \"#FF8A3D\";\n  ctx.beginPath(); ctx.ellipse(-48, -48, 13, 30, 0.35, 0, Math.PI * 2); ctx.fill();\n  ctx.beginPath(); ctx.ellipse(48, -48, 13, 30, -0.35, 0, Math.PI * 2); ctx.fill();\n  ctx.fillStyle = \"#FFC08A\";\n  ctx.beginPath(); ctx.ellipse(-48, -46, 6, 18, 0.35, 0, Math.PI * 2); ctx.fill();\n  ctx.beginPath(); ctx.ellipse(48, -46, 6, 18, -0.35, 0, Math.PI * 2); ctx.fill();\n  // 头\n  ctx.fillStyle = \"#F4F6FA\"; 圆角矩形(-40, -88, 80, 72, 30);\n  ctx.strokeStyle = \"#C5CCD8\"; ctx.lineWidth = 2; ctx.beginPath();\n  (function(x,y,w,h,r){ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();})(-40,-88,80,72,30); ctx.stroke();\n  ctx.fillStyle = \"rgba(255,255,255,.55)\"; ctx.beginPath(); ctx.ellipse(-14, -70, 16, 8, -0.3, 0, Math.PI * 2); ctx.fill();\n  // 黑面罩\n  ctx.fillStyle = \"#141820\"; ctx.beginPath(); ctx.ellipse(0, -52, 28, 22, 0, 0, Math.PI * 2); ctx.fill();\n  // 四角星星眼 ✦\n  ctx.fillStyle = \"#5BE0FF\";\n  for (const [ex, ey] of [[-12, -54], [12, -54]]) {\n    ctx.beginPath();\n    const outer = 9, inner = 9 * 0.38;\n    for (let i = 0; i < 8; i++) {\n      const a = -Math.PI / 2 + i * Math.PI / 4;\n      const rad = i % 2 === 0 ? outer : inner;\n      const x = ex + Math.cos(a) * rad, y = ey + Math.sin(a) * rad;\n      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);\n    }\n    ctx.closePath(); ctx.fill();\n  }\n  // 像素小嘴\n  [[-5, -40], [-1, -38], [3, -40]].forEach(([mx, my]) => { 圆角矩形(mx, my, 2.6, 2.2, 0.4); });\n  // 天线：橙底座 + 白杆 + 白球\n  ctx.fillStyle = \"#FF8A3D\"; ctx.beginPath(); ctx.ellipse(0, -88, 7, 4, 0, 0, Math.PI * 2); ctx.fill();\n  ctx.strokeStyle = \"#F2F4F8\"; ctx.lineWidth = 4; ctx.lineCap = \"round\";\n  ctx.beginPath(); ctx.moveTo(0, -88); ctx.lineTo(0, -104); ctx.stroke();\n  ctx.fillStyle = \"#FFFFFF\"; ctx.strokeStyle = \"#D0D6E2\"; ctx.lineWidth = 1;\n  ctx.beginPath(); ctx.arc(0, -106, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();\n  ctx.restore();\n}\nfunction 圆角矩形(x, y, w, h, r) {\n  r = Math.min(r, w / 2, h / 2);\n  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);\n  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); ctx.fill();\n}\nfunction 画表情(文字, x, y, 大小) {\n  ctx.font = 大小 + 'px \"Apple Color Emoji\",\"Segoe UI Emoji\",\"Noto Color Emoji\",sans-serif';\n  ctx.fillStyle = \"#000\"; ctx.textAlign = \"center\"; ctx.textBaseline = \"middle\"; ctx.fillText(文字, x, y);\n}\nfunction 画文字(文字, x, y, 大小, 颜色, 对齐) {\n  ctx.fillStyle = 颜色; ctx.font = \"bold \" + 大小 + 'px \"PingFang SC\",\"Microsoft YaHei\",sans-serif';\n  ctx.textAlign = 对齐 || \"center\"; ctx.textBaseline = \"middle\"; ctx.fillText(文字, x, y);\n}\nfunction 画按钮() {\n  if (操作.屏幕按钮) {\n    for (const 按钮 of 按钮们) {\n      ctx.fillStyle = 按住的按钮 === 按钮 ? \"rgba(30,42,74,0.75)\" : \"rgba(30,42,74,0.4)\";\n      ctx.beginPath(); ctx.arc(按钮.x, 按钮.y, 36, 0, Math.PI * 2); ctx.fill();\n      画文字({ 上: \"↑\", 下: \"↓\", 左: \"←\", 右: \"→\" }[按钮.名字], 按钮.x, 按钮.y + 2, 36, \"#FFFFFF\");\n    }\n  }\n  if (操作.冲刺) {\n    ctx.fillStyle = 冲刺时间 > 0 ? \"rgba(255,138,61,0.5)\" : \"#FF8A3D\";\n    ctx.beginPath(); ctx.arc(冲按钮.x, 冲按钮.y, 冲按钮.半径, 0, Math.PI * 2); ctx.fill();\n    画文字(\"冲\", 冲按钮.x, 冲按钮.y, 30, \"#FFFFFF\");\n  }\n}\n\nfunction 画() {\n  画背景();\n  画狗窝();\n  if (目标) { ctx.strokeStyle = \"rgba(30,42,74,0.35)\"; ctx.lineWidth = 3; ctx.setLineDash([8, 8]); ctx.beginPath(); ctx.moveTo(狗.x, 狗.y - 25); ctx.lineTo(目标.x, 目标.y); ctx.stroke(); ctx.setLineDash([]); }\n  for (const 东西 of 东西们) 画表情(东西.图案, 东西.x, 东西.y, 48);\n  const 显示狗 = 闪烁 === 0 || Math.floor(闪烁 / 6) % 2 === 0;\n  if (显示狗) {\n    if (设置.主角 === \"比特\") 画比特(狗.x, 狗.y, 设置.主角大小);\n    else 画表情(设置.主角, 狗.x, 狗.y - 设置.主角大小 * 0.45, 设置.主角大小);\n  }\n  for (const 字 of 飘字们) { ctx.globalAlpha = 字.寿命 / 50; 画文字(字.文字, 字.x, 字.y, 30, 字.颜色); 字.y -= 1; 字.寿命--; ctx.globalAlpha = 1; }\n  飘字们 = 飘字们.filter(字 => 字.寿命 > 0);\n  const 字色 = 设置.背景 === \"夜晚\" ? \"#FFFFFF\" : \"#1E2A4A\";\n  if (状态 === \"玩\") {\n    画按钮();\n    if (设置.显示分数) 画文字(\"分数 \" + 分数, 24, 36, 32, 字色, \"left\");\n    if (设置.生命 > 0) 画文字(\"生命 \" + \"♥\".repeat(Math.max(0, 剩余生命)), 24, 76, 28, \"#E5484D\", \"left\");\n    if (设置.倒计时 > 0) 画文字(\"倒计时 \" + Math.ceil(剩余时间), W / 2, 36, 32, 字色);\n    if (设置.关卡) 画文字(\"第 \" + 第几关 + \" 关\", W - 190, 36, 30, 字色, \"right\");\n    if (横幅 > 0 && 设置.关卡) { ctx.globalAlpha = Math.min(1, 横幅 / 30); 画文字(\"第 \" + 第几关 + \" 关\", W / 2, H / 2 - 20, 72, \"#FF8A3D\"); ctx.globalAlpha = 1; }\n    const 能动 = 操作.方向键 || 操作.屏幕按钮 || 操作.点哪走哪 || 操作.拖着走;\n    if (!能动 && 没动的时间 > 120) 画文字(\"比特还不会动……怎么让它听你的指挥？\", W / 2, H - 40, 28, 字色);\n  }\n  if (状态 === \"准备\") {\n    ctx.fillStyle = \"rgba(255,255,255,0.6)\"; ctx.fillRect(0, H / 2 - 80, W, 140);\n    画文字(\"把比特送回狗窝\", W / 2, H / 2 - 30, 52, \"#1E2A4A\");\n    画文字(\"点一下，开始\", W / 2, H / 2 + 30, 30, \"#5B6683\");\n  }\n  if (状态 === \"结束\" || 状态 === \"回家了\") {\n    ctx.fillStyle = 状态 === \"回家了\" ? \"rgba(24,168,124,0.6)\" : \"rgba(30,42,74,0.55)\"; ctx.fillRect(0, 0, W, H);\n    画文字(结束原因, W / 2, H / 2 - 50, 64, \"#FFFFFF\");\n    if (设置.显示分数) 画文字(\"得分 \" + 分数, W / 2, H / 2 + 20, 44, \"#FFC93D\");\n    画文字(\"点一下，再来一次\", W / 2, H / 2 + 80, 30, \"#FFFFFF\");\n  }\n}\n\nfunction 游戏循环() { 更新(); 画(); requestAnimationFrame(游戏循环); }\n放东西();\n游戏循环();\n<\/script>\n<\/body>\n<\/html>\n", "比特回家.html": "<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, user-scalable=no\">\n<title>比特回家<\/title>\n<style>\n  html, body { margin: 0; height: 100%; background: #FFF7EC; font-family: \"PingFang SC\", \"Microsoft YaHei\", sans-serif; color: #1E2A4A; touch-action: none; -webkit-user-select: none; user-select: none; }\n  #box { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }\n  h1 { margin: 0; font-size: 28px; }\n  canvas { width: min(96vw, 160vh); max-height: 82vh; aspect-ratio: 16 / 9; border-radius: 18px; box-shadow: 0 6px 0 #F0E2CC; background: #BFE6A8; touch-action: none; }\n  p { margin: 0; color: #5B6683; font-size: 18px; }\n<\/style>\n<\/head>\n<body>\n<div id=\"box\">\n  <h1>比特回家<\/h1>\n  <canvas id=\"game\" width=\"960\" height=\"540\"><\/canvas>\n  <p>怎么让比特动起来？<\/p>\n<\/div>\n\n<script>\n// ===== 游戏设置：想改游戏，先改这里 =====\nconst 设置 = {\n  主角: \"比特\",        // \"比特\" 是驯狗学院的机器狗；也可以换成表情，比如 \"🐰\"\n  主角大小: 70,        // 数字越大，主角越大\n  背景: \"草地\",        // 可以填 \"草地\"、\"夜晚\"、\"雪地\"\n  走路速度: 4,         // 数字越大，走得越快\n  显示分数: false,     // 是否显示分数\n  生命: 0,             // 有几条命；填 0 表示不算命\n  倒计时: 0,           // 游戏时间（秒）；填 0 表示不限时\n  关卡: false,         // 回到狗窝以后，是不是进下一关（每一关多一只猫，猫跑得快一点）\n  最后一关: 3,         // 打通第几关算通关\n};\n\n// ===== 怎么指挥比特：每一种操作，就是一个「事件」 =====\n// 发生一件事（按下按键、点到屏幕），程序就去做一件事（比特走一步）\n// true = 打开，false = 关着\nconst 操作 = {\n  方向键: false,      // 按键盘上的方向键走（电脑上用）\n  屏幕按钮: false,    // 屏幕右下角出现四个箭头按钮，按住就走（平板上用）\n  点哪走哪: false,    // 点一下屏幕，比特走到那里\n  拖着走: false,      // 手指按住比特，拖到哪里走到哪里\n  冲刺: false,        // 按空格键或屏幕上的「冲」按钮：3 秒内跑得飞快\n};\n\n// ===== 场上的东西：碰到了会发生什么，写在「碰到会」里 =====\n// 碰到会：\"\"（什么也不发生）、\"加分\"、\"扣命\"、\"变慢\"、\"变快\"、\"结束\"\n// 加几分：碰到会 \"加分\" 时加几分；几秒：碰到会 \"变慢\" 或 \"变快\" 时持续几秒\n// 数量：每一关放几个；会动：会不会走来走去\nconst 场上的东西 = [\n  { 名字: \"骨头\", 图案: \"🦴\", 数量: 5, 碰到会: \"\", 会动: false },\n  { 名字: \"水坑\", 图案: \"💧\", 数量: 3, 碰到会: \"\", 会动: false },\n  { 名字: \"猫\", 图案: \"🐱\", 数量: 1, 碰到会: \"\", 会动: true },\n];\n\n// ===== 下面是游戏程序 =====\nconst canvas = document.getElementById(\"game\");\nconst ctx = canvas.getContext(\"2d\");\nconst W = canvas.width, H = canvas.height;\nconst 狗窝 = { x: W - 90, y: 90 };\nconst 起点 = { x: 90, y: H - 80 };\n\nlet 状态 = \"准备\";          // \"准备\"、\"玩\"、\"结束\"、\"回家了\"\nlet 分数 = 0, 剩余生命 = 设置.生命, 剩余时间 = 设置.倒计时, 第几关 = 1;\nlet 东西们 = [], 飘字们 = [], 闪烁 = 0, 慢的时间 = 0, 快的时间 = 0, 冲刺时间 = 0, 结束原因 = \"\", 横幅 = 0, 帧数 = 0, 没动的时间 = 0;\nconst 狗 = { x: 起点.x, y: 起点.y };\nlet 目标 = null, 拖着 = false;\nconst 按着 = {};\n\n// 按出现位置放东西：不放在起点和狗窝旁边\nfunction 放东西() {\n  东西们 = [];\n  for (const 东西 of 场上的东西) {\n    let 个数 = 东西.数量 || 1;\n    if (设置.关卡 && 东西.会动) 个数 += 第几关 - 1;   // 每一关多一只会动的\n    for (let i = 0; i < 个数; i++) {\n      let x, y, 试 = 0;\n      do { x = 80 + Math.random() * (W - 160); y = 80 + Math.random() * (H - 160); 试++; }\n      while (试 < 50 && (Math.hypot(x - 起点.x, y - 起点.y) < 150 || Math.hypot(x - 狗窝.x, y - 狗窝.y) < 140));\n      const 角度 = Math.random() * Math.PI * 2, 快慢 = 1.4 + (设置.关卡 ? (第几关 - 1) * 0.6 : 0);\n      东西们.push(Object.assign({}, 东西, { x, y, vx: 东西.会动 ? Math.cos(角度) * 快慢 : 0, vy: 东西.会动 ? Math.sin(角度) * 快慢 : 0 }));\n    }\n  }\n}\n\nfunction 重新开始() {\n  分数 = 0; 剩余生命 = 设置.生命; 剩余时间 = 设置.倒计时; 第几关 = 1;\n  狗.x = 起点.x; 狗.y = 起点.y; 目标 = null; 闪烁 = 0; 慢的时间 = 0; 快的时间 = 0; 冲刺时间 = 0; 没动的时间 = 0;\n  飘字们 = []; 放东西(); 横幅 = 设置.关卡 ? 90 : 0;\n  状态 = \"玩\";\n}\n\nfunction 飘字(文字, x, y, 颜色) { 飘字们.push({ 文字, x, y, 颜色, 寿命: 50 }); }\n\n// 屏幕坐标换成游戏里的坐标\nfunction 位置(e) {\n  const r = canvas.getBoundingClientRect();\n  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };\n}\n\n// 屏幕右下角的按钮\nconst 按钮们 = [\n  { 名字: \"上\", x: W - 130, y: H - 165, dx: 0, dy: -1 },\n  { 名字: \"下\", x: W - 130, y: H - 55, dx: 0, dy: 1 },\n  { 名字: \"左\", x: W - 185, y: H - 110, dx: -1, dy: 0 },\n  { 名字: \"右\", x: W - 75, y: H - 110, dx: 1, dy: 0 },\n];\nconst 冲按钮 = { x: 80, y: H - 80, 半径: 46 };\nlet 按住的按钮 = null;\n\n// ===== 事件：手指或鼠标按下 =====\ncanvas.addEventListener(\"pointerdown\", e => {\n  e.preventDefault();\n  const p = 位置(e);\n  if (状态 !== \"玩\") { 重新开始(); return; }\n  if (操作.冲刺 && Math.hypot(p.x - 冲按钮.x, p.y - 冲按钮.y) < 冲按钮.半径 + 8) { 开始冲刺(); return; }\n  if (操作.屏幕按钮) {\n    for (const 按钮 of 按钮们) if (Math.hypot(p.x - 按钮.x, p.y - 按钮.y) < 44) { 按住的按钮 = 按钮; return; }\n  }\n  if (操作.拖着走 && Math.hypot(p.x - 狗.x, p.y - (狗.y - 30)) < 80) { 拖着 = true; return; }\n  if (操作.点哪走哪) 目标 = p;\n});\ncanvas.addEventListener(\"pointermove\", e => { if (拖着 && 操作.拖着走) { const p = 位置(e); 狗.x = p.x; 狗.y = p.y + 30; } });\nwindow.addEventListener(\"pointerup\", () => { 按住的按钮 = null; 拖着 = false; });\n\n// ===== 事件：按下键盘 =====\ndocument.addEventListener(\"keydown\", e => {\n  if (状态 !== \"玩\" && (e.key === \" \" || e.key === \"Enter\")) { 重新开始(); return; }\n  if (操作.方向键 && [\"ArrowUp\", \"ArrowDown\", \"ArrowLeft\", \"ArrowRight\"].includes(e.key)) { 按着[e.key] = true; e.preventDefault(); }\n  if (操作.冲刺 && e.key === \" \") { 开始冲刺(); e.preventDefault(); }\n});\ndocument.addEventListener(\"keyup\", e => { 按着[e.key] = false; });\n\nfunction 开始冲刺() { if (冲刺时间 <= 0) { 冲刺时间 = 180; 飘字(\"冲！\", 狗.x, 狗.y - 90, \"#FF8A3D\"); } }\n\n// 比特碰到场上的东西时，会发生什么\nfunction 碰到(东西) {\n  if (东西.碰到会 === \"加分\") {\n    东西.不见了 = true; 分数 += 东西.加几分 || 1;\n    飘字(\"+\" + (东西.加几分 || 1), 东西.x, 东西.y - 40, \"#18A87C\");\n  } else if (东西.碰到会 === \"扣命\") {\n    if (闪烁 > 0) return;\n    闪烁 = 90;\n    if (设置.生命 > 0) {\n      剩余生命 -= 1; 飘字(\"−1 命\", 东西.x, 东西.y - 40, \"#E5484D\");\n      if (剩余生命 <= 0) { 状态 = \"结束\"; 结束原因 = \"没有命了\"; }\n    } else { 状态 = \"结束\"; 结束原因 = \"碰到\" + 东西.名字 + \"了\"; }\n  } else if (东西.碰到会 === \"变慢\") {\n    if (慢的时间 <= 0) 飘字(\"变慢了\", 狗.x, 狗.y - 90, \"#2366D1\");\n    慢的时间 = (东西.几秒 || 3) * 60;\n  } else if (东西.碰到会 === \"变快\") {\n    东西.不见了 = true; 快的时间 = (东西.几秒 || 3) * 60; 飘字(\"变快！\", 狗.x, 狗.y - 90, \"#FF8A3D\");\n  } else if (东西.碰到会 === \"结束\") {\n    状态 = \"结束\"; 结束原因 = \"碰到\" + 东西.名字 + \"了\";\n  }\n}\n\n// 回到狗窝\nfunction 到家了() {\n  if (设置.关卡 && 第几关 < 设置.最后一关) {\n    第几关 += 1; 分数 += 5; 飘字(\"第 \" + 第几关 + \" 关！\", W / 2, H / 2, \"#FF8A3D\");\n    狗.x = 起点.x; 狗.y = 起点.y; 目标 = null; 放东西(); 横幅 = 90;\n    if (设置.倒计时 > 0) 剩余时间 = 设置.倒计时;\n    return;\n  }\n  状态 = \"回家了\"; 结束原因 = 设置.关卡 ? \"通关！\" : \"回家了！\";\n}\n\nfunction 更新() {\n  帧数++;\n  if (状态 !== \"玩\") return;\n  let 速度 = 设置.走路速度;\n  if (慢的时间 > 0) { 速度 *= 0.45; 慢的时间--; }\n  if (快的时间 > 0) { 速度 *= 1.8; 快的时间--; }\n  if (冲刺时间 > 0) { 速度 *= 2; 冲刺时间--; }\n\n  // 按方向键或屏幕按钮：往那边走\n  let dx = 0, dy = 0;\n  if (操作.方向键) {\n    if (按着.ArrowLeft) dx -= 1; if (按着.ArrowRight) dx += 1;\n    if (按着.ArrowUp) dy -= 1; if (按着.ArrowDown) dy += 1;\n  }\n  if (操作.屏幕按钮 && 按住的按钮) { dx += 按住的按钮.dx; dy += 按住的按钮.dy; }\n  if (dx || dy) { const 长 = Math.hypot(dx, dy); 狗.x += dx / 长 * 速度; 狗.y += dy / 长 * 速度; 目标 = null; }\n  // 点了屏幕：走到点的地方\n  if (目标 && 操作.点哪走哪) {\n    const 距离 = Math.hypot(目标.x - 狗.x, 目标.y - 狗.y);\n    if (距离 < 速度) 目标 = null; else { 狗.x += (目标.x - 狗.x) / 距离 * 速度; 狗.y += (目标.y - 狗.y) / 距离 * 速度; }\n  }\n  狗.x = Math.max(30, Math.min(W - 30, 狗.x)); 狗.y = Math.max(60, Math.min(H - 10, 狗.y));\n  if (dx || dy || 目标 || 拖着) 没动的时间 = 0; else 没动的时间++;\n\n  // 会动的东西走来走去，碰到边就掉头\n  for (const 东西 of 东西们) {\n    if (!东西.会动) continue;\n    东西.x += 东西.vx; 东西.y += 东西.vy;\n    if (东西.x < 40 || 东西.x > W - 40) 东西.vx *= -1;\n    if (东西.y < 50 || 东西.y > H - 40) 东西.vy *= -1;\n  }\n  // 碰到了吗？\n  for (const 东西 of 东西们) {\n    if (!东西.不见了 && Math.hypot(东西.x - 狗.x, 东西.y - (狗.y - 25)) < 48) 碰到(东西);\n    if (状态 !== \"玩\") return;\n  }\n  东西们 = 东西们.filter(东西 => !东西.不见了);\n  if (Math.hypot(狗窝.x - 狗.x, 狗窝.y - (狗.y - 25)) < 60) 到家了();\n\n  if (设置.倒计时 > 0) {\n    剩余时间 -= 1 / 60;\n    if (剩余时间 <= 0) { 剩余时间 = 0; 状态 = \"结束\"; 结束原因 = \"时间到\"; }\n  }\n  if (闪烁 > 0) 闪烁--;\n  if (横幅 > 0) 横幅--;\n}\n\n// ===== 画画 =====\nfunction 画背景() {\n  const 颜色 = { 草地: [\"#BFE6A8\", \"#A9D891\"], 夜晚: [\"#24345A\", \"#2D4170\"], 雪地: [\"#F4F8FF\", \"#DDE8F7\"] }[设置.背景] || [\"#BFE6A8\", \"#A9D891\"];\n  ctx.fillStyle = 颜色[0]; ctx.fillRect(0, 0, W, H);\n  ctx.fillStyle = 颜色[1];\n  for (let i = 0; i < 26; i++) { ctx.beginPath(); ctx.arc((i * 151) % W, (i * 89) % H, 18 + (i % 3) * 6, 0, Math.PI * 2); ctx.fill(); }\n  if (设置.背景 === \"夜晚\") { ctx.fillStyle = \"#FFFFFF\"; for (let i = 0; i < 30; i++) ctx.fillRect((i * 97) % W, (i * 53) % H, 3, 3); }\n}\nfunction 画狗窝() {\n  ctx.fillStyle = \"rgba(0,0,0,0.12)\"; ctx.beginPath(); ctx.ellipse(狗窝.x, 狗窝.y + 44, 64, 12, 0, 0, Math.PI * 2); ctx.fill();\n  ctx.fillStyle = \"#E0681C\"; ctx.beginPath(); ctx.moveTo(狗窝.x - 66, 狗窝.y - 6); ctx.lineTo(狗窝.x, 狗窝.y - 62); ctx.lineTo(狗窝.x + 66, 狗窝.y - 6); ctx.closePath(); ctx.fill();\n  ctx.fillStyle = \"#FFB27A\"; 圆角矩形(狗窝.x - 52, 狗窝.y - 10, 104, 56, 8);\n  ctx.fillStyle = \"#1E2A4A\"; 圆角矩形(狗窝.x - 20, 狗窝.y + 6, 40, 40, 18);\n  画文字(\"家\", 狗窝.x, 狗窝.y - 26, 22, \"#FFFFFF\");\n}\nfunction 画比特(x, y, 大小) {\n  const s = 大小 / 100;\n  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);\n  // 影子\n  ctx.fillStyle = \"rgba(36,48,94,.16)\"; ctx.beginPath(); ctx.ellipse(0, 54, 40, 6, 0, 0, Math.PI * 2); ctx.fill();\n  // 后腿\n  ctx.fillStyle = \"#F4F6FA\"; ctx.strokeStyle = \"#C5CCD8\"; ctx.lineWidth = 1.5;\n  [[-28, 20], [28, 20]].forEach(([lx, ly]) => { 圆角矩形(lx - 8, ly, 16, 26, 8); });\n  ctx.fillStyle = \"#FF8A3D\";\n  [[-28, 42], [28, 42]].forEach(([lx, ly]) => { 圆角矩形(lx - 10, ly, 20, 12, 5); });\n  // 尾巴\n  ctx.strokeStyle = \"#FF8A3D\"; ctx.lineWidth = 9; ctx.lineCap = \"round\";\n  ctx.beginPath(); ctx.moveTo(26, 8); ctx.quadraticCurveTo(44, 14, 40, 30); ctx.stroke();\n  // 身体\n  ctx.fillStyle = \"#F4F6FA\"; 圆角矩形(-34, -18, 68, 56, 22);\n  ctx.strokeStyle = \"#C5CCD8\"; ctx.lineWidth = 2; ctx.beginPath();\n  (function(x,y,w,h,r){ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();})(-34,-18,68,56,22); ctx.stroke();\n  // 橙心 <\/>\n  ctx.fillStyle = \"#FF8A3D\";\n  ctx.beginPath();\n  ctx.moveTo(0, 22); ctx.bezierCurveTo(-18, 8, -26, -4, -16, -12); ctx.bezierCurveTo(-10, -16, -4, -12, 0, -6);\n  ctx.bezierCurveTo(4, -12, 10, -16, 16, -12); ctx.bezierCurveTo(26, -4, 18, 8, 0, 22);\n  ctx.fill();\n  ctx.strokeStyle = \"#fff\"; ctx.lineWidth = 2.4; ctx.lineCap = \"round\"; ctx.lineJoin = \"round\";\n  ctx.beginPath(); ctx.moveTo(-9, -14); ctx.lineTo(-15, -8); ctx.lineTo(-9, -2); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(-2.5, -14); ctx.lineTo(2.5, -2); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(9, -14); ctx.lineTo(15, -8); ctx.lineTo(9, -2); ctx.stroke();\n  // 前腿\n  ctx.fillStyle = \"#F4F6FA\";\n  [[-16, 24], [16, 24]].forEach(([lx, ly]) => { 圆角矩形(lx - 7, ly, 14, 24, 7); });\n  ctx.fillStyle = \"#FF8A3D\";\n  [[-16, 44], [16, 44]].forEach(([lx, ly]) => { 圆角矩形(lx - 9, ly, 18, 11, 5); });\n  // 垂耳：从头两侧下垂的胶囊耳（正旋转=下垂；负旋转会变成翅耳）\n  ctx.fillStyle = \"#FF8A3D\";\n  ctx.beginPath(); ctx.ellipse(-48, -48, 13, 30, 0.35, 0, Math.PI * 2); ctx.fill();\n  ctx.beginPath(); ctx.ellipse(48, -48, 13, 30, -0.35, 0, Math.PI * 2); ctx.fill();\n  ctx.fillStyle = \"#FFC08A\";\n  ctx.beginPath(); ctx.ellipse(-48, -46, 6, 18, 0.35, 0, Math.PI * 2); ctx.fill();\n  ctx.beginPath(); ctx.ellipse(48, -46, 6, 18, -0.35, 0, Math.PI * 2); ctx.fill();\n  // 头\n  ctx.fillStyle = \"#F4F6FA\"; 圆角矩形(-40, -88, 80, 72, 30);\n  ctx.strokeStyle = \"#C5CCD8\"; ctx.lineWidth = 2; ctx.beginPath();\n  (function(x,y,w,h,r){ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();})(-40,-88,80,72,30); ctx.stroke();\n  ctx.fillStyle = \"rgba(255,255,255,.55)\"; ctx.beginPath(); ctx.ellipse(-14, -70, 16, 8, -0.3, 0, Math.PI * 2); ctx.fill();\n  // 黑面罩\n  ctx.fillStyle = \"#141820\"; ctx.beginPath(); ctx.ellipse(0, -52, 28, 22, 0, 0, Math.PI * 2); ctx.fill();\n  // 四角星星眼 ✦\n  ctx.fillStyle = \"#5BE0FF\";\n  for (const [ex, ey] of [[-12, -54], [12, -54]]) {\n    ctx.beginPath();\n    const outer = 9, inner = 9 * 0.38;\n    for (let i = 0; i < 8; i++) {\n      const a = -Math.PI / 2 + i * Math.PI / 4;\n      const rad = i % 2 === 0 ? outer : inner;\n      const x = ex + Math.cos(a) * rad, y = ey + Math.sin(a) * rad;\n      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);\n    }\n    ctx.closePath(); ctx.fill();\n  }\n  // 像素小嘴\n  [[-5, -40], [-1, -38], [3, -40]].forEach(([mx, my]) => { 圆角矩形(mx, my, 2.6, 2.2, 0.4); });\n  // 天线：橙底座 + 白杆 + 白球\n  ctx.fillStyle = \"#FF8A3D\"; ctx.beginPath(); ctx.ellipse(0, -88, 7, 4, 0, 0, Math.PI * 2); ctx.fill();\n  ctx.strokeStyle = \"#F2F4F8\"; ctx.lineWidth = 4; ctx.lineCap = \"round\";\n  ctx.beginPath(); ctx.moveTo(0, -88); ctx.lineTo(0, -104); ctx.stroke();\n  ctx.fillStyle = \"#FFFFFF\"; ctx.strokeStyle = \"#D0D6E2\"; ctx.lineWidth = 1;\n  ctx.beginPath(); ctx.arc(0, -106, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();\n  ctx.restore();\n}\nfunction 圆角矩形(x, y, w, h, r) {\n  r = Math.min(r, w / 2, h / 2);\n  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);\n  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); ctx.fill();\n}\nfunction 画表情(文字, x, y, 大小) {\n  ctx.font = 大小 + 'px \"Apple Color Emoji\",\"Segoe UI Emoji\",\"Noto Color Emoji\",sans-serif';\n  ctx.fillStyle = \"#000\"; ctx.textAlign = \"center\"; ctx.textBaseline = \"middle\"; ctx.fillText(文字, x, y);\n}\nfunction 画文字(文字, x, y, 大小, 颜色, 对齐) {\n  ctx.fillStyle = 颜色; ctx.font = \"bold \" + 大小 + 'px \"PingFang SC\",\"Microsoft YaHei\",sans-serif';\n  ctx.textAlign = 对齐 || \"center\"; ctx.textBaseline = \"middle\"; ctx.fillText(文字, x, y);\n}\nfunction 画按钮() {\n  if (操作.屏幕按钮) {\n    for (const 按钮 of 按钮们) {\n      ctx.fillStyle = 按住的按钮 === 按钮 ? \"rgba(30,42,74,0.75)\" : \"rgba(30,42,74,0.4)\";\n      ctx.beginPath(); ctx.arc(按钮.x, 按钮.y, 36, 0, Math.PI * 2); ctx.fill();\n      画文字({ 上: \"↑\", 下: \"↓\", 左: \"←\", 右: \"→\" }[按钮.名字], 按钮.x, 按钮.y + 2, 36, \"#FFFFFF\");\n    }\n  }\n  if (操作.冲刺) {\n    ctx.fillStyle = 冲刺时间 > 0 ? \"rgba(255,138,61,0.5)\" : \"#FF8A3D\";\n    ctx.beginPath(); ctx.arc(冲按钮.x, 冲按钮.y, 冲按钮.半径, 0, Math.PI * 2); ctx.fill();\n    画文字(\"冲\", 冲按钮.x, 冲按钮.y, 30, \"#FFFFFF\");\n  }\n}\n\nfunction 画() {\n  画背景();\n  画狗窝();\n  if (目标) { ctx.strokeStyle = \"rgba(30,42,74,0.35)\"; ctx.lineWidth = 3; ctx.setLineDash([8, 8]); ctx.beginPath(); ctx.moveTo(狗.x, 狗.y - 25); ctx.lineTo(目标.x, 目标.y); ctx.stroke(); ctx.setLineDash([]); }\n  for (const 东西 of 东西们) 画表情(东西.图案, 东西.x, 东西.y, 48);\n  const 显示狗 = 闪烁 === 0 || Math.floor(闪烁 / 6) % 2 === 0;\n  if (显示狗) {\n    if (设置.主角 === \"比特\") 画比特(狗.x, 狗.y, 设置.主角大小);\n    else 画表情(设置.主角, 狗.x, 狗.y - 设置.主角大小 * 0.45, 设置.主角大小);\n  }\n  for (const 字 of 飘字们) { ctx.globalAlpha = 字.寿命 / 50; 画文字(字.文字, 字.x, 字.y, 30, 字.颜色); 字.y -= 1; 字.寿命--; ctx.globalAlpha = 1; }\n  飘字们 = 飘字们.filter(字 => 字.寿命 > 0);\n  const 字色 = 设置.背景 === \"夜晚\" ? \"#FFFFFF\" : \"#1E2A4A\";\n  if (状态 === \"玩\") {\n    画按钮();\n    if (设置.显示分数) 画文字(\"分数 \" + 分数, 24, 36, 32, 字色, \"left\");\n    if (设置.生命 > 0) 画文字(\"生命 \" + \"♥\".repeat(Math.max(0, 剩余生命)), 24, 76, 28, \"#E5484D\", \"left\");\n    if (设置.倒计时 > 0) 画文字(\"倒计时 \" + Math.ceil(剩余时间), W / 2, 36, 32, 字色);\n    if (设置.关卡) 画文字(\"第 \" + 第几关 + \" 关\", W - 190, 36, 30, 字色, \"right\");\n    if (横幅 > 0 && 设置.关卡) { ctx.globalAlpha = Math.min(1, 横幅 / 30); 画文字(\"第 \" + 第几关 + \" 关\", W / 2, H / 2 - 20, 72, \"#FF8A3D\"); ctx.globalAlpha = 1; }\n    const 能动 = 操作.方向键 || 操作.屏幕按钮 || 操作.点哪走哪 || 操作.拖着走;\n    if (!能动 && 没动的时间 > 120) 画文字(\"比特还不会动……怎么让它听你的指挥？\", W / 2, H - 40, 28, 字色);\n  }\n  if (状态 === \"准备\") {\n    ctx.fillStyle = \"rgba(255,255,255,0.6)\"; ctx.fillRect(0, H / 2 - 80, W, 140);\n    画文字(\"把比特送回狗窝\", W / 2, H / 2 - 30, 52, \"#1E2A4A\");\n    画文字(\"点一下，开始\", W / 2, H / 2 + 30, 30, \"#5B6683\");\n  }\n  if (状态 === \"结束\" || 状态 === \"回家了\") {\n    ctx.fillStyle = 状态 === \"回家了\" ? \"rgba(24,168,124,0.6)\" : \"rgba(30,42,74,0.55)\"; ctx.fillRect(0, 0, W, H);\n    画文字(结束原因, W / 2, H / 2 - 50, 64, \"#FFFFFF\");\n    if (设置.显示分数) 画文字(\"得分 \" + 分数, W / 2, H / 2 + 20, 44, \"#FFC93D\");\n    画文字(\"点一下，再来一次\", W / 2, H / 2 + 80, 30, \"#FFFFFF\");\n  }\n}\n\nfunction 游戏循环() { 更新(); 画(); requestAnimationFrame(游戏循环); }\n放东西();\n游戏循环();\n<\/script>\n<\/body>\n<\/html>\n", "比特跑酷-救援版.html": "<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, user-scalable=no\">\n<title>比特跑酷<\/title>\n<style>\n  html, body { margin: 0; height: 100%; background: #FFF7EC; font-family: \"PingFang SC\", \"Microsoft YaHei\", sans-serif; color: #1E2A4A; touch-action: manipulation; }\n  #box { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }\n  h1 { margin: 0; font-size: 28px; }\n  canvas { width: min(96vw, 160vh); max-height: 82vh; aspect-ratio: 16 / 9; border-radius: 18px; box-shadow: 0 6px 0 #F0E2CC; background: #BDE6FF; }\n  p { margin: 0; color: #5B6683; font-size: 18px; }\n<\/style>\n<\/head>\n<body>\n<div id=\"box\">\n  <h1>比特跑酷<\/h1>\n  <canvas id=\"game\" width=\"960\" height=\"540\"><\/canvas>\n  <p>点一下屏幕（或按空格）让比特跳起来<\/p>\n<\/div>\n\n<script>\n// ===== 游戏设置：想改游戏，先改这里 =====\nconst 设置 = {\n  主角: \"比特\",        // \"比特\" 是驯狗学院的机器狗；也可以换成表情，比如 \"🐰\"\n  主角大小: 90,        // 数字越大，主角越大\n  背景: \"白天\",        // 可以填 \"白天\"、\"夜晚\"、\"太空\"\n  奔跑速度: 6,         // 数字越大，跑得越快\n  跳跃力气: 16,        // 数字越大，跳得越高\n  重力: 0.8,           // 数字越大，落得越快\n  显示分数: true,      // 是否显示分数\n  跳过加分: 1,         // 跳过一个“撞倒”的东西，加几分\n  生命: 3,             // 有几条命；填 0 表示撞一下就结束\n  倒计时: 60,          // 游戏时间（秒）；填 0 表示不限时\n  越来越快: true,      // 每得 5 分，速度变快一点\n  电量: true,          // 是否有电量：跑步会耗电，电用完比特就停下\n  每秒耗电: 5,         // 每秒用掉多少电（电量满格是 100）\n};\n\n// ===== 路上会出现的东西：只要你想得到，都可以加进来 =====\n// 碰到会：\"撞倒\"（比特要跳过去）或 \"吃掉\"（比特会把它吃了）\n// 吃掉以后会怎样：加分、加电量……想让它发生什么，就告诉代码精灵\n// 出现机会：数字越大，越常出现\nconst 路上的东西 = [\n  { 名字: \"仙人掌\", 图案: \"🌵\", 碰到会: \"撞倒\", 出现机会: 2 },\n  { 名字: \"电池\", 图案: \"🔋\", 碰到会: \"吃掉\", 加电量: 30, 出现机会: 1 },\n  { 名字: \"甜甜圈\", 图案: \"🍩\", 碰到会: \"吃掉\", 加分: 5, 出现机会: 1 },\n];\n\n// ===== 下面是游戏程序 =====\nconst canvas = document.getElementById(\"game\");\nconst ctx = canvas.getContext(\"2d\");\nconst W = canvas.width, H = canvas.height;\nconst 地面Y = H - 90;\n\nlet 状态 = \"准备\";            // \"准备\"、\"跑\"、\"结束\"\nlet 分数 = 0, 剩余生命 = 设置.生命, 剩余时间 = 设置.倒计时, 当前电量 = 100, 路程 = 0;\nlet 路上 = [], 下一个距离 = 300, 闪烁 = 0, 结束原因 = \"\", 飘字们 = [];\nconst 狗 = { x: 170, y: 地面Y, vy: 0 };\n\nfunction 重新开始() {\n  分数 = 0;\n  剩余生命 = 设置.生命;\n  剩余时间 = 设置.倒计时;\n  当前电量 = 100;\n  路程 = 0;\n  路上 = [];\n  下一个距离 = 300;\n  闪烁 = 0;\n  飘字们 = [];\n  狗.y = 地面Y; 狗.vy = 0;\n  状态 = \"跑\";\n}\n\n// 点屏幕或按空格：开始 / 跳跃 / 重来\nfunction 按下() {\n  if (状态 !== \"跑\") { 重新开始(); return; }\n  if (狗.y >= 地面Y) 狗.vy = -设置.跳跃力气;\n}\ncanvas.addEventListener(\"pointerdown\", 按下);\ndocument.addEventListener(\"keydown\", e => { if (e.code === \"Space\" || e.key === \"ArrowUp\") { e.preventDefault(); 按下(); } });\n\nfunction 当前速度() {\n  if (设置.越来越快) return 设置.奔跑速度 + Math.floor(Math.max(0, 分数) / 5) * 0.6;\n  return 设置.奔跑速度;\n}\n\n// 按“出现机会”随机挑一个东西放到路上\nfunction 挑一个东西() {\n  let 总数 = 0;\n  for (const 东西 of 路上的东西) 总数 += 东西.出现机会 || 1;\n  let 随机 = Math.random() * 总数;\n  for (const 东西 of 路上的东西) {\n    随机 -= 东西.出现机会 || 1;\n    if (随机 <= 0) return 东西;\n  }\n  return 路上的东西[0];\n}\n\n// 两个方框有没有碰到\nfunction 撞到了(a, b) {\n  return a.左 < b.右 && a.右 > b.左 && a.上 < b.下 && a.下 > b.上;\n}\n\nfunction 飘字(文字, x, y, 颜色) { 飘字们.push({ 文字, x, y, 颜色, 寿命: 45 }); }\n\n// 比特碰到路上的东西时，会发生什么\nfunction 碰到(东西) {\n  if (东西.碰到会 === \"吃掉\") {\n    东西.不见了 = true;\n    if (东西.加分) { 分数 += 东西.加分; 飘字(\"+\" + 东西.加分 + \" 分\", 东西.x, 地面Y - 100, \"#18A87C\"); }\n    if (设置.电量 && 东西.加电量) { 当前电量 = Math.min(100, 当前电量 + 东西.加电量); 飘字(\"电量 +\" + 东西.加电量, 东西.x, 地面Y - 140, \"#2366D1\"); }\n    if (!东西.加分 && !(设置.电量 && 东西.加电量)) 飘字(\"好吃！\", 东西.x, 地面Y - 100, \"#18A87C\");\n    return;\n  }\n  if (东西.碰到会 === \"撞倒\") {\n    东西.撞过 = true;\n    if (设置.生命 > 0) {\n      剩余生命 -= 1;\n      闪烁 = 40;\n      if (剩余生命 <= 0) { 状态 = \"结束\"; 结束原因 = \"没有生命了\"; }\n    } else { 状态 = \"结束\"; 结束原因 = \"撞到\" + 东西.名字 + \"了\"; }\n  }\n}\n\nfunction 更新() {\n  if (状态 !== \"跑\") return;\n  const 速度 = 当前速度();\n  路程 += 速度;\n\n  // 跳跃和下落\n  狗.y += 狗.vy;\n  狗.vy += 设置.重力;\n  if (狗.y >= 地面Y) { 狗.y = 地面Y; 狗.vy = 0; }\n\n  // 往路上放新东西\n  下一个距离 -= 速度;\n  if (下一个距离 <= 0) {\n    路上.push(Object.assign({ x: W + 40 }, 挑一个东西()));\n    下一个距离 = 260 + Math.random() * 300;\n  }\n\n  // 移动路上的东西，看看比特有没有碰到\n  const s = 设置.主角大小 / 100;\n  const 狗框 = { 左: 狗.x - 45 * s, 右: 狗.x + 70 * s, 上: 狗.y - 95 * s, 下: 狗.y - 4 };\n  for (const 东西 of 路上) {\n    东西.x -= 速度;\n    const 框 = { 左: 东西.x - 20, 右: 东西.x + 20, 上: 地面Y - 50, 下: 地面Y };\n    if (!东西.不见了 && !东西.撞过 && 撞到了(狗框, 框)) 碰到(东西);\n    if (东西.碰到会 === \"撞倒\" && !东西.过了 && 东西.x + 20 < 狗框.左) {\n      东西.过了 = true;\n      if (设置.显示分数 && !东西.撞过) 分数 += 设置.跳过加分;\n    }\n  }\n  路上 = 路上.filter(东西 => 东西.x > -60 && !东西.不见了);\n\n  // 电量：跑步会耗电\n  if (设置.电量) {\n    当前电量 -= 设置.每秒耗电 / 60;\n    if (当前电量 <= 0) { 当前电量 = 0; 状态 = \"结束\"; 结束原因 = \"没电了\"; }\n  }\n\n  // 倒计时\n  if (设置.倒计时 > 0) {\n    剩余时间 -= 1 / 60;\n    if (剩余时间 <= 0) { 剩余时间 = 0; 状态 = \"结束\"; 结束原因 = \"时间到\"; }\n  }\n  if (闪烁 > 0) 闪烁--;\n}\n\n// ===== 画画 =====\nfunction 画背景() {\n  const 主题 = { 白天: [\"#BDE6FF\", \"#F2C48D\"], 夜晚: [\"#1E2A4A\", \"#3B4B6E\"], 太空: [\"#140C33\", \"#4B3F72\"] }[设置.背景] || [\"#BDE6FF\", \"#F2C48D\"];\n  ctx.fillStyle = 主题[0]; ctx.fillRect(0, 0, W, H);\n  const 偏移 = 路程 * 0.2;\n  if (设置.背景 === \"白天\") {\n    ctx.fillStyle = \"#FFC93D\"; ctx.beginPath(); ctx.arc(860, 120, 40, 0, Math.PI * 2); ctx.fill();\n    ctx.fillStyle = \"#FFFFFF\";\n    for (let i = 0; i < 4; i++) { const x = ((i * 300 - 偏移) % 1200 + 1200) % 1200 - 120; 云(x, 110 + (i % 2) * 60); }\n  } else {\n    ctx.fillStyle = \"#FFFFFF\";\n    for (let i = 0; i < 40; i++) { const x = ((i * 97 - 偏移 * 0.5) % W + W) % W; ctx.fillRect(x, (i * 53) % (地面Y - 40), 3, 3); }\n    if (设置.背景 === \"夜晚\") { ctx.fillStyle = \"#FFF3C4\"; ctx.beginPath(); ctx.arc(840, 120, 36, 0, Math.PI * 2); ctx.fill(); }\n    if (设置.背景 === \"太空\") { ctx.fillStyle = \"#8B6CFF\"; ctx.beginPath(); ctx.arc(800, 140, 50, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = \"#FFC93D\"; ctx.lineWidth = 6; ctx.beginPath(); ctx.ellipse(800, 140, 80, 18, -0.3, 0, Math.PI * 2); ctx.stroke(); }\n  }\n  ctx.fillStyle = 主题[1]; ctx.fillRect(0, 地面Y, W, H - 地面Y);\n  ctx.fillStyle = \"rgba(0,0,0,0.12)\";\n  for (let i = 0; i < 12; i++) { const x = ((i * 90 - 路程) % 1080 + 1080) % 1080 - 60; ctx.fillRect(x, 地面Y + 22, 40, 6); }\n}\nfunction 云(x, y) { ctx.beginPath(); ctx.arc(x, y, 26, 0, 7); ctx.arc(x + 30, y - 12, 32, 0, 7); ctx.arc(x + 64, y, 24, 0, 7); ctx.fill(); }\n\nfunction 画比特(x, y, 大小) {\n  const s = 大小 / 100;\n  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);\n  // 影子\n  ctx.fillStyle = \"rgba(36,48,94,.16)\"; ctx.beginPath(); ctx.ellipse(0, 54, 40, 6, 0, 0, Math.PI * 2); ctx.fill();\n  // 后腿\n  ctx.fillStyle = \"#F4F6FA\"; ctx.strokeStyle = \"#C5CCD8\"; ctx.lineWidth = 1.5;\n  [[-28, 20], [28, 20]].forEach(([lx, ly]) => { 圆角矩形(lx - 8, ly, 16, 26, 8); });\n  ctx.fillStyle = \"#FF8A3D\";\n  [[-28, 42], [28, 42]].forEach(([lx, ly]) => { 圆角矩形(lx - 10, ly, 20, 12, 5); });\n  // 尾巴\n  ctx.strokeStyle = \"#FF8A3D\"; ctx.lineWidth = 9; ctx.lineCap = \"round\";\n  ctx.beginPath(); ctx.moveTo(26, 8); ctx.quadraticCurveTo(44, 14, 40, 30); ctx.stroke();\n  // 身体\n  ctx.fillStyle = \"#F4F6FA\"; 圆角矩形(-34, -18, 68, 56, 22);\n  ctx.strokeStyle = \"#C5CCD8\"; ctx.lineWidth = 2; ctx.beginPath();\n  (function(x,y,w,h,r){ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();})(-34,-18,68,56,22); ctx.stroke();\n  // 橙心 <\/>\n  ctx.fillStyle = \"#FF8A3D\";\n  ctx.beginPath();\n  ctx.moveTo(0, 22); ctx.bezierCurveTo(-18, 8, -26, -4, -16, -12); ctx.bezierCurveTo(-10, -16, -4, -12, 0, -6);\n  ctx.bezierCurveTo(4, -12, 10, -16, 16, -12); ctx.bezierCurveTo(26, -4, 18, 8, 0, 22);\n  ctx.fill();\n  ctx.strokeStyle = \"#fff\"; ctx.lineWidth = 2.4; ctx.lineCap = \"round\"; ctx.lineJoin = \"round\";\n  ctx.beginPath(); ctx.moveTo(-9, -14); ctx.lineTo(-15, -8); ctx.lineTo(-9, -2); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(-2.5, -14); ctx.lineTo(2.5, -2); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(9, -14); ctx.lineTo(15, -8); ctx.lineTo(9, -2); ctx.stroke();\n  // 前腿\n  ctx.fillStyle = \"#F4F6FA\";\n  [[-16, 24], [16, 24]].forEach(([lx, ly]) => { 圆角矩形(lx - 7, ly, 14, 24, 7); });\n  ctx.fillStyle = \"#FF8A3D\";\n  [[-16, 44], [16, 44]].forEach(([lx, ly]) => { 圆角矩形(lx - 9, ly, 18, 11, 5); });\n  // 垂耳：从头两侧下垂的胶囊耳（正旋转=下垂；负旋转会变成翅耳）\n  ctx.fillStyle = \"#FF8A3D\";\n  ctx.beginPath(); ctx.ellipse(-48, -48, 13, 30, 0.35, 0, Math.PI * 2); ctx.fill();\n  ctx.beginPath(); ctx.ellipse(48, -48, 13, 30, -0.35, 0, Math.PI * 2); ctx.fill();\n  ctx.fillStyle = \"#FFC08A\";\n  ctx.beginPath(); ctx.ellipse(-48, -46, 6, 18, 0.35, 0, Math.PI * 2); ctx.fill();\n  ctx.beginPath(); ctx.ellipse(48, -46, 6, 18, -0.35, 0, Math.PI * 2); ctx.fill();\n  // 头\n  ctx.fillStyle = \"#F4F6FA\"; 圆角矩形(-40, -88, 80, 72, 30);\n  ctx.strokeStyle = \"#C5CCD8\"; ctx.lineWidth = 2; ctx.beginPath();\n  (function(x,y,w,h,r){ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();})(-40,-88,80,72,30); ctx.stroke();\n  ctx.fillStyle = \"rgba(255,255,255,.55)\"; ctx.beginPath(); ctx.ellipse(-14, -70, 16, 8, -0.3, 0, Math.PI * 2); ctx.fill();\n  // 黑面罩\n  ctx.fillStyle = \"#141820\"; ctx.beginPath(); ctx.ellipse(0, -52, 28, 22, 0, 0, Math.PI * 2); ctx.fill();\n  // 四角星星眼 ✦\n  ctx.fillStyle = \"#5BE0FF\";\n  for (const [ex, ey] of [[-12, -54], [12, -54]]) {\n    ctx.beginPath();\n    const outer = 9, inner = 9 * 0.38;\n    for (let i = 0; i < 8; i++) {\n      const a = -Math.PI / 2 + i * Math.PI / 4;\n      const rad = i % 2 === 0 ? outer : inner;\n      const x = ex + Math.cos(a) * rad, y = ey + Math.sin(a) * rad;\n      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);\n    }\n    ctx.closePath(); ctx.fill();\n  }\n  // 像素小嘴\n  [[-5, -40], [-1, -38], [3, -40]].forEach(([mx, my]) => { 圆角矩形(mx, my, 2.6, 2.2, 0.4); });\n  // 天线：橙底座 + 白杆 + 白球\n  ctx.fillStyle = \"#FF8A3D\"; ctx.beginPath(); ctx.ellipse(0, -88, 7, 4, 0, 0, Math.PI * 2); ctx.fill();\n  ctx.strokeStyle = \"#F2F4F8\"; ctx.lineWidth = 4; ctx.lineCap = \"round\";\n  ctx.beginPath(); ctx.moveTo(0, -88); ctx.lineTo(0, -104); ctx.stroke();\n  ctx.fillStyle = \"#FFFFFF\"; ctx.strokeStyle = \"#D0D6E2\"; ctx.lineWidth = 1;\n  ctx.beginPath(); ctx.arc(0, -106, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();\n  ctx.restore();\n}\nfunction 圆角矩形(x, y, w, h, r) {\n  r = Math.min(r, w / 2, h / 2);\n  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);\n  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); ctx.fill();\n}\nfunction 画表情(文字, x, y, 大小) {\n  ctx.font = 大小 + 'px \"Apple Color Emoji\",\"Segoe UI Emoji\",\"Noto Color Emoji\",sans-serif';\n  ctx.fillStyle = \"#000\"; ctx.textAlign = \"center\"; ctx.textBaseline = \"middle\"; ctx.fillText(文字, x, y);\n}\nfunction 画文字(文字, x, y, 大小, 颜色, 对齐) {\n  ctx.fillStyle = 颜色; ctx.font = \"bold \" + 大小 + 'px \"PingFang SC\",\"Microsoft YaHei\",sans-serif';\n  ctx.textAlign = 对齐 || \"center\"; ctx.textBaseline = \"middle\"; ctx.fillText(文字, x, y);\n}\nfunction 画电量() {\n  const x = W / 2 - 130, y = 22, w = 260, h = 36;\n  ctx.fillStyle = \"rgba(255,255,255,0.9)\"; 圆角矩形(x, y, w, h, 12);\n  const 长度 = (w - 8) * 当前电量 / 100;\n  if (长度 > 2) { ctx.fillStyle = 当前电量 > 30 ? \"#2ECC9A\" : \"#E5484D\"; 圆角矩形(x + 4, y + 4, 长度, h - 8, 8); }\n  画文字(\"电量 \" + Math.ceil(当前电量), W / 2, y + h / 2, 22, \"#1E2A4A\");\n}\n\nfunction 画() {\n  画背景();\n  for (const 东西 of 路上) 画表情(东西.图案, 东西.x, 地面Y - 28, 58);\n  const 显示狗 = 闪烁 === 0 || Math.floor(闪烁 / 5) % 2 === 0;\n  if (显示狗) {\n    if (设置.主角 === \"比特\") 画比特(狗.x, 狗.y, 设置.主角大小);\n    else 画表情(设置.主角, 狗.x, 狗.y - 设置.主角大小 * 0.45, 设置.主角大小);\n  }\n  for (const 字 of 飘字们) {\n    ctx.globalAlpha = 字.寿命 / 45; 画文字(字.文字, 字.x, 字.y, 30, 字.颜色); 字.y -= 1.2; 字.寿命--; ctx.globalAlpha = 1;\n  }\n  飘字们 = 飘字们.filter(字 => 字.寿命 > 0);\n  const 字色 = 设置.背景 === \"白天\" ? \"#1E2A4A\" : \"#FFFFFF\";\n  if (状态 !== \"准备\") {\n    if (设置.显示分数) 画文字(\"分数 \" + 分数, 24, 40, 34, 字色, \"left\");\n    if (设置.生命 > 0) 画文字(\"生命 \" + \"♥\".repeat(Math.max(0, 剩余生命)), 24, 84, 30, \"#E5484D\", \"left\");\n    if (设置.倒计时 > 0) 画文字(\"倒计时 \" + Math.ceil(剩余时间), W - 24, 40, 34, 字色, \"right\");\n    if (设置.电量) 画电量();\n  }\n  if (状态 === \"准备\") { 画文字(\"点一下，开始跑！\", W / 2, H / 2 - 40, 52, 字色); }\n  if (状态 === \"结束\") {\n    ctx.fillStyle = \"rgba(30,42,74,0.55)\"; ctx.fillRect(0, 0, W, H);\n    画文字(结束原因 + \"！\", W / 2, H / 2 - 50, 64, \"#FFFFFF\");\n    if (设置.显示分数) 画文字(\"得分 \" + 分数, W / 2, H / 2 + 20, 44, \"#FFC93D\");\n    画文字(\"点一下，再来一次\", W / 2, H / 2 + 80, 32, \"#FFFFFF\");\n  }\n}\n\nfunction 游戏循环() { 更新(); 画(); requestAnimationFrame(游戏循环); }\n游戏循环();\n<\/script>\n<\/body>\n<\/html>\n", "比特跑酷-有虫版.html": "<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, user-scalable=no\">\n<title>比特跑酷<\/title>\n<style>\n  html, body { margin: 0; height: 100%; background: #FFF7EC; font-family: \"PingFang SC\", \"Microsoft YaHei\", sans-serif; color: #1E2A4A; touch-action: manipulation; }\n  #box { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }\n  h1 { margin: 0; font-size: 28px; }\n  canvas { width: min(96vw, 160vh); max-height: 82vh; aspect-ratio: 16 / 9; border-radius: 18px; box-shadow: 0 6px 0 #F0E2CC; background: #BDE6FF; }\n  p { margin: 0; color: #5B6683; font-size: 18px; }\n<\/style>\n<\/head>\n<body>\n<div id=\"box\">\n  <h1>比特跑酷<\/h1>\n  <canvas id=\"game\" width=\"960\" height=\"540\"><\/canvas>\n  <p>点一下屏幕（或按空格）让比特跳起来<\/p>\n<\/div>\n\n<script>\n// ===== 游戏设置：想改游戏，先改这里 =====\nconst 设置 = {\n  主角: \"比特\",        // \"比特\" 是驯狗学院的机器狗；也可以换成表情，比如 \"🐰\"\n  主角大小: 90,        // 数字越大，主角越大\n  背景: \"白天\",        // 可以填 \"白天\"、\"夜晚\"、\"太空\"\n  奔跑速度: 6,         // 数字越大，跑得越快\n  跳跃力气: 16,        // 数字越大，跳得越高\n  重力: 0.8,           // 数字越大，落得越快\n  显示分数: true,      // 是否显示分数\n  跳过加分: 1,         // 跳过一个“撞倒”的东西，加几分\n  生命: 3,             // 有几条命；填 0 表示撞一下就结束\n  倒计时: 60,          // 游戏时间（秒）；填 0 表示不限时\n  越来越快: true,      // 每得 5 分，速度变快一点\n  电量: true,          // 是否有电量：跑步会耗电，电用完比特就停下\n  每秒耗电: 5,         // 每秒用掉多少电（电量满格是 100）\n};\n\n// ===== 路上会出现的东西：只要你想得到，都可以加进来 =====\n// 碰到会：\"撞倒\"（比特要跳过去）或 \"吃掉\"（比特会把它吃了）\n// 吃掉以后会怎样：加分、加电量……想让它发生什么，就告诉代码精灵\n// 出现机会：数字越大，越常出现\nconst 路上的东西 = [\n  { 名字: \"仙人掌\", 图案: \"🌵\", 碰到会: \"撞倒\", 出现机会: 2 },\n  { 名字: \"电池\", 图案: \"🔋\", 碰到会: \"吃掉\", 加电量: 30, 出现机会: 1 },\n  { 名字: \"甜甜圈\", 图案: \"🍩\", 碰到会: \"吃掉\", 加分: 5, 出现机会: 1 },\n];\n\n// ===== 下面是游戏程序 =====\nconst canvas = document.getElementById(\"game\");\nconst ctx = canvas.getContext(\"2d\");\nconst W = canvas.width, H = canvas.height;\nconst 地面Y = H - 90;\n\nlet 状态 = \"准备\";            // \"准备\"、\"跑\"、\"结束\"\nlet 分数 = 0, 剩余生命 = 设置.生命, 剩余时间 = 设置.倒计时, 当前电量 = 100, 路程 = 0;\nlet 路上 = [], 下一个距离 = 300, 闪烁 = 0, 结束原因 = \"\", 飘字们 = [];\nconst 狗 = { x: 170, y: 地面Y, vy: 0 };\n\nfunction 重新开始() {\n  分数 = 0;\n  剩余生命 = 设置.生命;\n  剩余时间 = 设置.倒计时;\n  当前电量 = 100;\n  路程 = 0;\n  路上 = [];\n  下一个距离 = 300;\n  闪烁 = 0;\n  飘字们 = [];\n  狗.y = 地面Y; 狗.vy = 0;\n  状态 = \"跑\";\n}\n\n// 点屏幕或按空格：开始 / 跳跃 / 重来\nfunction 按下() {\n  if (状态 !== \"跑\") { 重新开始(); return; }\n  if (狗.y >= 地面Y) 狗.vy = -设置.跳跃力气;\n}\ncanvas.addEventListener(\"pointerdown\", 按下);\ndocument.addEventListener(\"keydown\", e => { if (e.code === \"Space\" || e.key === \"ArrowUp\") { e.preventDefault(); 按下(); } });\n\nfunction 当前速度() {\n  if (设置.越来越快) return 设置.奔跑速度 + Math.floor(Math.max(0, 分数) / 5) * 0.6;\n  return 设置.奔跑速度;\n}\n\n// 按“出现机会”随机挑一个东西放到路上\nfunction 挑一个东西() {\n  let 总数 = 0;\n  for (const 东西 of 路上的东西) 总数 += 东西.出现机会 || 1;\n  let 随机 = Math.random() * 总数;\n  for (const 东西 of 路上的东西) {\n    随机 -= 东西.出现机会 || 1;\n    if (随机 <= 0) return 东西;\n  }\n  return 路上的东西[0];\n}\n\n// 两个方框有没有碰到\nfunction 撞到了(a, b) {\n  return a.左 < b.右 && a.右 > b.左 && a.上 < b.下 && a.下 > b.上;\n}\n\nfunction 飘字(文字, x, y, 颜色) { 飘字们.push({ 文字, x, y, 颜色, 寿命: 45 }); }\n\n// 比特碰到路上的东西时，会发生什么\nfunction 碰到(东西) {\n  if (东西.碰到会 === \"吃掉\") {\n    东西.不见了 = true;\n    if (东西.加分) { 分数 += 东西.加分; 飘字(\"+\" + 东西.加分 + \" 分\", 东西.x, 地面Y - 100, \"#18A87C\"); }\n    if (设置.电量 && 东西.加电量) { 当前电量 = Math.min(100, 当前电量 - 东西.加电量); 飘字(\"电量 +\" + 东西.加电量, 东西.x, 地面Y - 140, \"#2366D1\"); }\n    if (!东西.加分 && !(设置.电量 && 东西.加电量)) 飘字(\"好吃！\", 东西.x, 地面Y - 100, \"#18A87C\");\n    return;\n  }\n  if (东西.碰到会 === \"撞到\") {\n    东西.撞过 = true;\n    if (设置.生命 > 0) {\n      剩余生命 -= 1;\n      闪烁 = 40;\n      if (剩余生命 <= 0) { 状态 = \"结束\"; 结束原因 = \"没有生命了\"; }\n    } else { 状态 = \"结束\"; 结束原因 = \"撞到\" + 东西.名字 + \"了\"; }\n  }\n}\n\nfunction 更新() {\n  if (状态 !== \"跑\") return;\n  const 速度 = 当前速度();\n  路程 += 速度;\n\n  // 跳跃和下落\n  狗.y += 狗.vy;\n  狗.vy += 设置.重力 / 10;\n  if (狗.y >= 地面Y) { 狗.y = 地面Y; 狗.vy = 0; }\n\n  // 往路上放新东西\n  下一个距离 -= 速度;\n  if (下一个距离 <= 0) {\n    路上.push(Object.assign({ x: W + 40 }, 挑一个东西()));\n    下一个距离 = 260 + Math.random() * 300;\n  }\n\n  // 移动路上的东西，看看比特有没有碰到\n  const s = 设置.主角大小 / 100;\n  const 狗框 = { 左: 狗.x - 45 * s, 右: 狗.x + 70 * s, 上: 狗.y - 95 * s, 下: 狗.y - 4 };\n  for (const 东西 of 路上) {\n    东西.x -= 速度;\n    const 框 = { 左: 东西.x - 20, 右: 东西.x + 20, 上: 地面Y - 50, 下: 地面Y };\n    if (!东西.不见了 && !东西.撞过 && 撞到了(狗框, 框)) 碰到(东西);\n    if (东西.碰到会 === \"撞倒\" && !东西.过了 && 东西.x + 20 < 狗框.左) {\n      东西.过了 = true;\n      if (设置.显示分数 && !东西.撞过) 分数 += 设置.跳过加分;\n    }\n  }\n  路上 = 路上.filter(东西 => 东西.x > -60 && !东西.不见了);\n\n  // 电量：跑步会耗电\n  if (设置.电量) {\n    当前电量 -= 设置.每秒耗电 / 60;\n    if (当前电量 <= 0) { 当前电量 = 0; 状态 = \"结束\"; 结束原因 = \"没电了\"; }\n  }\n\n  // 倒计时\n  if (设置.倒计时 > 0) {\n    剩余时间 -= 1 / 60;\n    if (剩余时间 <= 0) { 剩余时间 = 0; 状态 = \"结束\"; 结束原因 = \"时间到\"; }\n  }\n  if (闪烁 > 0) 闪烁--;\n}\n\n// ===== 画画 =====\nfunction 画背景() {\n  const 主题 = { 白天: [\"#BDE6FF\", \"#F2C48D\"], 夜晚: [\"#1E2A4A\", \"#3B4B6E\"], 太空: [\"#140C33\", \"#4B3F72\"] }[设置.背景] || [\"#BDE6FF\", \"#F2C48D\"];\n  ctx.fillStyle = 主题[0]; ctx.fillRect(0, 0, W, H);\n  const 偏移 = 路程 * 0.2;\n  if (设置.背景 === \"白天\") {\n    ctx.fillStyle = \"#FFC93D\"; ctx.beginPath(); ctx.arc(860, 120, 40, 0, Math.PI * 2); ctx.fill();\n    ctx.fillStyle = \"#FFFFFF\";\n    for (let i = 0; i < 4; i++) { const x = ((i * 300 - 偏移) % 1200 + 1200) % 1200 - 120; 云(x, 110 + (i % 2) * 60); }\n  } else {\n    ctx.fillStyle = \"#FFFFFF\";\n    for (let i = 0; i < 40; i++) { const x = ((i * 97 - 偏移 * 0.5) % W + W) % W; ctx.fillRect(x, (i * 53) % (地面Y - 40), 3, 3); }\n    if (设置.背景 === \"夜晚\") { ctx.fillStyle = \"#FFF3C4\"; ctx.beginPath(); ctx.arc(840, 120, 36, 0, Math.PI * 2); ctx.fill(); }\n    if (设置.背景 === \"太空\") { ctx.fillStyle = \"#8B6CFF\"; ctx.beginPath(); ctx.arc(800, 140, 50, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = \"#FFC93D\"; ctx.lineWidth = 6; ctx.beginPath(); ctx.ellipse(800, 140, 80, 18, -0.3, 0, Math.PI * 2); ctx.stroke(); }\n  }\n  ctx.fillStyle = 主题[1]; ctx.fillRect(0, 地面Y, W, H - 地面Y);\n  ctx.fillStyle = \"rgba(0,0,0,0.12)\";\n  for (let i = 0; i < 12; i++) { const x = ((i * 90 - 路程) % 1080 + 1080) % 1080 - 60; ctx.fillRect(x, 地面Y + 22, 40, 6); }\n}\nfunction 云(x, y) { ctx.beginPath(); ctx.arc(x, y, 26, 0, 7); ctx.arc(x + 30, y - 12, 32, 0, 7); ctx.arc(x + 64, y, 24, 0, 7); ctx.fill(); }\n\nfunction 画比特(x, y, 大小) {\n  const s = 大小 / 100;\n  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);\n  // 影子\n  ctx.fillStyle = \"rgba(36,48,94,.16)\"; ctx.beginPath(); ctx.ellipse(0, 54, 40, 6, 0, 0, Math.PI * 2); ctx.fill();\n  // 后腿\n  ctx.fillStyle = \"#F4F6FA\"; ctx.strokeStyle = \"#C5CCD8\"; ctx.lineWidth = 1.5;\n  [[-28, 20], [28, 20]].forEach(([lx, ly]) => { 圆角矩形(lx - 8, ly, 16, 26, 8); });\n  ctx.fillStyle = \"#FF8A3D\";\n  [[-28, 42], [28, 42]].forEach(([lx, ly]) => { 圆角矩形(lx - 10, ly, 20, 12, 5); });\n  // 尾巴\n  ctx.strokeStyle = \"#FF8A3D\"; ctx.lineWidth = 9; ctx.lineCap = \"round\";\n  ctx.beginPath(); ctx.moveTo(26, 8); ctx.quadraticCurveTo(44, 14, 40, 30); ctx.stroke();\n  // 身体\n  ctx.fillStyle = \"#F4F6FA\"; 圆角矩形(-34, -18, 68, 56, 22);\n  ctx.strokeStyle = \"#C5CCD8\"; ctx.lineWidth = 2; ctx.beginPath();\n  (function(x,y,w,h,r){ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();})(-34,-18,68,56,22); ctx.stroke();\n  // 橙心 <\/
